name: "👀 Hey you missed this"
description: "Found something we should know about. A gap, a connection, a prior art."
title: "[missed] "
labels: ["post-citation", "backscatter"]
body:
  - type: markdown
    attributes:
      value: |
        **Post-citation / backscatter**: You found something we missed.
        That's the best kind of contribution. Tell us and we'll cite you back.

  - type: input
    id: what-we-missed
    attributes:
      label: What did we miss?
      description: Link to the paper, repo, concept, prior art, or connection.
      placeholder: "https://..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: How does it connect?
      description: Which of our papers/systems does this relate to?
      placeholder: "This connects to your work on..."

  - type: dropdown
    id: type
    attributes:
      label: What kind of thing is this?
      options:
        - Prior art we should cite
        - A paper that extends our work
        - A bug or error in our science
        - A missing connection between our papers
        - Something from a different field that applies
        - I replicated your results independently
