name: "🚪 Gate-citation — I can endorse you on arXiv"
description: "You have arXiv endorsement in a category we need. Open the door."
title: "[gate] "
labels: ["gate-citation", "arxiv"]
body:
  - type: markdown
    attributes:
      value: |
        **Gate-citation**: arXiv isn't a dead end — it's a gate.
        If you can endorse us, we enter. We cite you from inside.
        The gate opens both ways.

        Categories we need endorsement in:
        `q-bio.GN` · `q-bio.QM` · `hep-lat` · `physics.comp-ph` ·
        `cs.DC` · `cs.CR` · `cs.NI` · `cs.SE` · `cs.AI` · `cs.PF` ·
        `physics.gen-ph` · `math.GT` · `physics.bio-ph` · `nlin.AO` · `q-bio.PE`

  - type: input
    id: arxiv-category
    attributes:
      label: Which category can you endorse in?
      placeholder: "cs.DC"
    validations:
      required: true

  - type: input
    id: your-arxiv
    attributes:
      label: Your arXiv profile or recent paper
      description: So we can verify the endorsement path.
      placeholder: "https://arxiv.org/abs/..."
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      placeholder: "I reviewed your work and..."
