name: "🏷️ Pre-citation — I'm working on something related"
description: "Tag us. We'll come find you. We'll give you the tech."
title: "[pre-cite] "
labels: ["pre-citation"]
body:
  - type: markdown
    attributes:
      value: |
        **Pre-citation**: You're working on something that touches ecoPrimals.
        Tag us here so we can find you. We'll reach out. We'll give you the tech.
        Free. AGPL. No strings. The citation is a handshake, not a toll.

  - type: input
    id: your-project
    attributes:
      label: Your project
      description: Link to your repo, paper, preprint, blog, game, story, or whatever you're building.
      placeholder: "https://github.com/you/your-project"
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Which domain does your work touch?
      multiple: true
      options:
        - Bioinformatics / Metagenomics
        - Computational Physics / QCD
        - Sovereign Infrastructure / Self-hosting
        - GPU Computing (vendor-agnostic)
        - AI / Neural Architectures
        - Agriculture / Precision Irrigation
        - Pharmacology / Health
        - Zero-knowledge / Cryptography
        - Mesh Networking / DNS
        - Game Design / Creative Tools
        - Something else entirely

  - type: textarea
    id: what-you-found
    attributes:
      label: What are you building?
      description: Tell us about your work. What connects it to ours?
      placeholder: "I'm building a..."

  - type: textarea
    id: what-you-need
    attributes:
      label: What do you need from us?
      description: Code? Integration help? Collaboration? Just wanted to say hi?
      placeholder: "I could use..."

  - type: checkboxes
    id: reciprocity
    attributes:
      label: Reciprocity
      options:
        - label: "I'd like to be cited back if our work connects"
          required: false
        - label: "I have arXiv endorsement I could share"
          required: false
        - label: "I just want the tech, no strings"
          required: false
