<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui,-apple-system,sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#89b4fa"/>
    </marker>
    <linearGradient id="wgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a6e3a1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#89b4fa;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">ecoPrimals Gate Mesh  Live Topology</text>

  <!-- WAN Zone -->
  <rect x="20" y="50" width="760" height="90" rx="8" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="40" y="72" fill="#a6adc8" font-size="11" font-weight="bold">WAN / INTERNET</text>

  <!-- golgi VPS -->
  <rect x="60" y="82" width="130" height="44" rx="6" fill="#45475a" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="125" y="100" text-anchor="middle" fill="#89b4fa" font-weight="bold">golgi</text>
  <text x="125" y="116" text-anchor="middle" fill="#a6adc8" font-size="10">VPS · WG hub · Forgejo</text>

  <!-- flockGate WAN -->
  <rect x="240" y="82" width="130" height="44" rx="6" fill="#45475a" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="305" y="100" text-anchor="middle" fill="#f9e2af" font-weight="bold">flockGate</text>
  <text x="305" y="116" text-anchor="middle" fill="#a6adc8" font-size="10">WAN · Tower dev</text>

  <!-- grapheneGate -->
  <rect x="420" y="82" width="140" height="44" rx="6" fill="#45475a" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="490" y="100" text-anchor="middle" fill="#cba6f7" font-weight="bold">grapheneGate</text>
  <text x="490" y="116" text-anchor="middle" fill="#a6adc8" font-size="10">Pixel 8a · ADB · Trust</text>

  <!-- Cloudflare edge -->
  <rect x="610" y="82" width="150" height="44" rx="6" fill="#45475a" stroke="#fab387" stroke-width="1"/>
  <text x="685" y="100" text-anchor="middle" fill="#fab387" font-weight="bold">Cloudflare</text>
  <text x="685" y="116" text-anchor="middle" fill="#a6adc8" font-size="10">DDoS · TLS edge</text>

  <!-- LAN Zone -->
  <rect x="20" y="160" width="760" height="340" rx="8" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="40" y="182" fill="#a6adc8" font-size="11" font-weight="bold">LAN (192.168.4.0/22)  sub-millisecond</text>

  <!-- Flint Router -->
  <rect x="560" y="190" width="200" height="40" rx="6" fill="#313244" stroke="#fab387" stroke-width="1.5"/>
  <text x="660" y="215" text-anchor="middle" fill="#fab387" font-weight="bold">Flint H1  Plasma Membrane</text>

  <!-- sporeGate -->
  <rect x="60" y="250" width="200" height="80" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="160" y="274" text-anchor="middle" fill="#a6e3a1" font-weight="bold" font-size="14">sporeGate</text>
  <text x="160" y="292" text-anchor="middle" fill="#cdd6f4" font-size="11">Public entry · Sovereign CI</text>
  <text x="160" y="308" text-anchor="middle" fill="#a6adc8" font-size="10">songBird hub · Caddy · bearDog</text>
  <text x="160" y="322" text-anchor="middle" fill="#a6adc8" font-size="10">.3 LAN · .2 WG</text>

  <!-- eastGate -->
  <rect x="300" y="250" width="200" height="80" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="274" text-anchor="middle" fill="#89b4fa" font-weight="bold" font-size="14">eastGate</text>
  <text x="400" y="292" text-anchor="middle" fill="#cdd6f4" font-size="11">Overwatch · primalSpring</text>
  <text x="400" y="308" text-anchor="middle" fill="#a6adc8" font-size="10">petalTongue · 10GbE · 96GB</text>
  <text x="400" y="322" text-anchor="middle" fill="#a6adc8" font-size="10">.5 LAN · .5 WG</text>

  <!-- ironGate -->
  <rect x="540" y="260" width="220" height="100" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="650" y="284" text-anchor="middle" fill="#f38ba8" font-weight="bold" font-size="14">ironGate</text>
  <text x="650" y="302" text-anchor="middle" fill="#cdd6f4" font-size="11">GPU Compute · JupyterHub</text>
  <text x="650" y="318" text-anchor="middle" fill="#a6adc8" font-size="10">RTX 5070 Ti (16GB) · GROMACS</text>
  <text x="650" y="334" text-anchor="middle" fill="#a6adc8" font-size="10">.237 LAN · .7 WG</text>
  <text x="650" y="350" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">ABG: bake3011, alistaire</text>

  <!-- strandGate (joining) -->
  <rect x="300" y="400" width="200" height="60" rx="8" fill="#313244" stroke="#585b70" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="400" y="424" text-anchor="middle" fill="#585b70" font-weight="bold" font-size="14">strandGate</text>
  <text x="400" y="442" text-anchor="middle" fill="#585b70" font-size="10">64-core EPYC · 256GB · joining</text>

  <!-- Mesh links  LAN direct (green) -->
  <line x1="260" y1="290" x2="300" y2="290" stroke="#a6e3a1" stroke-width="2"/>
  <line x1="500" y1="300" x2="540" y2="300" stroke="#a6e3a1" stroke-width="2"/>
  <line x1="160" y1="330" x2="160" y2="380" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,2" opacity="0.5"/>

  <!-- WireGuard links (blue dashed) -->
  <line x1="125" y1="126" x2="125" y2="250" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="305" y1="126" x2="160" y2="250" stroke="#89b4fa" stroke-width="1" stroke-dasharray="5,3" opacity="0.6"/>
  <line x1="660" y1="230" x2="660" y2="260" stroke="#a6e3a1" stroke-width="1.5"/>
  <line x1="685" y1="126" x2="660" y2="190" stroke="#fab387" stroke-width="1" stroke-dasharray="4,2" opacity="0.5"/>

  <!-- grapheneGate ADB -->
  <line x1="490" y1="126" x2="420" y2="260" stroke="#cba6f7" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Legend -->
  <rect x="40" y="470" width="720" height="30" rx="4" fill="#313244"/>
  <line x1="60" y1="486" x2="90" y2="486" stroke="#a6e3a1" stroke-width="2"/>
  <text x="95" y="490" fill="#a6adc8" font-size="10">LAN direct (&lt;1ms)</text>
  <line x1="210" y1="486" x2="240" y2="486" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="245" y="490" fill="#a6adc8" font-size="10">WireGuard overlay</text>
  <line x1="380" y1="486" x2="410" y2="486" stroke="#cba6f7" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="415" y="490" fill="#a6adc8" font-size="10">ADB (USB)</text>
  <rect x="505" y="480" width="12" height="12" rx="2" fill="none" stroke="#585b70" stroke-dasharray="4,2"/>
  <text x="522" y="490" fill="#a6adc8" font-size="10">Joining</text>
  <circle cx="610" cy="486" r="4" fill="#a6e3a1"/>
  <text x="618" y="490" fill="#a6adc8" font-size="10">Online</text>
  <circle cx="680" cy="486" r="4" fill="#f9e2af"/>
  <text x="688" y="490" fill="#a6adc8" font-size="10">WAN peer</text>
</svg>
