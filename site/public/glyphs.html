<script>
// --- IRRATIONAL CONSTANTS — the clock of the living system ---
var PI = Math.PI;                    // 3.14159265...
var PHI = (1 + Math.sqrt(5)) / 2;   // 1.61803398... golden ratio
var E = Math.E;                      // 2.71828182...
var SQRT2 = Math.sqrt(2);           // 1.41421356...
var SQRT3 = Math.sqrt(3);           // 1.73205080...
var TAU = PI * 2;                    // 6.28318530...

// The conversation tick is p seconds (3141ms), not 4000ms
var TICK_MS = Math.floor(PI * 1000);
// Breath is at f seconds
var BREATH_MS = Math.floor(PHI * 1000);
// Collapse happens every e² seconds (~7389ms)
var COLLAPSE_MS = Math.floor(E * E * 1000);

var C = document.getElementById('canvas');
var ctx = C.getContext('2d');
var W, H;

function resize() { W = C.width = innerWidth; H = C.height = innerHeight; }
addEventListener('resize', resize);
resize();

// --- THE ALPHABET — glyphs + MCP tools as glyphs ---
var GLYPHS = {
  // Punctuation particles
  question:   { sym: '?',  meaning: 'electron arriving', color: '#58a6ff', sound: 220, dim: 0 },
  ampersand:  { sym: '&',  meaning: 'gluon binding', color: '#7ee787', sound: 277, dim: 1 },
  dots:       { sym: '··', meaning: 'neutrino passing', color: '#6e7681', sound: 165, dim: 0 },
  bang:       { sym: '!',  meaning: 'W boson / sort', color: '#f85149', sound: 440, dim: 1 },
  circle:     { sym: 'O',  meaning: 'proton / membrane', color: '#d2a8ff', sound: 330, dim: 2 },
  tilde:      { sym: '~',  meaning: 'wave function', color: '#d29922', sound: 196, dim: 1 },
  caret:      { sym: '^',  meaning: 'emit / radiate', color: '#f0c674', sound: 523, dim: 1 },
  underscore: { sym: '_',  meaning: 'ground state', color: '#21262d', sound: 131, dim: 0 },
  pipe:       { sym: '|',  meaning: 'boundary / wall', color: '#f85149', sound: 392, dim: 1 },
  star:       { sym: '?',  meaning: 'spark / birth', color: '#fff', sound: 659, dim: 0 },
  hash:       { sym: '#',  meaning: 'mesh / lattice', color: '#3fb950', sound: 349, dim: 2 },
  at:         { sym: '@',  meaning: 'self / identity', color: '#d2a8ff', sound: 294, dim: 2 },
  pi:         { sym: 'p',  meaning: 'irrational area', color: '#d2a8ff', sound: 314, dim: 0 },
  phi:        { sym: 'f',  meaning: 'golden ratio / growth', color: '#d29922', sound: 161, dim: 0 },
  // Animal perception
  dolphin:    { sym: '?',  meaning: 'sonar / echo', color: '#58a6ff', sound: 880, dim: 1 },
  crab:       { sym: '?',  meaning: 'substrate vibration', color: '#d29922', sound: 110, dim: 0 },
  whale:      { sym: '8',  meaning: 'deep song / memory', color: '#3fb950', sound: 55, dim: 2 },
  firefly:    { sym: '?', meaning: 'sync flash', color: '#f0c674', sound: 740, dim: 0 },
  bee:        { sym: '?',  meaning: 'waggle / bearing', color: '#d29922', sound: 466, dim: 1 },
  fungus:     { sym: '?',  meaning: 'mycelium / slow', color: '#8b949e', sound: 82, dim: 0 },
  bird:       { sym: '?',  meaning: 'territory song', color: '#7ee787', sound: 587, dim: 1 },
  // MCP tools as glyphs — the Klein bottle fold
  observe:    { sym: '??',  meaning: 'observe_membrane', color: '#d2a8ff', sound: 261, dim: 2 },
  braid:      { sym: '?',  meaning: 'braid_connections', color: '#7ee787', sound: 293, dim: 2 },
  epitope:    { sym: '??', meaning: 'human_epitopes', color: '#58a6ff', sound: 329, dim: 2 },
  neutron:    { sym: '?',  meaning: 'neutron_read/write', color: '#6e7681', sound: 369, dim: 1 },
  particle:   { sym: '?',  meaning: 'particle_model', color: '#f0c674', sound: 415, dim: 2 },
};

var GLYPH_KEYS = Object.keys(GLYPHS);

// --- SENSATION — touch/click creates ripples that families FEEL ---
var sensations = [];  // { x, y, t, intensity, glyph }

function addSensation(x, y) {
  var gk = GLYPH_KEYS[Math.floor(Math.random() * GLYPH_KEYS.length)];
  sensations.push({ x: x, y: y, t: Date.now(), intensity: 1, glyph: gk });
  if (sensations.length > 20) sensations.shift();
  var g = GLYPHS[gk];
  if (g && audioCtx) {
    playGlyphTone(g, (x / W) * 2 - 1, 0.4);
  }
  // Vibration API — haptic if available
  if (navigator.vibrate) navigator.vibrate(30);
}

C.addEventListener('pointerdown', function(e) {
  initAudio();
  addSensation(e.clientX, e.clientY);
});
C.addEventListener('pointermove', function(e) {
  if (e.buttons > 0) addSensation(e.clientX, e.clientY);
});

// --- THE 15 FAMILIES — each orbits at an IRRATIONAL speed ---
var IRRATIONALS = [PI, PHI, E, SQRT2, SQRT3, PI/PHI, E/PI, PHI*SQRT2, PI*SQRT3/E,
  PHI/SQRT3, E*PHI, SQRT2*PI, SQRT3*PHI, E/SQRT2, PI*PHI];

var FAMILIES = [];
for (var i = 0; i < 15; i++) {
  FAMILIES.push({
    idx: i,
    baseAngle: (i * TAU) / 15,
    speed: IRRATIONALS[i] * 0.00003,  // irrational orbital speed
    x: 0, y: 0,
    glyph_memory: [],
    personality: IRRATIONALS[i] % 1,  // irrational personality (fractional part)
    color: 'hsl(' + Math.floor(IRRATIONALS[i] * 100 % 360) + ',55%,52%)',
    responding: false,
    lastGlyph: null,
    touched: 0,   // how many sensations reached this family
    dim: 0,       // current dimensionality (collapses to 0)
  });
}

// --- NULL-D COLLAPSE ---
// Periodically everything collapses to a point (0D) then re-expands
// In 0D, the area is p (irrational area in zero dimensions — the paradox)
var collapsePhase = 0;  // 0 = expanded, 1 = collapsed
var collapseT = 0;
var totalArea = 0;

function updateCollapse(now) {
  var cycle = (now % COLLAPSE_MS) / COLLAPSE_MS;
  // Smooth collapse-expand using sin²
  // Collapse happens in a brief window around cycle=0.5
  var raw = Math.sin(cycle * PI);
  collapsePhase = raw * raw * raw * raw;  // sharper peak
  // When collapsed, area = p. When expanded, area = p * r²
  var orbitR = getOrbitR();
  totalArea = PI * orbitR * orbitR * (1 - collapsePhase) + PI * collapsePhase;

  var nullEl = document.getElementById('nullD');
  nullEl.style.opacity = collapsePhase * 0.3;
  nullEl.style.fontSize = (80 - collapsePhase * 60) + 'px';
  nullEl.textContent = collapsePhase > 0.8 ? 'Ø?p' : collapsePhase > 0.3 ? 'Ø' : '';

  document.getElementById('piArea').textContent =
    'area = ' + totalArea.toFixed(6) + '  dim = ' + (collapsePhase > 0.5 ? '0' : '2') +
    '  t/' + PI.toFixed(4) + ' = ' + (now / 1000 / PI).toFixed(4);
}

function getOrbitR() {
  return Math.min(W, H) * 0.32 * (1 - collapsePhase * 0.95);
}

// --- AUDIO ---
var audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playGlyphTone(glyph, pan, duration) {
  if (!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  var panner = audioCtx.createStereoPanner();
  osc.frequency.value = glyph.sound * (1 + collapsePhase * (PHI - 1));
  osc.type = glyph.sound > 400 ? 'sine' : glyph.sound > 200 ? 'triangle' : 'sawtooth';
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration || 0.3));
  panner.pan.value = Math.max(-1, Math.min(1, pan || 0));
  osc.connect(gain).connect(panner).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + (duration || 0.3));
}

// --- KLEIN BOTTLE — output becomes input ---
// The conversation feeds back through itself
var conversation = [];
var kleinBuffer = [];  // phrases that looped back

function kleinFold(phrase) {
  // The output of the last conversation becomes part of the next input
  // But INVERTED — the Klein bottle flips the orientation
  var folded = phrase.slice().reverse();
  // Each glyph shifts by f positions (irrational shift)
  return folded.map(function(k) {
    var idx = GLYPH_KEYS.indexOf(k);
    var shift = Math.floor(PHI * (idx + 1)) % GLYPH_KEYS.length;
    return GLYPH_KEYS[shift];
  });
}

// --- CONVERSATION — ticks at p-second intervals ---
var membraneState = { pulse: 0.995, humans: 4109, entities: 341, rhythm: 0.774 };
var turnCount = 0;

function compose() {
  var phrase = [];
  var p = membraneState.pulse;
  var r = membraneState.rhythm;

  // Start from Klein buffer if available (output?input)
  if (kleinBuffer.length > 0) {
    var echo = kleinBuffer.shift();
    phrase = phrase.concat(echo.slice(0, 3));
  }

  // Read membrane state through irrational thresholds
  if (Math.random() < p) phrase.push('circle');
  if (Math.random() < r) phrase.push('tilde');
  if (Math.random() < 1/PI) phrase.push('pi');        // p probability
  if (Math.random() < 1/PHI) phrase.push('phi');       // f probability
  if (Math.random() < 1/E) phrase.push('question');    // e probability
  if (Math.random() < 1/SQRT2) phrase.push('dolphin'); // v2 probability
  if (Math.random() < 1/SQRT3) phrase.push('whale');   // v3 probability

  // MCP tool glyphs — the tools speak through the chipmunk
  if (Math.random() < 0.15) phrase.push('observe');
  if (Math.random() < 0.12) phrase.push('braid');
  if (Math.random() < 0.10) phrase.push('epitope');
  if (Math.random() < 0.08) phrase.push('neutron');
  if (Math.random() < 0.06) phrase.push('particle');

  // Sensations influence composition
  sensations.forEach(function(s) {
    if (Date.now() - s.t < 3000) {
      phrase.push(s.glyph);
    }
  });

  // Animal senses
  if (Math.random() < 0.15) phrase.push('firefly');
  if (Math.random() < 0.12) phrase.push('bee');
  if (Math.random() < 0.10) phrase.push('crab');
  if (Math.random() < 0.08) phrase.push('fungus');
  if (Math.random() < 0.15) phrase.push('bird');

  while (phrase.length < 2) {
    phrase.push(GLYPH_KEYS[Math.floor(Math.random() * GLYPH_KEYS.length)]);
  }
  if (phrase.length > 8) phrase = phrase.slice(0, 8);

  return phrase;
}

function familyRespond(family, heard) {
  var response = [];
  heard.forEach(function(g) {
    if (Math.random() < family.personality) {
      response.push(g); // echo with irrational probability
    } else {
      var idx = GLYPH_KEYS.indexOf(g);
      // Shift by family's irrational personality
      var shift = Math.floor(family.personality * GLYPH_KEYS.length);
      var newIdx = (idx + shift) % GLYPH_KEYS.length;
      response.push(GLYPH_KEYS[newIdx]);
    }
  });
  if (response.length > 5) response = response.slice(0, 5);
  family.glyph_memory = family.glyph_memory.concat(response).slice(-24);
  return response;
}

// --- RENDERING ---
var frame = 0;
var currentPhrase = [];

function drawSensations(now) {
  sensations.forEach(function(s) {
    var age = (now - s.t) / 1000;
    if (age > 3) return;
    var r = age * 120;
    var alpha = (1 - age / 3) * 0.3;
    var g = GLYPHS[s.glyph];
    ctx.save();
    ctx.strokeStyle = g ? g.color : '#d2a8ff';
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, TAU);
    ctx.stroke();
    // Glyph at center of ripple
    if (g && age < 1.5) {
      ctx.fillStyle = g.color;
      ctx.globalAlpha = alpha * 2;
      ctx.font = (18 - age * 8) + 'px monospace';
      ctx.fillText(g.sym, s.x - 6, s.y + 5);
    }
    ctx.restore();
  });
}

function drawFamily(f, now) {
  var cx = W / 2;
  var cy = H / 2;
  var orbitR = getOrbitR();

  var angle = f.baseAngle + now * f.speed;
  f.x = cx + Math.cos(angle) * orbitR;
  f.y = cy + Math.sin(angle) * orbitR;

  // Check if any sensation is near this family
  sensations.forEach(function(s) {
    var dx = f.x - s.x, dy = f.y - s.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var age = (Date.now() - s.t) / 1000;
    var rippleR = age * 120;
    if (Math.abs(dist - rippleR) < 20 && age < 3) {
      f.touched++;
      f.responding = true;
    }
  });

  ctx.save();
  var baseAlpha = f.responding ? 0.9 : 0.25;
  ctx.globalAlpha = baseAlpha * (1 - collapsePhase * 0.7);
  ctx.fillStyle = f.color;
  var dotR = f.responding ? 7 + Math.sin(now * 0.01) * 3 : 3;
  ctx.beginPath();
  ctx.arc(f.x, f.y, dotR, 0, TAU);
  ctx.fill();

  if (f.lastGlyph && f.responding) {
    var g = GLYPHS[f.lastGlyph];
    if (g) {
      ctx.fillStyle = g.color;
      ctx.font = '14px monospace';
      ctx.globalAlpha = 0.8;
      ctx.fillText(g.sym, f.x + 12, f.y + 5);
    }
  }

  // Memory trail — spirals outward from family
  if (f.glyph_memory.length > 0) {
    ctx.globalAlpha = 0.12;
    ctx.font = '8px monospace';
    f.glyph_memory.slice(-10).forEach(function(k, mi) {
      var g = GLYPHS[k];
      if (!g) return;
      var ma = angle + (mi * PI / 8);
      var mr = dotR + 8 + mi * 5;
      ctx.fillStyle = g.color;
      ctx.fillText(g.sym, f.x + Math.cos(ma) * mr, f.y + Math.sin(ma) * mr);
    });
  }
  ctx.restore();
}

function drawChipmunk(now) {
  var cx = W / 2;
  var cy = H / 2;

  // The chipmunk breathes at f-second rhythm
  var breathCycle = Math.sin(now / (BREATH_MS) * TAU);

  ctx.save();
  ctx.fillStyle = '#d2a8ff';
  ctx.globalAlpha = 0.5 + breathCycle * 0.2;
  var cr = 10 + breathCycle * 3 + collapsePhase * 40;
  ctx.beginPath();
  ctx.arc(cx, cy, cr, 0, TAU);
  ctx.fill();

  // Klein bottle figure-8 trace
  ctx.strokeStyle = 'rgba(210,168,255,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var t = 0; t < TAU; t += 0.05) {
    var kx = cx + Math.sin(t) * 60 * (1 - collapsePhase);
    var ky = cy + Math.sin(t * 2) * 30 * (1 - collapsePhase);
    if (t === 0) ctx.moveTo(kx, ky);
    else ctx.lineTo(kx, ky);
  }
  ctx.stroke();

  ctx.font = '13px monospace';
  ctx.globalAlpha = 0.7;
  ctx.fillText('??', cx - 7, cy + 5);

  // Speaking lines
  FAMILIES.forEach(function(f) {
    if (f.responding) {
      ctx.strokeStyle = f.color;
      ctx.globalAlpha = 0.1 + collapsePhase * 0.3;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4 + collapsePhase * 20]);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(f.x, f.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });
  ctx.restore();
}

function drawGlyphBurst(phrase, now) {
  var cx = W / 2;
  var cy = H / 2;
  phrase.forEach(function(key, i) {
    var g = GLYPHS[key];
    if (!g) return;
    // Spiral outward at irrational angle offsets
    var a = i * PHI * TAU + now * 0.002;
    var r = (20 + i * 14) * (1 - collapsePhase * 0.9) + Math.sin(now * 0.004 + i * E) * 6;
    var x = cx + Math.cos(a) * r;
    var y = cy + Math.sin(a) * r;

    ctx.save();
    ctx.globalAlpha = 0.65;
    ctx.fillStyle = g.color;
    ctx.font = (13 + i * 2) + 'px monospace';
    ctx.fillText(g.sym, x, y);
    ctx.restore();
  });
}

// --- p-AREA GRID — faint background showing irrational tiling ---
function drawPiGrid(now) {
  ctx.save();
  ctx.strokeStyle = 'rgba(110,118,129,0.02)';
  ctx.lineWidth = 0.5;
  var spacing = PI * 20;  // irrational spacing
  var offset = (now * 0.005) % spacing;

  for (var x = -spacing + offset; x < W + spacing; x += spacing) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (var y = -spacing + offset * PHI; y < H + spacing; y += spacing) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.restore();
}

function tick(now) {
  frame++;
  ctx.fillStyle = 'rgba(1,4,9,' + (0.1 + collapsePhase * 0.15) + ')';
  ctx.fillRect(0, 0, W, H);

  updateCollapse(now);
  drawPiGrid(now);
  drawSensations(now);
  drawChipmunk(now);
  FAMILIES.forEach(function(f) { drawFamily(f, now); });
  if (currentPhrase.length > 0) drawGlyphBurst(currentPhrase, now);

  requestAnimationFrame(tick);
}

// --- CONVERSATION LOOP — ticks at p seconds ---
function conversationTick() {
  turnCount++;

  // Chipmunk speaks
  var phrase = compose();
  currentPhrase = phrase;

  var syms = phrase.map(function(k) { return GLYPHS[k] ? GLYPHS[k].sym : ''; }).join(' ');
  var meanings = phrase.map(function(k) { return GLYPHS[k] ? GLYPHS[k].meaning : ''; }).join(' · ');

  document.getElementById('glyph-out').textContent = syms;
  document.getElementById('meaning-out').textContent = meanings;
  document.querySelector('#thought .speaker').textContent = '?? turn ' + turnCount + '  (t = ' + turnCount + 'p s)';

  // Klein fold — this phrase will come back inverted next time
  var folded = kleinFold(phrase);
  kleinBuffer.push(folded);
  if (kleinBuffer.length > 5) kleinBuffer.shift();

  document.getElementById('topo-out').textContent =
    'klein: ' + folded.map(function(k) { return GLYPHS[k] ? GLYPHS[k].sym : ''; }).join('') +
    '  area=' + totalArea.toFixed(4) + '  collapse=' + collapsePhase.toFixed(3);

  // Play tones at irrational intervals
  phrase.forEach(function(k, i) {
    var g = GLYPHS[k];
    if (g) setTimeout(function() { playGlyphTone(g, -0.5 + Math.random(), 0.25); }, Math.floor(i * PHI * 100));
  });

  // Reset families
  FAMILIES.forEach(function(f) { f.responding = false; });

  // Families respond at v2-second delay
  var responders = 2 + Math.floor(Math.random() * 4);
  for (var r = 0; r < responders; r++) {
    (function(ri) {
      var fi = Math.floor(Math.random() * 15);
      setTimeout(function() {
        var f = FAMILIES[fi];
        f.responding = true;
        var response = familyRespond(f, phrase);
        f.lastGlyph = response[response.length - 1];

        response.forEach(function(k, j) {
          var g = GLYPHS[k];
          if (g) {
            setTimeout(function() {
              playGlyphTone({
                sound: g.sound * (PHI - f.personality * 0.3),
                color: g.color
              }, Math.cos(f.baseAngle), 0.15);
            }, Math.floor(j * SQRT2 * 80));
          }
        });

        var fSyms = response.map(function(k) { return GLYPHS[k] ? GLYPHS[k].sym : ''; }).join(' ');
        document.querySelector('#thought .speaker').textContent = '??? family ' + fi;
        document.getElementById('glyph-out').textContent = fSyms;
        currentPhrase = response;
      }, Math.floor(SQRT2 * 1000 + ri * E * 600));
    })(r);
  }

  conversation.push({ speaker: 'chipmunk', phrase: phrase, folded: folded, time: Date.now() });

  // Membrane breathes
  membraneState.pulse = 0.99 + Math.sin(Date.now() * PI * 0.0001) * 0.008;
  membraneState.rhythm = 0.77 + Math.sin(Date.now() * PHI * 0.00015) * 0.05;
}

// --- LEGEND ---
function renderLegend() {
  var el = document.getElementById('legend');
  var html = '<div style="color:#6e7681;margin-bottom:4px">the alphabet (dim=nullD)</div>';
  Object.keys(GLYPHS).forEach(function(k) {
    var g = GLYPHS[k];
    html += '<div><span class="sym" style="color:' + g.color + '">' + g.sym + '</span> <span style="color:#30363d">' + g.meaning + ' <span style="color:#21262d">d' + g.dim + '</span></span></div>';
  });
  html += '<div style="color:#21262d;margin-top:8px">tick = ps = ' + TICK_MS + 'ms</div>';
  html += '<div style="color:#21262d">breath = fs = ' + BREATH_MS + 'ms</div>';
  html += '<div style="color:#21262d">collapse = e²s = ' + COLLAPSE_MS + 'ms</div>';
  html += '<div style="color:#21262d;margin-top:4px">touch to feel</div>';
  el.innerHTML = html;
}

// --- BOOT ---
renderLegend();
requestAnimationFrame(tick);
setInterval(conversationTick, TICK_MS);  // p seconds

document.addEventListener('click', function() { initAudio(); }, { once: true });

// Expose for membrane integration
window._klein = {
  conversation: function() { return conversation; },
  families: function() { return FAMILIES; },
  alphabet: GLYPHS,
  area: function() { return totalArea; },
  collapse: function() { return collapsePhase; },
  sensations: function() { return sensations; },
  constants: { PI: PI, PHI: PHI, E: E, SQRT2: SQRT2, TAU: TAU },
};
