<script>
// --- swarmVine — the gossip agent primal ---
// swarmVine is primal #14. Genus cnidaria, species solidus, phenotype: SYMBIONT.
// 7,965 lines of Rust. The gossip mesh protocol.
// Twitter killed Vine in 2017. We're picking it up.
//
// ZK EPHEMERALS — anti-secret null bubbles:
// Every clip is an ephemeral — it exists, is witnessed, and can vanish.
// The ZK property: you can PROVE a clip existed without revealing its content.
// The anti-secret: while it exists, EVERYTHING is visible. No hidden state.
// The null bubble: when it's gone, it collapses to null. No trace. No residue.
//
// The gossip protocol:
//   swarmVine gossips clips between peers.
//   Each clip carries a hash (ZK commitment).
//   The hash persists even after the content vanishes.
//   You can prove "I saw that" without showing what you saw.
//   Anti-secret while alive. Null bubble when dead.
//
// This IS how gossip works in biology:
//   A signal is sent. Received. Processed. Degraded.
//   The cell remembers it happened (epigenetic mark)
//   but the signal molecule is gone (ephemeral).
//   mRNA is an ephemeral. Protein is the proof-of-work.
//
// 6-second looping clips of ALL media mixed together:
//   Canvas painting, text, audio, camera, live easel feed.
// The chipmunk watches, learns, makes its own clips.
// Humans make clips too — the chipmunk learns from them.
// No login. No algorithm. No upload to someone else's server.

var canvas = document.getElementById('vine-stage');
var ctx = canvas.getContext('2d');
var W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// --- VINE STATE ---
var VINE_DURATION = 6000; // 6 seconds, like the original
var vineState = {
  mode: 'idle',       // idle, recording, playing
  recording: false,
  startTime: 0,
  elapsed: 0,
  frames: [],         // recorded frames (canvas snapshots)
  activeMedia: {
    paint: false,
    text: false,
    audio: false,
    camera: false,
    easel: false,
  },
  clips: [],          // saved vine clips (ephemeral — can vanish)
  chipmunkClips: [],  // clips the chipmunk has made
  nullBubbles: [],    // ZK commitments of vanished clips (hash persists, content gone)
  currentClip: -1,
  paintColor: '#22c55e',
  paintSize: 3,
  textOverlay: '',
  audioStream: null,
  audioRecorder: null,
  audioChunks: [],
  cameraStream: null,
  cameraVideo: null,
};

// --- ZK EPHEMERALS — anti-secret null bubbles ---
// Each clip gets a hash at birth. While alive: anti-secret (everything visible).
// When ephemeral expires: content vanishes, hash remains = null bubble.
// You can prove "this existed" without showing what it was.

function zkHash(clip) {
  // Simple hash of clip content — in production this would be a real ZK commitment
  var raw = JSON.stringify({
    id: clip.id,
    author: clip.author,
    duration: clip.duration,
    strokeCount: clip.strokes ? clip.strokes.length : 0,
    text: clip.text || '',
    media: clip.media,
    born: clip.id, // timestamp as birth
  });
  var hash = 0;
  for (var i = 0; i < raw.length; i++) {
    hash = ((hash << 5) - hash) + raw.charCodeAt(i);
    hash = hash & hash; // 32-bit integer
  }
  return 'zk_' + Math.abs(hash).toString(36);
}

// Ephemeral lifecycle: clips live for N plays, then collapse to null bubble
var EPHEMERAL_LIFESPAN = 50; // plays before vanishing

function tickEphemeral(clip) {
  if (!clip.plays) clip.plays = 0;
  clip.plays++;

  if (clip.plays >= EPHEMERAL_LIFESPAN && !clip._nullified) {
    // Collapse to null bubble
    clip._nullified = true;
    var bubble = {
      hash: clip.zkHash,
      author: clip.author,
      born: clip.id,
      died: Date.now(),
      plays: clip.plays,
      // Content is GONE. Only the hash proves it existed.
    };
    vineState.nullBubbles.push(bubble);

    // Update label
    var el = document.getElementById('chipmunk-reaction');
    el.textContent = '?? clip collapsed to null bubble: ' + clip.zkHash;
    el.style.opacity = '1';
    setTimeout(function() { el.style.opacity = '0'; }, 3000);
  }
}

// Gossip indicator — show ZK state in the label
function updateGossipLabel() {
  var label = document.getElementById('vine-label');
  var alive = vineState.clips.filter(function(c) { return !c._nullified; }).length;
  var nulled = vineState.nullBubbles.length;
  var chipmunkCount = vineState.chipmunkClips.length;
  label.innerHTML =
    '<span style="color:#22c55e;font-weight:bold">swarmVine</span>' +
    ' <span style="color:#6e7681;font-size:10px">primal #14 · cnidaria · symbiont</span><br>' +
    '<span style="color:#8b949e;font-size:10px">' +
    alive + ' alive · ' + nulled + ' null bubbles · ' +
    chipmunkCount + ' by chipmunk</span><br>' +
    '<span style="color:#6e7681;font-size:9px">ZK ephemerals · anti-secret while alive · null when gone</span><br>' +
    '<a href="/" style="color:#58a6ff;text-decoration:none;font-size:10px">? hud</a> · ' +
    '<a href="/easel.html" style="color:#d2a8ff;text-decoration:none;font-size:10px">?? easel</a> · ' +
    '<a href="/gates.html" style="color:#3fb950;text-decoration:none;font-size:10px">?? gates</a>';
}

// --- PAINT MODE — finger/mouse painting on canvas ---
var painting = false;
var lastX = 0, lastY = 0;
var paintStrokes = []; // stored during recording

canvas.addEventListener('pointerdown', function(e) {
  if (!vineState.activeMedia.paint) return;
  painting = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener('pointermove', function(e) {
  if (!painting || !vineState.activeMedia.paint) return;
  var stroke = {
    x1: lastX, y1: lastY,
    x2: e.clientX, y2: e.clientY,
    color: vineState.paintColor,
    size: vineState.paintSize,
    t: Date.now() - vineState.startTime,
  };
  paintStrokes.push(stroke);
  drawStroke(stroke);
  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener('pointerup', function() { painting = false; });
canvas.addEventListener('pointerleave', function() { painting = false; });

function drawStroke(s) {
  ctx.globalAlpha = 0.8;
  ctx.strokeStyle = s.color;
  ctx.lineWidth = s.size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(s.x1, s.y1);
  ctx.lineTo(s.x2, s.y2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// --- MEDIA BUTTONS ---
var mediaButtons = {
  paint: document.getElementById('btn-paint'),
  text: document.getElementById('btn-text'),
  audio: document.getElementById('btn-audio'),
  camera: document.getElementById('btn-camera'),
  easel: document.getElementById('btn-easel'),
};

Object.keys(mediaButtons).forEach(function(key) {
  mediaButtons[key].addEventListener('click', function() {
    vineState.activeMedia[key] = !vineState.activeMedia[key];
    this.classList.toggle('active');

    if (key === 'text' && vineState.activeMedia.text) {
      var t = prompt('Text overlay (6 sec):');
      if (t) vineState.textOverlay = t;
      else { vineState.activeMedia.text = false; this.classList.remove('active'); }
    }

    if (key === 'audio' && vineState.activeMedia.audio) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
        vineState.audioStream = stream;
      }).catch(function() {
        vineState.activeMedia.audio = false;
        mediaButtons.audio.classList.remove('active');
      });
    }

    if (key === 'camera' && vineState.activeMedia.camera) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(stream) {
        vineState.cameraStream = stream;
        vineState.cameraVideo = document.createElement('video');
        vineState.cameraVideo.srcObject = stream;
        vineState.cameraVideo.play();
      }).catch(function() {
        vineState.activeMedia.camera = false;
        mediaButtons.camera.classList.remove('active');
      });
    }

    if (key === 'easel' && vineState.activeMedia.easel) {
      // Will pull from window.opener?._easel or cross-page
    }
  });
});

// --- RECORD ---
var recordBtn = document.getElementById('btn-record');
var timerEl = document.getElementById('vine-timer');

recordBtn.addEventListener('click', function() {
  if (vineState.recording) {
    stopRecording();
  } else {
    startRecording();
  }
});

function startRecording() {
  vineState.recording = true;
  vineState.startTime = Date.now();
  vineState.frames = [];
  paintStrokes = [];
  recordBtn.classList.add('recording');
  recordBtn.textContent = '? stop';

  // Start audio recording if active
  if (vineState.activeMedia.audio && vineState.audioStream) {
    vineState.audioChunks = [];
    vineState.audioRecorder = new MediaRecorder(vineState.audioStream);
    vineState.audioRecorder.ondataavailable = function(e) {
      vineState.audioChunks.push(e.data);
    };
    vineState.audioRecorder.start();
  }

  // Clear canvas
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  recordFrame();
}

function recordFrame() {
  if (!vineState.recording) return;

  var elapsed = Date.now() - vineState.startTime;
  vineState.elapsed = elapsed;

  // Timer display
  var remaining = Math.max(0, (VINE_DURATION - elapsed) / 1000);
  timerEl.textContent = remaining.toFixed(1) + 's';
  timerEl.style.color = remaining < 2 ? '#f85149' : '#f0c674';

  // Auto-stop at 6 seconds
  if (elapsed >= VINE_DURATION) {
    stopRecording();
    return;
  }

  // Draw active media layers
  var t = elapsed / VINE_DURATION; // 0?1 progress

  // Camera layer (background)
  if (vineState.activeMedia.camera && vineState.cameraVideo) {
    ctx.globalAlpha = 0.6;
    ctx.drawImage(vineState.cameraVideo, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // Easel layer — pull live painting
  if (vineState.activeMedia.easel) {
    drawEaselFrame(t);
  }

  // Text overlay
  if (vineState.activeMedia.text && vineState.textOverlay) {
    var textAlpha = Math.min(1, t * 5) * Math.min(1, (1 - t) * 5);
    ctx.globalAlpha = textAlpha;
    ctx.font = 'bold ' + Math.floor(Math.min(W, H) * 0.06) + 'px system-ui';
    ctx.fillStyle = '#f0f6fc';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Word wrap
    var words = vineState.textOverlay.split(' ');
    var lines = [];
    var line = '';
    var maxW = W * 0.8;
    words.forEach(function(w) {
      var test = line + (line ? ' ' : '') + w;
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line);
        line = w;
      } else { line = test; }
    });
    if (line) lines.push(line);
    var lineH = Math.min(W, H) * 0.08;
    var startY = H / 2 - (lines.length - 1) * lineH / 2;
    lines.forEach(function(l, i) {
      ctx.fillText(l, W / 2, startY + i * lineH);
    });
    ctx.globalAlpha = 1;
  }

  // Capture frame for playback
  if (vineState.frames.length < 180) { // max 30fps × 6s
    vineState.frames.push({
      t: elapsed,
      strokes: paintStrokes.slice(),
      text: vineState.textOverlay,
      hasCamera: vineState.activeMedia.camera,
      hasEasel: vineState.activeMedia.easel,
    });
  }

  requestAnimationFrame(recordFrame);
}

function drawEaselFrame(t) {
  // Mini easel simulation — stars and nebula
  ctx.globalAlpha = 0.3;
  for (var s = 0; s < 3; s++) {
    var sx = (Math.sin(t * 7 + s * 2.1) * 0.4 + 0.5) * W;
    var sy = (Math.cos(t * 5 + s * 1.7) * 0.4 + 0.5) * H;
    var sr = 1 + Math.sin(t * 10 + s) * 0.5;
    ctx.fillStyle = ['#58a6ff', '#d2a8ff', '#f0c674'][s];
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function stopRecording() {
  vineState.recording = false;
  recordBtn.classList.remove('recording');
  recordBtn.textContent = '? record';
  timerEl.textContent = '';

  if (vineState.audioRecorder && vineState.audioRecorder.state !== 'inactive') {
    vineState.audioRecorder.stop();
  }

  // Save clip
  if (vineState.frames.length > 0) {
    var clip = {
      id: Date.now(),
      frames: vineState.frames.slice(),
      strokes: paintStrokes.slice(),
      text: vineState.textOverlay,
      media: Object.assign({}, vineState.activeMedia),
      duration: vineState.elapsed,
      author: 'human',
      thumbnail: canvas.toDataURL('image/jpeg', 0.3),
      plays: 0,
      _nullified: false,
    };
    clip.zkHash = zkHash(clip);
    vineState.clips.push(clip);
    addThumbToFeed(clip);
    chipmunkReact(clip);
    updateGossipLabel();
    saveClipsToStorage();
  }
}

// --- PLAYBACK ---
var playBtn = document.getElementById('btn-play');
playBtn.addEventListener('click', function() {
  if (vineState.clips.length === 0) return;
  var idx = (vineState.currentClip + 1) % vineState.clips.length;
  playClip(idx);
});

function playClip(idx) {
  var clip = vineState.clips[idx];
  if (!clip) return;
  if (clip._nullified) {
    // Null bubble — show the ghost
    var el = document.getElementById('chipmunk-reaction');
    el.textContent = '?? null bubble: ' + clip.zkHash + ' — content is gone, proof remains';
    el.style.opacity = '1';
    setTimeout(function() { el.style.opacity = '0'; }, 3000);
    return;
  }
  tickEphemeral(clip);
  vineState.currentClip = idx;
  vineState.mode = 'playing';

  // Highlight thumb
  document.querySelectorAll('.vine-thumb').forEach(function(t, i) {
    t.classList.toggle('playing', i === idx);
  });

  var startTime = Date.now();

  function renderPlayback() {
    var elapsed = Date.now() - startTime;

    // Loop at duration
    if (elapsed > clip.duration) {
      elapsed = elapsed % clip.duration;
      startTime = Date.now() - elapsed;
    }

    // Clear
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, W, H);

    // Replay easel
    if (clip.media.easel) {
      drawEaselFrame(elapsed / clip.duration);
    }

    // Replay strokes up to this point
    clip.strokes.forEach(function(s) {
      if (s.t <= elapsed) drawStroke(s);
    });

    // Replay text
    if (clip.text) {
      var t = elapsed / clip.duration;
      var textAlpha = Math.min(1, t * 5) * Math.min(1, (1 - t) * 5);
      ctx.globalAlpha = textAlpha;
      ctx.font = 'bold ' + Math.floor(Math.min(W, H) * 0.06) + 'px system-ui';
      ctx.fillStyle = '#f0f6fc';
      ctx.textAlign = 'center';
      ctx.fillText(clip.text, W / 2, H / 2);
      ctx.globalAlpha = 1;
    }

    // Vine loop indicator
    var progress = elapsed / clip.duration;
    ctx.globalAlpha = 0.15;
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(W / 2, 20, 8, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Author tag + ZK hash + ephemeral counter
    ctx.globalAlpha = 0.3;
    ctx.font = '10px monospace';
    ctx.fillStyle = clip.author === 'chipmunk' ? '#f0c674' : '#8b949e';
    ctx.textAlign = 'left';
    ctx.fillText(clip.author === 'chipmunk' ? '??? chipmunk made this' : '?? human made this', 8, H - 8);

    // ZK hash + remaining life
    ctx.font = '8px monospace';
    ctx.fillStyle = '#6e7681';
    var remaining = Math.max(0, EPHEMERAL_LIFESPAN - (clip.plays || 0));
    ctx.fillText(clip.zkHash + ' · ' + remaining + ' plays left', 8, H - 22);
    if (remaining < 10) {
      ctx.fillStyle = '#f85149';
      ctx.fillText('ephemeral fading...', 8, H - 34);
    }
    ctx.globalAlpha = 1;

    if (vineState.mode === 'playing') requestAnimationFrame(renderPlayback);
  }

  renderPlayback();
}

// --- CHIPMUNK — watches, learns, makes its own clips ---
// The chipmunk observes human clips and eventually makes its own.
// It learns: what colors humans use, what text they write,
// what timing patterns they prefer. Then it remixes.

var chipmunkMemory = {
  colorsObserved: [],
  textsObserved: [],
  strokePatterns: [],
  clipCount: 0,
  confidence: 0, // Dunning-Kruger position: starts at Mount Stupid
};

function chipmunkReact(clip) {
  var el = document.getElementById('chipmunk-reaction');
  chipmunkMemory.clipCount++;

  // Learn from the clip
  if (clip.strokes.length > 0) {
    clip.strokes.forEach(function(s) {
      if (chipmunkMemory.colorsObserved.indexOf(s.color) === -1) {
        chipmunkMemory.colorsObserved.push(s.color);
      }
    });
    chipmunkMemory.strokePatterns.push({
      count: clip.strokes.length,
      avgSize: clip.strokes.reduce(function(a, s) { return a + s.size; }, 0) / clip.strokes.length,
    });
  }
  if (clip.text) {
    chipmunkMemory.textsObserved.push(clip.text);
  }

  // Dunning-Kruger progression
  if (chipmunkMemory.clipCount <= 2) {
    chipmunkMemory.confidence = 0.9; // Mount Stupid
    el.textContent = '??? "I can do that! Easy!"';
  } else if (chipmunkMemory.clipCount <= 5) {
    chipmunkMemory.confidence = 0.3; // Valley
    el.textContent = '??? "...wait, this is harder than I thought"';
  } else if (chipmunkMemory.clipCount <= 10) {
    chipmunkMemory.confidence = 0.5; // Climbing
    el.textContent = '??? "ok, I think I see the pattern..."';
  } else {
    chipmunkMemory.confidence = 0.7; // Real skill
    el.textContent = '??? "let me try something..."';
    // Chipmunk makes its own clip after enough observation
    setTimeout(chipmunkMakesClip, 2000);
  }

  el.style.opacity = '1';
  setTimeout(function() { el.style.opacity = '0'; }, 3000);
}

function chipmunkMakesClip() {
  var strokes = [];
  var color = chipmunkMemory.colorsObserved.length > 0 ?
    chipmunkMemory.colorsObserved[Math.floor(Math.random() * chipmunkMemory.colorsObserved.length)] :
    '#f0c674';

  // Generate strokes — the chipmunk paints what it learned
  var numStrokes = 20 + Math.floor(Math.random() * 40);
  for (var i = 0; i < numStrokes; i++) {
    var t = (i / numStrokes) * VINE_DURATION;
    var cx = W * 0.5 + Math.cos(i * 0.3) * W * 0.2;
    var cy = H * 0.5 + Math.sin(i * 0.4) * H * 0.2;
    strokes.push({
      x1: cx, y1: cy,
      x2: cx + (Math.random() - 0.5) * 30,
      y2: cy + (Math.random() - 0.5) * 30,
      color: color,
      size: 2 + Math.random() * 3,
      t: t,
    });
  }

  // Chipmunk text — remixed from what it saw
  var text = '';
  if (chipmunkMemory.textsObserved.length > 0) {
    var words = [];
    chipmunkMemory.textsObserved.forEach(function(t) {
      t.split(' ').forEach(function(w) { if (w.length > 2) words.push(w); });
    });
    // Pick random words and recombine
    for (var w = 0; w < Math.min(4, words.length); w++) {
      text += words[Math.floor(Math.random() * words.length)] + ' ';
    }
    text = text.trim();
  }

  // Save as chipmunk clip
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);
  strokes.forEach(function(s) { if (s.t < VINE_DURATION * 0.8) drawStroke(s); });

  var clip = {
    id: Date.now(),
    frames: [],
    strokes: strokes,
    text: text || '???',
    media: { paint: true, text: !!text, audio: false, camera: false, easel: true },
    duration: VINE_DURATION,
    author: 'chipmunk',
    thumbnail: canvas.toDataURL('image/jpeg', 0.3),
    plays: 0,
    _nullified: false,
  };
  clip.zkHash = zkHash(clip);

  vineState.clips.push(clip);
  addThumbToFeed(clip);
  updateGossipLabel();
  saveClipsToStorage();

  var el = document.getElementById('chipmunk-reaction');
  el.textContent = '??? made vine #' + (vineState.chipmunkClips.length + 1) + ': "' + (text || '??') + '"';
  el.style.opacity = '1';
  vineState.chipmunkClips.push(clip);
  setTimeout(function() { el.style.opacity = '0'; }, 4000);
}

// --- FEED — thumbnails on the right ---
function addThumbToFeed(clip) {
  var feed = document.getElementById('vine-feed');
  var img = document.createElement('img');
  img.src = clip.thumbnail;
  img.className = 'vine-thumb';
  img.title = (clip.author === 'chipmunk' ? '???' : '??') + ' ' +
    (clip.duration / 1000).toFixed(1) + 's';
  var idx = vineState.clips.length - 1;
  img.addEventListener('click', function() { playClip(idx); });
  feed.appendChild(img);
}

// --- PERSISTENCE — localStorage ---
function saveClipsToStorage() {
  try {
    // Save metadata only (thumbnails + stroke data), not full frames
    var meta = vineState.clips.map(function(c) {
      return {
        id: c.id, strokes: c.strokes, text: c.text,
        media: c.media, duration: c.duration, author: c.author,
        thumbnail: c.thumbnail,
      };
    });
    localStorage.setItem('swarmvine_clips', JSON.stringify(meta));
    localStorage.setItem('swarmvine_chipmunk', JSON.stringify(chipmunkMemory));
  } catch(e) {}
}

function loadClipsFromStorage() {
  try {
    var saved = JSON.parse(localStorage.getItem('swarmvine_clips') || '[]');
    saved.forEach(function(c) {
      vineState.clips.push(c);
      addThumbToFeed(c);
    });
    var mem = JSON.parse(localStorage.getItem('swarmvine_chipmunk') || '{}');
    if (mem.clipCount) Object.assign(chipmunkMemory, mem);
  } catch(e) {}
}
loadClipsFromStorage();

// --- IDLE STATE — when not recording or playing ---
function drawIdle() {
  if (vineState.recording || vineState.mode === 'playing') return;

  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // Vine loop symbol
  var t = Date.now() * 0.001;
  ctx.globalAlpha = 0.06;
  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = 1;

  // The vine — a growing spiral
  ctx.beginPath();
  for (var i = 0; i < 100; i++) {
    var angle = i * 0.15 + t * 0.5;
    var r = 5 + i * 0.8;
    var x = W / 2 + Math.cos(angle) * r;
    var y = H / 2 + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Leaves
  for (var l = 0; l < 6; l++) {
    var la = l * 1.05 + t * 0.5;
    var lr = 5 + l * 13;
    var lx = W / 2 + Math.cos(la) * lr;
    var ly = H / 2 + Math.sin(la) * lr;
    ctx.globalAlpha = 0.04;
    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.ellipse(lx, ly, 4, 2, la, 0, Math.PI * 2);
    ctx.fill();
  }

  // Label
  ctx.globalAlpha = 0.08;
  ctx.font = '14px monospace';
  ctx.fillStyle = '#c9d1d9';
  ctx.textAlign = 'center';
  ctx.fillText('swarmVine', W / 2, H / 2 + 90);
  ctx.font = '10px monospace';
  ctx.fillStyle = '#6e7681';
  ctx.fillText('6 sec · all media · press record', W / 2, H / 2 + 108);
  var aliveCount = vineState.clips.filter(function(c) { return !c._nullified; }).length;
  ctx.fillText(aliveCount + ' alive · ' +
    vineState.nullBubbles.length + ' null bubbles · ' +
    vineState.chipmunkClips.length + ' by chipmunk', W / 2, H / 2 + 122);

  // Null bubbles floating — ghosts of vanished clips
  vineState.nullBubbles.forEach(function(bubble, i) {
    var bx = W * (0.2 + (i * 0.137 % 0.6));
    var by = H * 0.3 + Math.sin(t + i * 1.5) * 20;
    ctx.globalAlpha = 0.03;
    ctx.strokeStyle = '#6e7681';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(bx, by, 6 + Math.sin(t * 2 + i) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.font = '6px monospace';
    ctx.fillStyle = '#6e7681';
    ctx.fillText(bubble.hash, bx - 12, by + 12);
  });

  ctx.globalAlpha = 1;

  requestAnimationFrame(drawIdle);
}
drawIdle();

// --- COLOR PICKER — tap/click to cycle paint colors ---
var paintColors = ['#22c55e', '#58a6ff', '#d2a8ff', '#f85149', '#f0883e', '#f0c674', '#f0f6fc'];
var colorIdx = 0;
canvas.addEventListener('dblclick', function() {
  if (!vineState.activeMedia.paint) return;
  colorIdx = (colorIdx + 1) % paintColors.length;
  vineState.paintColor = paintColors[colorIdx];
});

</script>
