<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>📖 LIBER TERRAE — The Book of Gaia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#000; --gold:#c9a84c; --green:#3fb950; --blue:#58a6ff; --pink:#f778ba; --dim:#555; }
  body { background:var(--bg); color:#c9d1d9; font-family:'JetBrains Mono',monospace; overflow-x:hidden; }

  /* TOP NAV */
  .lib-top { position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(0,0,0,0.92); backdrop-filter:blur(8px);
    padding:8px 16px; display:flex; align-items:center; gap:12px;
    border-bottom:1px solid rgba(201,168,76,0.2);
    padding-top:env(safe-area-inset-top,8px);
  }
  .lib-top a { color:var(--green); text-decoration:none; font-size:11px; }
  .lib-top h1 { font-size:11px; color:var(--gold); letter-spacing:2px; flex:1; text-align:center; }
  .lib-top .diamond-count { color:var(--blue); font-size:10px; }

  /* FILTER BAR */
  .filter-bar { position:fixed; top:40px; left:0; right:0; z-index:99;
    background:rgba(0,0,0,0.88); backdrop-filter:blur(4px);
    padding:6px 12px; display:flex; gap:6px; overflow-x:auto;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
    border-bottom:1px solid rgba(30,32,48,0.5);
  }
  .filter-bar::-webkit-scrollbar { display:none; }
  .filter-btn { background:none; border:1px solid #2a2a3a; color:var(--dim);
    padding:4px 10px; border-radius:12px; font:9px 'JetBrains Mono',monospace;
    cursor:pointer; white-space:nowrap; transition:all 0.2s; min-height:28px;
  }
  .filter-btn.active { border-color:var(--gold); color:var(--gold); background:rgba(201,168,76,0.1); }
  .filter-btn:hover { border-color:var(--green); color:var(--green); }

  /* GALLERY GRID */
  .gallery { padding:90px 8px 100px; display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:12px; max-width:1200px; margin:0 auto;
  }
  @media (max-width:600px) {
    .gallery { grid-template-columns:1fr; padding:86px 6px 90px; gap:8px; }
  }

  /* CARD */
  .card { background:rgba(10,12,18,0.9); border:1px solid #1e2030;
    border-radius:12px; overflow:hidden; transition:all 0.3s;
    cursor:pointer; position:relative;
  }
  .card:hover { border-color:var(--gold); transform:translateY(-2px);
    box-shadow:0 8px 32px rgba(201,168,76,0.1);
  }
  .card:active { transform:scale(0.98); }
  .card img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block;
    filter:brightness(0.9); transition:filter 0.3s;
  }
  .card:hover img { filter:brightness(1); }
  .card-body { padding:10px 12px; }
  .card-diamond { font-size:8px; color:var(--blue); letter-spacing:1px; margin-bottom:2px; }
  .card-title { font-size:11px; color:var(--gold); margin-bottom:4px; line-height:1.4; }
  .card-desc { font-size:8px; color:var(--dim); line-height:1.5; }
  .card-tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .card-tag { font-size:7px; padding:2px 6px; border-radius:8px;
    border:1px solid #2a2a3a; color:#777;
  }

  /* FULLSCREEN LIGHTBOX */
  .lightbox { display:none; position:fixed; top:0;left:0;right:0;bottom:0;
    z-index:200; background:rgba(0,0,0,0.96); backdrop-filter:blur(12px);
    flex-direction:column; align-items:center; justify-content:center;
    padding:20px; padding-top:env(safe-area-inset-top,20px);
    padding-bottom:env(safe-area-inset-bottom,20px);
  }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:100%; max-height:80vh; object-fit:contain; border-radius:8px;
    box-shadow:0 0 60px rgba(201,168,76,0.15);
  }
  .lightbox .lb-close { position:absolute; top:16px; right:16px; color:#fff;
    font-size:24px; cursor:pointer; z-index:201; background:rgba(0,0,0,0.5);
    width:40px; height:40px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; border:1px solid #333;
  }
  .lightbox .lb-title { color:var(--gold); font-size:12px; margin-top:12px; text-align:center; }
  .lightbox .lb-nav { display:flex; gap:20px; margin-top:12px; }
  .lightbox .lb-nav button { background:none; border:1px solid #555; color:#aaa;
    padding:8px 20px; border-radius:8px; font:11px 'JetBrains Mono',monospace;
    cursor:pointer; min-height:44px; min-width:44px;
  }
  .lightbox .lb-nav button:hover { border-color:var(--gold); color:var(--gold); }

  /* BOTTOM RETURN BAR */
  .lib-bottom { position:fixed; bottom:0; left:0; right:0; z-index:100;
    background:rgba(0,0,0,0.92); backdrop-filter:blur(8px);
    padding:8px 16px; display:flex; align-items:center; justify-content:center; gap:16px;
    border-top:1px solid rgba(201,168,76,0.2);
    padding-bottom:env(safe-area-inset-bottom,8px);
  }
  .lib-bottom a { color:var(--green); text-decoration:none; font-size:10px;
    padding:6px 16px; border:1px solid var(--green); border-radius:20px;
    transition:all 0.2s; min-height:36px; display:flex; align-items:center;
  }
  .lib-bottom a:hover { background:rgba(63,185,80,0.15); }
  .lib-bottom .stat { color:var(--dim); font-size:9px; }

  /* TOUCH */
  @media (hover:none) and (pointer:coarse) {
    .card { -webkit-tap-highlight-color:transparent; }
    .lb-nav button, .filter-btn, .lib-bottom a { min-height:44px; min-width:44px; }
  }

  /* OLED */
  @media (prefers-color-scheme:dark) { body { background:#000; } }
</style>

// ═══ RENDER ═══
var gallery = document.getElementById('gallery');
var lightbox = document.getElementById('lightbox');
var lbImg = document.getElementById('lb-img');
var lbTitle = document.getElementById('lb-title');
var currentIdx = 0;
var filtered = paintings.slice();

function render(filter) {
  filtered = filter === 'all' ? paintings.slice() : paintings.filter(function(p) {
    return p.tags.indexOf(filter) >= 0;
  });
  document.getElementById('count').textContent = filtered.length + ' 💎';
  gallery.innerHTML = '';
  filtered.forEach(function(p, i) {
    var card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('data-idx', i);
    card.innerHTML =
      '<img src="' + p.src + '" alt="' + p.title + '" loading="lazy">' +
      '<div class="card-body">' +
        (p.diamond ? '<div class="card-diamond">' + p.diamond + '</div>' : '') +
        '<div class="card-title">' + p.title + '</div>' +
        '<div class="card-desc">' + p.desc + '</div>' +
        '<div class="card-tags">' + p.tags.map(function(t){ return '<span class="card-tag">' + t + '</span>'; }).join('') + '</div>' +
      '</div>';
    card.addEventListener('click', function() { openLightbox(i); });
    gallery.appendChild(card);
  });
}

function openLightbox(idx) {
  currentIdx = idx;
  var p = filtered[idx];
  lbImg.src = p.src;
  lbTitle.textContent = (p.diamond ? p.diamond + ' — ' : '') + p.title;
  lightbox.classList.add('open');
}

function closeLightbox() { lightbox.classList.remove('open'); }

document.getElementById('lb-close').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', function(e) { if (e.target === lightbox) closeLightbox(); });
document.getElementById('lb-prev').addEventListener('click', function() {
  currentIdx = (currentIdx - 1 + filtered.length) % filtered.length;
  openLightbox(currentIdx);
});
document.getElementById('lb-next').addEventListener('click', function() {
  currentIdx = (currentIdx + 1) % filtered.length;
  openLightbox(currentIdx);
});

// KEYBOARD NAV
document.addEventListener('keydown', function(e) {
  if (lightbox.classList.contains('open')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') { currentIdx = (currentIdx - 1 + filtered.length) % filtered.length; openLightbox(currentIdx); }
    if (e.key === 'ArrowRight') { currentIdx = (currentIdx + 1) % filtered.length; openLightbox(currentIdx); }
  }
});

// SWIPE SUPPORT
var touchStartX = 0;
lightbox.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
lightbox.addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(dx) > 50) {
    if (dx < 0) { currentIdx = (currentIdx + 1) % filtered.length; openLightbox(currentIdx); }
    else { currentIdx = (currentIdx - 1 + filtered.length) % filtered.length; openLightbox(currentIdx); }
  }
}, {passive:true});

// FILTER BUTTONS
document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    render(btn.getAttribute('data-filter'));
  });
});

// INIT
render('all');
</script>
