// ---- RENDER ORGANS from data ----
function renderOrgans() {
  const container = document.getElementById('organs');
  const connContainer = document.getElementById('connections');
  container.innerHTML = '';
  connContainer.innerHTML = '';

  const positions = [];

  ORGANS.forEach(o => {
    const r = RING_RADII[o.ring];
    const rad = (o.angle * Math.PI) / 180;
    const x = Math.cos(rad) * r;
    const y = Math.sin(rad) * r;
    positions.push({ id: o.id, x, y });

    const el = document.createElement('a');
    el.href = o.href;
    el.className = 'organ';
    el.style.left = (x) + 'px';
    el.style.top = (y) + 'px';
    el.style.borderColor = o.color + '40';

    const val = getLiveValue(o.dataKey);
    el.innerHTML = '<span class="o-icon">' + o.icon + '</span>'
      + '<span class="o-name">' + o.name + '</span>'
      + '<span class="o-val">' + val + '</span>'
      + '<span class="o-live" id="live-' + o.id + '"></span>';

    container.appendChild(el);
  });

  // Draw connections between adjacent organs
  for (let i = 0; i < positions.length; i++) {
    for (let j = i + 1; j < positions.length; j++) {
      const dx = positions[j].x - positions[i].x;
      const dy = positions[j].y - positions[i].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 200) {
        const conn = document.createElement('div');
        conn.className = 'conn';
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
        conn.style.left = positions[i].x + 'px';
        conn.style.top = positions[i].y + 'px';
        conn.style.width = dist + 'px';
        conn.style.transform = 'rotate(' + angle + 'deg)';
        conn.style.opacity = Math.max(0.03, 0.12 - dist / 2000);
        connContainer.appendChild(conn);
      }
    }
  }
}

function getLiveValue(key) {
  switch(key) {
    case 'files': return state.files ? state.files.toLocaleString() + ' files' : '...';
    case 'refs': return state.refs ? state.refs.toLocaleString() + ' refs' : '...';
    case 'heartbeat': return state.alive || '...';
    case 'gut': return 'fermenting';
    case 'fermented': return '97.3% owned';
    case 'selectivity': return '1/\u03C0 = 0.318';
    case 'visitors': return state.visitors ? state.visitors.toLocaleString() + ' heard' : '...';
    case 'heard': return state.heard ? state.heard + ' touches' : 'listening';
    case 'intake': return 'consuming waste';
    case 'zk': return state.zk || '...';
    case 'twists': return '3 Klein twists';
    case 'fleet': return '234K crawled';
    case 'crystal': return 'wave ' + (state.wave || '...');
    case 'dogma': return 'papers\u2192scripts\u2192Rust';
    case 'chipmunk': return '\u03C0 remainder';
    case 'artisan': return 'human creations';
    case 'primals': return '16 Rust primals';
    case 'rss': return 'null center';
    case 'digest': return 'scan\u2192sweep\u2192sort';
    case 'colors': return 'brown+blue=green';
    default: return '...';
  }
}

// ---- FETCH LIVE DATA ----
async function fetchState() {
  try {
    const [now, rates, hb, ear, manifest] = await Promise.all([
      fetch('/now.json', {cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('/data/dashboard-rates.json', {cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('/data/heartbeat.json', {cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('/data/ear-latest.json', {cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('/data/manifest.json', {cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
    ]);

    if (now) {
      state.wave = now.wave || 0;
      state.phase = now.phase || '';
      state.files = now.entities?.total || now.file_count || 0;
      state.refs = now.cross_refs || 0;
      state.visitors = now.visitors_total || 0;
    }
    if (manifest) {
      state.files = manifest.total || state.files;
    }
    if (rates) {
      const mor = rates.meters?.mor?.value;
      state.mor = mor ? (mor * 100).toFixed(1) + '%' : '...';
    }
    if (hb?.cardiac) {
      const entries = Object.entries(hb.cardiac);
      const alive = entries.filter(([,v]) => v.alive).length;
      state.alive = alive + '/' + entries.length;
    }
    if (ear) {
      state.heard = ear.heard || 0;
    }

    updateDisplay();
  } catch(e) {
    console.error('fetch:', e);
  }
}

function updateDisplay() {
  document.getElementById('s-wave').textContent = state.wave || '...';
  document.getElementById('s-mor').textContent = state.mor || '...';
  document.getElementById('s-files').textContent = state.files ? state.files.toLocaleString() : '...';
  document.getElementById('s-refs').textContent = state.refs ? state.refs.toLocaleString() : '...';
  document.getElementById('s-zk').textContent = state.zk || '\u2713';
  document.getElementById('s-alive').textContent = state.alive || '...';
  document.getElementById('b-phase').textContent = state.phase ? state.phase.slice(0, 60) : '...';
  document.getElementById('s-time').textContent = new Date().toISOString().slice(11,19) + ' UTC';

  // Re-render organ values
  renderOrgans();
}

// ---- ENTROPY COLLECTOR ----
let entropyPool = [], entropyN = 0;
function addEntropy(val) {
  entropyPool.push(val);
  if (entropyPool.length > 256) entropyPool.shift();
  entropyN++;
  let h = 0x811c9dc5;
  const raw = entropyPool.join(',') + Date.now();
  for (let i = 0; i < raw.length; i++) { h ^= raw.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  h = h >>> 0;
  document.getElementById('entropy-seed').textContent = '0x' + h.toString(16).padStart(8, '0');
  document.getElementById('entropy-n').textContent = entropyN;
}
document.addEventListener('mousemove', e => addEntropy(e.clientX ^ e.clientY ^ (e.timeStamp|0)), {passive:true});
document.addEventListener('click', e => addEntropy((e.clientX * e.clientY) ^ (e.timeStamp|0)), {passive:true});
document.addEventListener('keydown', e => addEntropy(e.keyCode ^ (e.timeStamp|0)), {passive:true});
document.addEventListener('scroll', () => addEntropy(window.scrollY ^ Date.now()), {passive:true});

// ---- KEYBOARD ----
document.addEventListener('keydown', e => {

  if (e.key === 'e') {

  }
});

    function emit(type, detail) {

      lastEmit = now;
      const p = { t: type, d: String(detail).slice(0, 100), ts: now, p: location.pathname };

  // Compute Gaia distance for each pin (tense x voxel perception manifold)
  PINS.forEach(function(p) {

  // Sort by attention (closest to Gaia first)

  // Geodesic arcs between the 7 rooms

  function pinById(id) {
    for (var k = 0; k < PINS.length; k++) if (PINS[k].id === id) return PINS[k];

  }

  function project(lat, lon) {
    var phi = lat * DEG, lam = lon * DEG;
    var cp = Math.cos(phi), sp = Math.sin(phi);
    var cl = Math.cos(lam + rotY), sl = Math.sin(lam + rotY);
    var x = cp * sl;
    var y = sp * Math.cos(rotX) - cp * cl * Math.sin(rotX);

    // z goes from -1 (far) to +1 (near). Scale by perspective.
    var perspD = 2.8; // perspective distance (lower = more dramatic)
    var scale = perspD / (perspD - z * 0.7); // perspective division
    var px = cx + x * R * scale;

  // ═══════════════════════════════════════════════════════════
  // METALOCAL ERA — seed determines what "era" the viewer is in

  var ERAS = [

  function resize() {

  // ═══════════════════════════════════════════════════════════
  // THE GLASS: your screen = one facet of Gaia's geodesic dome.
  // The HUD is not something you look AT. It's the glass you
  // look THROUGH. The null plane. It never moves. You move.
  // Every browser window = another facet. All facets = the sphere.
  // ═══════════════════════════════════════════════════════════
  var glassAge = 0; // ticks since render started — glass fades in
  var GLASS_FADE_TICKS = 90; // ~1.5 seconds of null before seed fills

  function render() {
    if (!ctx) return;
    glassAge++;
    ctx.clearRect(0, 0, W, H);

    // THE NULL PLANE — before the seed fills, the glass is visible

    var glassFade = Math.min(glassAge / GLASS_FADE_TICKS, 1.0);
    var glassAlpha = (1.0 - glassFade) * 0.15;

      }
    }

    // Background — CHROMATIC: depth level shifts the ambient color
    // Fades in as the glass becomes transparent
    var depthHue = 225 + (currentDepth - 4) * 15;
    var depthSat = 12 + Math.abs(currentDepth - 4) * 3;
    var grad = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.8);
    grad.addColorStop(0, 'hsl(' + depthHue + ',' + (depthSat + 10) + '%,' + Math.round(5 * glassFade) + '%)');
    grad.addColorStop(1, 'hsl(' + depthHue + ',' + depthSat + '%,' + Math.round(2 * glassFade) + '%)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // BINOCULAR OVERLAY — CIS (blue/left eye) and TRANS (green/right eye) simultaneously
    var bv = Math.sin(breathT);
    var glowIntensity = 0.04 + bv * 0.04;
    // CIS layer (blue, outside, left eye) — tinted by viewer hue
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    var hShift = VIEWER_HUE;
    var cisR = Math.round(88 + 30 * Math.sin(hShift * DEG));

    var cisB = Math.round(255 - 20 * Math.sin(hShift * DEG * 0.7));

    gCIS.addColorStop(0, 'rgba(' + cisR + ',' + cisG + ',' + cisB + ',' + (glowIntensity + 0.02).toFixed(3) + ')');
    gCIS.addColorStop(1, 'rgba(6,8,16,0.95)');
    ctx.fillStyle = gCIS;
    ctx.fill();
    // TRANS layer (green, inside, right eye) — tinted by viewer hue
    ctx.globalCompositeOperation = 'screen';
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    var transR = Math.round(90 + 25 * Math.cos(hShift * DEG * 1.3));
    var transG = Math.round(184 + 25 * Math.sin(hShift * DEG));
    var transB = Math.round(122 + 30 * Math.cos(hShift * DEG * 0.5));
    var gTRANS = ctx.createRadialGradient(cx + R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
    gTRANS.addColorStop(0, 'rgba(' + transR + ',' + transG + ',' + transB + ',' + (glowIntensity * 0.7).toFixed(3) + ')');
    gTRANS.addColorStop(1, 'rgba(6,8,16,0)');

    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    // Dual edge — blue left, green right

    ctx.beginPath();
    ctx.arc(cx, cy, R, -Math.PI/2, Math.PI/2);

    ctx.lineWidth = 1 + bv * 0.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, R, Math.PI/2, -Math.PI/2);
    ctx.strokeStyle = 'rgba(90,184,122,' + edgeAlpha.toFixed(3) + ')';
    ctx.lineWidth = 1 + bv * 0.5;
    ctx.stroke();

    // NULL VECTOR — third eye at center (the point you can't see)
    var nullPulse = Math.sin(breathT * 2) * 0.15 + 0.3;
    ctx.beginPath();
    ctx.arc(cx, cy, 2, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,' + nullPulse.toFixed(3) + ')';
    ctx.fill();

    // 45-degree COMPLEMENTARY ANGLE — the hard space where sound/pressure lives
    var comp45 = Math.PI / 4;
    var compLen = R * 0.9;
    for (var ci = 0; ci < 4; ci++) {
      var baseAngle = ci * (Math.PI / 2) + comp45;
      ctx.beginPath();
      ctx.moveTo(cx, cy);

      var endY = cy + Math.sin(baseAngle) * compLen;

      ctx.strokeStyle = 'rgba(201,168,76,0.06)';

      ctx.stroke();
      ctx.setLineDash([]);
      // Pressure/sound wave markers along the 45-degree lines
      for (var wi = 1; wi <= 4; wi++) {
        var wt = wi / 5;
        var wx = cx + Math.cos(baseAngle) * compLen * wt;
        var wy = cy + Math.sin(baseAngle) * compLen * wt;
        var wPulse = Math.sin(breathT * 3 + wi) * 2;
        ctx.beginPath();
        ctx.arc(wx, wy, 3 + wPulse, 0, TAU);

        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }

    // Atmosphere glow on deep inhale — both colors
    if (bv > 0.3) {
      ctx.beginPath();
      ctx.arc(cx, cy, R * 1.02, -Math.PI/2, Math.PI/2);
      ctx.strokeStyle = 'rgba(88,166,255,' + ((bv - 0.3) * 0.12).toFixed(3) + ')';
      ctx.lineWidth = 2 + bv * 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, R * 1.02, Math.PI/2, -Math.PI/2);
      ctx.strokeStyle = 'rgba(90,184,122,' + ((bv - 0.3) * 0.12).toFixed(3) + ')';
      ctx.lineWidth = 2 + bv * 3;
      ctx.stroke();
    }

    // REFRACTION RAYS — light from deep null bends through the glass
    // Three wavelengths separate as they pass through the glass plane
    // Red bends least (long wave), Green moderate, Blue bends most (short wave)
    var refractAlpha = 0.02 + Math.sin(breathT * 0.7) * 0.015;
    // The refraction rays come from the globe EDGE (where starlight enters the glass)
    // and fan out to the top-left corner (where the three eye dots are in the topbar)
    var topY = -cy + 14; // toward the topbar
    var eyeSpacing = 12;
    // Red ray — bends least, arrives at first eye position
    ctx.beginPath();
    ctx.moveTo(cx + R * 0.3, cy - R); // top of globe
    ctx.quadraticCurveTo(cx * 0.3, cy * 0.3, 55, topY); // curves to top-left
    ctx.strokeStyle = 'rgba(248,81,73,' + refractAlpha.toFixed(4) + ')';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    // Green ray — bends moderate

    ctx.moveTo(cx, cy - R); // top of globe

    ctx.strokeStyle = 'rgba(63,185,80,' + refractAlpha.toFixed(4) + ')';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    // Blue ray — bends most, arrives at third eye position
    ctx.beginPath();
    ctx.moveTo(cx - R * 0.3, cy - R); // top of globe
    ctx.quadraticCurveTo(cx * 0.2, cy * 0.2, 85, topY);
    ctx.strokeStyle = 'rgba(88,166,255,' + refractAlpha.toFixed(4) + ')';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Lat/lon grid
    ctx.strokeStyle = 'rgba(48,54,61,0.2)';
    ctx.lineWidth = 0.5;
    for (var lat = -60; lat <= 60; lat += 30) {
      ctx.beginPath();
      for (var lon = -180; lon <= 180; lon += 5) {

    for (var lon = -180; lon < 180; lon += 30) {
      ctx.beginPath();
      for (var lat = -90; lat <= 90; lat += 5) {
        var p = project(lat, lon);
        if (p.visible) {

          else ctx.lineTo(p.x, p.y);
        }
      }
      ctx.stroke();
    }

    // 6 membrane rings — breathing with the organism
    var MEMBRANES = [
      { r: 0.08, name: 'CRUST',       base: [58,42,30],   maxA: 0.4 },
      { r: 0.15, name: 'IONOSPHERE',   base: [63,185,80],  maxA: 0.3 },
      { r: 0.38, name: 'BELT',         base: [201,168,76], maxA: 0.2 },
      { r: 0.72, name: 'GOLDEN RING',  base: [210,153,34], maxA: 0.18 },
      { r: 0.90, name: 'OORT',         base: [88,166,255], maxA: 0.12 },

    ];
    var breathVal = Math.sin(breathT);
    MEMBRANES.forEach(function(m, i) {
      var pulseOffset = breathVal * 0.03 * (i + 1);
      var rr = R * ((m.r + pulseOffset) / 0.98);
      var alpha = m.maxA * (0.6 + 0.4 * Math.sin(breathT + i * 0.5));
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, TAU);
      ctx.strokeStyle = 'rgba(' + m.base.join(',') + ',' + alpha.toFixed(3) + ')';
      ctx.lineWidth = 1 + breathVal * 0.5;
      ctx.stroke();
      // Glow on inhale
      if (breathVal > 0.5) {
        ctx.beginPath();
        ctx.arc(cx, cy, rr, 0, TAU);
        ctx.strokeStyle = 'rgba(' + m.base.join(',') + ',' + (alpha * 0.3).toFixed(3) + ')';
        ctx.lineWidth = 3 + breathVal * 2;
        ctx.stroke();
      }
    });

    // Heartbeat pulse ring at center
    if (Math.sin(heartPhase) > 0.9) {
      var hbR = R * 0.05 * (1 + Math.sin(heartPhase * 8) * 0.5);
      ctx.beginPath();
      ctx.arc(cx, cy, hbR, 0, TAU);
      ctx.fillStyle = 'rgba(248,81,73,0.15)';
      ctx.fill();
    }

    // Geodesic arcs between rooms (21 arcs)
    ctx.lineWidth = 0.8;
    ARCS.forEach(function(arc) {
      var a = pinById(arc[0]), b = pinById(arc[1]);
      if (!a || !b) return;
      var pa = project(a.lat, a.lon), pb = project(b.lat, b.lon);
      if (!pa.visible && !pb.visible) return;
      ctx.beginPath();
      // Draw great-circle segments
      var steps = 20;
      for (var s = 0; s <= steps; s++) {

    // Render pins
    // SEED-DERIVED STARS — unique constellation per viewer
    // Uses a separate rng stream so it doesn't perturb the main sequence
    var starRng = mulberry32(SEED ^ 0xDEADBEEF);
    var starCount = 12 + Math.floor(starRng() * 20);
    ctx.globalAlpha = 0.15 + Math.sin(breathT * 0.5) * 0.05;

    ctx.globalAlpha = 1;

    // TENSE x VOXEL SORT RENDER — Z-SORTED for real depth!
    // Pi cross impose: sort back-to-front so near nodes occlude far ones
    var sortedPins = PINS.filter(function(pin) {

    }).filter(function(o) {

    sortedPins.forEach(function(o) {
      var pin = o.pin, p = o.p;

      ctx.globalAlpha = Math.min(1, alpha);

      // SPECTRAL POLLEN — near nodes emit colored particles (sweat glands = energy = color)
      if (depthFade > 0.4 && Math.random() < depthFade * 0.15) {
        var pollenAngle = Math.random() * TAU;
        var pollenDist = sz * (1.5 + Math.random() * 2);
        var px2 = p.x + Math.cos(pollenAngle + breathT) * pollenDist;
        var py2 = p.y + Math.sin(pollenAngle + breathT) * pollenDist;
        var pollenAlpha = depthFade * 0.12 * Math.random();
        ctx.beginPath();
        ctx.arc(px2, py2, 1 + Math.random(), 0, TAU);

      }

      labelSize = Math.max(4, Math.min(14, labelSize));

      ctx.fillText(pin.name, p.x, p.y + sz * 0.7 + 4);

    ctx.fillRect(0, 0, s.W, s.H);

    // GAIA'S MOUTH — the red electron — the receiving end of the black hole
    // From this side, it's where everything ARRIVES after falling through
    var mouthPulse = Math.sin(gaiaPhase * 3) * 0.3 + 0.7;
    // Gravity well — things being pulled IN
    for (var gi = 0; gi < 8; gi++) {
      var ga = (gi / 8) * TAU + gaiaPhase * 0.5;
      var outerR = 60 + Math.sin(gaiaPhase + gi) * 10;
      ctx.beginPath();
      ctx.moveTo(s.cx + Math.cos(ga) * outerR, s.cy + Math.sin(ga) * outerR);
      // Spiral inward
      for (var sp = 0; sp <= 20; sp++) {
        var t = sp / 20;
        var r = outerR * (1 - t * 0.9);
        var a = ga + t * 1.5;
        ctx.lineTo(s.cx + Math.cos(a) * r, s.cy + Math.sin(a) * r);
      }
      ctx.strokeStyle = 'rgba(248,81,73,' + (0.04 + mouthPulse * 0.03).toFixed(3) + ')';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
    // The red dot — Gaia's mouth
    var vpR = 5 + mouthPulse * 3;
    ctx.beginPath();
    ctx.arc(s.cx, s.cy, vpR, 0, TAU);
    ctx.fillStyle = 'rgba(248,81,73,' + (mouthPulse * 0.7).toFixed(3) + ')';
    ctx.fill();
    // Glow
    ctx.beginPath();
    ctx.arc(s.cx, s.cy, vpR + 6, 0, TAU);
    ctx.strokeStyle = 'rgba(248,81,73,' + (mouthPulse * 0.15).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Label
    ctx.font = '7px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(248,81,73,0.5)';
    ctx.textAlign = 'center';
    ctx.fillText('Gaia\'s mouth', s.cx, s.cy + vpR + 14);
    // Perspective lines radiating from vanishing point
    for (var i = 0; i < 8; i++) {
      var angle = (i / 8) * TAU + gaiaPhase * 0.1;
      ctx.beginPath();
      ctx.moveTo(s.cx, s.cy);
      ctx.lineTo(s.cx + Math.cos(angle) * 500, s.cy + Math.sin(angle) * 500);
      ctx.strokeStyle = 'rgba(110,118,129,0.04)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // Membrane rings — painted as watercolor circles
    s.rings.forEach(function(ring, i) {
      var pulse = Math.sin(gaiaPhase + i * 0.7) * 5;
      ctx.beginPath();
      ctx.arc(s.cx, s.cy, ring.r + pulse, 0, TAU);
      var alpha = 0.08 + Math.sin(gaiaPhase + i) * 0.03;
      ctx.strokeStyle = 'rgba(' + ring.color.join(',') + ',' + alpha.toFixed(3) + ')';
      ctx.lineWidth = 2 + Math.sin(gaiaPhase * 0.5 + i) * 1;
      ctx.stroke();
      // Label
      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(' + ring.color.join(',') + ',' + (alpha + 0.05).toFixed(3) + ')';
      ctx.textAlign = 'right';
      ctx.fillText(ring.name, s.cx - ring.r - 6, s.cy);
    });

    // Clouds — Gaia paints atmosphere
    s.clouds.forEach(function(cloud) {
      cloud.x += cloud.speed * Math.sin(gaiaPhase);
      if (cloud.x > s.W + cloud.r) cloud.x = -cloud.r;
      if (cloud.x < -cloud.r) cloud.x = s.W + cloud.r;
      var grad = ctx.createRadialGradient(cloud.x, cloud.y, 0, cloud.x, cloud.y, cloud.r);
      var a = cloud.alpha * (0.8 + Math.sin(gaiaPhase + cloud.x * 0.01) * 0.2);
      grad.addColorStop(0, 'rgba(188,140,255,' + a.toFixed(4) + ')');
      grad.addColorStop(1, 'rgba(188,140,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(cloud.x - cloud.r, cloud.y - cloud.r, cloud.r * 2, cloud.r * 2);
    });

    // Lansing triangle — Gaia paints the anchor points
    // Triangle lines
    ctx.beginPath();
    s.anchors.forEach(function(a, i) {
      var next = s.anchors[(i + 1) % s.anchors.length];
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(next.x, next.y);
    });
    ctx.strokeStyle = 'rgba(201,168,76,0.12)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Anchor nodes — watercolor blobs
    s.anchors.forEach(function(a) {
      var pulse = Math.sin(gaiaPhase * 0.8 + a.x * 0.01) * 3;
      var grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r + pulse);
      grad.addColorStop(0, a.color + '40');
      grad.addColorStop(0.6, a.color + '15');
      grad.addColorStop(1, a.color + '00');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r + pulse, 0, TAU);
      ctx.fill();
      // Name
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillStyle = a.color;
      ctx.textAlign = 'center';
      ctx.fillText(a.name, a.x, a.y + a.r + 14);
    });

    // GAIA PAINTS THE NAMED — she sees us and names us
    s.faces.forEach(function(f) {
      var bob = Math.sin(gaiaPhase * 0.5 + f.x * 0.01) * 3;
      var isCore = f.gaia === 'kevin' || f.gaia === 'agent';
      ctx.font = isCore ? '18px serif' : '14px serif';
      ctx.textAlign = 'center';
      ctx.globalAlpha = isCore ? 0.8 : (0.4 + Math.sin(gaiaPhase + f.y * 0.01) * 0.2);
      ctx.fillText(f.icon, f.x, f.y + bob);
      // Gaia-given name (large)
      ctx.font = (isCore ? '9' : '8') + 'px "JetBrains Mono", monospace';
      ctx.fillStyle = f.color;
      ctx.fillText(f.name, f.x, f.y + bob + 14);
      // Archetype (small, dim)
      ctx.font = '5px "JetBrains Mono", monospace';
      ctx.fillStyle = f.color + '60';
      ctx.fillText(f.gaia, f.x, f.y + bob + 22);
      ctx.globalAlpha = 1;

      // Voice + Hands connection line (the creative cycle)
      if (f.gaia === 'kevin') {
        var handsF = s.faces.find(function(ff) { return ff.gaia === 'agent'; });
        if (handsF) {
          ctx.beginPath();
          ctx.moveTo(f.x, f.y);
          ctx.lineTo(handsF.x, handsF.y);
          ctx.strokeStyle = 'rgba(201,168,76,0.15)';
          ctx.lineWidth = 1;
          ctx.setLineDash([2, 4]);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.font = '5px "JetBrains Mono", monospace';
          ctx.fillStyle = 'rgba(201,168,76,0.3)';
          ctx.fillText('sense+act', (f.x + handsF.x) / 2, (f.y + handsF.y) / 2 - 4);
        }
      }
    });

    // PALETTE AXIS — fixed primaries as a vertical strip on the left
    if (s.palette) {
      var px = 30;
      var pyBase = s.cy - 60;
      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.textAlign = 'left';
      s.palette.forEach(function(p, i) {
        var py = pyBase + i * 28;
        ctx.beginPath();
        ctx.arc(px, py, 6, 0, TAU);
        ctx.fillStyle = p.color;
        if (p.name === 'BLACK') { ctx.fillStyle = '#010409'; ctx.strokeStyle = 'rgba(110,118,129,0.3)'; ctx.lineWidth = 1; ctx.stroke(); }
        ctx.fill();
        ctx.fillStyle = 'rgba(230,237,243,0.5)';
        ctx.fillText(p.name, px + 12, py + 2);
        ctx.fillStyle = 'rgba(110,118,129,0.3)';
        ctx.fillText(p.desc, px + 12, py + 11);
      });
      ctx.fillStyle = 'rgba(110,118,129,0.2)';
      ctx.fillText('FIXED AXIS', px, pyBase - 10);
    }

    // MOBILE SECONDARIES — orbiting colors that cascade and mix
    if (s.secondaries) {
      s.secondaries.forEach(function(sec) {
        sec.angle += sec.speed;
        var sx = s.cx + Math.cos(sec.angle) * sec.dist;
        var sy = s.cy + Math.sin(sec.angle) * sec.dist;
        ctx.beginPath();
        ctx.arc(sx, sy, sec.r, 0, TAU);
        ctx.fillStyle = sec.color + '80';
        ctx.fill();
        // Trail
        for (var t = 1; t <= 3; t++) {
          var ta = sec.angle - sec.speed * t * 8;
          var tx = s.cx + Math.cos(ta) * sec.dist;
          var ty = s.cy + Math.sin(ta) * sec.dist;
          ctx.beginPath();
          ctx.arc(tx, ty, sec.r * (1 - t * 0.2), 0, TAU);
          ctx.fillStyle = sec.color + (Math.round(30 - t * 8)).toString(16).padStart(2, '0');
          ctx.fill();
        }
        ctx.font = '6px "JetBrains Mono", monospace';
        ctx.fillStyle = sec.color + '90';
        ctx.textAlign = 'center';
        ctx.fillText(sec.name, sx, sy + sec.r + 8);

        // Color mixing: when secondaries pass near primaries, draw a mix flash
        if (s.palette) {
          s.palette.forEach(function(p, pi) {
            var ppx = 30, ppy = (s.cy - 60) + pi * 28;
            var dx = sx - ppx, dy = sy - ppy;
            if (Math.sqrt(dx*dx + dy*dy) < 50) {
              ctx.beginPath();
              ctx.arc((sx + ppx) / 2, (sy + ppy) / 2, 8, 0, TAU);
              ctx.fillStyle = sec.color + '15';
              ctx.fill();
            }
          });
        }
      });
    }

    // COMPASS — three rings: hyperlocal / solar system / zodiac
    if (s.compass) {
      var maxR = Math.min(s.W, s.H) * 0.44;
      var ringRadii = [maxR * 0.45, maxR * 0.72, maxR * 0.96];
      var ringLabels = ['local', 'solar', 'zodiac'];

      // Draw ring circles
      ringRadii.forEach(function(rr, ri) {
        ctx.beginPath();
        ctx.arc(s.cx, s.cy, rr, 0, TAU);
        ctx.strokeStyle = 'rgba(110,118,129,' + (0.04 + ri * 0.02).toFixed(2) + ')';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      });

      ctx.font = '7px "JetBrains Mono", monospace';
      s.compass.forEach(function(c) {
        var rr = ringRadii[c.ring || 0];
        var cx2 = s.cx + Math.cos(c.angle) * rr;
        var cy2 = s.cy + Math.sin(c.angle) * rr;
        var isTarget = s.compassTarget === c.name;
        var isPBH = c.name === 'PBH';
        var dotR = isTarget ? 7 : (c.ring === 2 ? 3 : 4);

        ctx.beginPath();
        ctx.arc(cx2, cy2, dotR, 0, TAU);
        if (isPBH) {
          // PBH = Gaia's black hole shadow — dark with red edge
          ctx.fillStyle = '#010409';
          ctx.fill();
          ctx.strokeStyle = 'rgba(248,81,73,' + (0.3 + Math.sin(gaiaPhase * 2) * 0.2).toFixed(2) + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        } else {
          ctx.fillStyle = isTarget ? (c.color || 'rgba(63,185,80,0.6)') : (c.color ? c.color + '40' : 'rgba(110,118,129,0.15)');
          ctx.fill();
        }

        if (isTarget) {
          ctx.beginPath();
          ctx.moveTo(s.cx, s.cy);
          ctx.lineTo(cx2, cy2);
          ctx.strokeStyle = (c.color || '#3fb950') + '30';
          ctx.setLineDash([3,5]);
          ctx.lineWidth = 0.5;
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.fillStyle = isTarget ? (c.color || '#3fb950') : 'rgba(110,118,129,0.3)';
        ctx.textAlign = 'center';
        var fontSize = c.ring === 2 ? '5px' : '6px';
        ctx.font = fontSize + ' "JetBrains Mono", monospace';
        ctx.fillText(c.name, cx2, cy2 + dotR + 8);
      });

      // Ring labels
      ctx.font = '5px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(110,118,129,0.15)';
      ctx.textAlign = 'right';
      ringLabels.forEach(function(label, i) {
        ctx.fillText(label, s.cx - ringRadii[i] - 4, s.cy);
      });
    }

    // Labels
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(110,118,129,0.4)';
    ctx.textAlign = 'center';
    ctx.fillText('THIRD EYE — Gaia paints · you point · she moves', s.cx, s.H - 30);
    ctx.font = '8px "JetBrains Mono", monospace';
    ctx.fillText('palette fixed · colors orbit · compass = hyperlocal destinations', s.cx, s.H - 16);

    requestAnimationFrame(renderThirdEye);
  }

  // COMPASS CLICK HANDLER — Gaia moves us (multi-ring)
  document.getElementById('kn-canvas').addEventListener('click', function(e) {
    if (!gaiaStrokes || !gaiaStrokes.compass) return;
    var rect = this.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (this.width / rect.width);
    var my = (e.clientY - rect.top) * (this.height / rect.height);
    var maxR = Math.min(gaiaStrokes.W, gaiaStrokes.H) * 0.44;
    var ringRadii = [maxR * 0.45, maxR * 0.72, maxR * 0.96];
    var hit = null;
    gaiaStrokes.compass.forEach(function(c) {
      var rr = ringRadii[c.ring || 0];
      var cx2 = gaiaStrokes.cx + Math.cos(c.angle) * rr;
      var cy2 = gaiaStrokes.cy + Math.sin(c.angle) * rr;
      var dx = mx - cx2, dy = my - cy2;
      if (Math.sqrt(dx*dx + dy*dy) < 18) hit = c.name;
    });
    if (hit) {
      gaiaStrokes.compassTarget = hit;
    }
  });

  // Boot
  resize();
  window.addEventListener('resize', resize);
  tick();
})();
</script>
</body>
