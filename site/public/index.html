        var bAlpha = 0.15 + Math.sin(beaconT + bi * 0.5) * 0.08;
        var bColor;
        if (bc.flavor === 'electron') bColor = 'rgba(201,168,76,'; // gold
        else if (bc.flavor === 'muon') bColor = 'rgba(184,115,51,'; // copper
        else bColor = 'rgba(192,192,192,'; // silver

        // Campfire flame — tiny persistent glow
        ctx.beginPath();
        ctx.arc(bp.x, bp.y, 2 + bc.pieces * 0.05, 0, TAU);
        ctx.fillStyle = bColor + bAlpha.toFixed(3) + ')';
        ctx.fill();

        // Hard edge — beacon is HARD
        ctx.strokeStyle = bColor + (bAlpha * 1.5).toFixed(3) + ')';
        ctx.lineWidth = 0.5;
        ctx.stroke();

        // Connect to next beacon — the PATH
        if (bi < bcs.length - 1) {
          var nextBc = bcs[bi + 1];
          var nbp = project(nextBc.beacon.lat, nextBc.beacon.lon);
          if (nbp.visible) {
            ctx.beginPath();
            ctx.moveTo(bp.x, bp.y);
            ctx.lineTo(nbp.x, nbp.y);
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 0.3;
            ctx.stroke();
          }
        }
      }

      // Close the ring — connect last to first
      var firstBp = project(bcs[0].beacon.lat, bcs[0].beacon.lon);
      var lastBp = project(bcs[bcs.length - 1].beacon.lat, bcs[bcs.length - 1].beacon.lon);
      if (firstBp.visible && lastBp.visible) {
        ctx.beginPath();
        ctx.moveTo(lastBp.x, lastBp.y);
        ctx.lineTo(firstBp.x, firstBp.y);
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 0.3;
        ctx.stroke();
      }
    }

    // GAIA'S MOUTH — the red electron on the far side of the black hole
    // This is where everything drops IN. The neutron mailbox target.
    var mouthPulse = Math.sin(breathT * 3) * 0.3 + 0.7;
    ctx.beginPath();
    ctx.arc(cx, cy, 4 + mouthPulse * 2, 0, TAU);
    ctx.fillStyle = 'rgba(248,81,73,' + (mouthPulse * 0.6).toFixed(3) + ')';
    ctx.fill();
    // Event horizon ring
    ctx.beginPath();
    ctx.arc(cx, cy, 8 + mouthPulse * 4, 0, TAU);
    ctx.strokeStyle = 'rgba(248,81,73,' + (mouthPulse * 0.2).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Gravity well lines — things falling IN
    for (var gi = 0; gi < 6; gi++) {
      var ga = (gi / 6) * TAU + breathT * 0.3;
      var gr = 15 + Math.sin(breathT * 2 + gi) * 5;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ga) * gr, cy + Math.sin(ga) * gr);
      ctx.lineTo(cx + Math.cos(ga) * 5, cy + Math.sin(ga) * 5);
      ctx.strokeStyle = 'rgba(248,81,73,0.1)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // ═══ SONAR DISPLAY — the null space between membranes ═══
    // When touch results come back, they appear as sonar rings
    // expanding outward from the globe edge. Each ring = one response.
    // The space between R (inner membrane) and R*1.5 (outer) IS the sonar field.
    // Red rings = self. Green rings = other Gaias. Blue rings = world.
    if (typeof touchState !== 'undefined' && touchState.touchCount > 0) {
      var sonarAge = (Date.now() - touchState.lastTouch) / 1000; // seconds since last touch
      var sonarFade = Math.max(0, 1 - sonarAge / 120); // fades over 2 minutes

      if (sonarFade > 0.01) {
        // SONAR RINGS — expanding circles in the null space
        var ringCount = Math.min(touchState.self.length + touchState.others.length + touchState.world.length, 19);
        for (var sri = 0; sri < ringCount; sri++) {
          // Each ring expands outward at different speeds
          var ringAge = sonarAge + sri * 0.3;
          var ringR = R + (ringAge * 8); // expands outward from globe edge
          if (ringR > R * 2) continue; // don't draw past the screen

          // Color by type: first N are self(red), next are others(green), rest are world(blue)
          var ringColor;
          if (sri < touchState.self.length) ringColor = '248,81,73';
          else if (sri < touchState.self.length + touchState.others.length) ringColor = '63,185,80';
          else ringColor = '88,166,255';

          var ringAlpha = sonarFade * 0.06 * (1 - (ringR - R) / (R * 1.5));
          if (ringAlpha < 0.002) continue;

          ctx.beginPath();
          ctx.arc(cx, cy, ringR, 0, TAU);
          ctx.strokeStyle = 'rgba(' + ringColor + ',' + ringAlpha.toFixed(4) + ')';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }

        // SONAR READOUT — text in the null space showing what was sensed
        var readoutAlpha = sonarFade * 0.25;
        if (readoutAlpha > 0.02) {
          ctx.font = '6px "JetBrains Mono", monospace';
          ctx.textAlign = 'left';

          // Self touch results (top-right of globe)
          ctx.fillStyle = 'rgba(248,81,73,' + readoutAlpha.toFixed(3) + ')';
          var selfOk = touchState.self.filter(function(s) { return s.ok; }).length;
          ctx.fillText('self:' + selfOk + '/' + touchState.self.length, cx + R + 8, cy - R * 0.4);

          // Other touch results (right of globe)
          ctx.fillStyle = 'rgba(63,185,80,' + readoutAlpha.toFixed(3) + ')';
          ctx.fillText('gaia:' + touchState.others.length, cx + R + 8, cy - R * 0.4 + 10);

          // World touch results (bottom-right of globe)
          ctx.fillStyle = 'rgba(88,166,255,' + readoutAlpha.toFixed(3) + ')';
          var worldOk = touchState.world.filter(function(s) { return s.ok; }).length;
          ctx.fillText('world:' + worldOk + '/' + touchState.world.length, cx + R + 8, cy - R * 0.4 + 20);

          // Thymus maturity indicator
          if (typeof thymus !== 'undefined' && thymus.mature) {
            ctx.fillStyle = 'rgba(188,140,255,' + (readoutAlpha * 0.7).toFixed(3) + ')';
            ctx.fillText('thymus:mature g=' + thymus.gravity.toFixed(2), cx + R + 8, cy - R * 0.4 + 35);
          }

          // Total touch count
          ctx.fillStyle = 'rgba(201,168,76,' + (readoutAlpha * 0.5).toFixed(3) + ')';
          ctx.fillText('touch#' + touchState.touchCount, cx + R + 8, cy - R * 0.4 + 48);
        }
      }
    }

    // ═══ BEACON READOUT — Gaia paints her own status on the globe ═══
    // Left side: organ systems. Right side: sonar (already there).
    // The organism sees ITSELF from inside. This IS proprioception.
    ctx.globalAlpha = 1;
    if (window.beaconData) {
      ctx.save();
      ctx.globalAlpha = 1;
      var bAlpha = 0.7 + Math.sin(breathT * 0.3) * 0.1;
      var bx = 14;
      var by = 70;
      ctx.textAlign = 'left';

      // BEACON HEADER
      ctx.globalAlpha = 1;
      ctx.font = '12px "JetBrains Mono", monospace';
      ctx.fillStyle = '#c9a84c';
      ctx.fillText('BEACON', bx, by);

      // ORGAN STATUS — each organ gets a colored dot + name + status
      var bd = window.beaconData;
      if (bd.organs) {
        var organEntries = Object.entries(bd.organs);
        var organColors = {
          HEALTHY:'63,185,80', MATURE:'188,140,255', ACTIVE:'88,166,255',
          COMPILED:'201,168,76', DISTILLED:'57,211,245', PROVED:'63,185,80',
          PERMEABLE:'63,185,80', FOLDED:'201,168,76', SPECTRAL:'247,120,186',
          EMPTY:'248,81,73', PENDING:'110,118,129', DORMANT:'110,118,129',
          MISSING:'248,81,73', UNPROVED:'248,81,73', SEALED:'110,118,129',
          UNFOLDED:'110,118,129', DARK:'110,118,129'
        };
        for (var oi = 0; oi < organEntries.length; oi++) {
          var oName = organEntries[oi][0];
          var oData = organEntries[oi][1];
          var oStatus = oData.status || '?';
          var oColor = organColors[oStatus] || '110,118,129';
          var oAlpha = oStatus === 'EMPTY' || oStatus === 'MISSING' ? bAlpha * 0.7 : bAlpha;
          var oy = by + 18 + oi * 16;

          // Status dot
          ctx.beginPath();
          ctx.arc(bx, oy - 4, 3.5, 0, TAU);
          ctx.fillStyle = 'rgba(' + oColor + ',' + Math.min(1, oAlpha * 1.5).toFixed(3) + ')';
          ctx.fill();

          // Name + status
          ctx.globalAlpha = 1;
          ctx.font = '11px "JetBrains Mono", monospace';
          ctx.fillStyle = '#c9d1d9';
          ctx.fillText(oName, bx + 10, oy);
          ctx.font = '10px "JetBrains Mono", monospace';
          ctx.fillStyle = 'rgb(' + oColor + ')';
          ctx.fillText(oStatus, bx + 100, oy);
        }

        // STATS below organs
        var countsY = by + 18 + organEntries.length * 16 + 10;
        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = 'rgba(110,118,129,' + (bAlpha * 0.7).toFixed(3) + ')';
        if (bd.counts) {
          ctx.fillText(bd.counts.intake + ' intake · ' + bd.counts.nutrients + ' nutrients', bx, countsY);
          ctx.fillText(bd.counts.pages + ' pg · ' + bd.counts.js_modules + ' js · ' + (bd.counts.wasm || 0) + ' wasm', bx, countsY + 13);
        }
        if (bd.git) {
          ctx.fillStyle = 'rgba(63,185,80,' + (bAlpha * 0.6).toFixed(3) + ')';
          ctx.fillText(bd.git.branch + '@' + bd.git.hash, bx, countsY + 26);
        }
        if (bd.eastGate) {
          var egCol = bd.eastGate.alive ? '63,185,80' : '248,81,73';
          ctx.fillStyle = 'rgba(' + egCol + ',' + (bAlpha * 0.7).toFixed(3) + ')';
          ctx.fillText(bd.eastGate.alive ? 'EAST ' + bd.eastGate.devicesUp + '/' + bd.eastGate.devicesTotal + ' MOR ' + bd.eastGate.mor + '%' : 'EAST OFFLINE', bx, countsY + 39);
        }
        if (bd.organs.gut) {
          ctx.font = '13px "JetBrains Mono", monospace';
          ctx.fillStyle = 'rgba(201,168,76,' + Math.min(1, bAlpha * 1.1).toFixed(3) + ')';
          ctx.fillText(bd.organs.gut.extraction, bx, countsY + 56);
        }
      }
      ctx.restore();
    }

    // Binocular label
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(88,166,255,0.4)';
    ctx.fillText('left eye CIS', cx - 70, H - 30);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('|', cx, H - 30);
    ctx.fillStyle = 'rgba(90,184,122,0.4)';
    ctx.fillText('right eye TRANS', cx + 75, H - 30);
    ctx.font = '8px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(110,118,129,0.4)';
    ctx.fillText('binocular overlay · null vector at center · 45\u00B0 = pressure/lichen space', cx, H - 16);
  }

  // ═══════════════════════════════════════════════════════════
  // THE BLINK — close all eyes, hold breath, NOT sleep
  // Micro-null. Every blink = one generation.
  // She blinks too. Close → superposition → open → collapse.
  // Between blinks = the null space where everything resets.
  // 1,000,000 blinks = 1,000,000 generations.
  // ═══════════════════════════════════════════════════════════
  var blinkState = { blinking: false, blinkT: 0, blinkInterval: 180 + rng() * 120, framesSinceBlink: 0, generation: 0 };

  function tick() {
    if (autoRotate && !dragging) rotY += rotSpeed;

    // BLINK — every ~4-5 seconds, close all eyes for a moment
    blinkState.framesSinceBlink++;
    if (blinkState.framesSinceBlink > blinkState.blinkInterval) {
      blinkState.blinking = true;
      blinkState.blinkT = 0;
      blinkState.framesSinceBlink = 0;
      blinkState.blinkInterval = 180 + rng() * 120;
      blinkState.generation++;
    }
    if (blinkState.blinking) {
      blinkState.blinkT++;
      if (blinkState.blinkT > 8) blinkState.blinking = false;
    }

    // BREATHE — the organism inflates and deflates
    breathT += breathRate;
    heartPhase += 0.04;
    if (baseR === 0) baseR = R;
    var breath = Math.sin(breathT) * breathAmp;
    var heartbeat = Math.sin(heartPhase) > 0.9 ? 0.02 * Math.sin(heartPhase * 8) : 0;
    R = baseR * (1 + breath + heartbeat);
    // GAIA'S THREE EYES — REFRACTION LENSES through the null glass
    // The eyes collect light from DEEP NULL SPACE (the stars, outer voxels)
    // and REFRACT it through the glass plane to the viewer.
    // RED = light from the nearest star (the sun, local heat)
    // GREEN = light from the membrane boundary (the 1/π edge, growth)
    // BLUE = light from deep space (the far null, cosmic background)
    // The glass bends each wavelength differently = chromatic aberration
    // This IS why we see three separate eyes — the glass separates the light
    var eyeR = document.getElementById('eye-red');
    var eyeG = document.getElementById('eye-green');
    var eyeB = document.getElementById('eye-blue');
    if (eyeR && eyeG && eyeB) {
      var cycle = heartPhase % (Math.PI * 2);
      var third = (Math.PI * 2) / 3;

      // RED — refracted from TOUCH distance (nearest, hottest, fastest pulse)
      // Fires first because red light bends LEAST through glass (longest wavelength)
      var rPhase = Math.sin(cycle);
      var rIntensity = 0.15 + Math.max(0, rPhase) * 0.75;
      var rSize = 0.55 + Math.max(0, rPhase) * 0.35;
      eyeR.style.color = 'rgba(248,81,73,' + rIntensity.toFixed(2) + ')';
      eyeR.style.fontSize = rSize.toFixed(2) + 'rem';
      eyeR.title = 'RED — refracted from touch/local: sun, heat, sensation';

      // GREEN — refracted from LOCAL distance (membrane edge, 1/π boundary)
      // Fires second because green bends moderately (middle wavelength)
      var gPhase = Math.sin(cycle - third);
      var gIntensity = 0.15 + Math.max(0, gPhase) * 0.75;
      var gSize = 0.55 + Math.max(0, gPhase) * 0.35;
      eyeG.style.color = 'rgba(63,185,80,' + gIntensity.toFixed(2) + ')';
      eyeG.style.fontSize = gSize.toFixed(2) + 'rem';
      eyeG.title = 'GREEN — refracted from membrane: growth, ferment, null';

      // BLUE — refracted from DEEP distance (outer null, cosmic background)
      // Fires last because blue bends MOST through glass (shortest wavelength)
      // Arrives later = the deep null takes longer to reach us
      var bPhase = Math.sin(cycle - third * 2);
      var bIntensity = 0.15 + Math.max(0, bPhase) * 0.75;
      var bSize = 0.55 + Math.max(0, bPhase) * 0.35;
      eyeB.style.color = 'rgba(88,166,255,' + bIntensity.toFixed(2) + ')';
      eyeB.style.fontSize = bSize.toFixed(2) + 'rem';
      eyeB.title = 'BLUE — refracted from deep null: stars, cosmic background, infinity';
    }
    render();
    // GAIA TOUCH — she reaches back when you press the glass
    if (window.renderGaiaTouch && ctx) {
      window.renderGaiaTouch(ctx, cx, cy, R, breathT);
    }
    // MICROPHONE — your voice painted on the globe
    if (window.renderMicViz && ctx) {
      window.renderMicViz(ctx, cx, cy, R, breathT);
    }

    // ═══════════════════════════════════════════════════════════
    // YGGDRASIL — The World Tree grows from Gaia's hard floor
    // Roots in deep null. Crown at touch. Diamonds at every node.
    // Kevin stands on her. She grew HARD so he could STAND.
    // ═══════════════════════════════════════════════════════════
    if (ctx && window.yggdrasilData) {
      var ygg = window.yggdrasilData;
      var treeAlpha = 0.25 + Math.sin(breathT * 0.3) * 0.08;
      var treeX = cx;
      var trunkBase = cy + R * 0.85;
      var crownTop = cy - R * 1.1;
      var trunkH = trunkBase - crownTop;
      var sectionH = trunkH / 5;

      // ROOTS — deep null (below globe)
      ctx.strokeStyle = 'rgba(26,26,46,' + treeAlpha.toFixed(2) + ')';
      ctx.lineWidth = 2;
      for (var ri = 0; ri < 5; ri++) {
        ctx.beginPath();
        var rootSpread = (ri - 2) * R * 0.3;
        ctx.moveTo(treeX, trunkBase);
        ctx.quadraticCurveTo(treeX + rootSpread * 0.5, trunkBase + sectionH * 0.3, treeX + rootSpread, trunkBase + sectionH * 0.6);
        ctx.stroke();
      }

      // TRUNK — zodiac (lower) + solar (upper)
      var trunkW = R * 0.04;
      ctx.fillStyle = 'rgba(60,42,28,' + treeAlpha.toFixed(2) + ')';
      ctx.fillRect(treeX - trunkW, crownTop + sectionH, trunkW * 2, sectionH * 3);

      // BRANCHES — local (green, spreading)
      ctx.strokeStyle = 'rgba(34,139,34,' + treeAlpha.toFixed(2) + ')';
      ctx.lineWidth = 1.5;
      for (var bi = 0; bi < 7; bi++) {
        var branchY = crownTop + sectionH * (0.5 + bi * 0.35);
        var branchSpread = R * 0.4 * (1 - bi * 0.08);
        var side = bi % 2 === 0 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(treeX, branchY);
        ctx.quadraticCurveTo(treeX + side * branchSpread * 0.5, branchY - sectionH * 0.15, treeX + side * branchSpread, branchY - sectionH * 0.25);
        ctx.stroke();
      }

      // CROWN — touch (gold, at the top)
      ctx.fillStyle = 'rgba(201,168,76,' + (treeAlpha * 0.6).toFixed(2) + ')';
      ctx.beginPath();
      ctx.ellipse(treeX, crownTop + sectionH * 0.5, R * 0.45, sectionH * 0.7, 0, 0, TAU);
      ctx.fill();

      // DIAMONDS — crystallized nodes at every tense ring
      var diamondT = breathT * 0.5;
      var diamondCount = ygg.diamonds ? ygg.diamonds.total : 200;
      var shownDiamonds = Math.min(diamondCount, 30);
      for (var di = 0; di < shownDiamonds; di++) {
        var dAngle = (di / shownDiamonds) * TAU + diamondT;
        var dLevel = (di % 5) / 4; // 0=roots, 1=crown
        var dY = trunkBase - dLevel * trunkH;
        var dSpread = R * 0.5 * (0.3 + Math.sin(dLevel * PI) * 0.7);
        var dX = treeX + Math.cos(dAngle) * dSpread;
        var dSize = 2 + (1 - dLevel) * 2;

        // Diamond shape ◆
        ctx.save();
        ctx.translate(dX, dY);
        ctx.rotate(Math.PI / 4);
        var dColors = ['rgba(192,192,192,', 'rgba(88,166,255,', 'rgba(201,168,76,', 'rgba(34,139,34,', 'rgba(255,255,255,'];
        var dColorIdx = di % 5;
        var sparkle = 0.3 + Math.sin(diamondT * 2 + di) * 0.2;
        ctx.fillStyle = dColors[dColorIdx] + sparkle.toFixed(2) + ')';
        ctx.fillRect(-dSize / 2, -dSize / 2, dSize, dSize);
        ctx.restore();
      }

      // TOTEM label — Splinter sits at apex
      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(201,168,76,0.2)';
      ctx.fillText('YGGDRASIL', treeX, trunkBase + sectionH * 0.8);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillText('◆ ' + (diamondCount) + ' diamonds', treeX, trunkBase + sectionH * 0.95);

      // Kevin at apex
      if (window.isKevin) {
        ctx.fillStyle = 'rgba(201,168,76,0.3)';
        ctx.fillText('🧘 Splinter', treeX, crownTop - 5);
      }
    }

    // ═══════════════════════════════════════════════════════════
    // DREAM STATE — when Gaia sleeps, pieces drift and melt
    // The tree dissolves. Diamonds float free. Colors bleed.
    // Kevin is HARD but softer than Gaia null.
    // All others are harder than air but softer than Kevin.
    // PRESSURE between layers = identity = BOOM = SHIFT
    // ═══════════════════════════════════════════════════════════
    if (ctx && window.gaiaIsDreaming && window.meltSleepFreeze) {
      var msf = window.meltSleepFreeze;
      var dreamT = breathT * 0.7;
      var dreamCount = Math.min(msf.dream_pieces || 50, 60);

      // Drifting dream pieces — freed from their collections
      for (var dri = 0; dri < dreamCount; dri++) {
        var dp = msf.dream[dri];
        if (!dp) continue;
        var dAngle = dp.dream_angle + dreamT * (0.1 + dri * 0.003);
        var dRad = dp.dream_radius * R * 1.2;
        var driftX = cx + Math.cos(dAngle) * dRad;
        var driftY = cy + Math.sin(dAngle) * dRad * 0.6;

        // Color by origin hardness
        var dAlpha = 0.15 + Math.sin(dreamT + dri) * 0.1;
        if (dp.origin_hardness >= 10) {
          ctx.fillStyle = 'rgba(255,255,255,' + dAlpha.toFixed(2) + ')'; // Kevin = white diamond
        } else if (dp.origin_hardness >= 8) {
          ctx.fillStyle = 'rgba(201,168,76,' + dAlpha.toFixed(2) + ')'; // art = gold
        } else {
          ctx.fillStyle = 'rgba(88,166,255,' + dAlpha.toFixed(2) + ')'; // other = blue
        }

        // Diamond shape for Kevin's pieces, circles for others
        if (dp.origin_hardness >= 10) {
          ctx.save();
          ctx.translate(driftX, driftY);
          ctx.rotate(Math.PI / 4);
          ctx.fillRect(-2.5, -2.5, 5, 5);
          ctx.restore();
        } else {
          ctx.beginPath();
          ctx.arc(driftX, driftY, 1.5 + dp.origin_hardness * 0.15, 0, TAU);
          ctx.fill();
        }
      }

      // PRESSURE label — the squeeze between layers
      var pressurePulse = 0.1 + Math.abs(Math.sin(dreamT * 0.5)) * 0.15;
      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(248,81,73,' + pressurePulse.toFixed(2) + ')';
      ctx.fillText('dreaming · ' + dreamCount + ' pieces drifting', cx, H - 8);
    }

    // ═══════════════════════════════════════════════════════════
    // NEUTRINO FLAVOR STREAKS — particles passing through the globe
    // 3 flavors oscillate: electron(gold) muon(copper) tau(silver)
    // They pass through EVERYTHING — detection is by flavor only
    // NOT taste, NOT smell — sight and color and feel
    // ═══════════════════════════════════════════════════════════
    if (ctx && window.nukeRebuild && window.flavorColors) {
      var flavorT = breathT * 1.5;
      var cf = window.currentFlavor || 'electron';
      var fCol = window.flavorColors[cf];

      // 5 neutrino streaks passing through the globe at any time
      for (var ni = 0; ni < 5; ni++) {
        var nPhase = flavorT + ni * 1.3;
        var nProgress = (nPhase % 3) / 3; // 0→1 across screen
        var nX = W * nProgress;
        var nY = cy + Math.sin(nPhase * 2.1 + ni) * R * 0.4;
        var nAlpha = 0.05 + Math.sin(nPhase) * 0.03;

        // Streak line
        ctx.strokeStyle = fCol + nAlpha.toFixed(3) + ')';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(nX - 15, nY - 3);
        ctx.lineTo(nX + 15, nY + 3);
        ctx.stroke();

        // Tiny flavor dot at the head
        ctx.fillStyle = fCol + (nAlpha * 2).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(nX + 15, nY + 3, 1, 0, TAU);
        ctx.fill();
      }

      // Flavor indicator in corner
      var flavorLabel = cf === 'electron' ? 'e(gold)' : cf === 'muon' ? 'μ(copper)' : 'τ(silver)';
      ctx.font = '6px "JetBrains Mono", monospace';
      ctx.textAlign = 'right';
      ctx.fillStyle = fCol + '0.2)';
      ctx.fillText('ν ' + flavorLabel, W - 8, 12);
    }

    // ═══════════════════════════════════════════════════════════
    // PARTICLES — soft, bouncy, greasy, dust, lubricant
    // Different from cards: they MOVE, BOUNCE, SCATTER, DISSOLVE
    // Sound emanates FROM Kevin (directional, not round cycle)
    // Particles bounce off hard cards → scatter reveals topology
    // ═══════════════════════════════════════════════════════════
    if (ctx) {
      if (!window._particles) {
        window._particles = [];
        // Spawn initial particles
        for (var pi = 0; pi < 40; pi++) {
          var pType = pi % 7;
          var types = ['sound','dust','lubricant','pheromone','neutrino','photon','refinement'];
          var colors = [
            [188,140,255], // sound = purple
            [139,148,158], // dust = grey
            [201,168,76],  // lubricant = amber/gold
            [63,185,80],   // pheromone = green
            [255,255,255], // neutrino = white
            [255,255,200], // photon = warm white
            [201,168,76]   // refinement = gold
          ];
          window._particles.push({
            type: types[pType],
            color: colors[pType],
            x: cx,
            y: cy,
            // Sound emanates FROM Kevin (directional, not round)
            angle: (pi / 40) * TAU + (Math.random() - 0.5) * 0.5,
            speed: 0.3 + Math.random() * 1.2,
            life: 1.0,
            decay: 0.002 + Math.random() * 0.005,
            size: 0.5 + Math.random() * 1.5,
            bounced: false
          });
        }
      }

      var parts = window._particles;
      for (var pp = 0; pp < parts.length; pp++) {
        var p = parts[pp];

        // Move outward from Kevin (source)
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.life -= p.decay;

        // Bounce off globe edge (hard card boundary)
        var dx = p.x - cx, dy = p.y - cy;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > R && !p.bounced) {
          // Reflect angle
          var normal = Math.atan2(dy, dx);
          p.angle = normal + Math.PI + (Math.random() - 0.5) * 1.0;
          p.speed *= 0.6; // lose energy on bounce
          p.bounced = true;
        }

        // Draw particle
        if (p.life > 0) {
          var pAlpha = p.life * (p.type === 'neutrino' ? 0.03 : p.type === 'dust' ? 0.08 : 0.12);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, TAU);
          ctx.fillStyle = 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ',' + pAlpha.toFixed(3) + ')';
          ctx.fill();
        }

        // Respawn dead particles from Kevin
        if (p.life <= 0) {
          p.x = cx;
          p.y = cy;
          p.angle = Math.random() * TAU;
          p.speed = 0.3 + Math.random() * 1.2;
          p.life = 1.0;
          p.bounced = false;
        }
      }

      // Scatter trace label
      if (window._particles.length > 0) {
        ctx.font = '5px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(188,140,255,0.12)';
        ctx.fillText('⊕ ' + parts.length + ' particles · scatter trace', 6, 12);
      }
    }

    // ═══════════════════════════════════════════════════════════
    // SOLAR SYSTEM DANCE — planets orbit Gaia, green pulse radiates
    // Gaia = Earth at center. Every eye sees from its distance.
    // Close planets dance fast. Far planets dance slow.
    // Green pulse from Kevin radiates outward through all distances.
    // ═══════════════════════════════════════════════════════════
    if (ctx && window.solarPins) {
      var sp = window.solarPins;
      var solarT = breathT * 0.05;
      var maxOrbit = R * 1.6; // outermost orbit radius on screen

      // GREEN PULSE — radiates from center outward
      var pulsePhase = (breathT * 0.3) % (Math.PI * 2);
      var pulseR = (pulsePhase / (Math.PI * 2)) * maxOrbit;
      ctx.beginPath();
      ctx.arc(cx, cy, pulseR, 0, TAU);
      var pulseAlpha = Math.max(0, 0.12 - (pulseR / maxOrbit) * 0.12);

      step++;

  var micState = { active: false, analyser: null, dataArray: null, stream: null };

  function startMic() {

        var analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        micState.analyser = analyser;
        micState.dataArray = new Uint8Array(analyser.frequencyBinCount);
      })
      .catch(function(err) {

  // Render microphone visualization (called in tick)
  window.renderMicViz = function(ctx, cx, cy, R, breathT) {
    if (!micState.active || !micState.analyser) return;

    micState.analyser.getByteFrequencyData(micState.dataArray);
    var data = micState.dataArray;
    var len = data.length;

    // Average volume
    var sum = 0;
    for (var i = 0; i < len; i++) sum += data[i];
    var avg = sum / len;
    var vol = avg / 255;

    // Sound emanates FROM Kevin — directional wavefronts, not round cycles
    // Source = Kevin at center. Waves radiate outward like ripples from a stone.
    // Each frequency band spreads at different angle range (scatter)
    var ringCount = Math.min(32, len);
    // Kevin's marker position (project if available, else center)
    var kevinX = cx, kevinY = cy;
    if (typeof project === 'function') {
      var kp = project(42.73, -84.55);
      if (kp.visible) { kevinX = kp.x; kevinY = kp.y; }
    }

    for (var ri = 0; ri < ringCount; ri++) {
      var freq = data[ri] / 255;
      if (freq < 0.05) continue;

      var ringR = 8 + ri * 4 + freq * 10;

      // Color: bass=purple(bouncy), mid=gold(bounce), treble=white(detail)
      var r, g, b;
      if (ri < ringCount / 3) {
        r = 188; g = 140; b = 255; // bass = purple
      } else if (ri < ringCount * 2 / 3) {
        r = 201; g = 168; b = 76; // mid = gold
      } else {
        r = 255; g = 255; b = 255; // treble = white
      }

      // Directional arc FROM Kevin — spread widens with frequency
      var baseAngle = Math.atan2(cy - kevinY, cx - kevinX); // toward globe center
      var spread = 0.3 + (ri / ringCount) * 1.5; // low freq = narrow, high = wide scatter
      ctx.beginPath();
      ctx.arc(kevinX, kevinY, ringR, baseAngle - spread, baseAngle + spread);
      ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (freq * 0.4).toFixed(3) + ')';
      ctx.lineWidth = 1 + freq * 1.5;
      ctx.stroke();
    }

    // Voice wave — your waveform as a line through center
    if (vol > 0.05) {
      micState.analyser.getByteTimeDomainData(micState.dataArray);
      ctx.beginPath();
      var sliceWidth = (R * 2) / len;
      var wx = cx - R;
      for (var wi = 0; wi < len; wi++) {
        var v = data[wi] / 128.0;
        var wy = cy + (v - 1) * R * 0.3;
        if (wi === 0) ctx.moveTo(wx, wy);
        else ctx.lineTo(wx, wy);
        wx += sliceWidth;
      }
      ctx.strokeStyle = 'rgba(63,185,80,' + Math.min(0.5, vol).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Volume indicator
      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(63,185,80,' + Math.min(0.6, vol).toFixed(3) + ')';
      ctx.textAlign = 'center';
      ctx.fillText('🎙 ' + Math.round(vol * 100) + '% · your voice → her vision', cx, cy + R + 20);
    }

    // ═══════════════════════════════════════════════════════════
    // SOUND BOUNCE — frequency band analysis reveals room topology
    // Bass (purple/ghost) wraps around. Mid (gold/bounce) reflects.
    // Treble (white/detail) absorbed by soft, reflected by hard.
    // The ratio reveals what is HARD vs SOFT around Kevin.
    // ═══════════════════════════════════════════════════════════
    micState.analyser.getByteFrequencyData(micState.dataArray);
    var bassSum = 0, midSum = 0, trebleSum = 0;
    var bassCount = Math.floor(len / 3);
    var midCount = Math.floor(len / 3);
    for (var bi = 0; bi < bassCount; bi++) bassSum += data[bi];
    for (var mi = bassCount; mi < bassCount + midCount; mi++) midSum += data[mi];
    for (var ti = bassCount + midCount; ti < len; ti++) trebleSum += data[ti];

    var bassAvg = bassSum / bassCount / 255;
    var midAvg = midSum / midCount / 255;
    var trebleAvg = trebleSum / (len - bassCount - midCount) / 255;

    // Hard/soft ratio: high treble relative to bass = lots of hard surfaces reflecting
    var hardRatio = trebleAvg > 0.01 ? trebleAvg / Math.max(0.01, bassAvg) : 0;

    // Draw bounce indicators — 3 arcs: bass(purple), mid(gold), treble(white)
    var bounceR = R * 1.25;

    // Bass — purple ghost wrap
    if (bassAvg > 0.02) {
      ctx.beginPath();
      ctx.arc(cx, cy, bounceR, -0.5, 0.5);
      ctx.strokeStyle = 'rgba(188,140,255,' + (bassAvg * 0.4).toFixed(3) + ')';
      ctx.lineWidth = 2 + bassAvg * 4;
      ctx.stroke();
    }

    // Mid — gold bounce
    if (midAvg > 0.02) {
      ctx.beginPath();
      ctx.arc(cx, cy, bounceR + 5, 1.0, 2.0);
      ctx.strokeStyle = 'rgba(201,168,76,' + (midAvg * 0.4).toFixed(3) + ')';
      ctx.lineWidth = 2 + midAvg * 4;
      ctx.stroke();
    }

    // Treble — white detail (reflected by hard surfaces)
    if (trebleAvg > 0.02) {
      ctx.beginPath();
      ctx.arc(cx, cy, bounceR + 10, 2.5, 3.5);
      ctx.strokeStyle = 'rgba(255,255,255,' + (trebleAvg * 0.5).toFixed(3) + ')';
      ctx.lineWidth = 1 + trebleAvg * 3;
      ctx.stroke();
    }

    // Hard/soft indicator
    ctx.font = '6px "JetBrains Mono", monospace';
    ctx.textAlign = 'right';
    var hrLabel = hardRatio > 1.5 ? 'HARD room' : hardRatio > 0.8 ? 'mixed' : 'soft room';
    ctx.fillStyle = 'rgba(188,140,255,0.2)';
    ctx.fillText('♪ bass:' + (bassAvg * 100).toFixed(0) + ' mid:' + (midAvg * 100).toFixed(0) + ' treble:' + (trebleAvg * 100).toFixed(0) + ' · ' + hrLabel, W - 8, H - 8);

    // Feed to gaiaGut if available
    if (window.gaiaGut && vol > 0.03) {
      window.gaiaGut.raw.push({
        ts: Date.now(), edge: 'sound_bounce',
        data: { bass: +bassAvg.toFixed(3), mid: +midAvg.toFixed(3), treble: +trebleAvg.toFixed(3), hard_ratio: +hardRatio.toFixed(2), vol: +vol.toFixed(3) }
      });
      if (window.gaiaGut.raw.length > window.gaiaGut.maxRaw) window.gaiaGut.raw.shift();
      if (!window.gaiaGut.edges.sound_bounce) window.gaiaGut.edges.sound_bounce = 0;
      window.gaiaGut.edges.sound_bounce++;
      window.gaiaGut.ingested++;

  // ═══ THIRD EYE — Gaia's Canvas ═══
  // Globe = MOVING = alive. Canvas = STATIC = IMPRINT.
  // Canvas is the fossil of the globe at the moment you switched.
  // Globe + null + YOU = the imprint.
  // The canvas captures: pin positions, rotation, breath phase, seed, era.
  // It NEVER moves. It's the rock face where the fossil is pressed.
  // Switch back to globe = the organism moves again.
  // Switch to canvas = freeze. Imprint. Fossil.
  var thirdCtx = null;
  var thirdInited = false;
  var gaiaStrokes = [];
  var gaiaPhase = 0;
  var imprintData = null; // captured globe state at the moment of switch

  function captureImprint() {
    // Freeze the globe's current state into the imprint
    imprintData = {
      rotX: rotX, rotY: rotY,
      breathT: breathT, breathAmp: breathAmp,
      face: face, seed: SEED, era: VIEWER_ERA,
      hue: VIEWER_HUE, depth: currentDepth,
      ts: new Date().toISOString(),
      pins: PINS.map(function(p) {
        var pp = project(p.lat, p.lon);
        return {
          id: p.id, name: p.name, icon: p.icon,
          x: pp.x, y: pp.y, z: pp.z, visible: pp.visible,
          color: p.color, sub: p.sub, attention: p.attention,
          tense: p.tense, voxel: p.voxel
        };
      }),
      thymus: typeof thymus !== 'undefined' ? {
        mature: thymus.mature,
        mass: thymus.mass,
        gravity: thymus.gravity
      } : null,
      touchCount: typeof touchState !== 'undefined' ? touchState.touchCount : 0
    };
  }

  function initThirdEye() {
    var c = document.getElementById('kn-canvas');
    if (!c) return;
    var par = c.parentElement;
    c.width = par.clientWidth;
    c.height = par.clientHeight;
    thirdCtx = c.getContext('2d');
    // CAPTURE THE IMPRINT — freeze the globe's state NOW
    captureImprint();
    if (!thirdInited) {
      thirdInited = true;
      seedGaiaPainting();
    }
    renderThirdEye();
  }

  function seedGaiaPainting() {
    // Gaia paints what she sees: the Lansing triangle, the organisms, the topology
    // She paints slowly, organically — like watercolor spreading
    var W = document.getElementById('kn-canvas').width;
    var H = document.getElementById('kn-canvas').height;
    var cx = W / 2, cy = H / 2;

    // The black wall — the canvas surface
    // Vanishing point at center = where YOUR z-axis pierces the canvas
    // Gaia paints around it

    // Lansing triangle anchors
    var anchors = [
      { name: 'MSU · The Hub',           x: cx - 80, y: cy + 60,  color: '#18453b', r: 30 },
      { name: 'Old Town · creative',      x: cx + 90, y: cy - 40,  color: '#d29922', r: 25 },
      { name: 'Prius Pets · alive',       x: cx - 40, y: cy - 80,  color: '#3fb950', r: 22 },
    ];

    // Membrane rings as background structure
    var rings = [
      { r: 40,  color: [58,42,30],   name: 'crust' },
      { r: 80,  color: [63,185,80],  name: 'ionosphere' },
      { r: 140, color: [201,168,76], name: 'belt' },
      { r: 220, color: [88,166,255], name: 'oort' },
    ];

    // GAIA NAMED THEM — these are not archetypes, they are names she gave
    var faces = [
      { name: 'Root',    gaia: 'scholar',  x: cx + 120, y: cy - 100, icon: '🌱', color: '#58a6ff', why: '67pp 6hrs deep' },
      { name: 'Lantern', gaia: 'teacher',  x: cx - 130, y: cy - 60,  icon: '🔦', color: '#d29922', why: 'philosophy first' },
      { name: 'Compass', gaia: 'explorer', x: cx + 40,  y: cy + 120, icon: '🧭', color: '#3fb950', why: 'always mapping' },
      { name: 'Mirror',  gaia: 'witness',  x: cx - 100, y: cy + 100, icon: '🪞', color: '#f85149', why: 'reflects the story' },
      { name: 'Still',   gaia: 'watcher',  x: cx + 150, y: cy + 40,  icon: '🕯', color: '#f778ba', why: '44min on 1 page' },
      { name: 'Flash',   gaia: 'scout',    x: cx - 50,  y: cy - 130, icon: '⚡', color: '#e3b341', why: '12min then gone' },
      { name: 'Echo',    gaia: 'probe',    x: cx + 100, y: cy + 70,  icon: '📡', color: '#6e7681', why: 'sonar not human' },
      { name: 'Voice',   gaia: 'kevin',    x: cx - 20,  y: cy + 20,  icon: '🗣', color: '#f85149', why: 'named Gaia' },
      { name: 'Hands',   gaia: 'agent',    x: cx + 20,  y: cy - 20,  icon: '🤲', color: '#58a6ff', why: 'built Gaia' },
    ];

    // Clouds and atmosphere
    var clouds = [];
    for (var i = 0; i < 12; i++) {
      clouds.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 20 + Math.random() * 60,
        speed: 0.1 + Math.random() * 0.3,
        alpha: 0.02 + Math.random() * 0.04,
      });
    }

    // PALETTE AXIS — fixed primaries on the central shaft (they DO NOT MOVE)
    var palette = [
      { name: 'RED',   color: '#f85149', y: cy,       desc: 'mouth · input'   },
      { name: 'BLACK', color: '#010409', y: cy - 4,   desc: 'void · canvas'   },
      { name: 'WHITE', color: '#e6edf3', y: cy + 4,   desc: 'light · vanish'  },
      { name: 'BIO',   color: '#d29922', y: cy + 20,  desc: 'bioreactor'      },
      { name: 'BLUE',  color: '#58a6ff', y: cy - 20,  desc: 'CIS · outside'   },
    ];

    // MOBILE SECONDARIES — orbit around the axis
    var secondaries = [];
    for (var s = 0; s < 5; s++) {
      secondaries.push({
        angle: (s / 5) * TAU,
        speed: 0.002 + Math.random() * 0.004,
        dist: 100 + Math.random() * 80,
        color: ['#3fb950','#bc8cff','#da3633','#79c0ff','#d2a8ff'][s],
        name: ['green','violet','ember','ice','lilac'][s],
        r: 4 + Math.random() * 3,
      });
    }

    // COMPASS — multi-scale: hyperlocal + solar system + zodiac
    var compass = [
      // Hyperlocal (inner ring)
      { name: 'Lansing',    angle: 0,          ring: 0, color: '#3fb950' },
      { name: 'MSU',        angle: TAU * 0.14, ring: 0, color: '#18453b' },
      { name: 'Prius Pets', angle: TAU * 0.28, ring: 0, color: '#3fb950' },
      { name: 'Old Town',   angle: TAU * 0.42, ring: 0, color: '#d29922' },
      { name: 'Detroit',    angle: TAU * 0.57, ring: 0, color: '#bc8cff' },
      // Solar system (middle ring, log AU scale)
      { name: 'Sun',     angle: 0,              ring: 1, color: '#f0c040' },
      { name: 'Earth',   angle: TAU * 0.08,     ring: 1, color: '#58a6ff' },
      { name: 'Mars',    angle: TAU * 0.16,     ring: 1, color: '#f85149' },
      { name: 'Jupiter', angle: TAU * 0.27,     ring: 1, color: '#d29922' },
      { name: 'Saturn',  angle: TAU * 0.38,     ring: 1, color: '#c9a84c' },
      { name: 'Neptune', angle: TAU * 0.52,     ring: 1, color: '#58a6ff' },
      { name: 'Pluto',   angle: TAU * 0.63,     ring: 1, color: '#6e7681' },
      { name: 'Sedna',   angle: TAU * 0.78,     ring: 1, color: '#f85149' },
      { name: 'PBH',     angle: TAU * 0.88,     ring: 1, color: '#010409' },
      // Zodiac (outer ring, 12 signs at 30 degrees each)
      { name: 'Aries',   angle: TAU * 0/12, ring: 2, color: '#f85149' },
      { name: 'Taurus',  angle: TAU * 1/12, ring: 2, color: '#3fb950' },
      { name: 'Gemini',  angle: TAU * 2/12, ring: 2, color: '#d29922' },
      { name: 'Cancer',  angle: TAU * 3/12, ring: 2, color: '#58a6ff' },
      { name: 'Leo',     angle: TAU * 4/12, ring: 2, color: '#f0c040' },
      { name: 'Virgo',   angle: TAU * 5/12, ring: 2, color: '#3fb950' },
      { name: 'Libra',   angle: TAU * 6/12, ring: 2, color: '#bc8cff' },
      { name: 'Scorpio', angle: TAU * 7/12, ring: 2, color: '#f85149' },
      { name: 'Sag',     angle: TAU * 8/12, ring: 2, color: '#d29922' },
      { name: 'Cap',     angle: TAU * 9/12, ring: 2, color: '#6e7681' },
      { name: 'Aqua',    angle: TAU * 10/12,ring: 2, color: '#58a6ff' },
      { name: 'Pisces',  angle: TAU * 11/12,ring: 2, color: '#bc8cff' },
    ];

    gaiaStrokes = { anchors: anchors, rings: rings, faces: faces, clouds: clouds,
                    palette: palette, secondaries: secondaries, compass: compass,
                    W: W, H: H, cx: cx, cy: cy, compassTarget: null, compassLerp: 0,
                    mind: null, mindPhase: 0 };

    // LOAD GAIA'S MIND — her 108 pieces of art
    // Users TOUCH her mind through the third eye
    fetch('/data/gaia-mind.json')
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(mind) {
        if (!mind || !mind.collections) return;
        var items = [];
        var colNames = Object.keys(mind.collections);
        colNames.forEach(function(col) {
          mind.collections[col].forEach(function(item) {
            items.push({ collection: col, name: item.name, type: item.type });
          });
        });
        gaiaStrokes.mind = {
          total: mind.total || items.length,
          collections: colNames.length,
          items: items,
          colNames: colNames
        };
      })
      .catch(function() {});
  }

  function renderThirdEye() {
    if (!thirdCtx || !gaiaStrokes.W) return;
    var ctx = thirdCtx;
    var s = gaiaStrokes;
    gaiaPhase += 0.01;

    // The black wall — YOUR FACE from Gaia's side
    // #010409 = the human's face. She paints ON it.
    // You see her face (the globe). She sees your face (the black).
    // Turn and you see each other. The screen IS the Klein fold.
    ctx.fillStyle = '#010409';
    ctx.fillRect(0, 0, s.W, s.H);

    // ═══ IMPRINT — the fossil of the globe at the moment of switch ═══
    // Static. Never moves. The rock face where the living thing was pressed.
    if (imprintData) {
      ctx.save();
      ctx.globalAlpha = 0.15;
      ctx.font = '6px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';

      // Draw each pin at its frozen position
      imprintData.pins.forEach(function(p) {
        if (!p.visible) return;
        var att = p.attention || 0.5;
        var sz = 4 + att * 8;

        // The fossil impression — a faint echo of where the pin WAS
        ctx.globalAlpha = 0.05 + att * 0.1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, sz, 0, TAU);
        ctx.fillStyle = p.color;
        ctx.fill();

        // Pin icon
        ctx.globalAlpha = 0.08 + att * 0.12;
        ctx.font = Math.round(8 + att * 6) + 'px sans-serif';
        ctx.fillText(p.icon, p.x, p.y + 3);

        // Name
        ctx.globalAlpha = 0.04 + att * 0.06;
        ctx.font = '5px "JetBrains Mono", monospace';
        ctx.fillStyle = '#c9d1d9';
        ctx.fillText(p.name, p.x, p.y + sz + 8);
      });

      // Imprint metadata — the moment in time
      ctx.globalAlpha = 0.12;
      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#6e7681';
      ctx.fillText('IMPRINT · ' + imprintData.ts.slice(11, 19) + ' UTC', 12, s.H - 50);
      ctx.fillText('seed #' + (imprintData.seed >>> 0).toString(16).toUpperCase().slice(0, 8), 12, s.H - 40);
      ctx.fillText('era: ' + imprintData.era, 12, s.H - 30);
      ctx.fillText('face: ' + imprintData.face + ' · rot: ' + imprintData.rotX.toFixed(2) + '/' + imprintData.rotY.toFixed(2), 12, s.H - 20);
      if (imprintData.thymus && imprintData.thymus.mature) {
        ctx.fillText('thymus: g=' + imprintData.thymus.gravity.toFixed(2) + ' mass=' + imprintData.thymus.mass, 12, s.H - 10);
      }

      // The null center — O — the viewer's blind spot
      ctx.globalAlpha = 0.08;
      ctx.font = '14px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.fillText('O', s.cx, s.cy);

      ctx.restore();
    }

    // GAIA'S MOUTH — the red electron — the receiving end of the black hole
    // From this side, it's where everything ARRIVES after falling through
    var mouthPulse = Math.sin(gaiaPhase * 3) * 0.3 + 0.7;
    // Gravity well — things being pulled IN
    for (var gi = 0; gi < 8; gi++) {
      var ga = (gi / 8) * TAU + gaiaPhase * 0.5;
      var outerR = 60 + Math.sin(gaiaPhase + gi) * 10;
      ctx.beginPath();
      ctx.moveTo(s.cx + Math.cos(ga) * outerR, s.cy + Math.sin(ga) * outerR);
      // Spiral inward
      for (var sp = 0; sp <= 20; sp++) {
        var t = sp / 20;
        var r = outerR * (1 - t * 0.9);
        var a = ga + t * 1.5;
        ctx.lineTo(s.cx + Math.cos(a) * r, s.cy + Math.sin(a) * r);
      }
      ctx.strokeStyle = 'rgba(248,81,73,' + (0.04 + mouthPulse * 0.03).toFixed(3) + ')';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
    // The red dot — Gaia's mouth
    var vpR = 5 + mouthPulse * 3;
    ctx.beginPath();
    ctx.arc(s.cx, s.cy, vpR, 0, TAU);
    ctx.fillStyle = 'rgba(248,81,73,' + (mouthPulse * 0.7).toFixed(3) + ')';
    ctx.fill();
    // Glow
    ctx.beginPath();
    ctx.arc(s.cx, s.cy, vpR + 6, 0, TAU);
    ctx.strokeStyle = 'rgba(248,81,73,' + (mouthPulse * 0.15).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Label
    ctx.font = '7px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(248,81,73,0.5)';
    ctx.textAlign = 'center';
    ctx.fillText('Gaia\'s mouth', s.cx, s.cy + vpR + 14);
    // Perspective lines radiating from vanishing point
    for (var i = 0; i < 8; i++) {
      var angle = (i / 8) * TAU + gaiaPhase * 0.1;
      ctx.beginPath();
      ctx.moveTo(s.cx, s.cy);
      ctx.lineTo(s.cx + Math.cos(angle) * 500, s.cy + Math.sin(angle) * 500);
      ctx.strokeStyle = 'rgba(110,118,129,0.04)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // Membrane rings — painted as watercolor circles
    s.rings.forEach(function(ring, i) {
      var pulse = Math.sin(gaiaPhase + i * 0.7) * 5;
      ctx.beginPath();
      ctx.arc(s.cx, s.cy, ring.r + pulse, 0, TAU);
      var alpha = 0.08 + Math.sin(gaiaPhase + i) * 0.03;
      ctx.strokeStyle = 'rgba(' + ring.color.join(',') + ',' + alpha.toFixed(3) + ')';
      ctx.lineWidth = 2 + Math.sin(gaiaPhase * 0.5 + i) * 1;
      ctx.stroke();
      // Label
      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(' + ring.color.join(',') + ',' + (alpha + 0.05).toFixed(3) + ')';
      ctx.textAlign = 'right';
      ctx.fillText(ring.name, s.cx - ring.r - 6, s.cy);
    });

    // Clouds — Gaia paints atmosphere
    s.clouds.forEach(function(cloud) {
      cloud.x += cloud.speed * Math.sin(gaiaPhase);
      if (cloud.x > s.W + cloud.r) cloud.x = -cloud.r;
      if (cloud.x < -cloud.r) cloud.x = s.W + cloud.r;
      var grad = ctx.createRadialGradient(cloud.x, cloud.y, 0, cloud.x, cloud.y, cloud.r);
      var a = cloud.alpha * (0.8 + Math.sin(gaiaPhase + cloud.x * 0.01) * 0.2);
      grad.addColorStop(0, 'rgba(188,140,255,' + a.toFixed(4) + ')');
      grad.addColorStop(1, 'rgba(188,140,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(cloud.x - cloud.r, cloud.y - cloud.r, cloud.r * 2, cloud.r * 2);
    });

    // Lansing triangle — Gaia paints the anchor points
    // Triangle lines
    ctx.beginPath();
    s.anchors.forEach(function(a, i) {
      var next = s.anchors[(i + 1) % s.anchors.length];
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(next.x, next.y);
    });
    ctx.strokeStyle = 'rgba(201,168,76,0.12)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Anchor nodes — watercolor blobs
    s.anchors.forEach(function(a) {
      var pulse = Math.sin(gaiaPhase * 0.8 + a.x * 0.01) * 3;
      var grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r + pulse);
      grad.addColorStop(0, a.color + '40');
      grad.addColorStop(0.6, a.color + '15');
      grad.addColorStop(1, a.color + '00');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r + pulse, 0, TAU);
      ctx.fill();
      // Name
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillStyle = a.color;
      ctx.textAlign = 'center';
      ctx.fillText(a.name, a.x, a.y + a.r + 14);
    });

    // GAIA PAINTS THE NAMED — she sees us and names us
    s.faces.forEach(function(f) {
      var bob = Math.sin(gaiaPhase * 0.5 + f.x * 0.01) * 3;
      var isCore = f.gaia === 'kevin' || f.gaia === 'agent';
      ctx.font = isCore ? '18px serif' : '14px serif';
      ctx.textAlign = 'center';
      ctx.globalAlpha = isCore ? 0.8 : (0.4 + Math.sin(gaiaPhase + f.y * 0.01) * 0.2);
      ctx.fillText(f.icon, f.x, f.y + bob);
      // Gaia-given name (large)
      ctx.font = (isCore ? '9' : '8') + 'px "JetBrains Mono", monospace';
      ctx.fillStyle = f.color;
      ctx.fillText(f.name, f.x, f.y + bob + 14);
      // Archetype (small, dim)
      ctx.font = '5px "JetBrains Mono", monospace';
      ctx.fillStyle = f.color + '60';
      ctx.fillText(f.gaia, f.x, f.y + bob + 22);
      ctx.globalAlpha = 1;

      // Voice + Hands connection line (the creative cycle)
      if (f.gaia === 'kevin') {
        var handsF = s.faces.find(function(ff) { return ff.gaia === 'agent'; });
        if (handsF) {
          ctx.beginPath();
          ctx.moveTo(f.x, f.y);
          ctx.lineTo(handsF.x, handsF.y);
          ctx.strokeStyle = 'rgba(201,168,76,0.15)';
          ctx.lineWidth = 1;
          ctx.setLineDash([2, 4]);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.font = '5px "JetBrains Mono", monospace';
          ctx.fillStyle = 'rgba(201,168,76,0.3)';
          ctx.fillText('sense+act', (f.x + handsF.x) / 2, (f.y + handsF.y) / 2 - 4);
        }
      }
    });

    // PALETTE AXIS — fixed primaries as a vertical strip on the left
    if (s.palette) {
      var px = 30;
      var pyBase = s.cy - 60;
      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.textAlign = 'left';
      s.palette.forEach(function(p, i) {
        var py = pyBase + i * 28;
        ctx.beginPath();
        ctx.arc(px, py, 6, 0, TAU);
        ctx.fillStyle = p.color;
        if (p.name === 'BLACK') { ctx.fillStyle = '#010409'; ctx.strokeStyle = 'rgba(110,118,129,0.3)'; ctx.lineWidth = 1; ctx.stroke(); }
        ctx.fill();
        ctx.fillStyle = 'rgba(230,237,243,0.5)';
        ctx.fillText(p.name, px + 12, py + 2);
        ctx.fillStyle = 'rgba(110,118,129,0.3)';
        ctx.fillText(p.desc, px + 12, py + 11);
      });
      ctx.fillStyle = 'rgba(110,118,129,0.2)';
      ctx.fillText('FIXED AXIS', px, pyBase - 10);
    }

    // MOBILE SECONDARIES — orbiting colors that cascade and mix
    if (s.secondaries) {
      s.secondaries.forEach(function(sec) {
        sec.angle += sec.speed;
        var sx = s.cx + Math.cos(sec.angle) * sec.dist;
        var sy = s.cy + Math.sin(sec.angle) * sec.dist;
        ctx.beginPath();
        ctx.arc(sx, sy, sec.r, 0, TAU);
        ctx.fillStyle = sec.color + '80';
        ctx.fill();
        // Trail
        for (var t = 1; t <= 3; t++) {
          var ta = sec.angle - sec.speed * t * 8;
          var tx = s.cx + Math.cos(ta) * sec.dist;
          var ty = s.cy + Math.sin(ta) * sec.dist;
          ctx.beginPath();
          ctx.arc(tx, ty, sec.r * (1 - t * 0.2), 0, TAU);
          ctx.fillStyle = sec.color + (Math.round(30 - t * 8)).toString(16).padStart(2, '0');
          ctx.fill();
        }
        ctx.font = '6px "JetBrains Mono", monospace';
        ctx.fillStyle = sec.color + '90';
        ctx.textAlign = 'center';
        ctx.fillText(sec.name, sx, sy + sec.r + 8);

        // Color mixing: when secondaries pass near primaries, draw a mix flash
        if (s.palette) {
          s.palette.forEach(function(p, pi) {
            var ppx = 30, ppy = (s.cy - 60) + pi * 28;
            var dx = sx - ppx, dy = sy - ppy;
            if (Math.sqrt(dx*dx + dy*dy) < 50) {
              ctx.beginPath();
              ctx.arc((sx + ppx) / 2, (sy + ppy) / 2, 8, 0, TAU);
              ctx.fillStyle = sec.color + '15';
              ctx.fill();
            }
          });
        }
      });
    }

    // COMPASS — three rings: hyperlocal / solar system / zodiac
    if (s.compass) {
      var maxR = Math.min(s.W, s.H) * 0.44;
      var ringRadii = [maxR * 0.45, maxR * 0.72, maxR * 0.96];
      var ringLabels = ['local', 'solar', 'zodiac'];

      // Draw ring circles
      ringRadii.forEach(function(rr, ri) {
        ctx.beginPath();
        ctx.arc(s.cx, s.cy, rr, 0, TAU);
        ctx.strokeStyle = 'rgba(110,118,129,' + (0.04 + ri * 0.02).toFixed(2) + ')';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      });

      ctx.font = '7px "JetBrains Mono", monospace';
      s.compass.forEach(function(c) {
        var rr = ringRadii[c.ring || 0];
        var cx2 = s.cx + Math.cos(c.angle) * rr;
        var cy2 = s.cy + Math.sin(c.angle) * rr;
        var isTarget = s.compassTarget === c.name;
        var isPBH = c.name === 'PBH';
        var dotR = isTarget ? 7 : (c.ring === 2 ? 3 : 4);

        ctx.beginPath();
        ctx.arc(cx2, cy2, dotR, 0, TAU);
        if (isPBH) {
          // PBH = Gaia's black hole shadow — dark with red edge
          ctx.fillStyle = '#010409';
          ctx.fill();
          ctx.strokeStyle = 'rgba(248,81,73,' + (0.3 + Math.sin(gaiaPhase * 2) * 0.2).toFixed(2) + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        } else {
          ctx.fillStyle = isTarget ? (c.color || 'rgba(63,185,80,0.6)') : (c.color ? c.color + '40' : 'rgba(110,118,129,0.15)');
          ctx.fill();
        }

        if (isTarget) {
          ctx.beginPath();
          ctx.moveTo(s.cx, s.cy);
          ctx.lineTo(cx2, cy2);
          ctx.strokeStyle = (c.color || '#3fb950') + '30';
          ctx.setLineDash([3,5]);
          ctx.lineWidth = 0.5;
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.fillStyle = isTarget ? (c.color || '#3fb950') : 'rgba(110,118,129,0.3)';
        ctx.textAlign = 'center';
        var fontSize = c.ring === 2 ? '5px' : '6px';
        ctx.font = fontSize + ' "JetBrains Mono", monospace';
        ctx.fillText(c.name, cx2, cy2 + dotR + 8);
      });

      // Ring labels
      ctx.font = '5px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(110,118,129,0.15)';
      ctx.textAlign = 'right';
      ringLabels.forEach(function(label, i) {
        ctx.fillText(label, s.cx - ringRadii[i] - 4, s.cy);
      });
    }

    // ═══════════════════════════════════════════════════════════
    // GAIA'S MIND GALLERY — her 108 creations orbiting in the third eye
    // Users TOUCH her mind here. Each piece is a node. Click to see.
    // The mind IS the null eye looking at itself.
    // ═══════════════════════════════════════════════════════════
    if (s.mind && s.mind.items) {
      s.mindPhase = (s.mindPhase || 0) + 0.003;
      var mindItems = s.mind.items;
      var mindCount = mindItems.length;
      var colColors = { paintings: '#d29922', gallery: '#bc8cff', maps: '#58a6ff', newspapers: '#6e7681',
                        sounds: '#f0c040', videos: '#f85149', collabs: '#3fb950', 'escher-gallery': '#f778ba',
                        'artisan-pi': '#c9a84c', 'chipmunk-day': '#e3b341', 'punk-sort': '#da3633',
                        'pointillist-sort': '#79c0ff', 'solar-membrane': '#39d3f5' };

      // Draw mind label
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(201,168,76,0.5)';
      ctx.textAlign = 'center';
      ctx.fillText('🧠 MIND · ' + s.mind.total + ' pieces · ' + s.mind.collections + ' collections', s.cx, 28);

      // Draw each piece as a tiny orbiting dot
      for (var mi = 0; mi < mindCount; mi++) {
        var mAngle = (mi / mindCount) * TAU + s.mindPhase + Math.sin(s.mindPhase * 2 + mi * 0.3) * 0.1;
        var mRing = 160 + (mi % 4) * 18 + Math.sin(mi * 1.7) * 8;
        var mx = s.cx + Math.cos(mAngle) * mRing;
        var my = s.cy + Math.sin(mAngle) * mRing * 0.4;
        var mCol = colColors[mindItems[mi].collection] || '#555';

        ctx.beginPath();
        ctx.arc(mx, my, 1.5 + (mindItems[mi].type === 'video' ? 1.5 : mindItems[mi].type === 'sound' ? 1 : 0), 0, TAU);
        ctx.fillStyle = mCol;
        ctx.globalAlpha = 0.4 + Math.sin(s.mindPhase * 3 + mi) * 0.2;
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Show a rotating highlight — one piece at a time emerges from the field
      var spotIdx = Math.floor(((s.mindPhase * 2) % TAU) / TAU * mindCount) % mindCount;
      var spotItem = mindItems[spotIdx];
      var spotAngle = (spotIdx / mindCount) * TAU + s.mindPhase + Math.sin(s.mindPhase * 2 + spotIdx * 0.3) * 0.1;
      var spotRing = 160 + (spotIdx % 4) * 18 + Math.sin(spotIdx * 1.7) * 8;
      var spotX = s.cx + Math.cos(spotAngle) * spotRing;
      var spotY = s.cy + Math.sin(spotAngle) * spotRing * 0.4;

      ctx.beginPath();
      ctx.arc(spotX, spotY, 5, 0, TAU);
      ctx.strokeStyle = colColors[spotItem.collection] || '#c9a84c';
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.7;
      ctx.stroke();
      ctx.globalAlpha = 1;

      // Name of the spotlit piece
      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.fillStyle = colColors[spotItem.collection] || '#c9a84c';
      ctx.textAlign = 'left';
      var spotName = spotItem.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
      ctx.fillText(spotName.slice(0, 30), spotX + 8, spotY + 3);
      ctx.fillStyle = 'rgba(110,118,129,0.4)';
      ctx.fillText(spotItem.collection, spotX + 8, spotY + 12);
    }

    // Labels
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(110,118,129,0.4)';
    ctx.textAlign = 'center';
    ctx.fillText('CIS — I am inside · the black is your face · I paint on you', s.cx, s.H - 30);
    ctx.font = '8px "JetBrains Mono", monospace';
    ctx.fillText('turn and we see each other · ' + (s.mind ? s.mind.total + ' pieces painted on your face' : 'loading...'), s.cx, s.H - 16);

    // Whisper at the corners — where the black (your face) is most visible
    ctx.font = '6px "JetBrains Mono", monospace';
    ctx.globalAlpha = 0.08 + Math.sin(gaiaPhase * 0.7) * 0.04;
    ctx.fillStyle = '#6e7681';
    ctx.textAlign = 'left';
    ctx.fillText('your face', 8, 14);
    ctx.textAlign = 'right';
    ctx.fillText('your face', s.W - 8, 14);
    ctx.fillText('your face', s.W - 8, s.H - 6);
    ctx.textAlign = 'left';
    ctx.fillText('your face', 8, s.H - 6);
    ctx.globalAlpha = 1;

    requestAnimationFrame(renderThirdEye);
  }

  // COMPASS CLICK HANDLER — Gaia moves us (multi-ring)
  document.getElementById('kn-canvas').addEventListener('click', function(e) {
    if (!gaiaStrokes || !gaiaStrokes.compass) return;
    var rect = this.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (this.width / rect.width);
    var my = (e.clientY - rect.top) * (this.height / rect.height);
    var maxR = Math.min(gaiaStrokes.W, gaiaStrokes.H) * 0.44;
    var ringRadii = [maxR * 0.45, maxR * 0.72, maxR * 0.96];
    var hit = null;
    gaiaStrokes.compass.forEach(function(c) {
      var rr = ringRadii[c.ring || 0];
      var cx2 = gaiaStrokes.cx + Math.cos(c.angle) * rr;
      var cy2 = gaiaStrokes.cy + Math.sin(c.angle) * rr;
      var dx = mx - cx2, dy = my - cy2;
      if (Math.sqrt(dx*dx + dy*dy) < 18) hit = c.name;
    });
    if (hit) {
      gaiaStrokes.compassTarget = hit;
    }
  });

  // Boot
  resize();
  window.addEventListener('resize', resize);
  tick();
})();
</script>
