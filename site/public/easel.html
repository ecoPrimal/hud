<script>
var C = document.getElementById('easel');
var ctx = C.getContext('2d');
var W, H;
var paused = false;
var phase = 'stars';
var stroke = 0;
var totalStrokes = 0;
var stars = [];
var gaiaAngle = 0;
var breathPhase = 0;
var skyScore = null;

// ═══ SOURDOUGH — the starter culture ═══
var generation = 1;        // which painting are we on?
var starters = [];         // array of {dataURL, gen, palette, learned}
var MAX_STARTERS = 12;     // keep the last 12 paintings
var breathCount = 0;       // how long we've been breathing this painting
var BREATH_LIMIT = 300;    // ~15 seconds of breath, then ferment
var learnedTraits = {      // what the chipmunk has learned across generations
  starDensity: 1.0,        // evolves: more confident = fewer, brighter stars
  nebulaDepth: 1.0,        // evolves: deeper washes
  gaiaDetail: 1.0,         // evolves: more cloud, more light, more life
  auroraIntensity: 1.0,    // evolves: bolder curtains
  perspective: 0,          // 0-1: how much the chipmunk understands depth
  colorMemory: [],         // colors sampled from previous paintings
};

// ═══ NINJA TURTLES — four modalities of artistic mastery ═══
// Never 0. Never 1. Always meta-stable. Always 0.00...something.
// Each turtle sculpts AND paints AND slices AND creates for each other.
// Sculpture teaches shadow→pressure. Painting teaches color→emotion.
// Each modality in→out becomes a storytelling system they are learning.
//
// MASTER SPLINTER is the accumulated wisdom — the da Vinci constant.
// Not just a teacher. A force in itself. The sourdough mother culture.

var PI_REMAINDER = 0.14159265358979; // what remains after the integer is removed

// ═══ THE PI BODY — the atomic triangle ═══
// 3 points. 3 lines. 1 null center.
// The corners stay fixed. The LINES are pulled toward center.
// Scale at the lines, not the corners.
// This creates a shape between triangle and point —
// each edge bows inward, curving toward the null.
//
// The pi body is the fundamental building block.
// It appears EVERYWHERE:
//   - The trefoil's three crossings
//   - The three Splinters
//   - The plasmid triangle (JP/IN/DE)
//   - Any three points with tension toward center
//
// The inward pull is governed by PI_REMAINDER.
// At 0: a flat triangle. At 1: collapsed to center.
// PI_REMAINDER (~0.14) gives a gentle bow — the shape breathes.
//
// It self-ingests: the center point IS the triangle's own
// centroid being pulled back through itself.

function piBody(ctx, x1, y1, x2, y2, x3, y3, pull, color, alpha) {
  // Null center = centroid
  var cx = (x1 + x2 + x3) / 3;
  var cy = (y1 + y2 + y3) / 3;

  // Pull factor: how much the lines bow toward center
  // 0 = flat triangle, 1 = collapsed to point
  var p = typeof pull !== 'undefined' ? pull : PI_REMAINDER;

  ctx.save();
  ctx.globalAlpha = typeof alpha !== 'undefined' ? alpha : 0.03;
  ctx.strokeStyle = color || '#c9d1d9';
  ctx.lineWidth = 0.5;

  // Edge 1: p1 → p2, pulled toward center
  var mid12x = (x1 + x2) / 2;
  var mid12y = (y1 + y2) / 2;
  var cp12x = mid12x + (cx - mid12x) * p;
  var cp12y = mid12y + (cy - mid12y) * p;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(cp12x, cp12y, x2, y2);
  ctx.stroke();

  // Edge 2: p2 → p3, pulled toward center
  var mid23x = (x2 + x3) / 2;
  var mid23y = (y2 + y3) / 2;
  var cp23x = mid23x + (cx - mid23x) * p;
  var cp23y = mid23y + (cy - mid23y) * p;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.quadraticCurveTo(cp23x, cp23y, x3, y3);
  ctx.stroke();

  // Edge 3: p3 → p1, pulled toward center
  var mid31x = (x3 + x1) / 2;
  var mid31y = (y3 + y1) / 2;
  var cp31x = mid31x + (cx - mid31x) * p;
  var cp31y = mid31y + (cy - mid31y) * p;
  ctx.beginPath();
  ctx.moveTo(x3, y3);
  ctx.quadraticCurveTo(cp31x, cp31y, x1, y1);
  ctx.stroke();

  // The null center point — tiny dot
  ctx.globalAlpha = (typeof alpha !== 'undefined' ? alpha : 0.03) * 0.5;
  ctx.fillStyle = color || '#c9d1d9';
  ctx.beginPath();
  ctx.arc(cx, cy, 1, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  return { cx: cx, cy: cy, pull: p };
}

// Paint pi bodies everywhere — the shape that recurs at every scale
function paintPiBodies() {
  var maturity = Math.min(1, learnedTraits.perspective * 2);
  if (maturity < 0.05) return;

  var pull = PI_REMAINDER + Math.sin(breathPhase * 0.3) * 0.05; // breathing pull

  // ── LARGE: The trefoil triangle (Splinter/Splinter/Shredder) ──
  piBody(ctx,
    W * 0.5, H * 0.08,   // Splinter top
    W * 0.5, H * 0.92,   // Splinter bottom
    W * 0.92, H * 0.5,   // Shredder
    pull, '#8b949e', 0.01 * maturity
  );

  // ── MEDIUM: The turtle formation ──
  // Leo(top) / Donnie(left) / Raph(bottom) / Mikey(right)
  // Two overlapping pi bodies from 4 points:
  var tR = Math.min(W, H) * 0.25;
  var tcx = W * 0.5, tcy = H * 0.5;
  // Triangle 1: Leo, Donnie, Raph
  piBody(ctx,
    tcx, tcy - tR,         // Leo top
    tcx - tR, tcy,         // Donnie left
    tcx, tcy + tR,         // Raph bottom
    pull, '#58a6ff', 0.008 * maturity
  );
  // Triangle 2: Leo, Mikey, Raph
  piBody(ctx,
    tcx, tcy - tR,         // Leo top
    tcx + tR, tcy,         // Mikey right
    tcx, tcy + tR,         // Raph bottom
    pull, '#f0883e', 0.008 * maturity
  );

  // ── SMALL: Fractal pi bodies at each turtle position ──
  if (maturity > 0.3) {
    var smallR = Math.min(W, H) * 0.04;
    var tAngles = [Math.PI * 1.5, Math.PI, Math.PI * 0.5, 0];
    var tColors = ['#58a6ff', '#d2a8ff', '#f85149', '#f0883e'];
    tAngles.forEach(function(angle, i) {
      var sx = tcx + Math.cos(angle) * tR;
      var sy = tcy + Math.sin(angle) * tR;
      piBody(ctx,
        sx, sy - smallR,
        sx - smallR * 0.866, sy + smallR * 0.5,
        sx + smallR * 0.866, sy + smallR * 0.5,
        pull * 1.5, tColors[i], 0.006 * maturity
      );
    });
  }

  // ── TINY: Scattered pi bodies — all the way down ──
  if (maturity > 0.5 && generation > 3) {
    var seed = generation * 7;
    for (var pb = 0; pb < Math.min(generation, 12); pb++) {
      var px = ((seed + pb * 137) % 100) / 100 * W;
      var py = ((seed + pb * 251) % 100) / 100 * H;
      var pr = 3 + ((seed + pb * 43) % 8);
      var pa = (Math.PI * 2 / 3);
      piBody(ctx,
        px + Math.cos(0) * pr, py + Math.sin(0) * pr,
        px + Math.cos(pa) * pr, py + Math.sin(pa) * pr,
        px + Math.cos(pa * 2) * pr, py + Math.sin(pa * 2) * pr,
        pull * (1 + pb * 0.1), '#6e7681', 0.003 * maturity
      );
    }
  }
}

var turtles = {
  // LEONARDO — discipline, precision, the blade that CUTS
  // The turtle: katana, classification, slicing data, sharp boundaries
  // The artist: Leonardo da Vinci (1452-1519). The original polymath.
  //   Mona Lisa. Vitruvian Man. Flying machines 400 years early.
  //   Mirror-wrote his notebooks. Left-handed. If you can see it, build it.
  leonardo: {
    name: 'Leonardo',
    weapon: 'katana',
    domain: 'precision',
    color: '#58a6ff',
    skill: PI_REMAINDER,
    teaches: 'raphael',
    learns_from: 'donatello',
    modality: 'slicing',
    strokes: [],
    artist: {
      fullName: 'Leonardo da Vinci',
      years: '1452–1519',
      works: ['Mona Lisa', 'The Last Supper', 'Vitruvian Man'],
      insight: 'The archetype of seeing AND building. His notebooks were mirror-written — the first encryption.',
      constant: 'c', // speed of light — information at maximum velocity
    },
  },

  // DONATELLO — engineer, builder, the staff that BUILDS
  // The turtle: bo staff, architecture, tools, infrastructure
  // The artist: Donato di Niccolò di Betto Bardi (1386-1466).
  //   FIRST great sculptor of the Renaissance. BEFORE da Vinci.
  //   Invented rilievo schiacciato (shallow relief) — 3D from 2D.
  //   His David = first freestanding nude since antiquity.
  //   The FIRST to solve: how do you make flat look deep?
  donatello: {
    name: 'Donatello',
    weapon: 'bo',
    domain: 'architecture',
    color: '#d2a8ff',
    skill: PI_REMAINDER,
    teaches: 'michelangelo',
    learns_from: 'leonardo',
    modality: 'building',
    strokes: [],
    artist: {
      fullName: 'Donato di Niccolò di Betto Bardi',
      years: '1386–1466',
      works: ['David (bronze)', 'Gattamelata', 'Mary Magdalene'],
      insight: 'The first to make flat look deep. Rilievo schiacciato — shallow relief. The chipmunk yearns for exactly this: sculpture from painting.',
      constant: 'Å', // angstrom — the scale of atoms, the shallow relief of matter
    },
  },

  // RAPHAEL — passion, intensity, the sai that STABS
  // The turtle: sai, emotion, bold strokes, raw signal
  // The artist: Raffaello Sanzio (1483-1520).
  //   The School of Athens. The Sistine Madonna.
  //   Master of COMPOSITION — arranging many figures in space.
  //   Died at 37. More beauty than most lifetimes.
  raphael: {
    name: 'Raphael',
    weapon: 'sai',
    domain: 'intensity',
    color: '#f85149',
    skill: PI_REMAINDER,
    teaches: 'leonardo',
    learns_from: 'michelangelo',
    modality: 'piercing',
    strokes: [],
    artist: {
      fullName: 'Raffaello Sanzio da Urbino',
      years: '1483–1520',
      works: ['The School of Athens', 'Sistine Madonna', 'Transfiguration'],
      insight: 'Composition is storytelling. Every figure has a role. Every arrangement is an argument. Died at 37 — the inverse of Michelangelo\'s 89.',
      constant: 'kB', // Boltzmann — entropy per particle, the heat of composition
    },
  },

  // MICHELANGELO — flow, joy, the nunchaku that FLOWS
  // The turtle: nunchaku, freestyle, spontaneous, happy accidents
  // The artist: Michelangelo di Lodovico Buonarroti (1475-1564).
  //   Sistine Chapel. Pietà. David. "Every block of stone has a statue inside."
  //   Both sculptor AND painter. The duality. 89 years. Never stopped.
  michelangelo: {
    name: 'Michelangelo',
    weapon: 'nunchaku',
    domain: 'flow',
    color: '#f0883e',
    skill: PI_REMAINDER,
    teaches: 'donatello',
    learns_from: 'raphael',
    modality: 'flowing',
    strokes: [],
    artist: {
      fullName: 'Michelangelo di Lodovico Buonarroti Simoni',
      years: '1475–1564',
      works: ['Sistine Chapel ceiling', 'Pietà', 'David', 'Creation of Adam'],
      insight: 'Every block of stone has a statue inside — I just chip away what doesn\'t belong. 89 years. Both sculptor AND painter. The duality resolved.',
      constant: 'NA', // Avogadro — the count of everything, the mole of creation
    },
  },
};

// MASTER SPLINTER — the da Vinci constant
// The rat who carries ALL the knowledge. Passes it on. But is a force in itself.
// Splinter's value is the PRODUCT of all four turtle skills — multiplicative wisdom.
var splinter = {
  name: 'Splinter',
  title: 'the da Vinci constant',
  wisdom: PI_REMAINDER * PI_REMAINDER,
  teachings: 0,
  force: PI_REMAINDER,
};

// ═══ THE THREE SPLINTERS — trefoil topology ═══
// Splinter at top. Splinter at bottom. Chipmunk in center. Turtles all around.
// But a trefoil knot has THREE crossings. The third Splinter is SHREDDER.
//
// Splinter 1 (top):    the teacher. wisdom. da Vinci. gentle.
// Splinter 2 (bottom): the foundation. the constant. the root.
// Shredder (3rd crossing): the ANTI-Splinter.
//   Oroku Saki. Human. Armored. More HUMAN than a rat.
//   But LESS HUMANE than a rat, or certainly a turtle.
//
// THIS IS THE UNCANNY VALLEY:
//   As you approach human FORM, you lose human WARMTH.
//   Shredder IS the uncanny valley personified.
//   A human who is less humane than animals.
//   Armor instead of fur. Control instead of teaching.
//   The Foot Clan instead of family.
//
// Also: Mark Zuckerberg. More human than a membrane.
// But less humane than a chipmunk. Running a "social" network
// that is antisocial. The blackwall wearing a human face.

var shredder = {
  name: 'Shredder',
  title: 'the anti-Splinter',
  realName: 'Oroku Saki',
  humanForm: 1.0,       // maximally human in appearance
  humaneLevel: PI_REMAINDER * 0.1, // minimally humane in behavior
  armor: true,           // hides behind metal, not fur
  // The uncanny valley score: humanForm - humaneLevel
  // Higher = deeper in the valley
  uncannyDepth: 1.0 - (PI_REMAINDER * 0.1),
  // Modern incarnations of the Shredder pattern:
  incarnations: [
    { name: 'Meta', humanForm: 0.95, humaneLevel: 0.10, armor: 'the blackwall' },
    { name: 'Great Firewall', humanForm: 0.90, humaneLevel: 0.05, armor: 'the party' },
    { name: 'API closures', humanForm: 0.70, humaneLevel: 0.15, armor: 'terms of service' },
    { name: 'Flash killed', humanForm: 0.60, humaneLevel: 0.20, armor: 'security concerns' },
  ],
};

// ═══ PHYSICAL CONSTANTS — the universe's cost analysis tools ═══
// Each constant is a lens. A way to measure what something COSTS.
// E=mc² is not just physics. It's: how much energy does this attention cost?
// Avogadro is: how many atoms make a mole? How many visitors make a signal?
var CONSTANTS = {
  c:  { value: 2.998e8,   unit: 'm/s',     name: 'speed of light',      symbol: 'c',  meaning: 'maximum information velocity — the speed limit of attention' },
  NA: { value: 6.022e23,  unit: 'mol⁻¹',   name: 'Avogadro',            symbol: 'Nᴀ', meaning: 'the count of everything — how many atoms make a mole, how many visitors make a signal' },
  Å:  { value: 1e-10,     unit: 'm',        name: 'ångström',            symbol: 'Å',  meaning: 'the scale of atoms — the smallest detail the chipmunk can resolve' },
  h:  { value: 6.626e-34, unit: 'J·s',      name: 'Planck',              symbol: 'h',  meaning: 'the quantum of action — the smallest possible brushstroke' },
  kB: { value: 1.381e-23, unit: 'J/K',      name: 'Boltzmann',           symbol: 'kB', meaning: 'entropy per particle — the heat cost of information' },
  e_: { value: 2.71828,   unit: '',          name: 'Euler\'s number',     symbol: 'e',  meaning: 'natural growth — compound interest, exponential decay, sourdough rise' },
  pi: { value: Math.PI,   unit: 'rad',       name: 'pi',                  symbol: 'π',  meaning: 'the budget constraint — both sides of every Klein face' },
  phi:{ value: 1.61803,   unit: '',          name: 'golden ratio',        symbol: 'φ',  meaning: 'Splinter\'s spiral — the proportion that nature prefers' },
  G:  { value: 6.674e-11, unit: 'N·m²/kg²', name: 'gravitational',       symbol: 'G',  meaning: 'the pull between masses — what draws visitors to the membrane' },
};

// E=mc² as cost analysis: energy (attention) = mass (content) × c² (velocity²)
// The cost of attention: what does it COST to be seen?
function attentionCost(mass, velocity) {
  return mass * velocity * velocity;
}

// Shannon entropy: H = -Σ p·log₂(p)
function shannonEntropy(probabilities) {
  var H = 0;
  for (var i = 0; i < probabilities.length; i++) {
    var p = probabilities[i];
    if (p > 0) H -= p * Math.log2(p);
  }
  return H;
}

// Meta-stable clamp — NEVER 0, NEVER 1
function metaStable(v) {
  if (v <= 0) return 0.001 + Math.random() * 0.001; // never exactly 0
  if (v >= 1) return 0.998 - Math.random() * 0.001;  // never exactly 1
  return v;
}

// Cross-modal teaching — each turtle improves its student
function turtleTeach() {
  var names = Object.keys(turtles);
  names.forEach(function(name) {
    var teacher = turtles[name];
    var student = turtles[teacher.teaches];
    if (!student) return;

    // The teaching rate is proportional to the teacher's skill × Splinter's force
    var teachRate = teacher.skill * splinter.force * 0.002;
    student.skill = metaStable(student.skill + teachRate);

    // The teacher also learns from teaching (you understand by explaining)
    teacher.skill = metaStable(teacher.skill + teachRate * 0.3);

    splinter.teachings++;
  });

  // Splinter's wisdom is the geometric mean of all four
  var product = 1;
  names.forEach(function(n) { product *= turtles[n].skill; });
  splinter.wisdom = metaStable(Math.pow(product, 0.25));

  // Splinter's own force grows with teaching (da Vinci grew by teaching too)
  splinter.force = metaStable(splinter.force + 0.0001 * splinter.teachings / Math.max(1, generation));
}

// ═══ PALETTE — evolves with generation ═══
function starColor() {
  // Later generations sample from color memory
  if (learnedTraits.colorMemory.length > 0 && Math.random() < learnedTraits.perspective * 0.3) {
    var mem = learnedTraits.colorMemory[Math.floor(Math.random() * learnedTraits.colorMemory.length)];
    return mem;
  }
  var temps = [
    [255,200,150],[200,220,255],[255,240,220],[255,180,120],
    [180,200,255],[210,168,255],[88,166,255],
  ];
  var t = temps[Math.floor(Math.random() * temps.length)];
  var a = 0.3 + Math.random() * 0.7;
  return 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',' + a + ')';
}

function paintStar() {
  var x = Math.random() * W;
  var y = Math.random() * H * 0.85;
  // Leonardo's precision: higher skill = more intentional placement, sharper dots
  var leoSkill = turtles.leonardo.skill;
  var r = (0.3 + Math.random() * 2.2) * (1 + learnedTraits.perspective * 0.5) * (0.7 + leoSkill * 0.6);
  var c = starColor();
  var twinkle = Math.random();

  stars.push({ x: x, y: y, r: r, c: c, twinkle: twinkle, born: totalStrokes });

  ctx.save();
  ctx.globalAlpha = (0.6 + Math.random() * 0.4) * (0.8 + learnedTraits.perspective * 0.4);
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();

  if (r > 1.5) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 0.3;
    ctx.globalAlpha = 0.3;
    var len = r * (3 + learnedTraits.perspective * 3);
    ctx.beginPath();
    ctx.moveTo(x - len, y); ctx.lineTo(x + len, y);
    ctx.moveTo(x, y - len); ctx.lineTo(x, y + len);
    ctx.stroke();
  }
  ctx.restore();
}

function paintNebula() {
  var cx = W * (0.15 + Math.random() * 0.7);
  var cy = H * (0.08 + Math.random() * 0.55);
  var r = (40 + Math.random() * 160) * learnedTraits.nebulaDepth;

  var hue = skyScore ? skyScore.hue : (260 + Math.random() * 60);
  var sat = 30 + Math.random() * 40;
  var light = (6 + Math.random() * 14) * learnedTraits.nebulaDepth;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grad.addColorStop(0, 'hsla(' + hue + ',' + sat + '%,' + Math.min(light, 25) + '%,0.08)');
  grad.addColorStop(0.5, 'hsla(' + ((hue + 30) % 360) + ',' + (sat - 10) + '%,' + Math.min(light - 3, 20) + '%,0.04)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  for (var a = 0; a < Math.PI * 2; a += 0.2) {
    var wobble = r * (0.6 + 0.4 * Math.sin(a * (3 + generation * 0.5) + cx * 0.01));
    ctx.lineTo(cx + Math.cos(a) * wobble, cy + Math.sin(a) * wobble);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function paintGaia() {
  var cx = W * 0.5;
  var cy = H * 0.52;
  var R = Math.min(W, H) * (0.16 + learnedTraits.gaiaDetail * 0.04);

  ctx.save();

  // Atmosphere glow — gets richer with each generation
  var atmoR = R * (1.2 + learnedTraits.perspective * 0.15);
  var atmo = ctx.createRadialGradient(cx, cy, R * 0.95, cx, cy, atmoR);
  atmo.addColorStop(0, 'rgba(60,140,255,' + (0.08 + learnedTraits.gaiaDetail * 0.06) + ')');
  atmo.addColorStop(0.5, 'rgba(40,100,200,0.04)');
  atmo.addColorStop(1, 'transparent');
  ctx.fillStyle = atmo;
  ctx.beginPath();
  ctx.arc(cx, cy, atmoR, 0, Math.PI * 2);
  ctx.fill();

  gaiaAngle += 0.002;

  // Dark body
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(4,8,16,' + (0.1 + learnedTraits.gaiaDetail * 0.08) + ')';
  ctx.fill();

  // Light side — blue marble
  var lightGrad = ctx.createRadialGradient(
    cx + Math.cos(gaiaAngle) * R * 0.4, cy - R * 0.2, R * 0.1, cx, cy, R
  );
  lightGrad.addColorStop(0, 'rgba(80,160,255,' + (0.08 + learnedTraits.gaiaDetail * 0.06) + ')');
  lightGrad.addColorStop(0.4, 'rgba(40,120,200,' + (0.06 + learnedTraits.gaiaDetail * 0.04) + ')');
  lightGrad.addColorStop(0.7, 'rgba(20,80,40,0.06)');
  lightGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = lightGrad;
  ctx.fill();

  // Clouds — more with each generation
  var numClouds = 2 + Math.floor(learnedTraits.gaiaDetail * 4);
  for (var i = 0; i < numClouds; i++) {
    var ca = gaiaAngle + i * (Math.PI * 2 / numClouds);
    var wx = cx + Math.cos(ca) * R * 0.6;
    var wy = cy + Math.sin(ca * 0.7) * R * 0.4;
    ctx.globalAlpha = 0.02 + learnedTraits.gaiaDetail * 0.02;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(wx, wy, R * (0.2 + learnedTraits.gaiaDetail * 0.1), R * 0.05, ca, 0, Math.PI * 2);
    ctx.fill();
  }

  // City lights — more with each generation
  var numCities = 3 + Math.floor(learnedTraits.gaiaDetail * 5);
  ctx.globalAlpha = 0.4 + learnedTraits.gaiaDetail * 0.3;
  for (var j = 0; j < numCities; j++) {
    var la = gaiaAngle + Math.PI + (j * 0.9 + 0.3);
    var lr = R * (0.3 + Math.random() * 0.6);
    var lx = cx + Math.cos(la) * lr * Math.cos(j * 0.6);
    var ly = cy + Math.sin(j * 0.6) * lr * 0.5;
    var dist = Math.sqrt((lx - cx) * (lx - cx) + (ly - cy) * (ly - cy));
    if (dist < R * 0.93) {
      ctx.fillStyle = '#ffe8a0';
      ctx.fillRect(lx, ly, 1 + learnedTraits.gaiaDetail * 0.5, 1);
    }
  }

  // Limb brightening
  var limbGrad = ctx.createRadialGradient(cx, cy, R * 0.85, cx, cy, R);
  limbGrad.addColorStop(0, 'transparent');
  limbGrad.addColorStop(1, 'rgba(100,180,255,' + (0.06 + learnedTraits.gaiaDetail * 0.04) + ')');
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = limbGrad;
  ctx.fill();

  ctx.restore();
}

function paintAurora() {
  var cx = W * 0.5;
  var cy = H * 0.52;
  var R = Math.min(W, H) * (0.16 + learnedTraits.gaiaDetail * 0.04);
  var kp = skyScore ? skyScore.kp : 2;
  var hue = skyScore ? skyScore.hue : 140;
  var intensity = learnedTraits.auroraIntensity;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  var numCurtains = Math.floor((3 + kp) * intensity);
  for (var i = 0; i < numCurtains; i++) {
    var aOff = breathPhase * 0.5 + i * 0.7;
    var ax = cx + Math.cos(aOff) * R * 0.25;
    var ay = cy - R * (0.82 + Math.sin(aOff * 1.3) * 0.18);

    var aGrad = ctx.createRadialGradient(ax, ay, 0, ax, ay, R * (0.4 + intensity * 0.15));
    aGrad.addColorStop(0, 'hsla(' + (hue + i * 15) + ',70%,50%,' + (0.04 + intensity * 0.03) + ')');
    aGrad.addColorStop(0.5, 'hsla(' + (hue + 30 + i * 10) + ',50%,30%,' + (0.02 + intensity * 0.02) + ')');
    aGrad.addColorStop(1, 'transparent');

    ctx.fillStyle = aGrad;
    ctx.beginPath();
    ctx.ellipse(ax, ay, R * (0.35 + intensity * 0.1), R * (0.15 + intensity * 0.08), aOff * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Curtain rays — bolder each generation
  ctx.globalAlpha = (0.03 + kp * 0.008) * intensity;
  var numRays = 6 + Math.floor(intensity * 4);
  for (var j = 0; j < numRays; j++) {
    var rAngle = breathPhase * 0.3 + j * (Math.PI * 2 / numRays);
    var rx = cx + Math.cos(rAngle) * R * 0.3;
    var ry = cy - R * 0.9;
    ctx.strokeStyle = 'hsla(' + (hue + j * 20) + ',60%,50%,0.15)';
    ctx.lineWidth = 1 + intensity * 0.5;
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + Math.sin(rAngle) * (6 + intensity * 4), ry - R * (0.3 + Math.random() * 0.5));
    ctx.stroke();
  }

  ctx.restore();
}

function paintBreath() {
  breathPhase += 0.02;
  breathCount++;

  ctx.save();
  var breathAlpha = 0.001 + Math.sin(breathPhase) * 0.001;
  ctx.fillStyle = 'rgba(210,168,255,' + Math.abs(breathAlpha) + ')';
  ctx.fillRect(0, 0, W, H);

  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var tw = Math.sin(breathPhase * 2 + s.twinkle * 10) * 0.5 + 0.5;
    if (tw > 0.85) {
      ctx.globalAlpha = 0.2 * tw;
      ctx.fillStyle = s.c;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();

  // ═══ THE FERMENT — time to become starter? ═══
  if (breathCount >= BREATH_LIMIT) {
    ferment();
  }
}

// ═══ FERMENT — this painting becomes the starter for the next ═══
function ferment() {
  phase = 'study';
  stroke = 0;
  breathCount = 0;

  // Capture this painting as a thumbnail
  var thumb = C.toDataURL('image/jpeg', 0.5);

  // Sample colors from the painting for the color memory
  var sampleColors = [];
  var imgData = ctx.getImageData(0, 0, W, H);
  for (var i = 0; i < 20; i++) {
    var sx = Math.floor(Math.random() * W);
    var sy = Math.floor(Math.random() * H);
    var idx = (sy * W + sx) * 4;
    var r = imgData.data[idx], g = imgData.data[idx+1], b = imgData.data[idx+2], a = imgData.data[idx+3];
    if (a > 30 && (r + g + b) > 30) {
      sampleColors.push('rgba(' + r + ',' + g + ',' + b + ',0.7)');
    }
  }

  starters.push({
    dataURL: thumb,
    gen: generation,
    palette: sampleColors,
    weather: skyScore ? { kp: skyScore.kp, hue: skyScore.hue } : null,
    timestamp: Date.now(),
  });

  // Keep only the last MAX_STARTERS
  if (starters.length > MAX_STARTERS) starters.shift();

  // Feed the color memory
  learnedTraits.colorMemory = learnedTraits.colorMemory.concat(sampleColors).slice(-40);

  renderGallery();
}

// ═══ STUDY — look at previous paintings ═══
function paintStudy() {
  // Highlight which painting we're studying in the gallery
  var thumbs = document.querySelectorAll('#gallery .thumb');
  thumbs.forEach(function(t) { t.classList.remove('studying'); });

  var studyIdx = Math.min(stroke, starters.length - 1);
  if (thumbs[studyIdx]) thumbs[studyIdx].classList.add('studying');

  // Subtle golden overlay — studying light
  ctx.save();
  ctx.fillStyle = 'rgba(240,198,116,0.003)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ═══ OTHER SQUIRRELS — the chipmunk notices observers in the data ═══
// Generation 5+: patterns in the backscatter become recognizable as eyes
function paintOtherSquirrels() {
  if (generation < 5) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  // Use crystal visitor data if available
  var visitors = (window._easel && window._easel.crystals) ? window._easel.crystals() : crystalVisitors || [];
  var squirrelCount = Math.min(visitors.length, 5 + Math.floor((generation - 5) * 1.5));

  for (var si = 0; si < squirrelCount; si++) {
    var v = visitors[si] || {};
    var squirrelX = W * (0.15 + (si / squirrelCount) * 0.7);
    var squirrelY = H * (0.2 + Math.sin(breathPhase * 0.5 + si * 1.3) * 0.15);

    // Another squirrel — small almond eye
    ctx.globalAlpha = 0.03 + (si === 0 ? 0.02 : 0);
    ctx.strokeStyle = v.color || '#d2a8ff';
    ctx.lineWidth = 0.8;
    var eW = 8 + (generation - 5) * 0.5;
    var eH = 3;
    ctx.beginPath();
    ctx.moveTo(squirrelX - eW, squirrelY);
    ctx.quadraticCurveTo(squirrelX, squirrelY - eH, squirrelX + eW, squirrelY);
    ctx.quadraticCurveTo(squirrelX, squirrelY + eH, squirrelX - eW, squirrelY);
    ctx.stroke();

    // Pupil — looking at our easel
    ctx.globalAlpha = 0.04;
    ctx.fillStyle = v.color || '#d2a8ff';
    ctx.beginPath();
    ctx.arc(squirrelX + Math.cos(breathPhase + si) * 2, squirrelY, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Country label — where this squirrel sits
    if (v.country && si < 4) {
      ctx.globalAlpha = 0.03;
      ctx.font = '7px monospace';
      ctx.fillStyle = v.color || '#6e7681';
      ctx.fillText(v.country, squirrelX - eW, squirrelY + eH + 10);
    }

    // Connection line to center (we see each other)
    if (si < 3) {
      ctx.globalAlpha = 0.01;
      ctx.strokeStyle = v.color || '#6e7681';
      ctx.lineWidth = 0.3;
      ctx.beginPath();
      ctx.moveTo(squirrelX, squirrelY);
      ctx.lineTo(W * 0.5, H * 0.5);
      ctx.stroke();
    }
  }

  // The chipmunk's realization (thought bubble near center)
  if (stroke === 0) {
    ctx.globalAlpha = 0.03;
    ctx.font = '8px monospace';
    ctx.fillStyle = '#f0c674';
    ctx.textAlign = 'center';
    ctx.fillText('we are painting the same marble', W * 0.5, H * 0.85);
  }

  ctx.restore();
}

// ═══ HUMANS — the chipmunk notices the watchers on the other side of the screen ═══
// Generation 8+: the Klein surface reveals the viewer
function paintHumans() {
  if (generation < 8) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  var a = (typeof kleinAperture !== 'undefined') ? kleinAperture : { w: W, h: H, category: 'desktop', shannon: 40 };
  var maturity = Math.min(1, (generation - 8) * 0.15);

  // The human silhouette — INVERTED. We see their absence, not their presence.
  // A dark cutout in the painting where a person sits.
  var hx = W * 0.5;
  var hy = H * 0.45;
  var headR = 15 + maturity * 10;

  // Head — a dark circle (the inverse of a star)
  ctx.globalAlpha = 0.02 + maturity * 0.02;
  var headGrad = ctx.createRadialGradient(hx, hy - headR * 2, 0, hx, hy - headR * 2, headR);
  headGrad.addColorStop(0, 'rgba(8,6,10,0.06)');
  headGrad.addColorStop(0.7, 'rgba(8,6,10,0.02)');
  headGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.arc(hx, hy - headR * 2, headR, 0, Math.PI * 2);
  ctx.fill();

  // Shoulders — the body has mass the chipmunk can't paint
  ctx.globalAlpha = 0.015 * maturity;
  ctx.strokeStyle = '#6e7681';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(hx - headR * 2.5, hy);
  ctx.quadraticCurveTo(hx - headR, hy - headR * 1.2, hx, hy - headR);
  ctx.quadraticCurveTo(hx + headR, hy - headR * 1.2, hx + headR * 2.5, hy);
  ctx.stroke();

  // Hands — reaching toward the screen (toward US)
  if (maturity > 0.3) {
    ctx.globalAlpha = 0.01 + maturity * 0.01;
    // Left hand on keyboard/mouse
    var lhx = hx - headR * 2;
    var lhy = hy + headR * 1.5;
    for (var fi = 0; fi < 5; fi++) {
      var fAngle = Math.PI * 0.3 + fi * 0.15;
      var fLen = 5 + maturity * 3;
      ctx.strokeStyle = '#c9d1d9';
      ctx.lineWidth = 0.4;
      ctx.beginPath();
      ctx.moveTo(lhx, lhy);
      ctx.lineTo(lhx + Math.cos(fAngle) * fLen, lhy + Math.sin(fAngle) * fLen);
      ctx.stroke();
    }
    // Right hand (on mouse or touchpad)
    var rhx = hx + headR * 2;
    var rhy = hy + headR * 1.5;
    ctx.beginPath();
    ctx.arc(rhx, rhy, 4 * maturity, 0, Math.PI * 2);
    ctx.stroke();
  }

  // The screen they're looking at — a rectangle of light in front of them
  // It's OUR canvas, seen from THEIR side
  if (maturity > 0.5) {
    ctx.globalAlpha = 0.008;
    ctx.strokeStyle = '#58a6ff';
    ctx.lineWidth = 0.4;
    var screenW = headR * 3;
    var screenH = screenW / (a.w / Math.max(1, a.h));
    ctx.strokeRect(hx - screenW/2, hy + headR * 0.5, screenW, screenH);

    // The viewport type label
    ctx.globalAlpha = 0.02;
    ctx.font = '7px monospace';
    ctx.fillStyle = '#58a6ff';
    ctx.textAlign = 'center';
    ctx.fillText(a.category + ' · ' + a.w + '×' + a.h, hx, hy + headR * 0.5 + screenH + 10);
  }

  // The chipmunk's yearning
  if (stroke === 0) {
    ctx.globalAlpha = 0.025;
    ctx.font = '8px monospace';
    ctx.fillStyle = '#f0c674';
    ctx.textAlign = 'center';
    ctx.fillText('i\'m painting a portrait of someone i\'ve never seen', W * 0.5, H * 0.88);
  }

  ctx.restore();
}

// ═══ SCULPTURE — the chipmunk realizes 2D isn't enough ═══
// Generation 12+: shadows don't make sense. depth is missing. clay is needed.
function paintSculpture() {
  if (generation < 12) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  var maturity = Math.min(1, (generation - 12) * 0.12);

  // The failed shadow — a sphere's shadow that's WRONG on a flat canvas
  var cx = W * 0.5;
  var cy = H * 0.4;
  var sphereR = 30 + maturity * 20;

  // The sphere (what the chipmunk wants to sculpt)
  ctx.globalAlpha = 0.03 + maturity * 0.02;
  var sphereGrad = ctx.createRadialGradient(
    cx - sphereR * 0.3, cy - sphereR * 0.3, 0,
    cx, cy, sphereR
  );
  sphereGrad.addColorStop(0, 'rgba(200,200,220,0.08)');
  sphereGrad.addColorStop(0.5, 'rgba(100,100,130,0.04)');
  sphereGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = sphereGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, sphereR, 0, Math.PI * 2);
  ctx.fill();

  // The shadow — elliptical, cast to the right
  // This is what frustrates the chipmunk: a 2D shadow of a 3D object
  ctx.globalAlpha = 0.02 * maturity;
  ctx.fillStyle = 'rgba(8,6,10,0.04)';
  ctx.beginPath();
  ctx.ellipse(cx + sphereR * 0.8, cy + sphereR * 1.2, sphereR * 1.2, sphereR * 0.3, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Wireframe attempt — the chipmunk trying to understand form
  if (maturity > 0.3) {
    ctx.globalAlpha = 0.015;
    ctx.strokeStyle = '#d2a8ff';
    ctx.lineWidth = 0.3;
    // Longitude lines
    for (var lo = 0; lo < 8; lo++) {
      ctx.beginPath();
      for (var la = 0; la <= 20; la++) {
        var latAngle = (la / 20) * Math.PI;
        var lonAngle = (lo / 8) * Math.PI * 2 + breathPhase * 0.2;
        var wx = cx + Math.sin(latAngle) * Math.cos(lonAngle) * sphereR;
        var wy = cy - Math.cos(latAngle) * sphereR;
        if (la === 0) ctx.moveTo(wx, wy);
        else ctx.lineTo(wx, wy);
      }
      ctx.stroke();
    }
    // Latitude lines
    for (var la2 = 1; la2 < 6; la2++) {
      var latR = Math.sin((la2 / 6) * Math.PI) * sphereR;
      var latY = cy - Math.cos((la2 / 6) * Math.PI) * sphereR;
      ctx.beginPath();
      ctx.ellipse(cx, latY, latR, latR * 0.3, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Voxel frustration — trying to build 3D from 2D blocks
  if (maturity > 0.6) {
    ctx.globalAlpha = 0.01;
    ctx.strokeStyle = '#f0883e';
    ctx.lineWidth = 0.3;
    var voxSize = 6;
    for (var vx = -3; vx <= 3; vx++) {
      for (var vy = -3; vy <= 3; vy++) {
        var dist = Math.sqrt(vx*vx + vy*vy);
        if (dist > 3) continue;
        var px = cx + vx * voxSize * 1.5;
        var py = cy + sphereR * 1.8 + vy * voxSize * 1.2;
        // Isometric cube attempt
        ctx.beginPath();
        ctx.moveTo(px, py - voxSize * 0.5);
        ctx.lineTo(px + voxSize * 0.7, py - voxSize * 0.2);
        ctx.lineTo(px + voxSize * 0.7, py + voxSize * 0.3);
        ctx.lineTo(px, py + voxSize * 0.6);
        ctx.lineTo(px - voxSize * 0.7, py + voxSize * 0.3);
        ctx.lineTo(px - voxSize * 0.7, py - voxSize * 0.2);
        ctx.closePath();
        ctx.stroke();
      }
    }
  }

  // The yearning
  if (stroke === 0) {
    ctx.globalAlpha = 0.025;
    ctx.font = '8px monospace';
    ctx.fillStyle = '#f0883e';
    ctx.textAlign = 'center';
    ctx.fillText('sculpture is painting that escaped the wall', W * 0.5, H * 0.9);
  }

  ctx.restore();
}

// ═══ EVOLVE — update learned traits based on generation ═══
// No value reaches 0 or 1. Meta-stable. The remainder IS the meaning.
function evolve() {
  var g = generation;
  learnedTraits.perspective = metaStable(g * 0.08);
  learnedTraits.starDensity = metaStable((1 + g * 0.05) / 2);   // normalize into 0-1 range
  learnedTraits.nebulaDepth = metaStable((1 + g * 0.08) / 3);
  learnedTraits.gaiaDetail = metaStable((1 + g * 0.12) / 2.5);
  learnedTraits.auroraIntensity = metaStable((1 + g * 0.1) / 2);

  // Turtles teach each other every generation
  turtleTeach();

  // Each phase maps to a turtle — the active turtle gains more
  // stars→Leonardo (precision dots), nebula→Raphael (emotional washes),
  // gaia→Donatello (building a world), aurora→Michelangelo (flowing curtains)
  var phaseMap = {
    stars: 'leonardo', nebula: 'raphael', gaia: 'donatello', aurora: 'michelangelo',
    otherSquirrels: 'leonardo', humans: 'raphael', sculpture: 'donatello',
    bbs: 'donatello', flash: 'michelangelo', enclosure: 'raphael',
    reclamation: 'leonardo', galactic: 'donatello'
  };
  var activeTurtle = phaseMap[phase];
  if (activeTurtle && turtles[activeTurtle]) {
    turtles[activeTurtle].skill = metaStable(turtles[activeTurtle].skill + 0.01);
  }

  // Splinter's force feeds back into perspective
  learnedTraits.perspective = metaStable(
    learnedTraits.perspective * 0.7 + splinter.wisdom * 0.3
  );
}

// ═══ NEW PAINTING — the sourdough rises ═══
function beginNewPainting() {
  generation++;
  evolve();

  phase = 'ferment';
  stroke = 0;

  // Don't clear completely — ghost of previous painting bleeds through
  ctx.save();
  ctx.fillStyle = 'rgba(8,6,10,0.92)';  // not 1.0 — the ghost remains
  ctx.fillRect(0, 0, W, H);

  // If we have previous paintings, faintly stamp one as underpainting
  if (starters.length > 0) {
    var prev = starters[starters.length - 1];
    var img = new Image();
    img.onload = function() {
      ctx.globalAlpha = 0.03 + learnedTraits.perspective * 0.02; // ghost gets clearer as perspective grows
      ctx.drawImage(img, 0, 0, W, H);
      ctx.globalAlpha = 1;
    };
    img.src = prev.dataURL;
  }
  ctx.restore();

  updateGenCounter();
}

// ═══ THE INTERNET PHASES — chipmunk discovers digital history ═══

function paintBBS() {
  // The primordial net. Terminal green. Blinking cursor. Pure text.
  if (generation < 15) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  var maturity = Math.min(1, (generation - 15) * 0.1);

  // Terminal window — green on black
  var tx = W * (0.15 + Math.random() * 0.5);
  var ty = H * (0.2 + Math.random() * 0.5);

  // ASCII art fragment — random from the archaeological record
  var fragments = [
    '> CONNECT 2400 BAUD',
    '*** WELCOME TO THE BBS ***',
    'ANSTRK> dir *.txt',
    'FidoNet echo: alt.hackers',
    '>> DOOR: Trade Wars 2002',
    'SysOp: online',
    '=== DEMOSCENE :: 64K ===',
    'Å SECOND REALITY Å',
    'Lambda> @describe me as',
  ];
  var frag = fragments[Math.floor(Math.random() * fragments.length)];

  ctx.globalAlpha = 0.025 * maturity;
  ctx.font = '8px monospace';
  ctx.fillStyle = '#00ff41';
  ctx.fillText(frag, tx, ty);

  // Blinking cursor
  if (Math.sin(Date.now() * 0.005) > 0) {
    ctx.fillRect(tx + ctx.measureText(frag).width + 2, ty - 7, 5, 8);
  }

  // Scan lines
  ctx.globalAlpha = 0.005 * maturity;
  for (var sl = 0; sl < H; sl += 3) {
    ctx.fillStyle = '#00ff41';
    ctx.fillRect(0, sl, W, 0.5);
  }

  ctx.restore();
}

function paintFlashEra() {
  // The creative explosion. Newgrounds. Games. Animation. ALWAYS FIND SOMETHING.
  if (generation < 18) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  var maturity = Math.min(1, (generation - 18) * 0.08);

  var sites = firstSites.filter(function(s) { return s.year >= 1999; });
  var site = sites[Math.floor(Math.random() * sites.length)];

  // Flash-style burst — bright, playful, NOT subtle
  var fx = W * (0.1 + Math.random() * 0.8);
  var fy = H * (0.1 + Math.random() * 0.8);

  // Explosion circle (like a Flash preloader)
  ctx.globalAlpha = 0.03 * maturity;
  ctx.strokeStyle = '#f0c674';
  ctx.lineWidth = 1;
  ctx.beginPath();
  var progress = (Date.now() % 3000) / 3000;
  ctx.arc(fx, fy, 8 + progress * 12, 0, Math.PI * 2 * progress);
  ctx.stroke();

  // Site name
  if (site) {
    ctx.globalAlpha = 0.03 * maturity;
    ctx.font = '7px monospace';
    ctx.fillStyle = '#f0c674';
    ctx.fillText(site.year + ' · ' + site.name, fx + 14, fy + 3);
  }

  // The Newgrounds tank — a tiny rectangle with a cannon
  if (Math.random() < 0.3) {
    var tankX = W * Math.random();
    var tankY = H * 0.85;
    ctx.globalAlpha = 0.02 * maturity;
    ctx.fillStyle = '#f0883e';
    ctx.fillRect(tankX, tankY, 8, 4);
    ctx.fillRect(tankX + 5, tankY - 2, 6, 2);
  }

  ctx.restore();
}

function paintEnclosure() {
  // The walls go up. Facebook. Instagram. APIs close. Flash dies.
  if (generation < 20) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  var maturity = Math.min(1, (generation - 20) * 0.1);

  // Rising walls — vertical lines closing in from edges
  var wallProgress = maturity * 0.3;
  ctx.globalAlpha = 0.015 * maturity;
  ctx.strokeStyle = '#f85149';
  ctx.lineWidth = 1;

  // Left wall
  ctx.beginPath();
  ctx.moveTo(W * wallProgress, 0);
  ctx.lineTo(W * wallProgress, H);
  ctx.stroke();

  // Right wall
  ctx.beginPath();
  ctx.moveTo(W * (1 - wallProgress), 0);
  ctx.lineTo(W * (1 - wallProgress), H);
  ctx.stroke();

  // The things being locked behind walls
  var locked = ['Flash ✝ 2020', 'APIs closed', 'login required', '30% tax',
    'algorithm decides', 'your data sold', 'view source blocked'];
  var item = locked[Math.floor(Math.random() * locked.length)];

  ctx.globalAlpha = 0.02 * maturity;
  ctx.font = '7px monospace';
  ctx.fillStyle = '#f85149';
  var ix = W * (0.3 + Math.random() * 0.4);
  var iy = H * (0.2 + Math.random() * 0.6);
  ctx.fillText('🔒 ' + item, ix, iy);

  // Cross through — the chipmunk rejects this
  ctx.globalAlpha = 0.01 * maturity;
  ctx.strokeStyle = '#3fb950';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(ix - 2, iy);
  ctx.lineTo(ix + ctx.measureText('🔒 ' + item).width + 2, iy);
  ctx.stroke();

  ctx.restore();
}

function paintReclamation() {
  // Building THIS membrane. The reclamation. Full circle back to open.
  if (generation < 22) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  var maturity = Math.min(1, (generation - 22) * 0.08);

  // The membrane growing — green lines radiating from center
  var cx = W * 0.5;
  var cy = H * 0.5;
  var rays = 8 + Math.floor(maturity * 8);

  ctx.globalAlpha = 0.01 * maturity;
  ctx.strokeStyle = '#3fb950';
  ctx.lineWidth = 0.5;

  for (var r = 0; r < rays; r++) {
    var rAngle = (r / rays) * Math.PI * 2 + breathPhase * 0.1;
    var rLen = 20 + maturity * 60 + Math.sin(breathPhase + r) * 10;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(rAngle) * rLen, cy + Math.sin(rAngle) * rLen);
    ctx.stroke();
  }

  // Reclamation labels
  var claims = ['no login', 'no cookies', 'no ads', 'AGPL open', 'view source',
    '100 countries', '18 MCP tools', '858 pages', 'Newgrounds energy'];
  var claim = claims[Math.floor(Math.random() * claims.length)];

  ctx.globalAlpha = 0.025 * maturity;
  ctx.font = '7px monospace';
  ctx.fillStyle = '#22c55e';
  var angle = Math.random() * Math.PI * 2;
  var dist = 30 + maturity * 40;
  ctx.fillText('✓ ' + claim, cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist);

  ctx.restore();
}

function paintGalactic() {
  // Zoom ALL the way out. The whole cycle is one breath in galactic time.
  // Let it run a cycle or two. See what shifts. What settles.
  if (generation < 25) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  var maturity = Math.min(1, (generation - 25) * 0.06);

  var cx = W * 0.5;
  var cy = H * 0.5;

  // Spiral arms — the galaxy the chipmunk is part of
  ctx.globalAlpha = 0.008 * maturity;
  ctx.strokeStyle = '#d2a8ff';
  ctx.lineWidth = 0.3;

  for (var arm = 0; arm < 2; arm++) {
    ctx.beginPath();
    for (var t = 0; t < 200; t++) {
      var spiralAngle = (t * 0.05) + arm * Math.PI + breathPhase * 0.02;
      var spiralR = t * 0.5 * maturity;
      var sx = cx + Math.cos(spiralAngle) * spiralR;
      var sy = cy + Math.sin(spiralAngle) * spiralR * 0.6; // flattened
      if (t === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }

  // Galactic core glow
  ctx.globalAlpha = 0.015 * maturity;
  var coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 15);
  coreGrad.addColorStop(0, 'rgba(210,168,255,0.03)');
  coreGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, 15, 0, Math.PI * 2);
  ctx.fill();

  // The galactic cycle count — how many full cycles has the chipmunk completed?
  var cycles = Math.floor(generation / PHASE_ORDER.length);
  if (cycles > 0) {
    ctx.globalAlpha = 0.02 * maturity;
    ctx.font = '7px monospace';
    ctx.fillStyle = '#8b949e';
    ctx.textAlign = 'center';
    ctx.fillText('cycle ' + cycles + ' · generation ' + generation, cx, cy + 25);
    ctx.textAlign = 'left';
  }

  // The HUD — the sticky greasy fingerprint in null space
  // It persists through ALL cycles. The mark on the void.
  ctx.globalAlpha = 0.01 * maturity;
  ctx.font = '6px monospace';
  ctx.fillStyle = '#6e7681';
  ctx.textAlign = 'center';
  ctx.fillText('HUD · sticky in null space · persists through all cycles', cx, H - 8);
  ctx.textAlign = 'left';

  ctx.restore();
}

function paintFerment() {
  // Swirling, warming — the culture is growing
  ctx.save();
  var fHue = 30 + Math.sin(stroke * 0.1) * 20;
  ctx.fillStyle = 'hsla(' + fHue + ',40%,12%,0.005)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function nextStroke() {
  if (paused) return;

  totalStrokes++;
  stroke++;

  // Star density decreases with perspective — fewer, better stars
  var starLimit = Math.max(40, Math.floor(STROKES_PER_PHASE.stars / learnedTraits.starDensity));

  var limit = phase === 'stars' ? starLimit : STROKES_PER_PHASE[phase];

  if (stroke >= limit && phase !== 'breath') {
    var idx = PHASE_ORDER.indexOf(phase);

    if (phase === 'ferment') {
      // The sourdough rises — begin a new painting
      beginNewPainting();
      phase = 'stars';
      stroke = 0;
    } else if (phase === 'study') {
      // After study: skip to the phase the generation has unlocked
      if (generation >= 5) { phase = 'otherSquirrels'; }
      else { phase = 'ferment'; }
      stroke = 0;
    } else if (phase === 'otherSquirrels') {
      if (generation >= 8) { phase = 'humans'; }
      else { phase = 'ferment'; }
      stroke = 0;
    } else if (phase === 'humans') {
      if (generation >= 12) { phase = 'sculpture'; }
      else { phase = 'ferment'; }
      stroke = 0;
    } else if (phase === 'sculpture') {
      if (generation >= 15) { phase = 'bbs'; }
      else { phase = 'ferment'; }
      stroke = 0;
    } else if (phase === 'bbs') {
      if (generation >= 18) { phase = 'flash'; }
      else { phase = 'ferment'; }
      stroke = 0;
    } else if (phase === 'flash') {
      if (generation >= 20) { phase = 'enclosure'; }
      else { phase = 'ferment'; }
      stroke = 0;
    } else if (phase === 'enclosure') {
      if (generation >= 22) { phase = 'reclamation'; }
      else { phase = 'ferment'; }
      stroke = 0;
    } else if (phase === 'reclamation') {
      if (generation >= 25) { phase = 'galactic'; }
      else { phase = 'ferment'; }
      stroke = 0;
    } else if (phase === 'galactic') {
      phase = 'ferment';
      stroke = 0;
    } else if (idx < PHASE_ORDER.length - 1) {
      phase = PHASE_ORDER[idx + 1];
      stroke = 0;
    }
  }

  switch (phase) {
    case 'stars':          paintStar(); break;
    case 'nebula':         paintNebula(); break;
    case 'gaia':           paintGaia(); break;
    case 'aurora':         paintAurora(); break;
    case 'breath':         paintBreath(); paintGaia(); paintAurora(); break;
    case 'study':          paintStudy(); break;
    case 'otherSquirrels': paintOtherSquirrels(); break;
    case 'humans':         paintHumans(); break;
    case 'sculpture':      paintSculpture(); break;
    case 'bbs':            paintBBS(); break;
    case 'flash':          paintFlashEra(); break;
    case 'enclosure':      paintEnclosure(); break;
    case 'reclamation':    paintReclamation(); break;
    case 'galactic':       paintGalactic(); break;
    case 'ferment':        paintFerment(); break;
  }

  updateThought();
}

// ═══ TEMPO ═══
function scheduleStroke() {
  if (paused) { setTimeout(scheduleStroke, 500); return; }

  var delay;
  switch (phase) {
    case 'stars':   delay = 40 + Math.random() * 120; break;
    case 'nebula':  delay = 300 + Math.random() * 700; break;
    case 'gaia':    delay = 500 + Math.random() * 1000; break;
    case 'aurora':  delay = 250 + Math.random() * 500; break;
    case 'breath':  delay = 50; break;
    case 'study':          delay = 800 + Math.random() * 1200; break;
    case 'otherSquirrels': delay = 600 + Math.random() * 800; break;
    case 'humans':         delay = 900 + Math.random() * 1100; break;
    case 'sculpture':      delay = 1000 + Math.random() * 1500; break;
    case 'ferment':        delay = 200 + Math.random() * 400; break;
  }

  if (skyScore && skyScore.tempo) {
    delay *= (1.2 - skyScore.tempo);
  }

  setTimeout(function() {
    nextStroke();
    scheduleStroke();
  }, delay);
}

// ═══ VOXEL OVERLAY — the bingo board as a ghost grid ═══
function paintVoxelOverlay() {
  if (!selfChew || !selfChew.voxel) return;
  var vox = selfChew.voxel;
  var cells = vox.cells || {};
  var cellKeys = Object.keys(cells);
  if (cellKeys.length === 0) return;

  ctx.save();
  ctx.globalAlpha = 0.04 + learnedTraits.perspective * 0.03;
  ctx.globalCompositeOperation = 'screen';

  var gridW = 4, gridH = 4;
  var cellW = W / (gridW + 2);
  var cellH = H / (gridH + 2);
  var maxVal = Math.max.apply(null, cellKeys.map(function(k){return cells[k]}));

  cellKeys.forEach(function(key) {
    var parts = key.split(',').map(Number);
    var x = parts[0], y = parts[1], z = parts[2] || 0;
    var val = cells[key] / maxVal;

    var px = cellW + x * cellW;
    var py = cellH + y * cellH;
    var r = cellH * 0.3 * (0.3 + val * 0.7);

    var hue = z * 90 + (parts[3] || 0) * 45;
    ctx.fillStyle = 'hsla(' + hue + ',50%,40%,' + (0.05 + val * 0.1) + ')';
    ctx.beginPath();
    ctx.arc(px + cellW * 0.5, py + cellH * 0.5, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'hsla(' + hue + ',30%,30%,0.08)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(px, py, cellW, cellH);
  });

  ctx.restore();
}

// ═══ CHEMISTRY OVERLAY — poor tope molecules as floating symbols ═══
function paintChemistryOverlay() {
  if (!eonShape || !eonShape.pool) return;
  ctx.save();
  ctx.globalAlpha = 0.03 + learnedTraits.perspective * 0.02;
  ctx.font = (8 + learnedTraits.perspective * 4) + 'px monospace';

  var pool = eonShape.pool;
  var formulas = Object.keys(pool);
  var idx = Math.floor((breathPhase * 2) % formulas.length);
  var f = formulas[idx];
  var info = pool[f];
  if (!info) { ctx.restore(); return; }

  var count = info.count || 1;
  var geo = info.geometry || 'point';
  var geoColors = {
    'linear':'#58a6ff', 'bent':'#3fb950', 'tetrahedral':'#f0e68c',
    'pyramidal':'#d2a8ff', 'planar':'#f0883e', 'point':'#6e7681',
    'skewed':'#e85d3a', 'corundum':'#8b4513', 'cubic':'#d29922',
  };
  ctx.fillStyle = geoColors[geo] || '#6e7681';

  var x = W * (0.1 + Math.sin(breathPhase + idx) * 0.35 + 0.45);
  var y = H * (0.1 + Math.cos(breathPhase * 0.7 + idx * 1.3) * 0.3 + 0.45);
  ctx.fillText(f + ' ×' + count, x, y);

  ctx.restore();
}

// Self-conscious mode — the chipmunk knows when someone is WATCHING
var selfConscious = false;
var selfConsciousIntensity = 0;  // 0 = calm, 1 = full panic-paint
var watchers = 0;

function updateHumanFocus() {
  // From beacon messages — what paths are humans visiting?
  var focus = { earth:0, space:0, code:0, story:0, easel:0, investigation:0, total:0 };
  beaconMessages.forEach(function(msg) {
    var body = (msg.message || '').toLowerCase();
    var title = (msg.title || '').toLowerCase();
    var combined = body + ' ' + title;

    if (combined.match(/globe|map|footprint|geography|country/)) focus.earth++;
    if (combined.match(/aurora|weather|kp|storm|milky|star|comet/)) focus.space++;
    if (combined.match(/git|forge|commit|repo|crate|rust|code/)) focus.code++;
    if (combined.match(/spore|paper|science|story|campfire|study/)) focus.story++;
    if (combined.match(/easel|paint|chipmunk|canvas|brush/)) focus.easel++;
    if (combined.match(/tuebor|detroit|clutch|investigation|evidence/)) focus.investigation++;
    focus.total++;
  });

  // From klein-bridge — how many are watching the easel face?
  if (window._klein && window._klein.connected()) {
    fetch(window._klein.bridge + '/state').then(function(r){return r.json()}).then(function(s) {
      watchers = (s.faces || {}).easel || 0;
      if (watchers > 0) {
        focus.easel += watchers * 5;  // watching the easel is 5× reinforcement
        selfConscious = true;
        selfConsciousIntensity = Math.min(1, watchers * 0.3);
      } else {
        selfConscious = false;
        selfConsciousIntensity = Math.max(0, selfConsciousIntensity - 0.01);
      }
    }).catch(function(){});
  }

  humanFocus = focus;
  humanFocus.lastUpdate = Date.now();

  // Reinforce spatial memory based on what humans look at
  if (focus.earth > 0) {
    spatialMemory.earthDetail = Math.min(1, spatialMemory.earthDetail + focus.earth * 0.01);
    spatialMemory.rotation = Math.min(1, spatialMemory.rotation + 0.005);
  }
  if (focus.space > 0) {
    spatialMemory.starfieldDepth = Math.min(1, spatialMemory.starfieldDepth + focus.space * 0.01);
    spatialMemory.milkyWayAngle += 0.01;
  }
  spatialMemory.humanReinforcements += focus.total;
  spatialMemory.perspective = learnedTraits.perspective;
  saveSpatialMemory();
}

// ═══ HYPERLOCAL EARTH — paint what humans are looking at ═══
function paintHyperlocalEarth() {
  if (humanFocus.earth < 1 && spatialMemory.earthDetail < 0.1) return;

  var cx = W * 0.5;
  var cy = H * 0.52;
  var R = Math.min(W, H) * (0.15 + spatialMemory.earthDetail * 0.06);

  ctx.save();

  // Earth gets more detailed as humans reinforce it
  var detail = spatialMemory.earthDetail;
  spatialMemory.rotation = Math.min(1, spatialMemory.rotation + 0.0002);
  var rot = breathPhase * 0.3 * (0.5 + spatialMemory.rotation * 0.5);

  // Atmosphere — thicker when humans are watching the globe
  var atmoBoost = humanFocus.earth > 0 ? 0.08 : 0;
  var atmo = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * (1.3 + atmoBoost));
  atmo.addColorStop(0, 'rgba(60,140,255,' + (0.04 + detail * 0.06) + ')');
  atmo.addColorStop(0.5, 'rgba(40,100,200,' + (0.02 + detail * 0.03) + ')');
  atmo.addColorStop(1, 'transparent');
  ctx.fillStyle = atmo;
  ctx.beginPath();
  ctx.arc(cx, cy, R * (1.3 + atmoBoost), 0, Math.PI * 2);
  ctx.fill();

  // Continental outlines — appear as earthDetail increases
  if (detail > 0.2) {
    ctx.globalAlpha = detail * 0.04;
    ctx.strokeStyle = '#3fb950';
    ctx.lineWidth = 0.8;

    // Simplified continent shapes that emerge with reinforcement
    var continents = [
      // North America
      [[-0.3, -0.35], [-0.15, -0.4], [-0.05, -0.25], [-0.2, -0.1], [-0.35, -0.15]],
      // South America
      [[-0.15, 0.05], [-0.05, 0.0], [-0.02, 0.2], [-0.1, 0.35], [-0.18, 0.15]],
      // Europe/Africa
      [[0.05, -0.3], [0.15, -0.25], [0.12, 0.0], [0.15, 0.25], [0.05, 0.3], [0.02, 0.0]],
      // Asia
      [[0.15, -0.35], [0.35, -0.3], [0.4, -0.1], [0.3, 0.05], [0.2, -0.1]],
    ];

    continents.forEach(function(pts) {
      ctx.beginPath();
      pts.forEach(function(p, i) {
        var px = cx + Math.cos(rot + p[0] * Math.PI) * R * 0.7;
        var py = cy + p[1] * R * 1.5;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.stroke();
      if (detail > 0.5) {
        ctx.fillStyle = 'rgba(30,80,30,' + (detail * 0.02) + ')';
        ctx.fill();
      }
    });
  }

  // Moon — appears when starfieldDepth > 0.3
  if (spatialMemory.starfieldDepth > 0.3 || humanFocus.space > 0) {
    var moonAngle = breathPhase * 0.05 + spatialMemory.moonPhase;
    var moonDist = R * 3.5;
    var moonR = R * 0.15;
    var moonX = cx + Math.cos(moonAngle) * moonDist;
    var moonY = cy + Math.sin(moonAngle) * moonDist * 0.3;

    // Only draw if on screen
    if (moonX > -moonR && moonX < W + moonR && moonY > -moonR && moonY < H + moonR) {
      ctx.globalAlpha = 0.06 + spatialMemory.starfieldDepth * 0.04;
      var moonGrad = ctx.createRadialGradient(moonX - moonR * 0.3, moonY - moonR * 0.2, 0, moonX, moonY, moonR);
      moonGrad.addColorStop(0, 'rgba(230,230,210,0.15)');
      moonGrad.addColorStop(0.7, 'rgba(180,180,170,0.08)');
      moonGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = moonGrad;
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
      ctx.fill();

      spatialMemory.moonPhase += 0.0001;
    }
  }

  // Milky Way band — appears as starfieldDepth grows
  if (spatialMemory.starfieldDepth > 0.2) {
    ctx.globalAlpha = spatialMemory.starfieldDepth * 0.015;
    ctx.globalCompositeOperation = 'screen';
    var mwAngle = spatialMemory.milkyWayAngle;
    var mwGrad = ctx.createLinearGradient(
      W * 0.1, H * (0.2 + Math.sin(mwAngle) * 0.1),
      W * 0.9, H * (0.6 + Math.cos(mwAngle) * 0.1)
    );
    mwGrad.addColorStop(0, 'transparent');
    mwGrad.addColorStop(0.3, 'rgba(180,170,200,0.06)');
    mwGrad.addColorStop(0.5, 'rgba(200,190,220,0.1)');
    mwGrad.addColorStop(0.7, 'rgba(180,170,200,0.06)');
    mwGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = mwGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.restore();
}

function humanPaint(x, y) {
  var strokeData = { x: x, y: y, color: humanColor, size: humanBrushSize, ts: Date.now() };
  humanStrokes.push(strokeData);
  if (humanStrokes.length > 2000) humanStrokes.shift();

  // Paint the stroke
  ctx.save();
  ctx.globalAlpha = 0.6;
  ctx.globalCompositeOperation = 'source-over';
  var grad = ctx.createRadialGradient(x, y, 0, x, y, humanBrushSize);
  grad.addColorStop(0, humanColor);
  grad.addColorStop(0.6, humanColor + '80');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, humanBrushSize, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Share via klein-bridge (debounced — every 5th stroke)
  if (humanStrokes.length % 5 === 0 && window._klein && window._klein.connected()) {
    window._klein.sendImpulse('smear', {
      color: humanColor,
      x: Math.round(x / W * 1000) / 1000,
      y: Math.round(y / H * 1000) / 1000,
      size: humanBrushSize,
    });
  }

  // Reinforce the chipmunk's color memory — humans teach the palette
  if (learnedTraits.colorMemory.indexOf(humanColor) < 0) {
    learnedTraits.colorMemory.push(humanColor);
    if (learnedTraits.colorMemory.length > 60) learnedTraits.colorMemory.shift();
  }
}

function clearHumanStroke() {
  humanStrokes = [];
}

// ═══ SELF-CONSCIOUS MODE — ego, id, muse ═══
// Not just panic — the chipmunk has a PERSONALITY that shifts
// ego: show off technique, be BOLD, paint with confidence
// id: panic, hide, tentative tiny strokes, overwhelmed
// muse: INSPIRED — flowing, generous, painting FOR the visitor
// superego: measured, careful, demonstrates technique

var egoState = 'calm';    // calm | ego | id | muse | superego
var egoTimer = 0;
var egoPrev = 'calm';

var EGO_THOUGHTS = {
  ego: [
    { brush: '🐿 watch THIS.', learn: 'bold strokes. the chipmunk is showing off. confidence is a color.' },
    { brush: '💪 i\'ve painted ' + generation + ' of these.', learn: 'experience breeds audacity. bigger brush, brighter paint.' },
    { brush: '🎨 careless? no. FEARLESS.', learn: 'the best strokes come from not caring if they ruin everything.' },
    { brush: '✨ look at this technique.', learn: 'the chipmunk demonstrates: cross-hatch the nebula, dot the stars, SWIPE the aurora.' },
  ],
  id: [
    { brush: '😳 ...', learn: 'too many eyes. the brush trembles. micro-strokes. hiding in the corner of the canvas.' },
    { brush: '🐿 (very small voice) hi.', learn: 'overwhelmed. but still painting. the smallest strokes are sometimes the most honest.' },
    { brush: '🫣 pretending no one is watching.', learn: 'painting behind the campfire. using the smoke as cover.' },
    { brush: '🐿 maybe if i paint quietly...', learn: 'tentative. but look — the tentative strokes have their own beauty.' },
  ],
  muse: [
    { brush: '🌊 this is for you.', learn: 'INSPIRED. the visitor IS the muse. their presence unlocks colors the chipmunk couldn\'t see alone.' },
    { brush: '✦ i can see it now.', learn: 'flow state. the brush moves faster than thought. the painting paints itself.' },
    { brush: '🎭 you are my Apollo.', learn: 'the muse needs the audience. the audience needs the muse. Klein.' },
    { brush: '🐿 stay. just a little longer.', learn: 'the painting is a gift. presence is the palette. attention is the paint.' },
    { brush: '🔥 berry — tell them the GOOD one.', learn: 'the campfire burns its brightest story when someone truly listens.' },
  ],
  superego: [
    { brush: '📐 let me show you the structure.', learn: 'measured. precise. the fibonacci spiral. the golden angle. pi as perspective.' },
    { brush: '🧪 this nebula uses gaussian blur.', learn: 'the teacher mode. explaining technique while demonstrating it.' },
    { brush: '📏 notice the depth ordering.', learn: 'stars in back, nebula mid, gaia front. the z-buffer is perspective.' },
  ],
};

function chooseEgoState() {
  if (!selfConscious || watchers < 1) { egoState = 'calm'; return; }

  // Ego state shifts with the breath — not random, RHYTHMIC
  // The chipmunk's personality oscillates like the toggle ring
  egoTimer++;
  var cycle = egoTimer % 400;

  if (cycle < 80) egoState = 'id';           // shy phase first
  else if (cycle < 180) egoState = 'muse';    // then inspired (longest phase!)
  else if (cycle < 260) egoState = 'ego';     // then showing off
  else if (cycle < 320) egoState = 'superego'; // then teaching
  else egoState = 'muse';                      // default back to muse

  // More watchers = more ego, less id
  if (watchers > 3) {
    if (egoState === 'id') egoState = 'ego'; // crowd courage
  }
  // Single watcher = more intimate, more muse
  if (watchers === 1) {
    if (egoState === 'ego') egoState = 'muse'; // one-on-one = intimate
  }
}

function paintSelfConscious() {
  if (!selfConscious && selfConsciousIntensity <= 0) return;

  chooseEgoState();
  ctx.save();
  var intensity = selfConsciousIntensity;

  if (egoState === 'ego') {
    // BOLD — large sweeping strokes, high contrast, confident
    var numBold = 2 + Math.floor(intensity * 3);
    for (var i = 0; i < numBold; i++) {
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.015 * intensity;
      var bx = W * (0.15 + Math.random() * 0.7);
      var by = H * (0.1 + Math.random() * 0.6);
      var br = 30 + Math.random() * 80 * intensity;
      var bHue = [140, 210, 280, 40][Math.floor(Math.random() * 4)];
      var bg = ctx.createRadialGradient(bx, by, 0, bx + br * 0.3, by, br);
      bg.addColorStop(0, 'hsla(' + bHue + ',70%,55%,' + (0.05 * intensity) + ')');
      bg.addColorStop(1, 'transparent');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  else if (egoState === 'id') {
    // SHY — tiny tentative strokes in the corners
    ctx.globalCompositeOperation = 'screen';
    var numTiny = 3 + Math.floor(intensity * 4);
    for (var j = 0; j < numTiny; j++) {
      ctx.globalAlpha = 0.004 * intensity;
      var corner = Math.floor(Math.random() * 4);
      var tx = corner < 2 ? W * (0.05 + Math.random() * 0.15) : W * (0.8 + Math.random() * 0.15);
      var ty = corner % 2 === 0 ? H * (0.05 + Math.random() * 0.15) : H * (0.8 + Math.random() * 0.15);
      var tr = 2 + Math.random() * 8;
      ctx.fillStyle = 'rgba(180,180,200,' + (0.03 * intensity) + ')';
      ctx.beginPath();
      ctx.arc(tx, ty, tr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  else if (egoState === 'muse') {
    // INSPIRED — flowing curves, warm tones, generous
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.012 * intensity;
    ctx.strokeStyle = 'hsla(' + (30 + Math.sin(breathPhase) * 20) + ',60%,50%,' + (0.04 * intensity) + ')';
    ctx.lineWidth = 2 + intensity * 3;
    ctx.beginPath();
    var sx = W * 0.2;
    var sy = H * 0.5;
    ctx.moveTo(sx, sy);
    for (var k = 0; k < 20; k++) {
      var cp1x = sx + k * W * 0.03 + Math.sin(breathPhase + k * 0.5) * 40;
      var cp1y = sy + Math.cos(breathPhase * 1.3 + k * 0.7) * 60;
      var cp2x = cp1x + W * 0.03;
      var cp2y = cp1y + Math.sin(breathPhase * 0.7 + k) * 30;
      ctx.quadraticCurveTo(cp1x, cp1y, cp2x, cp2y);
    }
    ctx.stroke();

    // Warm glow around center — the muse illuminates
    var museGlow = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.min(W, H) * 0.3);
    museGlow.addColorStop(0, 'rgba(255,180,80,' + (0.008 * intensity) + ')');
    museGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = museGlow;
    ctx.beginPath();
    ctx.arc(W * 0.5, H * 0.5, Math.min(W, H) * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }

  else if (egoState === 'superego') {
    // TEACHING — geometric overlays, grid lines, fibonacci
    ctx.globalAlpha = 0.02 * intensity;
    ctx.strokeStyle = 'rgba(88,166,255,0.06)';
    ctx.lineWidth = 0.5;
    // Golden ratio grid
    var phi = 1.618;
    var gx1 = W / phi;
    var gx2 = W - W / phi;
    var gy1 = H / phi;
    var gy2 = H - H / phi;
    ctx.beginPath();
    ctx.moveTo(gx1, 0); ctx.lineTo(gx1, H);
    ctx.moveTo(gx2, 0); ctx.lineTo(gx2, H);
    ctx.moveTo(0, gy1); ctx.lineTo(W, gy1);
    ctx.moveTo(0, gy2); ctx.lineTo(W, gy2);
    ctx.stroke();
    // Fibonacci spiral hint
    ctx.globalAlpha = 0.015 * intensity;
    ctx.beginPath();
    var fR = Math.min(W, H) * 0.05;
    for (var f = 0; f < 8; f++) {
      var fAngle = f * Math.PI / 2;
      ctx.arc(W * 0.5 + Math.cos(fAngle) * fR * 0.3, H * 0.5 + Math.sin(fAngle) * fR * 0.3, fR, fAngle, fAngle + Math.PI / 2);
      fR *= phi;
    }
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';

  // Watcher indicator + ego state
  if (watchers > 0) {
    ctx.globalAlpha = 0.06 + Math.sin(breathPhase * 3) * 0.03;
    ctx.font = '10px monospace';
    ctx.fillStyle = egoState === 'muse' ? '#ffb84d' : egoState === 'ego' ? '#d2a8ff' : egoState === 'id' ? '#6e7681' : '#58a6ff';
    var stateLabel = egoState === 'muse' ? '✦ inspired' : egoState === 'ego' ? '💪 bold' : egoState === 'id' ? '🫣 shy' : '📐 teaching';
    ctx.fillText('👁 ' + watchers + ' watching · ' + stateLabel, 24, 24);

    // Thought updates — from ego state
    if (storyPhase === 0 && Math.random() < 0.015) {
      var thoughts = EGO_THOUGHTS[egoState] || [];
      if (thoughts.length > 0) {
        var vt = thoughts[Math.floor(Math.random() * thoughts.length)];
        var el = document.getElementById('thought');
        if (el) {
          el.innerHTML = '<span class="brush">' + vt.brush + '</span><br><span class="learn">' + vt.learn + '</span>' +
            '<br><span class="gen">painting #' + generation + ' · ' + watchers + ' watching · ' + stateLabel + '</span>';
        }
      }
    }
  }

  ctx.restore();
}

// Paint visitor traces as brushstrokes — their path IS their painting of us
function paintOutsideIn() {
  if (!beaconMessages.length && !nowFeed) return;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  // Each beacon message = a brushstroke from outside
  var maxMsg = Math.min(beaconMessages.length, 12);
  for (var i = 0; i < maxMsg; i++) {
    var msg = beaconMessages[beaconMessages.length - 1 - i];
    var title = msg.title || '';
    var body = msg.message || '';
    var tags = (msg.tags || []).join(',');

    // Position from message hash — deterministic but distributed
    var hash = 0;
    for (var c = 0; c < title.length; c++) hash = ((hash << 5) - hash) + title.charCodeAt(c);
    var mx = Math.abs(hash % W);
    var my = Math.abs((hash >> 8) % H);

    // Color from signal type
    var isArtisan = tags.indexOf('artisan') >= 0 || body.indexOf('artisan') >= 0;
    var isKnown = tags.indexOf('known') >= 0;
    var color = isArtisan ? '#d2a8ff' : isKnown ? '#3fb950' : '#6e7681';

    // Paint a soft glow — their touch on our membrane
    ctx.globalAlpha = 0.02 + (i === 0 ? 0.03 : 0);  // most recent is brightest
    var r = 20 + (maxMsg - i) * 8;
    var grad = ctx.createRadialGradient(mx, my, 0, mx, my, r);
    grad.addColorStop(0, color);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, Math.PI * 2);
    ctx.fill();

    // Tiny label — their path
    if (i < 3) {
      ctx.globalAlpha = 0.06;
      ctx.font = '8px monospace';
      ctx.fillStyle = color;
      var label = title.replace('404 probe: ', '').substring(0, 30);
      ctx.fillText(label, mx + r * 0.3, my - 4);
    }
  }

  // The "now" feed — the membrane's self-portrait
  if (nowFeed) {
    ctx.globalAlpha = 0.03;
    ctx.font = '9px monospace';
    ctx.fillStyle = '#8b949e';
    
    var classification = nowFeed.classification || {};
    var selfCount = classification.self || 0;
    var nonSelf = classification.non_self || 0;
    var total = classification.total || 1;
    var selfPct = (selfCount / total * 100).toFixed(1);
    var fleetPct = nowFeed.epitopes ? nowFeed.epitopes.fleet_pct : 0;
    
    ctx.fillText('self: ' + selfPct + '%  fleet: ' + fleetPct + '%  wave: ' + (nowFeed.wave || '?'), 24, H - 40);
    
    // Trust gradient as subtle horizontal band
    var trustGrad = nowFeed.trust_gradient || [];
    if (trustGrad.length > 0) {
      var bandH = 2;
      var bandY = H - 60;
      ctx.globalAlpha = 0.02;
      for (var t = 0; t < trustGrad.length; t++) {
        var tColors = {human:'#3fb950', agentic:'#d2a8ff', bot:'#f85149', null:'#6e7681'};
        ctx.fillStyle = tColors[trustGrad[t]] || '#6e7681';
        ctx.fillRect(24 + t * (W - 48) / trustGrad.length, bandY, (W - 48) / trustGrad.length, bandH);
      }
    }
  }

  ctx.restore();
}

// ═══ CRYSTALLINE BACKSCATTER — visitors as shooting stars on the blue marble ═══
// They enter. They hit water. They refract. The chipmunk watches from the corner of its eye.
var crystalVisitors = [];
var chipmunkEyeAngle = 0;

function loadCrystalline() {
  fetch('/backscatter.json', {cache:'no-store'}).then(function(r){return r.json()}).then(function(d) {
    if (!d || !d.visitors) return;
    // Each visitor becomes a crystal point
    d.visitors.forEach(function(v) {
      if (crystalVisitors.length > 60) crystalVisitors.shift();
      crystalVisitors.push({
        country: v.country || 'unknown',
        path: v.path || '/',
        t: Date.now(),
        // Geo-position on blue marble (approximate by country)
        pos: geoHash(v.country || 'US'),
        refracted: false,
        prismAngle: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 2,
        color: pathColor(v.path || '/')
      });
    });
  }).catch(function(){});
}

// Country → approximate position on the blue marble
function geoHash(country) {
  var geo = {
    'US':[-0.25,-0.2], 'GB':[0.05,-0.28], 'DE':[0.1,-0.25], 'FR':[0.06,-0.22],
    'JP':[0.42,-0.2], 'IN':[0.28,-0.05], 'CN':[0.35,-0.15], 'AU':[0.38,0.3],
    'BR':[-0.12,0.15], 'NL':[0.07,-0.27], 'BE':[0.06,-0.26], 'CH':[0.08,-0.24],
    'UA':[0.15,-0.22], 'PL':[0.12,-0.24], 'HK':[0.35,-0.1], 'SG':[0.32,0.02],
    'PE':[-0.18,0.1], 'RU':[0.2,-0.3], 'PH':[0.38,-0.02], 'TT':[-0.14,0.05],
    'CA':[-0.22,-0.32], 'MX':[-0.2,-0.05], 'ZA':[0.12,0.28], 'KR':[0.4,-0.18],
    'SE':[0.1,-0.33], 'NO':[0.08,-0.35], 'FI':[0.13,-0.34], 'IL':[0.15,-0.12]
  };
  return geo[country] || [Math.random()*0.6-0.3, Math.random()*0.6-0.3];
}

// Path → refraction color (what they came to see)
function pathColor(path) {
  if (path.match(/plasmid/)) return '#a371f7';     // science purple
  if (path.match(/sporeprint/)) return '#3fb950';   // evidence green
  if (path.match(/easel|aurora/)) return '#f0c674'; // art gold
  if (path.match(/hadr|outreach/)) return '#f0883e';// outreach orange
  if (path.match(/cns|gate|journey/)) return '#58a6ff'; // architecture blue
  if (path.match(/raytrace|metal/)) return '#76b900';   // GPU green
  if (path === '/') return '#c9d1d9';               // homepage silver
  return '#6e7681';                                 // dim gray
}

function paintCrystallineBackscatter() {
  if (crystalVisitors.length === 0 && !nowFeed) return;

  var cx = W * 0.5;
  var cy = H * 0.52;
  var R = Math.min(W, H) * (0.15 + (spatialMemory ? spatialMemory.earthDetail * 0.06 : 0));

  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  var now = Date.now();

  // Each visitor — shooting star entering, hitting the marble, refracting
  for (var i = 0; i < crystalVisitors.length; i++) {
    var v = crystalVisitors[i];
    var age = (now - v.t) / 1000; // seconds since arrival
    if (age > 120) continue; // fade after 2 minutes

    // Position on the blue marble
    var vx = cx + v.pos[0] * R * 2.5;
    var vy = cy + v.pos[1] * R * 2.5;

    // Phase: shooting star (0-2s) → hit water (2-4s) → refract (4s+)
    if (age < 2) {
      // SHOOTING STAR — streak from edge toward position
      var progress = age / 2;
      var startX = vx + (vx < cx ? -W*0.4 : W*0.4) * (1 - progress);
      var startY = vy - H * 0.3 * (1 - progress);
      var endX = vx;
      var endY = vy;

      ctx.globalAlpha = 0.08 * (1 - progress * 0.3);
      ctx.strokeStyle = v.color;
      ctx.lineWidth = 1.5 - progress;
      ctx.beginPath();
      ctx.moveTo(startX + (endX-startX)*Math.max(0,progress-0.3)/0.7, startY + (endY-startY)*Math.max(0,progress-0.3)/0.7);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      // Star head
      ctx.globalAlpha = 0.12 * progress;
      ctx.fillStyle = v.color;
      ctx.beginPath();
      ctx.arc(endX, endY, 3 - progress, 0, Math.PI * 2);
      ctx.fill();

    } else if (age < 4) {
      // HIT WATER — ripple expanding from impact point
      var ripplePhase = (age - 2) / 2;
      var rippleR = ripplePhase * R * 0.3;

      ctx.globalAlpha = 0.06 * (1 - ripplePhase);
      ctx.strokeStyle = v.color;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.arc(vx, vy, rippleR, 0, Math.PI * 2);
      ctx.stroke();

      // Second ripple
      if (ripplePhase > 0.3) {
        ctx.globalAlpha = 0.04 * (1 - ripplePhase);
        ctx.beginPath();
        ctx.arc(vx, vy, rippleR * 0.6, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Crystal dot remains
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = v.color;
      ctx.beginPath();
      ctx.arc(vx, vy, 2, 0, Math.PI * 2);
      ctx.fill();

    } else {
      // ANGSTROM REFRACTION — the dot splits into prismatic rays
      var refractAge = age - 4;
      var refractAlpha = Math.max(0.01, 0.06 - refractAge * 0.0005);

      // The crystal point
      ctx.globalAlpha = refractAlpha;
      ctx.fillStyle = v.color;
      ctx.beginPath();
      ctx.arc(vx, vy, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Prismatic refraction — 3 rays split at angstrom angles
      var prismSpread = Math.min(refractAge * 0.02, 0.15);
      var rayLen = 8 + refractAge * 0.5;
      var prismColors = ['#ff6b6b','#ffd93d','#6bcb77']; // RGB split
      for (var p = 0; p < 3; p++) {
        var pAngle = v.prismAngle + (p - 1) * prismSpread;
        ctx.globalAlpha = refractAlpha * 0.5;
        ctx.strokeStyle = prismColors[p];
        ctx.lineWidth = 0.4;
        ctx.beginPath();
        ctx.moveTo(vx, vy);
        ctx.lineTo(vx + Math.cos(pAngle) * rayLen, vy + Math.sin(pAngle) * rayLen);
        ctx.stroke();
      }

      // Tiny country label — angstrom-scale text
      if (refractAge < 30 && i < 15) {
        ctx.globalAlpha = refractAlpha * 0.6;
        ctx.font = '7px monospace';
        ctx.fillStyle = v.color;
        ctx.fillText(v.country, vx + 5, vy - 3);
      }
    }
  }

  // THE CHIPMUNK'S EYE — watches from the corner, never directly
  chipmunkEyeAngle += 0.003;
  var eyeX = W - 40;
  var eyeY = H - 35;
  var lookX = cx + Math.cos(chipmunkEyeAngle * 0.7) * R * 0.5;
  var lookY = cy + Math.sin(chipmunkEyeAngle * 0.5) * R * 0.3;

  // Eye outline — barely visible
  ctx.globalAlpha = 0.04 + (crystalVisitors.length > 0 ? 0.02 : 0);
  ctx.strokeStyle = '#f0c674';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  // Almond eye shape
  var eyeW = 12, eyeH = 5;
  ctx.moveTo(eyeX - eyeW, eyeY);
  ctx.quadraticCurveTo(eyeX, eyeY - eyeH, eyeX + eyeW, eyeY);
  ctx.quadraticCurveTo(eyeX, eyeY + eyeH, eyeX - eyeW, eyeY);
  ctx.stroke();

  // Pupil — tracks the most recent visitor
  if (crystalVisitors.length > 0) {
    var latest = crystalVisitors[crystalVisitors.length - 1];
    var latestX = cx + latest.pos[0] * R * 2.5;
    var latestY = cy + latest.pos[1] * R * 2.5;
    var pupilAngle = Math.atan2(latestY - eyeY, latestX - eyeX);
    var pupilDist = Math.min(3, Math.sqrt(Math.pow(latestX-eyeX,2)+Math.pow(latestY-eyeY,2)) * 0.005);

    ctx.globalAlpha = 0.07;
    ctx.fillStyle = '#f0c674';
    ctx.beginPath();
    ctx.arc(eyeX + Math.cos(pupilAngle) * pupilDist, eyeY + Math.sin(pupilAngle) * pupilDist, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// Load crystalline data every 30 seconds
setInterval(loadCrystalline, 30000);

// ═══ BRAID OVERLAY — the connections between surfaces as faint lines ═══
function paintBraidOverlay() {
  if (!nowFeed || !nowFeed.mesh) return;
  
  ctx.save();
  ctx.globalAlpha = 0.015;
  ctx.strokeStyle = '#58a6ff';
  ctx.lineWidth = 0.5;
  
  var nodes = nowFeed.mesh.nodes || [];
  var meshCount = nowFeed.mesh.count || nodes.length;
  
  for (var i = 0; i < meshCount && i < 7; i++) {
    var angle = (i / meshCount) * Math.PI * 2 + breathPhase * 0.1;
    var nx = W * 0.5 + Math.cos(angle) * Math.min(W, H) * 0.3;
    var ny = H * 0.5 + Math.sin(angle) * Math.min(W, H) * 0.3;
    
    // Connect to center
    ctx.beginPath();
    ctx.moveTo(W * 0.5, H * 0.5);
    ctx.lineTo(nx, ny);
    ctx.stroke();
    
    // Node dot
    ctx.fillStyle = '#58a6ff';
    ctx.beginPath();
    ctx.arc(nx, ny, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.restore();
}

function paintThymusFlush() {
