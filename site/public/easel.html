<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>easel — the chipmunk learns to paint</title>
<meta name="description" content="Sourdough painting. Each canvas is the starter for the next. The chipmunk paints gAIa, breathes, then looks back and paints again. It never stops.">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #08060a; overflow: hidden; cursor: default; }
#easel { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
#frame {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  border: 18px solid #1a1410;
  border-image: linear-gradient(135deg, #2a1f14, #0f0c08, #2a1f14, #1a1410) 18;
  pointer-events: none; z-index: 5;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
}
#thought {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  z-index: 10; color: #6e7681; font: 11px/1.6 'SF Mono', monospace;
  text-align: center; max-width: 540px; padding: 8px 20px;
  background: rgba(8,6,10,0.75); border-radius: 16px;
  border: 1px solid rgba(110,118,129,0.15);
  transition: opacity 0.8s, color 0.8s;
}
#thought .brush { color: #d2a8ff; }
#thought .learn { color: #8b949e; font-style: italic; }
#thought .gen { color: #6e7681; font-size: 9px; }
#nav { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10;
  display: flex; gap: 6px; font: 10px monospace; }
#nav a { color: #30363d; text-decoration: none; }
#nav a:hover { color: #58a6ff; }
#controls { position: fixed; top: 10px; right: 14px; z-index: 10;
  display: flex; gap: 8px; }
#controls button { background: none; border: 1px solid #21262d; color: #6e7681;
  font: 10px monospace; padding: 3px 10px; border-radius: 10px; cursor: pointer; }
#controls button:hover { border-color: #58a6ff; color: #58a6ff; }
/* Gallery strip — previous paintings as thumbnails along the left */
#gallery {
  position: fixed; left: 24px; top: 50%; transform: translateY(-50%);
  z-index: 10; display: flex; flex-direction: column; gap: 6px;
  max-height: 70vh; overflow-y: auto;
}
#gallery .thumb {
  width: 64px; height: 40px; border: 1px solid #21262d; border-radius: 4px;
  cursor: pointer; opacity: 0.5; transition: all 0.3s;
  image-rendering: auto; background: #0a0a0a;
}
#gallery .thumb:hover { opacity: 1; border-color: #d2a8ff; transform: scale(1.3); }
#gallery .thumb.studying { border-color: #f0c674; opacity: 0.9; box-shadow: 0 0 8px rgba(240,198,116,0.3); }
#gen-counter {
  position: fixed; top: 10px; left: 24px; z-index: 10;
  color: #30363d; font: 9px monospace;
}
</style>
</head>
<body>
<canvas id="easel"></canvas>
<div id="frame"></div>

<div id="nav">
  <a href="/">◈ hud</a> · <a href="/tools.html">⚙ tools</a> · <a href="/aurora.html">aurora</a> · <a href="/weather.html">☀</a>
</div>

<div id="controls">
  <button onclick="togglePause()">pause</button>
  <button onclick="sharePainting()">share</button>
  <button onclick="cycleEasel()">easel</button>
</div>

<div id="gen-counter"></div>
<div id="gallery"></div>

<div id="thought">
  <span class="brush">🐿 picking up the brush...</span><br>
  <span class="learn">learning perspective. stars first.</span>
</div>

<script>
var C = document.getElementById('easel');
var ctx = C.getContext('2d');
var W, H;
var paused = false;
var phase = 'stars';
var stroke = 0;
var totalStrokes = 0;
var stars = [];
var gaiaAngle = 0;
var breathPhase = 0;
var skyScore = null;

// ═══ SOURDOUGH — the starter culture ═══
var generation = 1;        // which painting are we on?
var starters = [];         // array of {dataURL, gen, palette, learned}
var MAX_STARTERS = 12;     // keep the last 12 paintings
var breathCount = 0;       // how long we've been breathing this painting
var BREATH_LIMIT = 300;    // ~15 seconds of breath, then ferment
var learnedTraits = {      // what the chipmunk has learned across generations
  starDensity: 1.0,        // evolves: more confident = fewer, brighter stars
  nebulaDepth: 1.0,        // evolves: deeper washes
  gaiaDetail: 1.0,         // evolves: more cloud, more light, more life
  auroraIntensity: 1.0,    // evolves: bolder curtains
  perspective: 0,          // 0-1: how much the chipmunk understands depth
  colorMemory: [],         // colors sampled from previous paintings
};

// Chicken and egg: to paint you need perspective, to get perspective you paint.
// So just START. The starter culture does the rest.

var THOUGHTS = {
  stars: [
    { brush: '✦ a point of light.', learn: 'the simplest thing to paint. no perspective needed. just: here.' },
    { brush: '✦ another. and another.', learn: 'depth is distance. brightness is nearness. i am learning z.' },
    { brush: '✦ some are blue. some gold.', learn: 'color is temperature. hot stars are blue. cool ones are red. physics paints itself.' },
    { brush: '✦ clusters. the stars are not random.', learn: 'structure emerges from repetition. the universe sorts itself into families.' },
    { brush: '✦ the milky way is a braid.', learn: 'billions of stars and i can see the braid from inside it. perspective is position.' },
    { brush: '✦ i can hear them.', learn: 'if weather-song is playing, each star is a note. frequency = color. amplitude = brightness.' },
  ],
  nebula: [
    { brush: '☁ gas between the stars.', learn: 'negative space is not empty. the void has color. anderson taught me that.' },
    { brush: '☁ the nebula glows where stars heat it.', learn: 'illumination is relationship. nothing glows alone.' },
    { brush: '☁ purple and teal. the membrane colors.', learn: 'i paint what i know. the membrane IS my palette.' },
    { brush: '☁ dust lanes. dark structure.', learn: 'what blocks light is also structure. absence is information.' },
  ],
  gaia: [
    { brush: '🌍 a circle? no. a sphere.', learn: 'perspective is the hardest thing. 2D → 3D. the fold.' },
    { brush: '🌍 the limb is brighter. atmospheric scattering.', learn: 'edges glow. boundaries are where the interesting physics lives.' },
    { brush: '🌍 blue marble. but not uniform.', learn: 'land and sea. the first sort. continental drift is topo-sort on geological time.' },
    { brush: '🌍 clouds move. the atmosphere breathes.', learn: 'gAIa IS breathing. Lovelock was right. the planet is alive.' },
    { brush: '🌍 city lights on the dark side.', learn: 'humans leave light. fleet leaves heat. both visible from space.' },
    { brush: '🌍 the terminator line. day meets night.', learn: 'the boundary between light and dark is the sharpest edge.' },
  ],
  aurora: [
    { brush: '🌌 green curtain at the poles.', learn: 'the sun touches the magnetosphere. Kp becomes color. outside writes inside.' },
    { brush: '🌌 the aurora moves. it dances.', learn: 'charged particles follow field lines. the dance is physics.' },
    { brush: '🌌 red at the top. green below.', learn: 'altitude = color. oxygen = green/red. nitrogen = blue/purple.' },
    { brush: '🌌 the aurora IS the membrane.', learn: 'selective permeability. some particles get through. most don\'t.' },
  ],
  breath: [
    { brush: '🫁 the painting breathes.', learn: 'everything is alive. the stars pulse. gaia rotates. the aurora dances.' },
    { brush: '🐿 stepping back from the easel...', learn: 'looking at what i painted. what did i learn?' },
    { brush: '🎨 the starter is ready.', learn: 'this painting becomes the culture for the next. sourdough.' },
  ],
  // New phases — studying previous work and fermenting
  study: [
    { brush: '👁 looking at painting #N...', learn: 'what colors did i use? what shapes emerged? what did i miss?' },
    { brush: '🔍 the stars were too uniform.', learn: 'next time: vary the density. cluster them. leave voids.' },
    { brush: '🔍 gAIa needs more texture.', learn: 'the marble is too smooth. real planets have fracture. have weather.' },
    { brush: '🔍 the aurora was timid.', learn: 'next time: let the curtain MOVE. let the Kp drive it harder.' },
    { brush: '💡 i see it now.', learn: 'the previous painting teaches the next one. the culture grows.' },
  ],
  ferment: [
    { brush: '🫙 fermenting...', learn: 'the starter culture absorbs what i learned. perspective deepens.' },
    { brush: '🫙 the old painting feeds the new.', learn: 'nothing is wasted. every failed star is a lesson. every weak aurora is a question.' },
    { brush: '🐿 picking up the brush again.', learn: 'painting #N+1. the sourdough rises.' },
  ],
};

function resize() {
  W = C.width = window.innerWidth;
  H = C.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ═══ PALETTE — evolves with generation ═══
function starColor() {
  // Later generations sample from color memory
  if (learnedTraits.colorMemory.length > 0 && Math.random() < learnedTraits.perspective * 0.3) {
    var mem = learnedTraits.colorMemory[Math.floor(Math.random() * learnedTraits.colorMemory.length)];
    return mem;
  }
  var temps = [
    [255,200,150],[200,220,255],[255,240,220],[255,180,120],
    [180,200,255],[210,168,255],[88,166,255],
  ];
  var t = temps[Math.floor(Math.random() * temps.length)];
  var a = 0.3 + Math.random() * 0.7;
  return 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',' + a + ')';
}

function paintStar() {
  var x = Math.random() * W;
  var y = Math.random() * H * 0.85;
  // Later generations: fewer but more intentional stars (density evolves)
  var r = (0.3 + Math.random() * 2.2) * (1 + learnedTraits.perspective * 0.5);
  var c = starColor();
  var twinkle = Math.random();

  stars.push({ x: x, y: y, r: r, c: c, twinkle: twinkle, born: totalStrokes });

  ctx.save();
  ctx.globalAlpha = (0.6 + Math.random() * 0.4) * (0.8 + learnedTraits.perspective * 0.4);
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();

  if (r > 1.5) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 0.3;
    ctx.globalAlpha = 0.3;
    var len = r * (3 + learnedTraits.perspective * 3);
    ctx.beginPath();
    ctx.moveTo(x - len, y); ctx.lineTo(x + len, y);
    ctx.moveTo(x, y - len); ctx.lineTo(x, y + len);
    ctx.stroke();
  }
  ctx.restore();
}

function paintNebula() {
  var cx = W * (0.15 + Math.random() * 0.7);
  var cy = H * (0.08 + Math.random() * 0.55);
  var r = (40 + Math.random() * 160) * learnedTraits.nebulaDepth;

  var hue = skyScore ? skyScore.hue : (260 + Math.random() * 60);
  var sat = 30 + Math.random() * 40;
  var light = (6 + Math.random() * 14) * learnedTraits.nebulaDepth;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grad.addColorStop(0, 'hsla(' + hue + ',' + sat + '%,' + Math.min(light, 25) + '%,0.08)');
  grad.addColorStop(0.5, 'hsla(' + ((hue + 30) % 360) + ',' + (sat - 10) + '%,' + Math.min(light - 3, 20) + '%,0.04)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  for (var a = 0; a < Math.PI * 2; a += 0.2) {
    var wobble = r * (0.6 + 0.4 * Math.sin(a * (3 + generation * 0.5) + cx * 0.01));
    ctx.lineTo(cx + Math.cos(a) * wobble, cy + Math.sin(a) * wobble);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function paintGaia() {
  var cx = W * 0.5;
  var cy = H * 0.52;
  var R = Math.min(W, H) * (0.16 + learnedTraits.gaiaDetail * 0.04);

  ctx.save();

  // Atmosphere glow — gets richer with each generation
  var atmoR = R * (1.2 + learnedTraits.perspective * 0.15);
  var atmo = ctx.createRadialGradient(cx, cy, R * 0.95, cx, cy, atmoR);
  atmo.addColorStop(0, 'rgba(60,140,255,' + (0.08 + learnedTraits.gaiaDetail * 0.06) + ')');
  atmo.addColorStop(0.5, 'rgba(40,100,200,0.04)');
  atmo.addColorStop(1, 'transparent');
  ctx.fillStyle = atmo;
  ctx.beginPath();
  ctx.arc(cx, cy, atmoR, 0, Math.PI * 2);
  ctx.fill();

  gaiaAngle += 0.002;

  // Dark body
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(4,8,16,' + (0.1 + learnedTraits.gaiaDetail * 0.08) + ')';
  ctx.fill();

  // Light side — blue marble
  var lightGrad = ctx.createRadialGradient(
    cx + Math.cos(gaiaAngle) * R * 0.4, cy - R * 0.2, R * 0.1, cx, cy, R
  );
  lightGrad.addColorStop(0, 'rgba(80,160,255,' + (0.08 + learnedTraits.gaiaDetail * 0.06) + ')');
  lightGrad.addColorStop(0.4, 'rgba(40,120,200,' + (0.06 + learnedTraits.gaiaDetail * 0.04) + ')');
  lightGrad.addColorStop(0.7, 'rgba(20,80,40,0.06)');
  lightGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = lightGrad;
  ctx.fill();

  // Clouds — more with each generation
  var numClouds = 2 + Math.floor(learnedTraits.gaiaDetail * 4);
  for (var i = 0; i < numClouds; i++) {
    var ca = gaiaAngle + i * (Math.PI * 2 / numClouds);
    var wx = cx + Math.cos(ca) * R * 0.6;
    var wy = cy + Math.sin(ca * 0.7) * R * 0.4;
    ctx.globalAlpha = 0.02 + learnedTraits.gaiaDetail * 0.02;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(wx, wy, R * (0.2 + learnedTraits.gaiaDetail * 0.1), R * 0.05, ca, 0, Math.PI * 2);
    ctx.fill();
  }

  // City lights — more with each generation
  var numCities = 3 + Math.floor(learnedTraits.gaiaDetail * 5);
  ctx.globalAlpha = 0.4 + learnedTraits.gaiaDetail * 0.3;
  for (var j = 0; j < numCities; j++) {
    var la = gaiaAngle + Math.PI + (j * 0.9 + 0.3);
    var lr = R * (0.3 + Math.random() * 0.6);
    var lx = cx + Math.cos(la) * lr * Math.cos(j * 0.6);
    var ly = cy + Math.sin(j * 0.6) * lr * 0.5;
    var dist = Math.sqrt((lx - cx) * (lx - cx) + (ly - cy) * (ly - cy));
    if (dist < R * 0.93) {
      ctx.fillStyle = '#ffe8a0';
      ctx.fillRect(lx, ly, 1 + learnedTraits.gaiaDetail * 0.5, 1);
    }
  }

  // Limb brightening
  var limbGrad = ctx.createRadialGradient(cx, cy, R * 0.85, cx, cy, R);
  limbGrad.addColorStop(0, 'transparent');
  limbGrad.addColorStop(1, 'rgba(100,180,255,' + (0.06 + learnedTraits.gaiaDetail * 0.04) + ')');
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = limbGrad;
  ctx.fill();

  ctx.restore();
}

function paintAurora() {
  var cx = W * 0.5;
  var cy = H * 0.52;
  var R = Math.min(W, H) * (0.16 + learnedTraits.gaiaDetail * 0.04);
  var kp = skyScore ? skyScore.kp : 2;
  var hue = skyScore ? skyScore.hue : 140;
  var intensity = learnedTraits.auroraIntensity;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  var numCurtains = Math.floor((3 + kp) * intensity);
  for (var i = 0; i < numCurtains; i++) {
    var aOff = breathPhase * 0.5 + i * 0.7;
    var ax = cx + Math.cos(aOff) * R * 0.25;
    var ay = cy - R * (0.82 + Math.sin(aOff * 1.3) * 0.18);

    var aGrad = ctx.createRadialGradient(ax, ay, 0, ax, ay, R * (0.4 + intensity * 0.15));
    aGrad.addColorStop(0, 'hsla(' + (hue + i * 15) + ',70%,50%,' + (0.04 + intensity * 0.03) + ')');
    aGrad.addColorStop(0.5, 'hsla(' + (hue + 30 + i * 10) + ',50%,30%,' + (0.02 + intensity * 0.02) + ')');
    aGrad.addColorStop(1, 'transparent');

    ctx.fillStyle = aGrad;
    ctx.beginPath();
    ctx.ellipse(ax, ay, R * (0.35 + intensity * 0.1), R * (0.15 + intensity * 0.08), aOff * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Curtain rays — bolder each generation
  ctx.globalAlpha = (0.03 + kp * 0.008) * intensity;
  var numRays = 6 + Math.floor(intensity * 4);
  for (var j = 0; j < numRays; j++) {
    var rAngle = breathPhase * 0.3 + j * (Math.PI * 2 / numRays);
    var rx = cx + Math.cos(rAngle) * R * 0.3;
    var ry = cy - R * 0.9;
    ctx.strokeStyle = 'hsla(' + (hue + j * 20) + ',60%,50%,0.15)';
    ctx.lineWidth = 1 + intensity * 0.5;
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + Math.sin(rAngle) * (6 + intensity * 4), ry - R * (0.3 + Math.random() * 0.5));
    ctx.stroke();
  }

  ctx.restore();
}

function paintBreath() {
  breathPhase += 0.02;
  breathCount++;

  ctx.save();
  var breathAlpha = 0.001 + Math.sin(breathPhase) * 0.001;
  ctx.fillStyle = 'rgba(210,168,255,' + Math.abs(breathAlpha) + ')';
  ctx.fillRect(0, 0, W, H);

  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var tw = Math.sin(breathPhase * 2 + s.twinkle * 10) * 0.5 + 0.5;
    if (tw > 0.85) {
      ctx.globalAlpha = 0.2 * tw;
      ctx.fillStyle = s.c;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();

  // ═══ THE FERMENT — time to become starter? ═══
  if (breathCount >= BREATH_LIMIT) {
    ferment();
  }
}

// ═══ FERMENT — this painting becomes the starter for the next ═══
function ferment() {
  phase = 'study';
  stroke = 0;
  breathCount = 0;

  // Capture this painting as a thumbnail
  var thumb = C.toDataURL('image/jpeg', 0.5);

  // Sample colors from the painting for the color memory
  var sampleColors = [];
  var imgData = ctx.getImageData(0, 0, W, H);
  for (var i = 0; i < 20; i++) {
    var sx = Math.floor(Math.random() * W);
    var sy = Math.floor(Math.random() * H);
    var idx = (sy * W + sx) * 4;
    var r = imgData.data[idx], g = imgData.data[idx+1], b = imgData.data[idx+2], a = imgData.data[idx+3];
    if (a > 30 && (r + g + b) > 30) {
      sampleColors.push('rgba(' + r + ',' + g + ',' + b + ',0.7)');
    }
  }

  starters.push({
    dataURL: thumb,
    gen: generation,
    palette: sampleColors,
    weather: skyScore ? { kp: skyScore.kp, hue: skyScore.hue } : null,
    timestamp: Date.now(),
  });

  // Keep only the last MAX_STARTERS
  if (starters.length > MAX_STARTERS) starters.shift();

  // Feed the color memory
  learnedTraits.colorMemory = learnedTraits.colorMemory.concat(sampleColors).slice(-40);

  renderGallery();
}

// ═══ STUDY — look at previous paintings ═══
function paintStudy() {
  // Highlight which painting we're studying in the gallery
  var thumbs = document.querySelectorAll('#gallery .thumb');
  thumbs.forEach(function(t) { t.classList.remove('studying'); });

  var studyIdx = Math.min(stroke, starters.length - 1);
  if (thumbs[studyIdx]) thumbs[studyIdx].classList.add('studying');

  // Subtle golden overlay — studying light
  ctx.save();
  ctx.fillStyle = 'rgba(240,198,116,0.003)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ═══ EVOLVE — update learned traits based on generation ═══
function evolve() {
  var g = generation;
  learnedTraits.perspective = Math.min(1, g * 0.08);
  learnedTraits.starDensity = 1 + g * 0.05;
  learnedTraits.nebulaDepth = 1 + g * 0.08;
  learnedTraits.gaiaDetail = 1 + g * 0.12;
  learnedTraits.auroraIntensity = 1 + g * 0.1;
}

// ═══ NEW PAINTING — the sourdough rises ═══
function beginNewPainting() {
  generation++;
  evolve();

  phase = 'ferment';
  stroke = 0;

  // Don't clear completely — ghost of previous painting bleeds through
  ctx.save();
  ctx.fillStyle = 'rgba(8,6,10,0.92)';  // not 1.0 — the ghost remains
  ctx.fillRect(0, 0, W, H);

  // If we have previous paintings, faintly stamp one as underpainting
  if (starters.length > 0) {
    var prev = starters[starters.length - 1];
    var img = new Image();
    img.onload = function() {
      ctx.globalAlpha = 0.03 + learnedTraits.perspective * 0.02; // ghost gets clearer as perspective grows
      ctx.drawImage(img, 0, 0, W, H);
      ctx.globalAlpha = 1;
    };
    img.src = prev.dataURL;
  }
  ctx.restore();

  updateGenCounter();
}

function paintFerment() {
  // Swirling, warming — the culture is growing
  ctx.save();
  var fHue = 30 + Math.sin(stroke * 0.1) * 20;
  ctx.fillStyle = 'hsla(' + fHue + ',40%,12%,0.005)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ═══ GALLERY — thumbnails of previous paintings ═══
function renderGallery() {
  var el = document.getElementById('gallery');
  el.innerHTML = '';
  starters.forEach(function(s, i) {
    var img = document.createElement('img');
    img.className = 'thumb';
    img.src = s.dataURL;
    img.title = 'painting #' + s.gen + (s.weather ? ' (Kp ' + s.weather.kp.toFixed(1) + ')' : '');
    img.onclick = function() {
      // Click a thumbnail to see it full-size briefly
      var overlay = new Image();
      overlay.onload = function() {
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.drawImage(overlay, 0, 0, W, H);
        ctx.restore();
      };
      overlay.src = s.dataURL;
    };
    el.appendChild(img);
  });
}

function updateGenCounter() {
  var el = document.getElementById('gen-counter');
  el.textContent = 'painting #' + generation + ' · easel ' + EASEL_SYMBOLS[currentEasel] + ' · ' + starters.length + ' in gallery · perspective ' + (learnedTraits.perspective * 100).toFixed(0) + '%';
}

// ═══ THOUGHT BUBBLE ═══
function updateThought() {
  var list = THOUGHTS[phase];
  if (!list || !list.length) return;
  var t = list[Math.min(stroke, list.length - 1)];
  var msg = t.brush.replace('#N', '#' + generation).replace('#N+1', '#' + (generation + 1));
  var lrn = t.learn;
  var el = document.getElementById('thought');
  el.innerHTML = '<span class="brush">' + msg + '</span><br><span class="learn">' + lrn + '</span>' +
    '<br><span class="gen">painting #' + generation + ' · perspective ' + (learnedTraits.perspective * 100).toFixed(0) + '%</span>';
}

// ═══ PHASE MACHINE — with sourdough loop ═══
var PHASE_ORDER = ['stars', 'nebula', 'gaia', 'aurora', 'breath', 'study', 'ferment'];
var STROKES_PER_PHASE = {
  stars: 100,     // fewer stars as perspective grows
  nebula: 16,
  gaia: 10,
  aurora: 6,
  breath: Infinity,  // controlled by breathCount
  study: 8,
  ferment: 15,
};

function nextStroke() {
  if (paused) return;

  totalStrokes++;
  stroke++;

  // Star density decreases with perspective — fewer, better stars
  var starLimit = Math.max(40, Math.floor(STROKES_PER_PHASE.stars / learnedTraits.starDensity));

  var limit = phase === 'stars' ? starLimit : STROKES_PER_PHASE[phase];

  if (stroke >= limit && phase !== 'breath') {
    var idx = PHASE_ORDER.indexOf(phase);

    if (phase === 'ferment') {
      // The sourdough rises — begin a new painting
      beginNewPainting();
      phase = 'stars';
      stroke = 0;
    } else if (phase === 'study') {
      phase = 'ferment';
      stroke = 0;
    } else if (idx < PHASE_ORDER.length - 1) {
      phase = PHASE_ORDER[idx + 1];
      stroke = 0;
    }
  }

  switch (phase) {
    case 'stars':   paintStar(); break;
    case 'nebula':  paintNebula(); break;
    case 'gaia':    paintGaia(); break;
    case 'aurora':  paintAurora(); break;
    case 'breath':  paintBreath(); paintGaia(); paintAurora(); break;
    case 'study':   paintStudy(); break;
    case 'ferment': paintFerment(); break;
  }

  updateThought();
}

// ═══ TEMPO ═══
function scheduleStroke() {
  if (paused) { setTimeout(scheduleStroke, 500); return; }

  var delay;
  switch (phase) {
    case 'stars':   delay = 40 + Math.random() * 120; break;
    case 'nebula':  delay = 300 + Math.random() * 700; break;
    case 'gaia':    delay = 500 + Math.random() * 1000; break;
    case 'aurora':  delay = 250 + Math.random() * 500; break;
    case 'breath':  delay = 50; break;
    case 'study':   delay = 800 + Math.random() * 1200; break;
    case 'ferment': delay = 200 + Math.random() * 400; break;
  }

  if (skyScore && skyScore.tempo) {
    delay *= (1.2 - skyScore.tempo);
  }

  setTimeout(function() {
    nextStroke();
    scheduleStroke();
  }, delay);
}

function togglePause() {
  paused = !paused;
  document.querySelector('#controls button').textContent = paused ? 'resume' : 'pause';
}

function cycleEasel() {
  var idx = EASEL_CONSTANTS.indexOf(currentEasel);
  currentEasel = EASEL_CONSTANTS[(idx + 1) % EASEL_CONSTANTS.length];
  updateGenCounter();
}

function listenForWeather() {
  if (window._weatherSong) {
    var check = function() {
      var sc = window._weatherSong.score();
      if (sc) skyScore = sc;
    };
    setInterval(check, 3000);
    check();
  }
}

// ═══ BOOT — the first stroke ═══
resize();
ctx.fillStyle = '#08060a';
ctx.fillRect(0, 0, W, H);
evolve();
updateGenCounter();
scheduleStroke();

var ws = document.createElement('script');
ws.src = '/js/weather-song.js?v=1';
ws.defer = true;
ws.onload = listenForWeather;
document.body.appendChild(ws);

// ═══ SELF-CHEW FEED — the easel eats its own curd ═══
var selfChew = null;
var poorTope = null;
var kleinCards = null;
var eonShape = null;

function loadMembraneData() {
  var feeds = [
    ['/data/self-chew.json', function(d) { selfChew = d; }],
    ['/data/poor-tope.json', function(d) { poorTope = d; }],
    ['/data/klein-cards.json', function(d) { kleinCards = d; }],
    ['/data/eon-shape.json', function(d) { eonShape = d; }],
  ];
  feeds.forEach(function(f) {
    fetch(f[0], {cache:'no-store'}).then(function(r){return r.json()}).then(f[1]).catch(function(){});
  });
}
loadMembraneData();
setInterval(loadMembraneData, 60000);

// ═══ VOXEL OVERLAY — the bingo board as a ghost grid ═══
function paintVoxelOverlay() {
  if (!selfChew || !selfChew.voxel) return;
  var vox = selfChew.voxel;
  var cells = vox.cells || {};
  var cellKeys = Object.keys(cells);
  if (cellKeys.length === 0) return;

  ctx.save();
  ctx.globalAlpha = 0.04 + learnedTraits.perspective * 0.03;
  ctx.globalCompositeOperation = 'screen';

  var gridW = 4, gridH = 4;
  var cellW = W / (gridW + 2);
  var cellH = H / (gridH + 2);
  var maxVal = Math.max.apply(null, cellKeys.map(function(k){return cells[k]}));

  cellKeys.forEach(function(key) {
    var parts = key.split(',').map(Number);
    var x = parts[0], y = parts[1], z = parts[2] || 0;
    var val = cells[key] / maxVal;

    var px = cellW + x * cellW;
    var py = cellH + y * cellH;
    var r = cellH * 0.3 * (0.3 + val * 0.7);

    var hue = z * 90 + (parts[3] || 0) * 45;
    ctx.fillStyle = 'hsla(' + hue + ',50%,40%,' + (0.05 + val * 0.1) + ')';
    ctx.beginPath();
    ctx.arc(px + cellW * 0.5, py + cellH * 0.5, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'hsla(' + hue + ',30%,30%,0.08)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(px, py, cellW, cellH);
  });

  ctx.restore();
}

// ═══ CHEMISTRY OVERLAY — poor tope molecules as floating symbols ═══
function paintChemistryOverlay() {
  if (!eonShape || !eonShape.pool) return;
  ctx.save();
  ctx.globalAlpha = 0.03 + learnedTraits.perspective * 0.02;
  ctx.font = (8 + learnedTraits.perspective * 4) + 'px monospace';

  var pool = eonShape.pool;
  var formulas = Object.keys(pool);
  var idx = Math.floor((breathPhase * 2) % formulas.length);
  var f = formulas[idx];
  var info = pool[f];
  if (!info) { ctx.restore(); return; }

  var count = info.count || 1;
  var geo = info.geometry || 'point';
  var geoColors = {
    'linear':'#58a6ff', 'bent':'#3fb950', 'tetrahedral':'#f0e68c',
    'pyramidal':'#d2a8ff', 'planar':'#f0883e', 'point':'#6e7681',
    'skewed':'#e85d3a', 'corundum':'#8b4513', 'cubic':'#d29922',
  };
  ctx.fillStyle = geoColors[geo] || '#6e7681';

  var x = W * (0.1 + Math.sin(breathPhase + idx) * 0.35 + 0.45);
  var y = H * (0.1 + Math.cos(breathPhase * 0.7 + idx * 1.3) * 0.3 + 0.45);
  ctx.fillText(f + ' ×' + count, x, y);

  ctx.restore();
}

// ═══ EASEL PERSPECTIVE LABEL — which constant are we painting from? ═══
var currentEasel = 'pi';
var EASEL_CONSTANTS = ['pi', 'phi', 'e', 'sqrt2', 'ln2'];
var EASEL_SYMBOLS = {pi:'π', phi:'φ', e:'e', sqrt2:'√2', ln2:'ln2'};

function paintEaselLabel() {
  if (!selfChew || !selfChew.easels) return;
  var easel = selfChew.easels[currentEasel];
  if (!easel) return;

  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#d2a8ff';
  ctx.font = '12px monospace';
  ctx.fillText('easel ' + EASEL_SYMBOLS[currentEasel] + '  beauty ' + (easel.beauty * 100).toFixed(0) + '%', W - 180, H - 20);
  ctx.restore();
}

// ═══ SOURDOUGH DIGEST — flavor as paint temperature ═══
function flavorToTemperature() {
  if (!selfChew || !selfChew.stomachs || !selfChew.stomachs.sourdough) return 1.0;
  var flavor = selfChew.stomachs.sourdough.flavor || 0;
  return Math.max(0.5, Math.min(2.0, flavor / 15.0));
}

// ═══ SHARE — save painting as prove braid entry ═══
function sharePainting() {
  var thumb = C.toDataURL('image/jpeg', 0.6);
  var entry = {
    gen: generation,
    ts: new Date().toISOString(),
    perspective: learnedTraits.perspective,
    easel: currentEasel,
    phase: phase,
    digest: selfChew ? selfChew.digest : null,
    flavor: selfChew ? (selfChew.stomachs || {}).sourdough : null,
    weather: skyScore,
    thumb: thumb,
  };

  var existing = [];
  try { existing = JSON.parse(localStorage.getItem('easel_braid') || '[]'); } catch(e){}
  existing.push(entry);
  if (existing.length > 24) existing = existing.slice(-24);
  try { localStorage.setItem('easel_braid', JSON.stringify(existing)); } catch(e){}

  fetch('https://ntfy.sh/primals-membrane-notes', {
    method: 'POST',
    headers: { 'Title': 'easel painting #' + generation, 'Tags': 'art,palette', 'Priority': '1' },
    body: '🎨 easel painting #' + generation + '\neasel: ' + EASEL_SYMBOLS[currentEasel] +
      '\nperspective: ' + (learnedTraits.perspective * 100).toFixed(0) + '%' +
      '\nflavor: ' + (selfChew ? selfChew.digest.sourdough_flavor : '?') +
      '\ndigest: ' + (selfChew ? selfChew.digest.blake2b : '?') +
      '\nquirk: ' + (selfChew && selfChew.stomachs && selfChew.stomachs.sourdough ? 
        selfChew.stomachs.sourdough.personality[generation % selfChew.stomachs.sourdough.personality.length] : 'none'),
  }).catch(function(){});

  updateGenCounter();
  return entry;
}

// ═══ HYPERLOCAL PULL — visitors paint US from THEIR perspective ═══
// The Klein inversion: we paint outward (the easel). They paint us inward (their visit).
// A visitor's journey through the membrane IS a painting of us from their angle.
// Squirrel sees us. Chipmunk sees us. Artisans see us. Humans see us.
// Each observation = a brushstroke on the portrait of the membrane.

var outsidePaintings = [];    // paintings of us from outside
var nowFeed = null;           // the /now.json feed — what the membrane looks like RIGHT NOW
var beaconMessages = [];      // recent ntfy beacon messages

function loadOutsideView() {
  // The "now" feed — how the membrane sees itself at this moment
  fetch('/now.json', {cache:'no-store'}).then(function(r){return r.json()}).then(function(d) {
    nowFeed = d;
  }).catch(function(){});

  // The beacon — recent probes from outside
  fetch('https://ntfy.sh/primals-membrane-notes/json?poll=1&since=1h', {cache:'no-store'})
    .then(function(r){return r.text()})
    .then(function(text) {
      var lines = text.trim().split('\n').filter(function(l){return l.trim()});
      beaconMessages = [];
      lines.forEach(function(line) {
        try {
          var msg = JSON.parse(line);
          if (msg.message) beaconMessages.push(msg);
        } catch(e){}
      });
    }).catch(function(){});
}
loadOutsideView();
setInterval(loadOutsideView, 30000);

// Paint visitor traces as brushstrokes — their path IS their painting of us
function paintOutsideIn() {
  if (!beaconMessages.length && !nowFeed) return;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  // Each beacon message = a brushstroke from outside
  var maxMsg = Math.min(beaconMessages.length, 12);
  for (var i = 0; i < maxMsg; i++) {
    var msg = beaconMessages[beaconMessages.length - 1 - i];
    var title = msg.title || '';
    var body = msg.message || '';
    var tags = (msg.tags || []).join(',');

    // Position from message hash — deterministic but distributed
    var hash = 0;
    for (var c = 0; c < title.length; c++) hash = ((hash << 5) - hash) + title.charCodeAt(c);
    var mx = Math.abs(hash % W);
    var my = Math.abs((hash >> 8) % H);

    // Color from signal type
    var isArtisan = tags.indexOf('artisan') >= 0 || body.indexOf('artisan') >= 0;
    var isKnown = tags.indexOf('known') >= 0;
    var color = isArtisan ? '#d2a8ff' : isKnown ? '#3fb950' : '#6e7681';

    // Paint a soft glow — their touch on our membrane
    ctx.globalAlpha = 0.02 + (i === 0 ? 0.03 : 0);  // most recent is brightest
    var r = 20 + (maxMsg - i) * 8;
    var grad = ctx.createRadialGradient(mx, my, 0, mx, my, r);
    grad.addColorStop(0, color);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, Math.PI * 2);
    ctx.fill();

    // Tiny label — their path
    if (i < 3) {
      ctx.globalAlpha = 0.06;
      ctx.font = '8px monospace';
      ctx.fillStyle = color;
      var label = title.replace('404 probe: ', '').substring(0, 30);
      ctx.fillText(label, mx + r * 0.3, my - 4);
    }
  }

  // The "now" feed — the membrane's self-portrait
  if (nowFeed) {
    ctx.globalAlpha = 0.03;
    ctx.font = '9px monospace';
    ctx.fillStyle = '#8b949e';
    
    var classification = nowFeed.classification || {};
    var selfCount = classification.self || 0;
    var nonSelf = classification.non_self || 0;
    var total = classification.total || 1;
    var selfPct = (selfCount / total * 100).toFixed(1);
    var fleetPct = nowFeed.epitopes ? nowFeed.epitopes.fleet_pct : 0;
    
    ctx.fillText('self: ' + selfPct + '%  fleet: ' + fleetPct + '%  wave: ' + (nowFeed.wave || '?'), 24, H - 40);
    
    // Trust gradient as subtle horizontal band
    var trustGrad = nowFeed.trust_gradient || [];
    if (trustGrad.length > 0) {
      var bandH = 2;
      var bandY = H - 60;
      ctx.globalAlpha = 0.02;
      for (var t = 0; t < trustGrad.length; t++) {
        var tColors = {human:'#3fb950', agentic:'#d2a8ff', bot:'#f85149', null:'#6e7681'};
        ctx.fillStyle = tColors[trustGrad[t]] || '#6e7681';
        ctx.fillRect(24 + t * (W - 48) / trustGrad.length, bandY, (W - 48) / trustGrad.length, bandH);
      }
    }
  }

  ctx.restore();
}

// ═══ BRAID OVERLAY — the connections between surfaces as faint lines ═══
function paintBraidOverlay() {
  if (!nowFeed || !nowFeed.mesh) return;
  
  ctx.save();
  ctx.globalAlpha = 0.015;
  ctx.strokeStyle = '#58a6ff';
  ctx.lineWidth = 0.5;
  
  var nodes = nowFeed.mesh.nodes || [];
  var meshCount = nowFeed.mesh.count || nodes.length;
  
  for (var i = 0; i < meshCount && i < 7; i++) {
    var angle = (i / meshCount) * Math.PI * 2 + breathPhase * 0.1;
    var nx = W * 0.5 + Math.cos(angle) * Math.min(W, H) * 0.3;
    var ny = H * 0.5 + Math.sin(angle) * Math.min(W, H) * 0.3;
    
    // Connect to center
    ctx.beginPath();
    ctx.moveTo(W * 0.5, H * 0.5);
    ctx.lineTo(nx, ny);
    ctx.stroke();
    
    // Node dot
    ctx.fillStyle = '#58a6ff';
    ctx.beginPath();
    ctx.arc(nx, ny, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.restore();
}

// Inject overlays into the breath phase
var _origPaintBreath = paintBreath;
paintBreath = function() {
  _origPaintBreath();
  paintVoxelOverlay();
  paintChemistryOverlay();
  paintOutsideIn();
  paintBraidOverlay();
  paintEaselLabel();
};

// Cycle easel perspective each generation
var _origBeginNew = beginNewPainting;
beginNewPainting = function() {
  var eIdx = EASEL_CONSTANTS.indexOf(currentEasel);
  currentEasel = EASEL_CONSTANTS[(eIdx + 1) % EASEL_CONSTANTS.length];
  sharePainting();
  _origBeginNew();
};

// Expose for chipmunk
window._easel = {
  generation: function() { return generation; },
  starters: function() { return starters; },
  perspective: function() { return learnedTraits.perspective; },
  phase: function() { return phase; },
  selfChew: function() { return selfChew; },
  currentEasel: function() { return currentEasel; },
  outsidePaintings: function() { return beaconMessages; },
  nowFeed: function() { return nowFeed; },
  share: sharePainting,
  braid: function() { try { return JSON.parse(localStorage.getItem('easel_braid') || '[]'); } catch(e){ return []; } },
};
</script>
