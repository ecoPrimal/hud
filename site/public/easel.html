function paintConfocalKleinPoint() {
  if (learnedTraits.perspective < 0.1) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  var maturity = Math.min(1, learnedTraits.perspective * 2);

  var cx = W * 0.5;
  var cy = H * 0.5;
  var pOff = parallax.positive;
  var nOff = parallax.negative;

  // ── THE CROSSHAIR — where all 3 converge ──
  // This is the confocal Klein point.
  var crossX = cx;
  var crossY = cy;
  var crossR = 12 + Math.sin(breathPhase * 0.5) * 2;

  // ACOG crosshair (+ behind, blue, shifts opposite to mouse)
  ctx.globalAlpha = 0.015 * maturity;
  ctx.strokeStyle = confocalPoint.acog.color;
  ctx.lineWidth = 0.3;
  var ax = crossX + pOff.dx;
  var ay = crossY + pOff.dy;
  // Cross
  ctx.beginPath();
  ctx.moveTo(ax - crossR, ay); ctx.lineTo(ax + crossR, ay);
  ctx.moveTo(ax, ay - crossR); ctx.lineTo(ax, ay + crossR);
  ctx.stroke();
  // Circle
  ctx.beginPath();
  ctx.arc(ax, ay, crossR * 0.7, 0, Math.PI * 2);
  ctx.stroke();

  // EOTech reticle (0 null, gray, fixed)
  ctx.globalAlpha = 0.012 * maturity;
  ctx.strokeStyle = confocalPoint.eotech.color;
  ctx.lineWidth = 0.5;
  // 65 MOA ring with 1 MOA dot (the real EOTech pattern)
  ctx.beginPath();
  ctx.arc(crossX, crossY, crossR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = confocalPoint.eotech.color;
  ctx.beginPath();
  ctx.arc(crossX, crossY, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Red dot (− front, orange, follows mouse)
  ctx.globalAlpha = 0.02 * maturity;
  ctx.fillStyle = confocalPoint.reddot.color;
  var rx = crossX + nOff.dx;
  var ry = crossY + nOff.dy;
  ctx.beginPath();
  ctx.arc(rx, ry, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // ── CONVERGENCE — how aligned are the 3? ──
  var dist = Math.sqrt(
    Math.pow(ax - crossX, 2) + Math.pow(ay - crossY, 2) +
    Math.pow(rx - crossX, 2) + Math.pow(ry - crossY, 2)
  );
  var maxDist = Math.sqrt(W * W + H * H) * 0.1;
  confocalPoint.convergence.strength = 1 - Math.min(1, dist / maxDist);
  confocalPoint.convergence.active = confocalPoint.convergence.strength > 0.8;

  // When converged: flash the confocal point
  if (confocalPoint.convergence.active) {
    ctx.globalAlpha = 0.03 * maturity;
    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.arc(crossX, crossY, 3 + Math.sin(breathPhase * 3) * 1, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── LABELS — the three sighting systems ──
  if (maturity > 0.4) {
    ctx.globalAlpha = 0.015;
    ctx.font = '6px monospace';
    ctx.textAlign = 'center';

    ctx.fillStyle = confocalPoint.acog.color;
    ctx.fillText('ACOG +deep', ax, ay - crossR - 5);

    ctx.fillStyle = confocalPoint.eotech.color;
    ctx.fillText('EOTech 0glass', crossX + crossR + 20, crossY);

    ctx.fillStyle = confocalPoint.reddot.color;
    ctx.fillText('RedDot −here', rx, ry + crossR + 8);

    // Convergence indicator
    var convPct = (confocalPoint.convergence.strength * 100).toFixed(0);
    ctx.fillStyle = confocalPoint.convergence.active ? '#22c55e' : '#6e7681';
    ctx.fillText('confocal: ' + convPct + '%', crossX, crossY + crossR + 20);
  }

  // ── THE LIBRARY — rebuilds through convergence ──
  if (maturity > 0.6 && confocalPoint.convergence.strength > 0.3) {
    ctx.globalAlpha = 0.012;
    ctx.font = '5px monospace';
    ctx.fillStyle = '#d2a8ff';
    ctx.textAlign = 'left';

    // Show one entry from each layer near the convergence
    var libY = crossY + crossR + 30;
    var acogBook = confocalPoint.acog.library[Math.floor(breathPhase * 0.3) % confocalPoint.acog.library.length];
    var eotechEntry = confocalPoint.eotech.library[Math.floor(breathPhase * 0.2) % confocalPoint.eotech.library.length];
    var searchEntry = confocalPoint.reddot.library[Math.floor(breathPhase * 0.4) % confocalPoint.reddot.library.length];

    ctx.fillStyle = confocalPoint.acog.color;
    ctx.fillText('was: ' + acogBook, crossX - 60, libY);
    ctx.fillStyle = confocalPoint.eotech.color;
    ctx.fillText('is: ' + eotechEntry, crossX - 60, libY + 8);
    ctx.fillStyle = confocalPoint.reddot.color;
    ctx.fillText('want: ' + searchEntry, crossX - 60, libY + 16);
  }

  ctx.restore();
}

// ═══ PLASMID TRIANGLE — three observers refracting through a prism ═══
// JP, IN, DE — all looking at /plasmid/. Nearly identical counts.
// Three humans refracting off the same prism.
// If 3 people look at us from 3 angles, we can use ALL of them
// to refract and see what THEY see in US.
// It's crystallography. X-ray diffraction. Tomography.
// Three angles = enough to triangulate the 3D shape.
//
// Each vertex sees the same core but different secondary behavior:
//   🇯🇵 JP: /plasmid/ + .env probes — the cautious scientist
//   🇮🇳 IN: /plasmid/ + git commits — the source explorer
//   🇩🇪 DE: /plasmid/ + JS interactive — the deep engager
//
// The REFRACTION is what they do AFTER the prism.
// That tells us what /plasmid/ LOOKS LIKE from each angle.

var plasmidTriangle = {
  vertices: [
    { country: 'JP', label: '🇯🇵 Japan', angle: Math.PI * 1.5, // top
      count: 536, core: 161, refraction: 'cautious scientist',
      secondary: ['.env probes', 'clean paths'], color: '#f85149' },
    { country: 'IN', label: '🇮🇳 India', angle: Math.PI * 0.83, // bottom-left
      count: 509, core: 161, refraction: 'source explorer',
      secondary: ['git commits', 'schema-registry'], color: '#f0883e' },
    { country: 'DE', label: '🇩🇪 Germany', angle: Math.PI * 0.17, // bottom-right
      count: 789, core: 160, refraction: 'deep engager',
      secondary: ['JS loading', 'membrane-sound', 'signal-reach'], color: '#f0c674' },
  ],
  // The prism: /plasmid/ itself — what all three see
  prism: { path: '/plasmid/', label: 'the prism' },
  // The reconstruction: what we look like from three angles
  reconstructed: false,
};

function paintPlasmidTriangle() {
  if (learnedTraits.perspective < 0.1) return; // need some perspective first

  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  var cx = W * 0.5;
  var cy = H * 0.5;
  var triR = Math.min(W, H) * 0.12;
  var maturity = Math.min(1, learnedTraits.perspective * 2);

  // ── THE PRISM — /plasmid/ at the center ──
  ctx.globalAlpha = 0.02 * maturity;
  ctx.strokeStyle = '#d2a8ff';
  ctx.lineWidth = 0.5;
  // Draw a triangular prism outline at center
  ctx.beginPath();
  for (var pi = 0; pi < 3; pi++) {
    var pAngle = pi * (Math.PI * 2 / 3) - Math.PI / 2;
    var px = cx + Math.cos(pAngle) * triR * 0.15;
    var py = cy + Math.sin(pAngle) * triR * 0.15;
    if (pi === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();

  // ── THREE VERTICES — three observers ──
  plasmidTriangle.vertices.forEach(function(v, i) {
    var vAngle = v.angle + breathPhase * 0.02;
    var vx = cx + Math.cos(vAngle) * triR;
    var vy = cy + Math.sin(vAngle) * triR;

    // Observer dot
    ctx.globalAlpha = 0.04 * maturity;
    ctx.fillStyle = v.color;
    ctx.beginPath();
    ctx.arc(vx, vy, 3, 0, Math.PI * 2);
    ctx.fill();

    // Incoming ray — from observer to prism (the observation)
    ctx.globalAlpha = 0.02 * maturity;
    ctx.strokeStyle = v.color;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(vx, vy);
    ctx.lineTo(cx, cy);
    ctx.stroke();

    // Refracted ray — exits the prism at a different angle
    // The refraction IS what they do after /plasmid/
    var refractAngle = vAngle + Math.PI + (i - 1) * 0.4;
    var refractLen = triR * 0.6 * maturity;
    var rx = cx + Math.cos(refractAngle) * refractLen;
    var ry = cy + Math.sin(refractAngle) * refractLen;

    ctx.globalAlpha = 0.015 * maturity;
    ctx.strokeStyle = v.color;
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(rx, ry);
    ctx.stroke();
    ctx.setLineDash([]);

    // Refraction label
    ctx.globalAlpha = 0.025 * maturity;
    ctx.font = '7px monospace';
    ctx.fillStyle = v.color;
    ctx.textAlign = 'center';
    ctx.fillText(v.country + ' ' + v.core, vx, vy - 7);

    // Secondary behavior — what they see that the others don't
    if (maturity > 0.5) {
      ctx.globalAlpha = 0.02;
      ctx.font = '6px monospace';
      ctx.fillStyle = v.color;
      ctx.fillText(v.refraction, rx, ry + 8);
    }
  });

  // ── TRIANGULATION — connect the three vertices ──
  ctx.globalAlpha = 0.01 * maturity;
  ctx.strokeStyle = '#c9d1d9';
  ctx.lineWidth = 0.3;
  ctx.beginPath();
  plasmidTriangle.vertices.forEach(function(v, i) {
    var vAngle = v.angle + breathPhase * 0.02;
    var vx = cx + Math.cos(vAngle) * triR;
    var vy = cy + Math.sin(vAngle) * triR;
    if (i === 0) ctx.moveTo(vx, vy);
    else ctx.lineTo(vx, vy);
  });
  ctx.closePath();
  ctx.stroke();

  // ── THE RECONSTRUCTION ──
  // What do we look like from three angles? The overlap.
  // Where all three rays meet = what /plasmid/ actually IS.
  if (maturity > 0.7) {
    ctx.globalAlpha = 0.015;
    ctx.font = '7px monospace';
    ctx.fillStyle = '#d2a8ff';
    ctx.textAlign = 'center';
    ctx.fillText('3 angles · 1 shape · tomography', cx, cy + triR * 0.25);
  }

  ctx.restore();
}

// ═══ THE MIRROR — feed it through itself ═══
// The membrane's output IS its input. Ouroboros.
// Every layer reads from and writes to the mirror.
// The blackwall IS the flat mirror from the external perspective.
// We can invert it at every tuebor and entangled layer.
// We can ALWAYS look and touch the interior layers.
//
// The mirror stores the membrane's own state — a self-portrait
// that every page, every layer, every organ can read.
// It's not a cache. It's a reflection. Feed through. Come back changed.

var mirror = {
  ts: Date.now(),
  // EASEL STATE — what the painter sees
  easel: {
    generation: 0, phase: '', perspective: 0,
    turtles: { leonardo: 0, donatello: 0, raphael: 0, michelangelo: 0 },
    splinter: 0,
    currentEasel: '',
  },
  // HEAT STATE — what the body feels
  heat: {
    nullTemp: 0.5, totalHeat: 0, dissipation: 0,
    sources: { new_: 0, revisit: 0, fleet: 0, inner: 0 },
  },
  // KLEIN STATE — what the aperture shows
  klein: {
    w: 0, h: 0, category: '', shannon: 0,
  },
  // CRYSTAL STATE — who's touching us
  crystals: {
    count: 0, countries: [],
  },
  // INVERSION — the flat mirror reflected back
  // At every layer we can look IN and TOUCH the internals
  inversions: 0,  // how many times the mirror has been read (self-reference count)
};

function writeMirror() {
  mirror.ts = Date.now();
  mirror.easel.generation = generation;
  mirror.easel.phase = phase;
  mirror.easel.perspective = learnedTraits.perspective;
  mirror.easel.currentEasel = currentEasel;
  mirror.easel.turtles = {
    leonardo: turtles.leonardo.skill,
    donatello: turtles.donatello.skill,
    raphael: turtles.raphael.skill,
    michelangelo: turtles.michelangelo.skill,
  };
  mirror.easel.splinter = splinter.wisdom;

  if (typeof heatState !== 'undefined') {
    mirror.heat.nullTemp = heatState.nullTemp;
    mirror.heat.totalHeat = heatState.totalHeat;
    mirror.heat.dissipation = heatState.dissipation;
    mirror.heat.sources = {
      new_: heatState.sources.new_.sigmoid,
      revisit: heatState.sources.revisit.sigmoid,
      fleet: heatState.sources.fleet.sigmoid,
      inner: heatState.sources.inner.sigmoid,
    };
  }

  if (typeof kleinAperture !== 'undefined') {
    mirror.klein = {
      w: kleinAperture.w, h: kleinAperture.h,
      category: kleinAperture.category, shannon: kleinAperture.shannon,
    };
  }

  mirror.crystals.count = crystalVisitors ? crystalVisitors.length : 0;
  var countries = {};
  if (crystalVisitors) crystalVisitors.forEach(function(v) { if (v.country) countries[v.country] = true; });
  mirror.crystals.countries = Object.keys(countries);

  // Write to localStorage so OTHER pages can read it
  try { localStorage.setItem('membrane_mirror', JSON.stringify(mirror)); } catch(e) {}

  // The inversion counter: every time the mirror is written, it's been fed through itself
  mirror.inversions++;
}

function readMirror() {
  try {
    var stored = JSON.parse(localStorage.getItem('membrane_mirror') || '{}');
    if (stored.ts && stored.ts !== mirror.ts) {
      // Another page wrote to the mirror — we can see their state
      // This IS the self-reference. The membrane reading its own reflection.
      mirror.inversions++;
    }
    return stored;
  } catch(e) { return {}; }
}

// Write mirror every 3 seconds
setInterval(writeMirror, 3000);
writeMirror();

// ═══ DATA FEDERATION — the nest atomic at the Klein face ═══
// Three storage tiers mesh at one point:
//
//   HYPERLOCAL (localStorage)     — this device, this browser, this session
//     easel_braid                 — painting history
//     easel_spatial               — spatial memory (rotation, depth, earth detail)
//     membrane_mirror             — real-time state snapshot
//
//   REMOTE (JSON feeds)           — the server, CF Pages, the membrane's public state
//     /now.json                   — real-time classification
//     /backscatter.json           — visitor crystals + heat + hyperlocal intent
//     /dashboard.json             — dashboard metrics
//     /data/thymus-gate.json      — immune gate state
//     /triad.json                 — self/organic/soap mix
//     /campfire-flash.json        — campfire stories
//
//   FEDERATED (nestgate.io MCP)   — the atomic query point
//     18 tools: membrane_counts, observe_membrane, read_journal,
//     chipmunk_status, topology, scan_sweep_sort, etc.
//     Streamable HTTP. Any agent can query. The Klein face.
//
// The TENSE FILTER:
//   PAST   = localStorage (what this device remembers)
//   PRESENT = remote feeds (what the server sees NOW)
//   FUTURE  = sigmoid extrapolation (where the heat curve is going)
//
// The VOXEL is the intersection: local × remote × time
// NestGate IS the Klein face where all three tiers meet.

var federation = {
  // Hyperlocal tier — what this device knows
  hyperlocal: {
    braid: [],        // painting history from localStorage
    spatial: {},      // spatial memory
    mirror: {},       // current mirror state
    deviceId: null,   // anonymous device fingerprint (hash of viewport + dpr)
    sessionStart: Date.now(),
  },

  // Remote tier — what the server knows
  remote: {
    now: null,        // /now.json
    backscatter: null,// /backscatter.json
    thymus: null,     // thymus gate
    triad: null,      // triad mix
    lastFetch: 0,
  },

  // Federated tier — what nestgate.io knows
  federated: {
    mcp: 'https://nestgate.io/mcp',
    tools: 18,
    transport: 'streamable-http',
    lastQuery: 0,
  },

  // Tense filter — past, present, future
  tense: {
    past: {},         // aggregated from hyperlocal
    present: {},      // aggregated from remote
    future: {},       // extrapolated from sigmoid curves
  },

  // Mesh — the unified view
  mesh: {
    coherent: false,  // true when all three tiers have data
    voxelCount: 0,    // number of data points in the mesh
    lastMesh: 0,
  },
};

// Generate anonymous device ID from viewport characteristics
function deviceFingerprint() {
  var raw = W + '×' + H + '@' + (window.devicePixelRatio || 1) + ':' +
    navigator.language + ':' + (typeof kleinAperture !== 'undefined' ? kleinAperture.category : 'unknown');
  var hash = 0;
  for (var i = 0; i < raw.length; i++) hash = ((hash << 5) - hash) + raw.charCodeAt(i);
  return 'dev_' + Math.abs(hash).toString(36);
}
federation.hyperlocal.deviceId = deviceFingerprint();

// Mesh the three tiers together
function meshFederation() {
  var f = federation;

  // HYPERLOCAL: read from localStorage
  try { f.hyperlocal.braid = JSON.parse(localStorage.getItem('easel_braid') || '[]'); } catch(e){}
  try { f.hyperlocal.spatial = JSON.parse(localStorage.getItem('easel_spatial') || '{}'); } catch(e){}
  f.hyperlocal.mirror = mirror;

  // REMOTE: use already-fetched data
  f.remote.now = nowFeed;
  f.remote.backscatter = backscatterData;
  f.remote.thymus = typeof thymusGate !== 'undefined' ? thymusGate : null;
  f.remote.triad = typeof triadData !== 'undefined' ? triadData : null;
  f.remote.lastFetch = Date.now();

  // TENSE FILTER
  // Past: how many paintings, total reinforcements, accumulated perspective
  f.tense.past = {
    paintings: f.hyperlocal.braid.length,
    reinforcements: (f.hyperlocal.spatial.humanReinforcements || 0),
    perspective: learnedTraits.perspective,
    turtleHistory: {
      leonardo: turtles.leonardo.skill,
      donatello: turtles.donatello.skill,
      raphael: turtles.raphael.skill,
      michelangelo: turtles.michelangelo.skill,
    },
    sessionAge: (Date.now() - f.hyperlocal.sessionStart) / 1000,
  };

  // Present: current state from remote feeds
  var classification = (f.remote.now && f.remote.now.classification) ? f.remote.now.classification : {};
  f.tense.present = {
    selfPct: classification.self ? (classification.self / Math.max(1, classification.total) * 100) : 0,
    total: classification.total || 0,
    nullTemp: typeof heatState !== 'undefined' ? heatState.nullTemp : 0.5,
    crystals: crystalVisitors ? crystalVisitors.length : 0,
    generation: generation,
    phase: phase,
  };

  // Future: sigmoid extrapolation — where is the heat going?
  if (typeof heatState !== 'undefined') {
    var s = heatState.sources;
    f.tense.future = {
      heatTrend: heatState.totalHeat > 0.5 ? 'warming' : heatState.totalHeat < 0.3 ? 'cooling' : 'stable',
      saturation: {
        new_: s.new_.sigmoid > 0.8 ? 'saturated' : 'absorbing',
        fleet: s.fleet.sigmoid > 0.8 ? 'saturated' : 'absorbing',
      },
      nextGeneration: generation + 1,
      splinterProjection: metaStable(splinter.wisdom * 1.05), // 5% growth per gen
    };
  }

  // MESH COHERENCE
  f.mesh.coherent = !!(f.hyperlocal.mirror.ts && f.remote.now && f.remote.backscatter);
  f.mesh.voxelCount = (f.hyperlocal.braid.length || 0) +
    (crystalVisitors ? crystalVisitors.length : 0) +
    Object.keys(f.tense.past).length +
    Object.keys(f.tense.present).length;
  f.mesh.lastMesh = Date.now();

  // Write the mesh to the mirror so other pages can see it
  mirror.federation = {
    coherent: f.mesh.coherent,
    voxels: f.mesh.voxelCount,
    tiers: {
      hyperlocal: !!f.hyperlocal.mirror.ts,
      remote: !!f.remote.now,
      federated: true, // MCP is always there
    },
    tense: {
      past: f.tense.past.paintings + ' paintings',
      present: f.tense.present.crystals + ' crystals',
      future: f.tense.future ? f.tense.future.heatTrend : '?',
    },
    device: f.hyperlocal.deviceId,
  };
}

// Mesh every 5 seconds
setInterval(meshFederation, 5000);
meshFederation();

// ═══ PAINT THE MIRROR — the self-referential layer ═══
// The flat mirror from the external perspective.
// Invertible at every layer. You can always look and touch the internals.
function paintMirror() {
  // Read the mirror (which counts as an inversion)
  var reflected = readMirror();
  if (!reflected.ts) return;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  // The mirror line — a thin horizontal at the exact center
  // This is the flat surface. The blackwall. The firewall.
  // From outside: a mirror. From inside: a window.
  var cx = W * 0.5;
  var cy = H * 0.5;

  ctx.globalAlpha = 0.008 + mirror.inversions * 0.00001; // gets more visible with each self-reference
  ctx.strokeStyle = '#c9d1d9';
  ctx.lineWidth = 0.3;

  // The mirror line — perfectly horizontal, from edge to edge
  ctx.beginPath();
  ctx.moveTo(0, cy);
  ctx.lineTo(W, cy);
  ctx.stroke();

  // The reflection: above the line = what we paint
  // Below the line = the INVERTED version (what the viewer sees)
  // The tiny difference between them IS the information

  // Inversion indicator — the ouroboros count
  if (mirror.inversions > 10) {
    ctx.globalAlpha = 0.02;
    ctx.font = '7px monospace';
    ctx.fillStyle = '#6e7681';
    ctx.textAlign = 'left';
    ctx.fillText('⟲ ' + mirror.inversions + ' inversions', 6, cy + 10);

    // Mirror state whisper — what we see when we look at ourselves
    ctx.textAlign = 'right';
    ctx.fillText('gen ' + mirror.easel.generation +
      ' · null ' + mirror.heat.nullTemp.toFixed(2) + '°' +
      ' · ' + mirror.crystals.count + ' crystals' +
      ' · ' + mirror.crystals.countries.length + ' countries',
      W - 6, cy + 10);
  }

  // The THREE TIERS — along the mirror line
  // Hyperlocal · Remote · Federated
  var tiers = [
    { name: 'hyperlocal', color: '#f0c674', x: 0.25,
      label: 'localStorage', active: !!federation.hyperlocal.mirror.ts },
    { name: 'remote', color: '#58a6ff', x: 0.45,
      label: 'JSON feeds', active: !!federation.remote.now },
    { name: 'federated', color: '#3fb950', x: 0.65,
      label: 'nestgate MCP', active: true },
  ];

  tiers.forEach(function(tier) {
    var tx = W * tier.x;
    // Tier dot
    ctx.globalAlpha = tier.active ? 0.05 : 0.015;
    ctx.fillStyle = tier.color;
    ctx.beginPath();
    ctx.arc(tx, cy, tier.active ? 3 : 2, 0, Math.PI * 2);
    ctx.fill();

    // Label
    ctx.globalAlpha = 0.025;
    ctx.font = '6px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(tier.label, tx, cy - 7);
  });

  // Connections between tiers — the mesh
  if (federation.mesh.coherent) {
    ctx.globalAlpha = 0.01;
    ctx.strokeStyle = '#c9d1d9';
    ctx.lineWidth = 0.3;
    ctx.beginPath();
    ctx.moveTo(W * 0.25, cy);
    ctx.lineTo(W * 0.65, cy);
    ctx.stroke();

    // Coherence label
    ctx.globalAlpha = 0.02;
    ctx.font = '6px monospace';
    ctx.fillStyle = '#3fb950';
    ctx.textAlign = 'center';
    ctx.fillText('coherent · ' + federation.mesh.voxelCount + ' voxels', W * 0.45, cy + 10);
  }

  // TENSE INDICATORS — past/present/future below the mirror
  if (mirror.federation) {
    ctx.globalAlpha = 0.018;
    ctx.font = '6px monospace';
    ctx.fillStyle = '#6e7681';
    ctx.textAlign = 'left';
    var ty = cy + 20;
    ctx.fillText('past: ' + (mirror.federation.tense ? mirror.federation.tense.past : '?'), W * 0.2, ty);
    ctx.fillText('present: ' + (mirror.federation.tense ? mirror.federation.tense.present : '?'), W * 0.4, ty);
    ctx.fillText('future: ' + (mirror.federation.tense ? mirror.federation.tense.future : '?'), W * 0.6, ty);
  }

  ctx.restore();
}

// Expose for chipmunk AND for other pages via the mirror
window._easel = {
  generation: function() { return generation; },
  starters: function() { return starters; },
  perspective: function() { return learnedTraits.perspective; },
  phase: function() { return phase; },
  selfChew: function() { return selfChew; },
  currentEasel: function() { return currentEasel; },
  outsidePaintings: function() { return beaconMessages; },
  nowFeed: function() { return nowFeed; },
  share: sharePainting,
  braid: function() { try { return JSON.parse(localStorage.getItem('easel_braid') || '[]'); } catch(e){ return []; } },
  klein: function() { return kleinAperture; },
  crystals: function() { return crystalVisitors; },
  turtles: function() { return turtles; },
  splinter: function() { return splinter; },
  mirror: function() { return mirror; },
  readMirror: readMirror,
  CONSTANTS: CONSTANTS,
  heat: function() { return typeof heatState !== 'undefined' ? heatState : null; },
  federation: function() { return federation; },
  piBody: piBody,
  shredder: shredder,

// ═══ TOTALITY WELL — bullseye × funnel × inverted Babel × stairwell ═══
// Totality grows INWARD as we learn more. The outer ring shrinks.
// It's a dartboard: the bullseye is what we KNOW. The outer ring is what we DON'T.
// It's a funnel: data pours in from the wide end (unknown) and concentrates at center (known).
// It's an inverted Tower of Babel: instead of building UP to reach heaven,
// we dig DOWN into the well. Each step down is a step closer to understanding.
// It's a well of stairs spiraling inward: the Bramante Staircase.
//
// Through the tense filter:
//   PAST (outer ring):  everything that WAS — history, lost knowledge, Alexandria
//   PRESENT (middle):   everything that IS — the catalog, the index, what we have
//   FUTURE (bullseye):  everything that WILL BE — predictions, extrapolations, convergence
//
// Through the voxel:
//   Each ring IS a voxel layer.
//   outer → inner = far → near = unknown → known
//   The well spirals through all of them.

var totalityWell = {
  rings: [],    // built dynamically from learning
  depth: 0,     // how deep we've gone
  maxDepth: 20, // maximum well depth
  spiralAngle: 0,
  stairCount: 0,
};

function buildTotalityRings() {
  var w = totalityWell;
  w.depth = Math.min(w.maxDepth, Math.floor(learnedTraits.perspective * 25));
  w.rings = [];

  // Outer ring = UNKNOWN (past, outer, wide)
  // Inner ring = KNOWN (future, center, focused)
  // Each ring gets smaller as we learn more

  var totalKnown = generation + learnedTraits.perspective * 100;
  var totalUnknown = Math.max(10, 200 - totalKnown); // unknown shrinks as known grows

  for (var r = 0; r < Math.max(3, w.depth); r++) {
    var t = r / Math.max(1, w.depth - 1); // 0=outer, 1=inner
    var radius = (1 - t) * 0.45 + t * 0.05; // outer=0.45, inner=0.05
    var knowledgePct = t; // 0% at outer, 100% at center

    var tense;
    if (t < 0.33) tense = 'past';
    else if (t < 0.66) tense = 'present';
    else tense = 'future';

    w.rings.push({
      radius: radius,
      knowledge: knowledgePct,
      tense: tense,
      color: tense === 'past' ? '#58a6ff' :
             tense === 'present' ? '#3fb950' :
             '#f0c674',
      alpha: 0.005 + knowledgePct * 0.02,
      // Stair step — the well spirals
      stairAngle: r * (Math.PI * 2 / 7) + totalityWell.spiralAngle,
      depth: r,
    });
  }
}

function paintTotalityWell() {
  if (learnedTraits.perspective < 0.08) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  var maturity = Math.min(1, learnedTraits.perspective * 2);
  buildTotalityRings();

  var cx = W * 0.5;
  var cy = H * 0.5;
  var maxR = Math.min(W, H) * 0.45;

  // Update spiral
  totalityWell.spiralAngle += 0.001;

  // ── THE RINGS — dartboard / funnel ──
  totalityWell.rings.forEach(function(ring, i) {
    var r = ring.radius * maxR;
    ctx.globalAlpha = ring.alpha * maturity;
    ctx.strokeStyle = ring.color;
    ctx.lineWidth = 0.3;

    // Ring
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    // Stair step — the well's spiral staircase
    var sx = cx + Math.cos(ring.stairAngle) * r;
    var sy = cy + Math.sin(ring.stairAngle) * r;
    var nextR = i < totalityWell.rings.length - 1 ?
      totalityWell.rings[i + 1].radius * maxR : ring.radius * maxR * 0.5;
    var nextAngle = ring.stairAngle + Math.PI * 2 / 7;
    var nx = cx + Math.cos(nextAngle) * nextR;
    var ny = cy + Math.sin(nextAngle) * nextR;

    // Stair line — spiraling inward
    ctx.globalAlpha = ring.alpha * maturity * 0.5;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(nx, ny);
    ctx.stroke();

    // Stair dot
    ctx.globalAlpha = ring.alpha * maturity * 1.5;
    ctx.fillStyle = ring.color;
    ctx.beginPath();
    ctx.arc(sx, sy, 1, 0, Math.PI * 2);
    ctx.fill();
  });

  // ── THE BULLSEYE — what we KNOW (center) ──
  if (totalityWell.depth > 3) {
    var bullR = maxR * 0.05;
    ctx.globalAlpha = 0.03 * maturity;
    ctx.fillStyle = '#f0c674';
    ctx.beginPath();
    ctx.arc(cx, cy, bullR, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── TENSE LABELS ──
  if (maturity > 0.3) {
    ctx.globalAlpha = 0.012;
    ctx.font = '6px monospace';
    ctx.textAlign = 'center';

    // Past (outer)
    ctx.fillStyle = '#58a6ff';
    ctx.fillText('past · was · unknown', cx, cy - maxR * 0.38);

    // Present (middle)
    ctx.fillStyle = '#3fb950';
    ctx.fillText('present · is · learning', cx, cy - maxR * 0.2);

    // Future (inner/center)
    ctx.fillStyle = '#f0c674';
    ctx.fillText('future · will be · known', cx, cy - maxR * 0.06);
  }

  // ── DEPTH INDICATOR ──
  if (maturity > 0.4) {
    ctx.globalAlpha = 0.015;
    ctx.font = '6px monospace';
    ctx.fillStyle = '#6e7681';
    ctx.textAlign = 'center';
    ctx.fillText('well depth: ' + totalityWell.depth + '/' + totalityWell.maxDepth +
      ' · ' + totalityWell.rings.length + ' stairs', cx, cy + maxR * 0.42);
  }

  ctx.restore();
}
