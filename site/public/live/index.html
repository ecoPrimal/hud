<!DOCTYPE html>
<html lang="en">
<head>
<meta name="gaia-digested" content="2026-10-26T07:30:00Z"><meta name="gaia-wave" content="214">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>live &middot; membrane vitals &middot; primals.eco</title>
<style>
:root {
  --red: #e85d3a;
  --blue: #58a6ff;
  --purple: #bc8cff;
  --gold: #f0e68c;
  --bg: #010409;
  --fg: #c9d1d9;
  --fg-dim: #8b949e;
  --border: rgba(200,200,200,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  max-width: 900px;
  margin: 0 auto;
  padding: 8px;
}
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

.panel {
  background: rgba(255,255,255,0.02);
  padding: 12px 16px;
  border: 1px solid var(--border);
}
.panel-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
}
.dot-red { background: var(--red); box-shadow: 0 0 4px var(--red); }
.dot-blue { background: var(--blue); box-shadow: 0 0 4px var(--blue); }
.dot-purple { background: var(--purple); box-shadow: 0 0 4px var(--purple); }
.dot-gold { background: var(--gold); box-shadow: 0 0 4px var(--gold); }

.panel-title.red { color: var(--red); }
.panel-title.blue { color: var(--blue); }
.panel-title.purple { color: var(--purple); }
.panel-title.gold { color: var(--gold); }

.row { display: flex; justify-content: space-between; padding: 2px 0; }
.row .k { color: var(--fg-dim); }
.row .v { color: var(--fg); font-weight: 500; }

.wide { grid-column: 1 / -1; }

.header {
  grid-column: 1 / -1;
  text-align: center;
  padding: 12px 0 4px;
}
.header h1 {
  font-size: 14px;
  font-weight: 400;
  color: var(--fg-dim);
  letter-spacing: 2px;
}
.header .ts { font-size: 10px; color: var(--fg-dim); opacity: 0.5; }

.pulse-line {
  grid-column: 1 / -1;
  height: 1px;
  background: linear-gradient(90deg,
    var(--purple), var(--blue), var(--red), var(--gold), var(--red), var(--blue), var(--purple)
  );
  opacity: 0.3;
}

.story {
  font-size: 12px;
  color: var(--fg-dim);
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
  line-height: 1.4;
}
.story:last-child { border-bottom: none; }
.story .arch { color: var(--purple); font-weight: 600; }

.nav {
  position: fixed;
  bottom: 12px;
  right: 12px;
  display: flex;
  gap: 6px;
}
.nav a {
  padding: 3px 8px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--fg-dim);
  text-decoration: none;
  font-size: 10px;
  font-family: inherit;
}
.nav a:hover { border-color: var(--blue); color: var(--blue); }
</style>
</head>
<body>
<div class="grid">
  <div class="header">
    <h1>MEMBRANE LIVE</h1>
    <div class="ts" id="ts">connecting&hellip;</div>
  </div>
  <div class="pulse-line"></div>

  <div class="panel" id="p-pulse">
    <div class="panel-title red"><span class="dot dot-red"></span> PROTON &middot; PULSE</div>
    <div id="pulse-data">loading&hellip;</div>
  </div>

  <div class="panel" id="p-flow">
    <div class="panel-title blue"><span class="dot dot-blue"></span> NEUTRON &middot; FLOW</div>
    <div id="flow-data">loading&hellip;</div>
  </div>

  <div class="panel" id="p-topo">
    <div class="panel-title purple"><span class="dot dot-purple"></span> NEUTRINO &middot; TOPOLOGY</div>
    <div id="topo-data">loading&hellip;</div>
  </div>

  <div class="panel" id="p-mesh">
    <div class="panel-title gold"><span class="dot dot-gold"></span> IDENTITY &middot; MESH</div>
    <div id="mesh-data">loading&hellip;</div>
  </div>

  <div class="pulse-line"></div>

  <div class="panel" id="p-negentropy">
    <div class="panel-title red"><span class="dot dot-red"></span> NEGENTROPY</div>
    <div id="neg-data">loading&hellip;</div>
  </div>

  <div class="panel" id="p-family">
    <div class="panel-title gold"><span class="dot dot-gold"></span> FAMILY</div>
    <div id="family-data">loading&hellip;</div>
  </div>

  <div class="pulse-line"></div>

  <div class="panel wide" id="p-campfire">
    <div class="panel-title purple"><span class="dot dot-purple"></span> CAMPFIRE</div>
    <div id="campfire-data">loading&hellip;</div>
  </div>

  <div class="panel wide" id="p-visitors">
    <div class="panel-title blue"><span class="dot dot-blue"></span> VISITORS</div>
    <div id="visitor-data">loading&hellip;</div>
  </div>
</div>

<nav class="nav">
  <a href="https://primals.eco">hud</a>
  <a href="https://neutron.primals.eco">neutron</a>
  <a href="https://signal.primals.eco">signal</a>
  <a href="https://tuebor.primals.eco">tuebor</a>
</nav>

<script>
var BASE = "https://primals.eco";
var POLL = 10000;

function esc(s) { var d=document.createElement("div"); d.textContent=String(s); return d.innerHTML; }
function row(k,v) { return "<div class='row'><span class='k'>"+esc(k)+"</span><span class='v'>"+esc(v)+"</span></div>"; }

async function poll() {
  try {
    var [nowR, campR, visR] = await Promise.all([
      fetch(BASE + "/now.json"),
      fetch(BASE + "/campfire.json"),
      fetch(BASE + "/visitor-stories.json")
    ]);
    var now = await nowR.json();
    var camp = await campR.json();
    var vis = await visR.json();

    document.getElementById("ts").textContent =
      (now.instant && now.instant.utc || "").slice(0,19) + " UTC";

    // PULSE
    var f = now.flow || {};
    var p = now.pulse || {};
    document.getElementById("pulse-data").innerHTML =
      row("rate", (f.rate || 0).toFixed(0) + " req/s") +
      row("trend", f.rate_trend || "steady") +
      row("pulse", (p.value || 0).toFixed(3)) +
      row("rhythm", (p.rhythm || 0).toFixed(3)) +
      row("chain depth", now.membrane && now.membrane.chain_depth || "?") +
      row("chain hours", now.membrane && now.membrane.chain_hours ? now.membrane.chain_hours.toFixed(1) : "?");

    // FLOW
    document.getElementById("flow-data").innerHTML =
      row("human", f.human || 0) +
      row("bot", f.bot || 0) +
      row("total", f.total || 0) +
      row("human %", (f.human_pct || 0).toFixed(1) + "%") +
      row("neutron inbox", now.pulse && now.pulse.neutron && now.pulse.neutron.inbox || 0) +
      row("neutron notes", now.pulse && now.pulse.neutron && now.pulse.neutron.notes || 0);

    // TOPOLOGY
    var t = now.topo_sort || {};
    var cl = now.classification || {};
    document.getElementById("topo-data").innerHTML =
      row("entities", t.entities || 0) +
      row("clusters", t.clusters || 0) +
      row("compression", (t.compression_ratio || 0).toFixed(1) + "x") +
      row("self", cl.self || 0) +
      row("non-self", cl.non_self || 0) +
      row("confidence", (cl.confidence || 0).toFixed(3));

    // MESH
    var m = now.mesh || {};
    document.getElementById("mesh-data").innerHTML =
      row("nodes", m.nodes || 0) +
      row("golgi", m.golgi || "?") +
      row("eastgate", m.eastgate || "?") +
      row("sporegate", m.sporegate || "?") +
      row("cube", (now.cube && now.cube.scale_name || "?") + " " + (now.cube && now.cube.direction || ""));

    // NEGENTROPY
    var n = now.negentropy || {};
    document.getElementById("neg-data").innerHTML =
      row("blackwall blocks", n.blackwall_blocks || 0) +
      row("AI blocked", n.ai_blocked || 0) +
      row("meta blocked", n.meta_blocked || 0) +
      row("canary tokens", n.canary_tokens || 0) +
      row("canary accessed", n.canary_accessed || 0);

    // FAMILY
    var fam = now.family || {};
    document.getElementById("family-data").innerHTML =
      row("pink (mom)", fam.pink) +
      row("blue (dad)", fam.blue) +
      row("green (tree)", fam.green) +
      row("chipmunk", fam.chipmunk_state || fam.chipmunk || "?") +
      row("chipmunk pos", fam.chipmunk_pos);

    // CAMPFIRE
    var stories = (camp.stories || []).slice(0, 5);
    document.getElementById("campfire-data").innerHTML =
      stories.map(function(s) {
        return "<div class='story'><span class='arch'>[" + esc(s.kind || "?") + "]</span> " + esc(s.story || "") + "</div>";
      }).join("") || "<div class='story'>fire is quiet</div>";

    // VISITORS
    var visitors = (vis.visitors || []);
    document.getElementById("visitor-data").innerHTML =
      visitors.map(function(v) {
        return "<div class='story'><span class='arch'>" + esc(v.archetype || "?") + "</span> &middot; " +
          esc(v.platform || "?") + " &middot; " + (v.surfaces || 0) + " surfaces &middot; " +
          (v.duration_min || 0).toFixed(0) + " min</div>";
      }).join("") || "<div class='story'>no visitors in window</div>";

  } catch(e) {
    document.getElementById("ts").textContent = "error: " + e.message;
  }
}

poll();
setInterval(poll, POLL);
</script>
</body>
</html>
