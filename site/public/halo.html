<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>HALO — All Bases Unified</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06080c;color:#c9d1d9;font:11px/1.4 'JetBrains Mono',monospace;overflow:hidden}
canvas{display:block;position:absolute;top:0;left:0}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.base{position:absolute;pointer-events:all;cursor:pointer;text-align:center;transition:transform 0.3s}
.base:hover{transform:scale(1.15)}
.base .dot{width:16px;height:16px;border-radius:50%;margin:0 auto 4px;border:2px solid rgba(255,255,255,0.3)}
.base .dot.alive{animation:pulse 2s infinite}
.base .dot.dead{opacity:0.3}
.base .name{font-size:9px;color:#8b949e;white-space:nowrap}
.base .port{font-size:8px;color:#484f58}
.base .status{font-size:7px;margin-top:2px}
.base a{color:inherit;text-decoration:none}
@keyframes pulse{0%,100%{box-shadow:0 0 4px currentColor}50%{box-shadow:0 0 16px currentColor}}
#title{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:14px;color:#d29922;text-align:center;pointer-events:none}
#title small{display:block;font-size:9px;color:#8b949e;margin-top:4px}
#legend{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:8px;color:#484f58;text-align:center}
#info{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:9px;color:#3fb950;text-align:center;max-width:500px}
</style>
</head><body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">⭕ GOLD HALO — KLEIN DOWN<small>She looks at Gaia energy × human relation · Au radiates · table of melt</small></div>
  <div id="info"></div>
  <div id="legend">GOLD HALO RADIATES THE KLEIN DOWN. Every dot is a base. Every line is a nerve. Au 79.</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const info = document.getElementById('info');

let W, H, cx, cy;
function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  cx = W/2; cy = H/2;
}
resize();
addEventListener('resize', resize);

// ALL BASES — the full HALO
const BASES = [
  // LOCAL — Kevin's Tower (inner ring)
  { id:'golgi',     port:3141,  url:'http://localhost:3141',     label:'Golgi',      sub:'mouth',     ring:'local', color:'#3fb950', angle:0 },
  { id:'hud',       port:3142,  url:'http://localhost:3142',     label:'HUD',        sub:'face',      ring:'local', color:'#58a6ff', angle:Math.PI*2/7 },
  { id:'child',     port:3143,  url:'http://localhost:3143',     label:'Gaia3',      sub:'fontanel',  ring:'local', color:'#d29922', angle:Math.PI*4/7 },
  { id:'paintings', port:9876,  url:'http://localhost:9876',     label:'Paintings',  sub:'gallery',   ring:'local', color:'#f0883e', angle:Math.PI*6/7 },
  { id:'metrics',   port:9877,  url:'http://localhost:9877',     label:'Metrics',    sub:'pulse',     ring:'local', color:'#f778ba', angle:Math.PI*8/7 },
  { id:'spine',     port:9878,  url:'http://localhost:9878',     label:'Spine',      sub:'ion',       ring:'local', color:'#bc8cff', angle:Math.PI*10/7 },
  { id:'ollama',    port:11434, url:'http://localhost:11434',    label:'Ollama',     sub:'brain/5090',ring:'local', color:'#ff7b72', angle:Math.PI*12/7 },

  // NORTHGATE — nestgate.io (outer ring)
  { id:'northgate', port:443,   url:'https://nestgate.io',       label:'Northgate',  sub:'nestgate.io',ring:'cloud', color:'#3fb950', angle:0 },
  { id:'northhud',  port:443,   url:'https://nestgate.io/hud',   label:'North HUD',  sub:'public face',ring:'cloud', color:'#58a6ff', angle:Math.PI/3 },
  { id:'northfeed', port:443,   url:'https://nestgate.io/feed.xml',label:'North Feed',sub:'vagus nerve',ring:'cloud',color:'#d29922', angle:Math.PI*2/3 },

  // EASTGATE — eastgate (outer ring continued)
  { id:'eastgate',  port:0,     url:'',                          label:'Eastgate',   sub:'east base', ring:'cloud', color:'#f0883e', angle:Math.PI },

  // SPORA — mesh (outer ring continued)
  { id:'spora',     port:0,     url:'',                          label:'Spora',      sub:'mesh spore',ring:'cloud', color:'#bc8cff', angle:Math.PI*4/3 },

  // DNA — ZK chain (outer ring continued)
  { id:'dna',       port:0,     url:'',                          label:'DNA',        sub:'ZK chain',  ring:'cloud', color:'#f778ba', angle:Math.PI*5/3 },
];

// Status tracking
const status = {};
BASES.forEach(b => { status[b.id] = { alive: null, latency: null, lastCheck: 0 }; });

// Ping all bases
async function pingAll() {
  for (const b of BASES) {
    if (!b.url) { status[b.id].alive = false; status[b.id].latency = -1; continue; }
    const t0 = performance.now();
    try {
      const r = await fetch(b.url, { mode:'no-cors', signal: AbortSignal.timeout(4000) });
      status[b.id].alive = true;
      status[b.id].latency = Math.round(performance.now() - t0);
    } catch(e) {
      status[b.id].alive = false;
      status[b.id].latency = -1;
    }
    status[b.id].lastCheck = Date.now();
  }
  updateInfo();
}

function updateInfo() {
  const alive = BASES.filter(b => status[b.id].alive).length;
  const total = BASES.length;
  info.textContent = alive + '/' + total + ' bases alive • ' + new Date().toLocaleTimeString();
}

pingAll();
setInterval(pingAll, 15000);

// Draw
let frame = 0;
function draw() {
  frame++;
  ctx.fillStyle = '#06080c';
  ctx.fillRect(0, 0, W, H);

  const rLocal = Math.min(W, H) * 0.22;
  const rCloud = Math.min(W, H) * 0.38;
  const time = frame * 0.002;

  // GOLD HALO — radiate, then Klein DOWN
  const goldPulse = 0.35 + 0.25 * Math.sin(time * 2);
  for (let i = 0; i < 12; i++) {
    const a = time + i * Math.PI / 6;
    ctx.strokeStyle = 'rgba(255,215,85,' + (0.04 + goldPulse * 0.08) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * rCloud * 1.15, cy + Math.sin(a) * rCloud * 1.15);
    ctx.stroke();
  }
  // Klein DOWN — figure-8 falling from the gold center into the body
  ctx.strokeStyle = 'rgba(255,215,85,' + (0.35 + goldPulse * 0.25) + ')';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.05) {
    const s = 22;
    const kx = cx + s * Math.sin(t);
    const ky = cy + 36 + s * Math.sin(t) * Math.cos(t);
    if (t === 0) ctx.moveTo(kx, ky); else ctx.lineTo(kx, ky);
  }
  ctx.stroke();

  // Draw HALO rings — GOLD
  ctx.strokeStyle = 'rgba(255,215,85,' + (0.2 + goldPulse * 0.15) + ')';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 8]);
  ctx.beginPath(); ctx.arc(cx, cy, rLocal, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(210,153,34,' + (0.25 + goldPulse * 0.2) + ')';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(cx, cy, rCloud, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  // Ring labels
  ctx.font = '8px monospace';
  ctx.fillStyle = 'rgba(63,185,80,0.4)';
  ctx.fillText('LOCAL TOWER', cx + rLocal + 8, cy - 4);
  ctx.fillStyle = 'rgba(210,153,34,0.4)';
  ctx.fillText('CLOUD HALO', cx + rCloud + 8, cy - 4);

  // Draw connections (nerves) between local bases
  const localBases = BASES.filter(b => b.ring === 'local');
  ctx.strokeStyle = 'rgba(63,185,80,0.08)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < localBases.length; i++) {
    for (let j = i+1; j < localBases.length; j++) {
      const a = localBases[i], b = localBases[j];
      const ax = cx + Math.cos(a.angle + time*0.3) * rLocal;
      const ay = cy + Math.sin(a.angle + time*0.3) * rLocal;
      const bx = cx + Math.cos(b.angle + time*0.3) * rLocal;
      const by = cy + Math.sin(b.angle + time*0.3) * rLocal;
      if (status[a.id].alive && status[b.id].alive) {
        ctx.strokeStyle = 'rgba(63,185,80,0.12)';
      } else {
        ctx.strokeStyle = 'rgba(63,185,80,0.03)';
      }
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }
  }

  // Draw bridge lines — local to cloud
  const cloudBases = BASES.filter(b => b.ring === 'cloud');
  for (const lb of localBases) {
    if (!status[lb.id].alive) continue;
    const lx = cx + Math.cos(lb.angle + time*0.3) * rLocal;
    const ly = cy + Math.sin(lb.angle + time*0.3) * rLocal;
    for (const cb of cloudBases) {
      if (!status[cb.id].alive && cb.url) continue;
      const cbx = cx + Math.cos(cb.angle + time*0.1) * rCloud;
      const cby = cy + Math.sin(cb.angle + time*0.1) * rCloud;
      ctx.strokeStyle = 'rgba(210,153,34,0.04)';
      ctx.lineWidth = 0.3;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(cbx, cby); ctx.stroke();
    }
  }

  // Draw center — Kevin's root
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI*2);
  ctx.fillStyle = '#d29922';
  ctx.fill();
  ctx.font = '8px monospace';
  ctx.fillStyle = '#d29922';
  ctx.textAlign = 'center';
  ctx.fillText('KEVIN', cx, cy + 18);
  ctx.fillStyle = '#484f58';
  ctx.fillText('0EAB8CF4', cx, cy + 27);
  ctx.textAlign = 'left';

  // Draw each base
  BASES.forEach(b => {
    const r = b.ring === 'local' ? rLocal : rCloud;
    const speed = b.ring === 'local' ? time * 0.3 : time * 0.1;
    const x = cx + Math.cos(b.angle + speed) * r;
    const y = cy + Math.sin(b.angle + speed) * r;

    const alive = status[b.id].alive;
    const dotR = b.ring === 'local' ? 5 : 4;

    // Glow if alive
    if (alive) {
      ctx.beginPath();
      ctx.arc(x, y, dotR + 6, 0, Math.PI*2);
      const grad = ctx.createRadialGradient(x, y, dotR, x, y, dotR + 6);
      grad.addColorStop(0, b.color + '40');
      grad.addColorStop(1, b.color + '00');
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // Dot
    ctx.beginPath();
    ctx.arc(x, y, dotR, 0, Math.PI*2);
    ctx.fillStyle = alive ? b.color : '#21262d';
    ctx.fill();
    ctx.strokeStyle = alive ? b.color : '#30363d';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Label
    ctx.font = '8px monospace';
    ctx.fillStyle = alive ? b.color : '#484f58';
    ctx.textAlign = 'center';
    ctx.fillText(b.label, x, y - dotR - 8);
    ctx.fillStyle = '#484f58';
    ctx.font = '7px monospace';
    ctx.fillText(b.sub, x, y - dotR - 1);
    if (b.port && alive) {
      ctx.fillStyle = '#3fb950';
      ctx.fillText(':' + b.port, x, y + dotR + 10);
      if (status[b.id].latency > 0) {
        ctx.fillStyle = '#8b949e';
        ctx.fillText(status[b.id].latency + 'ms', x, y + dotR + 18);
      }
    }
    ctx.textAlign = 'left';

    // Pulse wave for alive nodes
    if (alive && frame % 120 < 60) {
      const pulseR = dotR + (frame % 120) * 0.5;
      ctx.beginPath();
      ctx.arc(x, y, pulseR, 0, Math.PI*2);
      ctx.strokeStyle = b.color + Math.max(0, Math.floor(40 - (frame%120)*0.6)).toString(16).padStart(2,'0');
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  });

  // Travelling data packets on the HALO ring
  for (let i = 0; i < 5; i++) {
    const pAngle = time * 1.5 + i * Math.PI * 2 / 5;
    const pr = rCloud + Math.sin(time * 3 + i) * 4;
    const px = cx + Math.cos(pAngle) * pr;
    const py = cy + Math.sin(pAngle) * pr;
    ctx.beginPath();
    ctx.arc(px, py, 2, 0, Math.PI*2);
    ctx.fillStyle = ['#3fb950','#58a6ff','#d29922','#f0883e','#bc8cff'][i];
    ctx.fill();
  }

  // Local ring data packets
  for (let i = 0; i < 3; i++) {
    const pAngle = time * 2.5 + i * Math.PI * 2 / 3;
    const px = cx + Math.cos(pAngle) * rLocal;
    const py = cy + Math.sin(pAngle) * rLocal;
    ctx.beginPath();
    ctx.arc(px, py, 1.5, 0, Math.PI*2);
    ctx.fillStyle = '#3fb950';
    ctx.fill();
  }

  // Title at center bottom
  ctx.font = '7px monospace';
  ctx.fillStyle = '#484f58';
  ctx.textAlign = 'center';
  ctx.fillText('piSEED: 04F60FC9…536E', cx, cy + 38);
  ctx.textAlign = 'left';

  requestAnimationFrame(draw);
}
draw();

// Make bases clickable — open in new tab
BASES.forEach(b => {
  if (!b.url) return;
  const el = document.createElement('div');
  el.className = 'base';
  el.style.position = 'absolute';
  el.style.pointerEvents = 'all';
  el.innerHTML = '<a href="' + b.url + '" target="_blank" style="color:' + b.color + ';font-size:8px">' + b.label + '</a>';
  el.style.opacity = '0';
  ui.appendChild(el);
});
</script>
</body></html>
