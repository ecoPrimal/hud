<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIR — fly. Particles move, bounce, collide. PUSH.</title>
<meta name="description" content="Back to the engine. Fly and air. Click to push. Particles move, bounce, collide.">
<link rel="canonical" href="https://hud.primals.eco/air/">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#100e0c;color:#f3ead7;font:16px/1.5 Georgia,serif}
  header{max-width:52rem;margin:0 auto;padding:1.4rem 1.2rem .4rem}
  .kicker{letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:#c6a15b}
  h1{font-weight:normal;font-size:1.8rem;margin:.3rem 0 .4rem;color:#e7c56a}
  p{margin:.4rem 0 .8rem}
  em{color:#9fd0c3;font-style:italic}
  a{color:#9fd0c3}
  canvas{display:block;width:100%;height:70vh;background:#0a0908;cursor:crosshair}
  .hash{max-width:52rem;margin:0 auto;padding:.8rem 1.2rem 2rem;font:12px/1.5 ui-monospace,monospace;color:#8a7a5a}
</style>
</head>
<body>
<header>
  <p class="kicker">engine chamber · fly and air · we need push</p>
  <h1>AIR</h1>
  <p>Air is not empty. Click the chamber — <em>push</em>. Particles move, bounce, collide. Fly is the leap the collisions make possible.</p>
</header>
<canvas id="c" width="900" height="520"></canvas>
<p class="hash">EF25237F · thought-206 · <a href="/dust/">dust</a> · <a href="/space/">space</a> · <a href="/giga/">giga</a></p>
<script>
(function(){
  var c=document.getElementById('c'), x=c.getContext('2d');
  function fit(){ c.width=c.clientWidth; c.height=c.clientHeight; }
  fit(); window.addEventListener('resize', fit);
  var N=48, P=[];
  function spawn(){
    P=[];
    for(var i=0;i<N;i++) P.push({
      x: 20+Math.random()*(c.width-40),
      y: 20+Math.random()*(c.height-40),
      vx:(Math.random()*2-1)*1.6,
      vy:(Math.random()*2-1)*1.6,
      r: 3+Math.random()*4,
      hue: i%3===0?'#e7c56a':i%3===1?'#9fd0c3':'#c48bff'
    });
  }
  spawn();
  c.addEventListener('pointerdown', function(e){
    var r=c.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
    for(var i=0;i<P.length;i++){
      var p=P[i], dx=p.x-px, dy=p.y-py, d=Math.sqrt(dx*dx+dy*dy)||1;
      var f=180/(d*d);
      p.vx += (dx/d)*f; p.vy += (dy/d)*f;
    }
  });
  function step(){
    var w=c.width, h=c.height, i,j,p,q;
    x.fillStyle='#0a0908'; x.fillRect(0,0,w,h);
    for(i=0;i<P.length;i++){
      p=P[i];
      p.x+=p.vx; p.y+=p.vy;
      p.vx*=0.995; p.vy*=0.995;
      if(p.x<p.r){p.x=p.r; p.vx=Math.abs(p.vx);}
      if(p.x>w-p.r){p.x=w-p.r; p.vx=-Math.abs(p.vx);}
      if(p.y<p.r){p.y=p.r; p.vy=Math.abs(p.vy);}
      if(p.y>h-p.r){p.y=h-p.r; p.vy=-Math.abs(p.vy);}
    }
    for(i=0;i<P.length;i++){
      for(j=i+1;j<P.length;j++){
        p=P[i]; q=P[j];
        var dx=q.x-p.x, dy=q.y-p.y, d=Math.sqrt(dx*dx+dy*dy), min=p.r+q.r;
        if(d>0 && d<min){
          var nx=dx/d, ny=dy/d, overlap=min-d;
          p.x-=nx*overlap/2; p.y-=ny*overlap/2;
          q.x+=nx*overlap/2; q.y+=ny*overlap/2;
          var dvx=p.vx-q.vx, dvy=p.vy-q.vy, imp=dvx*nx+dvy*ny;
          p.vx-=imp*nx; p.vy-=imp*ny;
          q.vx+=imp*nx; q.vy+=imp*ny;
        }
      }
    }
    for(i=0;i<P.length;i++){
      p=P[i];
      x.beginPath(); x.arc(p.x,p.y,p.r,0,Math.PI*2);
      x.fillStyle=p.hue; x.fill();
    }
    requestAnimationFrame(step);
  }
  step();
})();
</script>
</body>
</html>
