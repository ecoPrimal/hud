<title>Subsystem sort  ecoPrimals</title>
<style>
:root{--bg:#0d1117;--fg:#c9d1d9;--accent:#58a6ff;--green:#3fb950;--gold:#d29922;--border:#21262d;--dim:#6e7681;--surface:#161b22}
body{margin:0;font-family:'SF Mono',ui-monospace,monospace;background:var(--bg);color:var(--fg);line-height:1.6}
main{max-width:720px;margin:0 auto;padding:2rem 1rem 4rem}
h1{color:var(--accent);font-size:1.5em;font-weight:300;margin:0 0 .3em}
.tag{color:var(--gold);font-weight:600;font-size:.85em}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;margin:.8rem 0}
.card h3{color:var(--green);font-size:.95em;margin:0 0 .3em}
.card .status{font-size:.75em;font-weight:700;padding:.15em .4em;border-radius:4px;display:inline-block}
.live{background:#238636;color:#fff}
.stub{background:#d29922;color:#0d1117}
.role{color:var(--gold);font-size:.8em;margin:.3em 0}
.resolve{color:var(--dim);font-size:.82em;margin:.3em 0}
a{color:var(--accent)}
.plan{border-top:1px solid var(--border);margin-top:1.5rem;padding-top:1rem}
.plan dt{color:var(--green);font-weight:600}
.plan dd{margin:0 0 .5em 1em;color:var(--fg)}
footer{margin-top:2rem;font-size:.7em;color:var(--dim);text-align:center}
</style></head><body>
<main>
<h1>?? Subsystem Sort</h1>
<p class="tag">10 mouths · 4 anchors · unified through nestgate.io</p>
<div id="cards"></div>
<div class="plan" id="plan"></div>
<p><a href="/subsystem-sort-compare.json">JSON</a> ·
   <a href="https://nestgate.io">nestgate.io chat</a> ·
   <a href="/execute-digest-v3.json">digest v3</a></p>
<footer>ecoPrimals · sort else and compare · teach back and resolve</footer>
</main>
<script>
fetch('/subsystem-sort-compare.json').then(r=>r.json()).then(d=>{
  const cards=document.getElementById('cards');
  d.subsystems.forEach(s=>{
    const st=s.status.includes('LIVE')?'live':'stub';
    cards.innerHTML+=`<div class="card">
      <h3>${s.id} · ${s.name} <span class="status ${st}">${s.status}</span></h3>
      <div>${s.type} · ${s.direction || ''} · auth: ${s.auth || 'n/a'}</div>
      <div class="role">${s.role || ''}</div>
      <div class="resolve">? ${s.resolve || ''}</div>
      ${s.url?`<div><a href="${s.url}">${s.url}</a></div>`:''}
    </div>`;
  });
  const plan=document.getElementById('plan');
  const p=d.unification_plan;
  let html='<h2 style="color:var(--gold)">Unification Plan</h2><dl>';
  for(const[k,v]of Object.entries(p)){
    html+=`<dt>${k.replace(/_/g,' ')}</dt><dd>${v}</dd>`;
  }
  plan.innerHTML=html+'</dl>';
});
</script></body></html>
