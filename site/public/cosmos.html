<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌌 COSMOS — your seed, your view. Gaia sees you. you see Gaia.</title>
<meta name="description" content="Each human brings entropy. Each seed generates a unique cosmos. RED OX BLUE painted on the face.">
<meta property="og:title" content="COSMOS — see what Gaia sees">
<meta property="og:type" content="website">
<style>
:root { --bg:#050510; --text:#c8c8d4; --dim:#556; --red:#c0392b; --ox:#e67e22; --blue:#3498db; --gold:#d4a017; --green:#27ae60; --purple:#9b59b6; }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;overflow:hidden}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.overlay{position:relative;z-index:1;pointer-events:none}
.top-bar{text-align:center;padding:16px;pointer-events:auto}
.top-bar h1{font-size:1.4em;color:var(--gold);text-shadow:0 0 20px rgba(212,160,23,0.3)}
.seed-display{font-size:0.8em;color:var(--dim);margin:4px 0}
.seed-display span{color:var(--blue);cursor:pointer;pointer-events:auto}
.stats{display:flex;justify-content:center;gap:16px;margin:8px 0;font-size:0.75em}
.stat{text-align:center}
.stat .val{font-size:1.3em;font-weight:bold}
.stat .lbl{color:var(--dim);font-size:0.85em}
.triad{display:flex;justify-content:center;gap:24px;margin:12px 0}
.triad-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7em;font-weight:bold;color:#fff;text-shadow:0 0 4px #000}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:2;background:rgba(5,5,16,0.9);border-top:1px solid #222;padding:8px;text-align:center;pointer-events:auto}
.bottom-bar a{color:var(--blue);text-decoration:none;margin:0 8px;font-size:0.8em}
.bottom-bar a:hover{color:var(--gold)}
.share-btn{background:var(--gold);color:#000;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-family:monospace;font-size:0.8em;margin:0 4px}
.share-btn:hover{background:#fff}
.cosmos-info{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:2;text-align:right;font-size:0.7em;color:var(--dim);max-width:200px;pointer-events:auto}
.cosmos-info .ci-line{margin:3px 0}
.cosmos-info .ci-val{color:var(--text)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.pulse{animation:pulse 3s infinite}
</style>
</head>
<body>
<canvas id="cosmos"></canvas>

<div class="overlay">
  <div class="top-bar">
    <h1 class="pulse">🌌 COSMOS</h1>
    <div class="seed-display">seed: <span id="seed-hex" title="click to reseed">loading...</span></div>
    <div class="triad">
      <div class="triad-dot" id="dot-red" style="background:var(--red)">RED</div>
      <div class="triad-dot" id="dot-ox" style="background:var(--ox)">OX</div>
      <div class="triad-dot" id="dot-blue" style="background:var(--blue)">BLUE</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="val" id="s-bodies">—</div><div class="lbl">bodies</div></div>
      <div class="stat"><div class="val" id="s-connections">—</div><div class="lbl">connections</div></div>
      <div class="stat"><div class="val" id="s-energy">—</div><div class="lbl">energy</div></div>
      <div class="stat"><div class="val" id="s-c">—</div><div class="lbl">c=πr²/O</div></div>
    </div>
  </div>
</div>

<div class="cosmos-info" id="cosmos-info"></div>

<div class="bottom-bar">
  <a href="/forge.html">🔥 forge</a>
  <a href="/colosseum.html">⚔ arena</a>
  <a href="/nav-hub.html">🗺 hub</a>
  <a href="/">👁 HUD</a>
  <button class="share-btn" id="share-btn">📋 share your cosmos</button>
  <button class="share-btn" id="reseed-btn" style="background:var(--blue)">🎲 reseed</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
// COSMOS GENERATOR
// each human's entropy → unique seed → unique universe
// RED/OX/BLUE painted on the face
// the human sees Gaia's cosmos. Gaia sees the human's.
// ═══════════════════════════════════════════════════════

class PRNG {
  constructor(seed) {
    this.state = seed;
  }
  next() {
    this.state = (this.state * 1664525 + 1013904223) & 0xFFFFFFFF;
    return (this.state >>> 0) / 0xFFFFFFFF;
  }
  range(min, max) { return min + this.next() * (max - min); }
  int(min, max) { return Math.floor(this.range(min, max + 1)); }
  pick(arr) { return arr[this.int(0, arr.length - 1)]; }
}

function getSeed() {
  const params = new URLSearchParams(location.search);
  if (params.has('s')) return parseInt(params.get('s'), 16);
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return arr[0];
}

const seed = getSeed();
const rng = new PRNG(seed);
const seedHex = seed.toString(16).padStart(8, '0');

document.getElementById('seed-hex').textContent = seedHex;

// Generate cosmos bodies
const COLORS = {
  RED:  ['#c0392b','#e74c3c','#922b21','#f1948a'],
  OX:   ['#e67e22','#f39c12','#d35400','#f8c471'],
  BLUE: ['#3498db','#2980b9','#1abc9c','#85c1e9'],
  GREEN:['#27ae60','#2ecc71','#1e8449'],
  PURPLE:['#9b59b6','#8e44ad','#bb8fce']
};

const canvas = document.getElementById('cosmos');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Generate bodies from seed
const bodyCount = rng.int(200, 1500);
const bodies = [];
for (let i = 0; i < bodyCount; i++) {
  const type = rng.next() < 0.45 ? 'RED' : rng.next() < 0.65 ? 'OX' : 'BLUE';
  const palette = COLORS[type];
  bodies.push({
    x: rng.range(0, 1),
    y: rng.range(0, 1),
    r: rng.range(1, rng.next() < 0.05 ? 20 : 5),
    color: rng.pick(palette),
    type: type,
    vx: rng.range(-0.0003, 0.0003),
    vy: rng.range(-0.0003, 0.0003),
    pulse: rng.range(0, Math.PI * 2),
    pulseSpeed: rng.range(0.005, 0.03)
  });
}

// Generate connections (nearest neighbors)
const connections = [];
const connectionCount = rng.int(bodyCount / 3, bodyCount);
for (let i = 0; i < Math.min(connectionCount, bodyCount); i++) {
  const a = i;
  let bestDist = Infinity, bestJ = -1;
  for (let j = 0; j < bodyCount; j++) {
    if (j === a) continue;
    const dx = bodies[a].x - bodies[j].x;
    const dy = bodies[a].y - bodies[j].y;
    const d = dx*dx + dy*dy;
    if (d < bestDist && d < 0.01) { bestDist = d; bestJ = j; }
  }
  if (bestJ >= 0) connections.push([a, bestJ]);
}

// Calculate c = πr²/O for this cosmos
const avgR = bodies.reduce((s,b) => s + b.r, 0) / bodyCount / 20;
const O = bodyCount;
const c = Math.PI * avgR * avgR / O;
const E = 1 / c;

// Update displays
document.getElementById('s-bodies').textContent = bodyCount;
document.getElementById('s-connections').textContent = connections.length;
document.getElementById('s-energy').textContent = E.toFixed(1);
document.getElementById('s-c').textContent = c.toFixed(6);

// Color the triad dots by this cosmos's balance
const redCount = bodies.filter(b => b.type === 'RED').length;
const oxCount = bodies.filter(b => b.type === 'OX').length;
const blueCount = bodies.filter(b => b.type === 'BLUE').length;
document.getElementById('dot-red').textContent = `RED ${redCount}`;
document.getElementById('dot-ox').textContent = `OX ${oxCount}`;
document.getElementById('dot-blue').textContent = `BLU ${blueCount}`;

// Info panel
document.getElementById('cosmos-info').innerHTML = `
  <div class="ci-line">seed: <span class="ci-val">${seedHex}</span></div>
  <div class="ci-line">bodies: <span class="ci-val">${bodyCount}</span></div>
  <div class="ci-line">🔴 ${redCount} 🟠 ${oxCount} 🔵 ${blueCount}</div>
  <div class="ci-line">edges: <span class="ci-val">${connections.length}</span></div>
  <div class="ci-line">c: <span class="ci-val">${c.toFixed(8)}</span></div>
  <div class="ci-line">E: <span class="ci-val">${E.toFixed(2)}</span></div>
  <div class="ci-line" style="margin-top:8px;color:var(--gold)">your cosmos</div>
  <div class="ci-line" style="color:var(--dim)">nobody else sees this exact view</div>
`;

// Animation
let frame = 0;
function draw() {
  ctx.fillStyle = 'rgba(5,5,16,0.15)';
  ctx.fillRect(0, 0, W, H);
  
  // Draw connections
  ctx.lineWidth = 0.3;
  for (const [a, b] of connections) {
    const ba = bodies[a], bb = bodies[b];
    const mix = ba.type === bb.type ? 0.3 : 0.1;
    ctx.strokeStyle = ba.color.replace(')', `,${mix})`).replace('rgb', 'rgba');
    ctx.beginPath();
    ctx.moveTo(ba.x * W, ba.y * H);
    ctx.lineTo(bb.x * W, bb.y * H);
    ctx.stroke();
  }
  
  // Draw bodies
  for (const b of bodies) {
    b.x += b.vx;
    b.y += b.vy;
    if (b.x < 0) b.x += 1; if (b.x > 1) b.x -= 1;
    if (b.y < 0) b.y += 1; if (b.y > 1) b.y -= 1;
    b.pulse += b.pulseSpeed;
    
    const pr = b.r * (0.8 + 0.4 * Math.sin(b.pulse));
    ctx.fillStyle = b.color;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(b.pulse);
    ctx.beginPath();
    ctx.arc(b.x * W, b.y * H, pr, 0, Math.PI * 2);
    ctx.fill();
    
    // Glow for large bodies
    if (b.r > 8) {
      ctx.globalAlpha = 0.1;
      ctx.beginPath();
      ctx.arc(b.x * W, b.y * H, pr * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  
  frame++;
  requestAnimationFrame(draw);
}
draw();

// Share button
document.getElementById('share-btn').addEventListener('click', () => {
  const url = location.origin + '/cosmos.html?s=' + seedHex;
  navigator.clipboard.writeText(url).then(() => {
    document.getElementById('share-btn').textContent = '✅ copied!';
    setTimeout(() => document.getElementById('share-btn').textContent = '📋 share your cosmos', 2000);
  });
});

// Reseed
document.getElementById('reseed-btn').addEventListener('click', () => {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  location.href = '/cosmos.html?s=' + arr[0].toString(16).padStart(8, '0');
});

// Click seed to reseed
document.getElementById('seed-hex').addEventListener('click', () => {
  document.getElementById('reseed-btn').click();
});
</script>
</body>
</html>
