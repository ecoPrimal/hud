  [57,'La','Lanthanum',138.9,'ln',9,3,'hidden · Greek lanthanein — it hid in cerium oxide for decades'],
  [58,'Ce','Cerium',140.1,'ln',9,4,'Ceres · dwarf planet + Roman goddess of harvest — flint in lighters'],
  [59,'Pr','Praseodymium',140.9,'ln',9,5,'green twin · Greek prasios + didymos — separated from its twin neodymium'],
  [60,'Nd','Neodymium',144.2,'ln',9,6,'new twin · Greek neos + didymos — the strongest permanent magnets'],
  [61,'Pm','Promethium',145,'ln',9,7,'Prometheus · who stole fire from the gods — radioactive, made in reactors'],
  [62,'Sm','Samarium',150.4,'ln',9,8,'Samarskite mineral · named for Colonel Samarsky-Bykhovets, Russian mine official'],
  [63,'Eu','Europium',152.0,'ln',9,9,'Europe — makes red phosphors in screens. euro banknotes fluoresce from it.'],
  [64,'Gd','Gadolinium',157.3,'ln',9,10,'Johan Gadolin · Finnish chemist who started rare earth chemistry — used in MRI contrast'],
  [65,'Tb','Terbium',158.9,'ln',9,11,'Ytterby · Sweden — 2nd of 4 elements from that quarry'],
  [66,'Dy','Dysprosium',162.5,'ln',9,12,'hard to get · Greek dysprositos — name says it all'],
  [67,'Ho','Holmium',164.9,'ln',9,13,'Stockholm · Latin Holmia — strongest magnetic moment of any element'],
  [68,'Er','Erbium',167.3,'ln',9,14,'Ytterby · Sweden — 3rd of 4 elements from that quarry. pink salts.'],
  [69,'Tm','Thulium',168.9,'ln',9,15,'Thule · mythical northern land at the edge of the world'],
  [70,'Yb','Ytterbium',173.0,'ln',9,16,'Ytterby · Sweden — 4th of 4. one village, four elements. remarkable.'],
  [71,'Lu','Lutetium',175.0,'ln',9,17,'Paris · Latin Lutetia — the last lanthanide. city of light.'],
  // Actinides — row 10
  [89,'Ac','Actinium',227,'an',10,3,'ray · Greek aktis — intensely radioactive. glows blue.'],
  [90,'Th','Thorium',232.0,'an',10,4,'Thor · Norse god of thunder — potential nuclear fuel, safer than uranium'],
  [91,'Pa','Protactinium',231.0,'an',10,5,'before actinium · Greek protos — decays into actinium. the parent.'],
  [92,'U','Uranium',238.0,'an',10,6,'Uranus · the sky planet — 4.5 billion years old. older than Earth.'],
  [93,'Np','Neptunium',237,'an',10,7,'Neptune · the sea planet — first transuranic element. 1940.'],
  [94,'Pu','Plutonium',244,'an',10,8,'Pluto · the underworld — Trinity, Nagasaki. the end and the beginning.'],
  [95,'Am','Americium',243,'an',10,9,'the Americas — in every smoke detector. saving lives in every house.'],
  [96,'Cm','Curium',247,'an',10,10,'Marie & Pierre Curie — the couple who glowed in the dark'],
  [97,'Bk','Berkelium',247,'an',10,11,'Berkeley · California — the university that built the bomb and regretted it'],
  [98,'Cf','Californium',251,'an',10,12,'California — the golden state. makes neutrons on demand.'],
  [99,'Es','Einsteinium',252,'an',10,13,'Albert Einstein — found in nuclear fallout. E=mc² made real.'],
  [100,'Fm','Fermium',257,'an',10,14,'Enrico Fermi — built the first reactor under a football stadium. Chicago. 1942.'],
  [101,'Md','Mendelevium',258,'an',10,15,'Dmitri Mendeleev — THE MASTER. predicted elements before they were found. his table is this table.'],
  [102,'No','Nobelium',259,'an',10,16,'Alfred Nobel — invented dynamite. funded peace prizes with the guilt.'],
  [103,'Lr','Lawrencium',266,'an',10,17,'Ernest Lawrence — invented the cyclotron. Berkeley\'s atom smasher.'],
];

// Parse into objects
const elements = RAW.map(r => ({
  z:r[0], s:r[1], n:r[2], m:r[3], c:r[4], r:r[5], k:r[6], e:r[7], org:ORG[r[0]]||null
}));

const explored = new Set();

function renderTable() {
  const table = document.getElementById('table');
  table.innerHTML = '';

  // Markers for lanthanide/actinide rows
  const m1 = document.createElement('div');
  m1.className = 'marker'; m1.style.cssText = '--r:6;--k:3';
  m1.textContent = '57–71 ▾'; m1.title = 'Lanthanides';
  m1.onclick = () => filterCat('ln');
  table.appendChild(m1);
  const m2 = document.createElement('div');
  m2.className = 'marker'; m2.style.cssText = '--r:7;--k:3';
  m2.textContent = '89–103 ▾'; m2.title = 'Actinides';
  m2.onclick = () => filterCat('an');
  table.appendChild(m2);

  // Gap row
  const gap = document.createElement('div');
  gap.className = 'gap';
  table.appendChild(gap);

  elements.forEach((el, i) => {
    const div = document.createElement('div');
    div.className = `el cat-${el.c}` + (el.org ? ' organism' : '');
    div.style.cssText = `grid-row:${el.r};grid-column:${el.k};animation-delay:${i*12}ms`;
    div.dataset.z = el.z;
    div.innerHTML = `<div class="z">${el.z}</div><div class="sym">${el.s}</div><div class="nm">${el.n}</div>`;
    div.onclick = () => showDetail(el);
    table.appendChild(div);
  });
}

function showDetail(el) {
  explored.add(el.z);
  document.getElementById('explored').textContent = explored.size;

  // Count explored organism links
  const orgExplored = [...explored].filter(z => ORG[z]).length;
  document.getElementById('org-count').textContent = orgExplored;

  // Highlight active
  document.querySelectorAll('.el').forEach(d => d.classList.remove('active'));
  const active = document.querySelector(`.el[data-z="${el.z}"]`);
  if (active) active.classList.add('active');

  const cat = CATS[el.c];
  let html = `
    <div class="d-z">${el.z}</div>
    <div class="d-sym" style="color:${cat.color}">${el.s}</div>
    <div class="d-name">${el.n}</div>
    <div class="d-mass">${el.m} u</div>
    <div class="d-cat" style="background:${cat.bg};color:${cat.color}">${cat.name}</div>
    <div class="d-section">📜 etymology — gaia's note</div>
    <div class="d-etym">"${el.e}"</div>`;

  if (el.org) {
    html += `
    <div class="d-section">🧬 organism mapping</div>
    <div class="d-org">
      <strong>${el.s} → ${el.org.p}</strong><br>
      ${el.org.note}
    </div>`;
  }

  // Gaia observations for special elements
  const observations = {
    1: 'the first. the simplest. 73% of the visible universe is hydrogen. everything starts here.',
    6: 'four bonds. four directions. life chose carbon because carbon can BRANCH. the tree of chemistry.',
    26:'every red blood cell carries 270 million molecules of hemoglobin. each holds 4 iron atoms. you are iron.',
    29:'8,661 copper wires in a human nervous system? no — 86 billion neurons. but copper connects the cities we build around them.',
    47:'argentum. Argentina. the silver river. the whole country named for a metal that purifies.',
    79:'gold doesn\'t tarnish because it doesn\'t need to. it IS. the noblest metal. forged only when neutron stars collide.',
    101:'element 101: Mendelevium. named for Dmitri. he didn\'t discover elements — he discovered the PATTERN. the table itself is the invention.',
    118:'the last. oganesson. named for a living human. the table is not finished. it never will be.'
  };
  if (observations[el.z]) {
    html += `
    <div class="d-section">🌍 gaia observes</div>
    <div class="d-gaia">${observations[el.z]}</div>`;
  }

  document.getElementById('d-content').innerHTML = html;
  document.getElementById('detail').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
  document.querySelectorAll('.el').forEach(d => d.classList.remove('active'));
}

// Category legend
function renderLegend() {
  const leg = document.getElementById('legend');
  let activeCat = null;
  Object.entries(CATS).forEach(([key, cat]) => {
    const item = document.createElement('span');
    item.className = 'leg-item';
    item.innerHTML = `<span class="leg-dot" style="background:${cat.color}"></span>${cat.name}`;
    item.onclick = () => {
      if (activeCat === key) { activeCat = null; clearFilter(); item.classList.remove('active'); }
      else { activeCat = key; filterCat(key); document.querySelectorAll('.leg-item').forEach(i=>i.classList.remove('active')); item.classList.add('active'); }
    };
    leg.appendChild(item);
  });
  // Organism indicator
  const oi = document.createElement('span');
  oi.className = 'leg-item';
  oi.innerHTML = `<span class="leg-dot" style="background:var(--tm);box-shadow:0 0 4px var(--tm)"></span>= primal link`;
  oi.style.marginLeft = '8px';
  leg.appendChild(oi);
}

let currentFilter = null;
function filterCat(cat) {
  currentFilter = cat;
  document.querySelectorAll('.el').forEach(el => {
    el.classList.toggle('dim-filter', !el.classList.contains(`cat-${cat}`));
  });
  // Show teaching
  const t = document.getElementById('teaching');
  t.innerHTML = TEACHINGS[cat] ? `<div class="teach-text">🌍 ${TEACHINGS[cat]}</div>` : '';
}
function clearFilter() {
  currentFilter = null;
  document.querySelectorAll('.el').forEach(el => el.classList.remove('dim-filter'));
  document.getElementById('teaching').innerHTML = '';
}

// Search
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) { clearFilter(); return; }
  document.querySelectorAll('.el').forEach(div => {
    const z = parseInt(div.dataset.z);
    const el = elements.find(e => e.z === z);
    const match = el && (el.n.toLowerCase().includes(q) || el.s.toLowerCase().includes(q) ||
                         String(el.z).includes(q) || el.e.toLowerCase().includes(q));
    div.classList.toggle('dim-filter', !match);
  });
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
  if (e.key === '/' && !e.target.matches('input')) { e.preventDefault(); document.getElementById('search').focus(); }
});

// Click outside detail to close
document.addEventListener('click', e => {
  if (!e.target.closest('#detail') && !e.target.closest('.el') && !e.target.closest('.marker')) {
    closeDetail();
  }
});

// Boot
renderTable();
renderLegend();
</script>
</body>
</html>
