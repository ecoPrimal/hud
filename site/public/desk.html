<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nestGate ? Desktop</title>
<style>
/* === WINDOWS 98 / XP HYBRID DESKTOP === */
:root {
  --win-bg: #008080;
  --win-silver: #c0c0c0;
  --win-dark: #808080;
  --win-darkest: #404040;
  --win-light: #dfdfdf;
  --win-white: #ffffff;
  --win-title: #000080;
  --win-title-inactive: #808080;
  --win-title-text: #ffffff;
  --win-text: #000000;
  --win-highlight: #0000aa;
  --win-btn-face: #c0c0c0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

@font-face {
  font-family: 'W95FA';
  src: local('MS Sans Serif'), local('Tahoma'), local('Arial');
}

body {
  font-family: 'Tahoma', 'MS Sans Serif', 'Arial', sans-serif;
  font-size: 11px;
  background: var(--win-bg);
  color: var(--win-text);
  height: 100vh;
  overflow: hidden;
  cursor: default;
  user-select: none;
}

/* === DESKTOP AREA === */
#desktop {
  position: fixed;
  top: 0; left: 0; right: 0;
  bottom: 28px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 4px;
}

/* === DESKTOP ICONS === */
.desk-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 72px;
  padding: 4px 2px;
  cursor: pointer;
  border: 1px solid transparent;
  text-align: center;
}
.desk-icon:hover { background: rgba(0,0,128,0.15); }
.desk-icon.selected {
  background: var(--win-highlight);
  color: white;
  border: 1px dotted #ffffff;
}
.desk-icon .ico {
  font-size: 32px;
  line-height: 36px;
  margin-bottom: 2px;
  image-rendering: pixelated;
}
.desk-icon .ico-label {
  font-size: 10px;
  color: #ffffff;
  text-shadow: 1px 1px 1px #000;
  word-wrap: break-word;
  max-width: 68px;
  line-height: 1.2;
}
.desk-icon.selected .ico-label { text-shadow: none; }

/* === WINDOWS === */
.win98-window {
  position: absolute;
  background: var(--win-silver);
  border: 2px solid;
  border-color: var(--win-light) var(--win-darkest) var(--win-darkest) var(--win-light);
  box-shadow: 1px 1px 0 var(--win-darkest);
  min-width: 280px;
  min-height: 160px;
  display: flex;
  flex-direction: column;
}
.win98-window.maximized {
  top: 0 !important; left: 0 !important;
  width: 100% !important; height: calc(100vh - 28px) !important;
}

/* TITLE BAR */
.win-titlebar {
  background: linear-gradient(90deg, var(--win-title), #1084d0);
  color: var(--win-title-text);
  padding: 2px 3px;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  cursor: move;
  flex-shrink: 0;
}
.win-titlebar.inactive {
  background: linear-gradient(90deg, var(--win-title-inactive), #b4b4b4);
}
.win-titlebar .win-ico { font-size: 14px; }
.win-titlebar .win-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win-btn {
  width: 16px; height: 14px;
  background: var(--win-btn-face);
  border: 1px solid;
  border-color: var(--win-light) var(--win-darkest) var(--win-darkest) var(--win-light);
  font-size: 9px;
  font-weight: 700;
  color: #000;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-family: 'Marlett', 'Tahoma', sans-serif;
}
.win-btn:active {
  border-color: var(--win-darkest) var(--win-light) var(--win-light) var(--win-darkest);
}

/* MENU BAR */
.win-menubar {
  background: var(--win-silver);
  border-bottom: 1px solid var(--win-dark);
  padding: 1px 0;
  display: flex;
  font-size: 11px;
  flex-shrink: 0;
}
.win-menu-item {
  padding: 2px 8px;
  cursor: pointer;
}
.win-menu-item:hover { background: var(--win-highlight); color: white; }

/* WINDOW BODY */
.win-body {
  flex: 1;
  overflow: auto;
  background: #ffffff;
  border: 2px solid;
  border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);
  margin: 2px;
  padding: 4px;
  font-size: 11px;
  line-height: 1.5;
  color: var(--win-text);
}
.win-body pre {
  font-family: 'Fixedsys', 'Lucida Console', 'Courier New', monospace;
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-all;
}

/* STATUS BAR */
.win-statusbar {
  background: var(--win-silver);
  border-top: 1px solid var(--win-dark);
  padding: 2px 6px;
  font-size: 10px;
  color: var(--win-darkest);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.win-status-section {
  border: 1px solid;
  border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);
  padding: 0 6px;
  flex: 1;
}

/* === TASKBAR === */
#taskbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 28px;
  background: var(--win-silver);
  border-top: 2px solid var(--win-light);
  display: flex;
  align-items: center;
  padding: 0 2px;
  gap: 2px;
  z-index: 9999;
}

/* START BUTTON */
#start-btn {
  height: 22px;
  padding: 0 6px;
  border: 2px solid;
  border-color: var(--win-light) var(--win-darkest) var(--win-darkest) var(--win-light);
  background: var(--win-silver);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 3px;
  font-family: inherit;
}
#start-btn:active, #start-btn.pressed {
  border-color: var(--win-darkest) var(--win-light) var(--win-light) var(--win-darkest);
}
#start-btn .start-flag { font-size: 14px; }

.taskbar-sep {
  width: 2px; height: 20px;
  border-left: 1px solid var(--win-dark);
  border-right: 1px solid var(--win-light);
  margin: 0 2px;
}

/* TASK BUTTONS */
#task-buttons {
  flex: 1;
  display: flex;
  gap: 2px;
  overflow: hidden;
}
.task-btn {
  height: 22px;
  min-width: 100px;
  max-width: 160px;
  padding: 0 6px;
  border: 2px solid;
  border-color: var(--win-light) var(--win-darkest) var(--win-darkest) var(--win-light);
  background: var(--win-silver);
  font-size: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: inherit;
}
.task-btn.active {
  border-color: var(--win-darkest) var(--win-light) var(--win-light) var(--win-darkest);
  background: #b0b0b0;
  font-weight: 700;
}
.task-btn .tb-ico { font-size: 12px; }

/* SYSTEM TRAY */
#systray {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px;
  height: 22px;
  border: 2px solid;
  border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);
  font-size: 10px;
}
#systray .tray-icon { font-size: 12px; cursor: pointer; }

/* === START MENU === */
#start-menu {
  display: none;
  position: fixed;
  bottom: 28px;
  left: 0;
  width: 200px;
  background: var(--win-silver);
  border: 2px solid;
  border-color: var(--win-light) var(--win-darkest) var(--win-darkest) var(--win-light);
  z-index: 10000;
}
#start-menu.open { display: block; }

.start-sidebar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 22px;
  background: linear-gradient(to top, #000080, #1084d0);
  display: flex;
  align-items: flex-end;
  padding: 4px 2px;
}
.start-sidebar span {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  color: white;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 2px;
}

.start-items {
  margin-left: 22px;
  padding: 2px 0;
}
.start-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px;
  cursor: pointer;
  font-size: 11px;
}
.start-item:hover { background: var(--win-highlight); color: white; }
.start-item .si-ico { font-size: 18px; width: 24px; text-align: center; }
.start-sep { border-top: 1px solid var(--win-dark); border-bottom: 1px solid var(--win-light); margin: 2px 22px 2px 26px; }

/* === SCROLLBARS === */
.win-body::-webkit-scrollbar { width: 16px; }
.win-body::-webkit-scrollbar-track { background: var(--win-silver); border: 1px solid var(--win-dark); }
.win-body::-webkit-scrollbar-thumb {
  background: var(--win-btn-face);
  border: 2px solid;
  border-color: var(--win-light) var(--win-darkest) var(--win-darkest) var(--win-light);
}

/* === BOOT SCREEN === */
#boot-screen {
  position: fixed;
  inset: 0;
  background: #000;
  color: #aaa;
  font-family: 'Fixedsys', 'Lucida Console', 'Courier New', monospace;
  font-size: 14px;
  padding: 20px;
  z-index: 99999;
  white-space: pre-wrap;
  overflow: hidden;
}
#boot-screen.done { display: none; }

/* Explorer list view */
.explorer-list { width: 100%; border-collapse: collapse; }
.explorer-list th {
  text-align: left;
  padding: 2px 8px;
  background: var(--win-silver);
  border: 1px solid;
  border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
  font-weight: 400;
  font-size: 10px;
  cursor: pointer;
}
.explorer-list td {
  padding: 1px 8px;
  font-size: 11px;
  white-space: nowrap;
}
.explorer-list tr:hover td { background: var(--win-highlight); color: white; }
.explorer-list tr td:first-child { display: flex; align-items: center; gap: 4px; }
</style>
</head>

<script>
// ================================================================
// nestGate DESKTOP ? Windows 98 computer running the organism
// ================================================================

const SPRINGS = [
  { id: 'ludoSpring', ico: '??', label: 'ludoSpring', loc: 'MSU Campus, MI', lat: 42.73, lon: -84.48, desc: 'The Playground ? Science of Play. 982 tests. Fitts, Hick, Flow.' },

  { id: 'rhizoCrypt', ico: '??', label: 'rhizoCrypt', loc: 'Seattle, WA', lat: 47.75, lon: -122.34, desc: 'The Root ? Ephemeral DAG. Underground city. Mycelial nets.' },
  { id: 'loamSpine', ico: '??', label: 'loamSpine', loc: 'Grand Canyon, AZ', lat: 36.11, lon: -112.11, desc: 'The Bone ? 2B years of immutable geological commits.' },
  { id: 'coralReef', ico: '??', label: 'coralReef', loc: 'Florida Keys, FL', lat: 24.56, lon: -81.78, desc: 'The Reef ? GPU shaders. Million polyps = million threads.' },
  { id: 'petalTongue', ico: '???', label: 'petalTongue', loc: 'Sequoia NP, CA', lat: 36.05, lon: -118.20, desc: 'The Eye ? General Sherman. Making the invisible visible.' },
  { id: 'toadStool', ico: '??', label: 'toadStool', loc: 'Casper, WY', lat: 42.89, lon: -106.31, desc: 'The Toad ? Hoodoo formations. GPU/NPU/CPU dispatch.' },
  { id: 'skunkBat', ico: '??', label: 'skunkBat', loc: 'Carlsbad, NM', lat: 32.14, lon: -104.56, desc: 'The Shadow ? 400K bats. Network defense at dusk.' },
  { id: 'bearDog', ico: '??', label: 'bearDog', loc: 'Kenai Fjords, AK', lat: 60.97, lon: -149.09, desc: 'The Guard ? Crypto/TLS. Fjords = encryption channels.' },
];

const DESK_ICONS = [
  { id: 'my-computer', ico: '???', label: 'My Computer' },
  { id: 'springs-explorer', ico: '??', label: 'Springs Explorer' },
  { id: 'archive', ico: '??', label: 'Archive' },
  { id: 'cmd', ico: '?', label: 'Command\nPrompt' },
  ...SPRINGS.slice(0, 8).map(s => ({ id: 'spring-' + s.id, ico: s.ico, label: s.label })),
  { id: 'engine', ico: '??', label: 'Kenshi\nEngine', href: '/engine.html' },
  { id: 'body-map', ico: '??', label: 'Body Map', href: '/' },
  { id: 'recycle', ico: '???', label: 'Recycle Bin' },
];

let windows = [];
let zCounter = 100;
let bootDone = false;

// ---- BOOT SEQUENCE ----
async function boot() {
  const el = document.getElementById('boot-screen');
  const lines = [
    'nestGate BIOS v1.0 ? ecoPrimal Systems, 2026',
    'CPU: Organism Core @ 1/? GHz',
    'RAM: 39T bacterial cells',
    'Detecting springs...',
    '',
    '  C:\\SPRINGS\\LUDOSPRING    OK (MSU Campus, MI)',
    '  C:\\SPRINGS\\HOTSPRING     OK (Yellowstone, WY)',
    '  C:\\SPRINGS\\WETSPRING     OK (Everglades, FL)',
    '  C:\\SPRINGS\\PRIMALSPRING  OK (Ann Arbor, MI)',
    '  C:\\SPRINGS\\NEURALSPRING  OK (Silicon Valley, CA)',
    '  C:\\SPRINGS\\SOURDOUGH     OK (San Francisco, CA)',
    '  C:\\SPRINGS\\SWEETGRASS    OK (Glacier NP, MT)',
    '  C:\\SPRINGS\\LOAMSPINE     OK (Grand Canyon, AZ)',
    '',
    '18 springs detected. 18 beacons online.',
    'Membrane selectivity: 1/? = 0.31831',
    'Wave: 214',
    '',
    'Loading nestGate Desktop...',
    '',
    'Starting Windows...',
  ];

  for (const line of lines) {
    el.textContent += line + '\n';
    await sleep(80 + Math.random() * 60);
    el.scrollTop = el.scrollHeight;
  }
  await sleep(600);
  el.classList.add('done');
  bootDone = true;
  renderDesktop();
  startClock();
  fetchLiveData();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ---- RENDER DESKTOP ICONS ----
function renderDesktop() {
  const desk = document.getElementById('desktop');
  desk.innerHTML = '';
  DESK_ICONS.forEach(ic => {
    const el = document.createElement('div');
    el.className = 'desk-icon';
    el.innerHTML = `<span class="ico">${ic.ico}</span><span class="ico-label">${ic.label}</span>`;
    el.ondblclick = () => {
      if (ic.href) { window.open(ic.href, '_self'); return; }
      if (ic.id.startsWith('spring-')) {
        const sp = SPRINGS.find(s => 'spring-' + s.id === ic.id);
        if (sp) openWindow('spring-detail', sp);
      } else {
        openWindow(ic.id);
      }
    };
    el.onclick = (e) => {
      document.querySelectorAll('.desk-icon').forEach(d => d.classList.remove('selected'));
      el.classList.add('selected');
      e.stopPropagation();
    };
    desk.appendChild(el);
  });
}

// ---- WINDOW SYSTEM ----
function openWindow(type, data, title) {
  const existing = windows.find(w => w.id === type && !data);
  if (existing) { focusWindow(existing.el); return; }

  const winId = type + '-' + Date.now();
  const wEl = document.createElement('div');
  wEl.className = 'win98-window';
  wEl.style.left = (80 + windows.length * 24) + 'px';
  wEl.style.top = (40 + windows.length * 24) + 'px';
  wEl.style.width = '560px';
  wEl.style.height = '400px';
  wEl.style.zIndex = ++zCounter;

  let winTitle = title || 'Window';
  let winIco = '??';
  let bodyHTML = '';
  let menubar = '<div class="win-menubar"><span class="win-menu-item">File</span><span class="win-menu-item">Edit</span><span class="win-menu-item">View</span><span class="win-menu-item">Help</span></div>';
  let statusText = 'Ready';

  switch (type) {
    case 'my-computer':
      winTitle = 'My Computer';
      winIco = '???';
      statusText = '18 spring(s), 50+ data file(s)';
      bodyHTML = buildMyComputer();
      break;

    case 'springs-explorer':
      winTitle = 'Springs Explorer ? North America';
      winIco = '??';
      statusText = '18 springs across 12 states';
      bodyHTML = buildSpringsExplorer();
      break;

    case 'archive':
      winTitle = 'Archive Terminal (TR-49)';
      winIco = '??';
      bodyHTML = buildArchive();
      menubar = '';
      break;

    case 'spring-detail':
      winTitle = data.label + ' ? ' + data.loc;
      winIco = data.ico;
      statusText = `${data.lat}�N, ${Math.abs(data.lon)}�W`;
      bodyHTML = buildSpringDetail(data);
      break;

    case 'cmd':
      winTitle = 'C:\\WINDOWS\\system32\\cmd.exe';
      winIco = '?';
      bodyHTML = buildCmd();
      menubar = '';
      wEl.style.width = '640px';
      break;

    case 'notepad':
      winTitle = (title || 'Untitled') + ' - Notepad';
      winIco = '??';
      bodyHTML = buildNotepad(data || '');
      break;

    case 'control-panel':
      winTitle = 'Control Panel';
      winIco = '??';
      bodyHTML = buildControlPanel();
      statusText = '18 beacons | selectivity 1/?';
      break;

    case 'recycle':
      winTitle = 'Recycle Bin';
      winIco = '???';
      bodyHTML = '<div style="padding:20px;text-align:center;color:#808080;font-size:12px;">The Recycle Bin is empty.<br><br>Fungi always win.<br>Nothing is truly waste.</div>';
      statusText = '0 object(s) ? everything composted';
      break;

    default:
      winTitle = type;
      bodyHTML = '<div style="padding:12px">Loading...</div>';
  }

  wEl.innerHTML = `
    <div class="win-titlebar" onmousedown="startDrag(event,'${winId}')">
      <span class="win-ico">${winIco}</span>
      <span class="win-title">${winTitle}</span>
      <button class="win-btn" onclick="minimizeWindow('${winId}')" title="Minimize">_</button>
      <button class="win-btn" onclick="maximizeWindow('${winId}')" title="Maximize">?</button>
      <button class="win-btn" onclick="closeWindow('${winId}')" title="Close">?</button>
    </div>
    ${menubar}
    <div class="win-body">${bodyHTML}</div>
    <div class="win-statusbar"><span class="win-status-section">${statusText}</span></div>
  `;

  wEl.onmousedown = () => focusWindow(wEl);
  document.getElementById('desktop').appendChild(wEl);
  const win = { id: type, winId, el: wEl, title: winTitle, ico: winIco, minimized: false };
  windows.push(win);
  updateTaskbar();
  focusWindow(wEl);
}

function closeWindow(winId) {
  const idx = windows.findIndex(w => w.winId === winId);
  if (idx === -1) return;
  windows[idx].el.remove();
  windows.splice(idx, 1);
  updateTaskbar();
}

function minimizeWindow(winId) {
  const win = windows.find(w => w.winId === winId);
  if (!win) return;
  win.minimized = true;
  win.el.style.display = 'none';
  updateTaskbar();
}

function maximizeWindow(winId) {
  const win = windows.find(w => w.winId === winId);
  if (!win) return;
  win.el.classList.toggle('maximized');
}

function focusWindow(el) {
  el.style.zIndex = ++zCounter;
  document.querySelectorAll('.win-titlebar').forEach(tb => tb.classList.add('inactive'));
  el.querySelector('.win-titlebar').classList.remove('inactive');
  const win = windows.find(w => w.el === el);
  if (win && win.minimized) {
    win.minimized = false;
    win.el.style.display = 'flex';
  }
  updateTaskbar();
}

// ---- DRAG WINDOWS ----
let dragState = null;
function startDrag(e, winId) {
  const win = windows.find(w => w.winId === winId);
  if (!win || win.el.classList.contains('maximized')) return;
  dragState = {
    el: win.el,
    startX: e.clientX - win.el.offsetLeft,
    startY: e.clientY - win.el.offsetTop,
  };
  e.preventDefault();
}
document.addEventListener('mousemove', e => {
  if (!dragState) return;
  dragState.el.style.left = (e.clientX - dragState.startX) + 'px';
  dragState.el.style.top = (e.clientY - dragState.startY) + 'px';
});
document.addEventListener('mouseup', () => { dragState = null; });

// ---- TASKBAR ----
function updateTaskbar() {
  const cont = document.getElementById('task-buttons');
  cont.innerHTML = '';
  windows.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'task-btn' + (w.minimized ? '' : ' active');
    btn.innerHTML = `<span class="tb-ico">${w.ico}</span> ${w.title.slice(0, 20)}`;
    btn.onclick = () => {
      if (w.minimized) {
        w.minimized = false;
        w.el.style.display = 'flex';
      }
      focusWindow(w.el);
    };
    cont.appendChild(btn);
  });
}

// ---- START MENU ----
function toggleStartMenu() {
  document.getElementById('start-menu').classList.toggle('open');
  document.getElementById('start-btn').classList.toggle('pressed');
}
document.addEventListener('click', e => {
  if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) {
    document.getElementById('start-menu').classList.remove('open');
    document.getElementById('start-btn').classList.remove('pressed');
  }
});
document.getElementById('desktop').addEventListener('click', e => {
  if (e.target === document.getElementById('desktop')) {
    document.querySelectorAll('.desk-icon').forEach(d => d.classList.remove('selected'));
  }
});
