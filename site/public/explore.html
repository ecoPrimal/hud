<div class="wrap">
<h1>?? Data Explorer</h1>
<p class="sub">browse the membrane's data feeds — <span id="total-count">...</span> files, <span id="total-size">...</span></p>

<div class="search-bar">
  <input type="text" id="search" placeholder="?? search feeds... (genotype, traffic, Klein, turtle, biology...)" oninput="filter(this.value)">
  <span class="count" id="match-count"></span>
</div>

<div class="grid" id="grid"></div>
<div id="viewer"><span class="back" onclick="closeViewer()">? back to list</span><h3 id="v-title" style="color:var(--cyan);margin:8px 0"></h3><pre id="v-content"></pre></div>
</div>

<script>
var FILES = [];
var allCards = [];

fetch('/api/strata.json').then(function(r){return r.json()}).then(function(strata){
  var allFiles = [];
  strata.strata.forEach(function(s){
    s.files.forEach(function(f){ allFiles.push({name:f,stratum:s.stratum,glyph:s.glyph}) });
  });
  return allFiles;
}).then(function(files){
  FILES = files;
  document.getElementById('total-count').textContent = files.length;
  
  var grid = document.getElementById('grid');
  var totalSize = 0;
  
  files.forEach(function(f,i){
    var card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = f.name.toLowerCase();
    card.dataset.stratum = f.stratum;
    card.innerHTML = '<div class="name">' + f.glyph + ' ' + f.name.replace('.json','') + '</div>' +
      '<div class="size">' + f.stratum + '</div>';
    card.onclick = function(){ openFile(f.name) };
    grid.appendChild(card);
    allCards.push(card);
  });
  
  document.getElementById('total-size').textContent = files.length + ' feeds across ' + 
    new Set(files.map(function(f){return f.stratum})).size + ' strata';
    
  var param = new URLSearchParams(location.search).get('file');
  if (param) openFile(param.endsWith('.json') ? param : param + '.json');
});

function filter(q) {
  q = q.toLowerCase().trim();
  var shown = 0;
  allCards.forEach(function(c){
    var match = !q || c.dataset.name.indexOf(q) !== -1 || c.dataset.stratum.indexOf(q) !== -1;
    c.style.display = match ? '' : 'none';
    if (match) shown++;
  });
  document.getElementById('match-count').textContent = q ? shown + ' matches' : '';
}

function openFile(name) {
  document.getElementById('grid').style.display = 'none';
  document.getElementById('viewer').style.display = 'block';
  document.getElementById('v-title').textContent = name;
  document.getElementById('v-content').textContent = 'loading...';
  fetch('/data/' + name).then(function(r){return r.json()}).then(function(data){
    document.getElementById('v-content').textContent = JSON.stringify(data, null, 2);
  }).catch(function(e){
    document.getElementById('v-content').textContent = 'error loading: ' + e.message;
  });
  history.replaceState(null, '', '?file=' + name);
}

function closeViewer() {
  document.getElementById('grid').style.display = '';
  document.getElementById('viewer').style.display = 'none';
  history.replaceState(null, '', location.pathname);
}
</script>
