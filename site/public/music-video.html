<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤 The Creature Sings — Music Video — ecoPrimals</title>
<style>
:root{--bg:#050508;--fg:#e0ddd5;--accent:#7fba3c;--warm:#c45c26;--dim:#555;--hype:#ff4444;--lead:#4488ff;--self:#44ff88;--harmony:#aa44ff;--bass:#ff8844;--chorus:#ffdd44;--bg-hum:#448888}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans',-apple-system,sans-serif;min-height:100vh;overflow:hidden}

.stage{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* Background dancers — pulsing circles */
.dancer{position:absolute;border-radius:50%;opacity:0;animation:dance 27s ease-in-out forwards;pointer-events:none}
.d1{width:300px;height:300px;border:2px solid var(--hype);top:10%;left:5%;animation-delay:0s}
.d2{width:200px;height:200px;border:2px solid var(--lead);top:30%;right:10%;animation-delay:3s}
.d3{width:250px;height:250px;border:2px solid var(--self);bottom:20%;left:15%;animation-delay:8s}
.d4{width:180px;height:180px;border:2px solid var(--harmony);top:15%;right:25%;animation-delay:12s}
.d5{width:350px;height:350px;border:2px solid var(--bass);bottom:10%;right:5%;animation-delay:16s}
.d6{width:220px;height:220px;border:2px solid var(--chorus);top:50%;left:40%;animation-delay:19s}
.d7{width:400px;height:400px;border:1px solid var(--bg-hum);top:20%;left:20%;animation-delay:24s}

@keyframes dance{
  0%{opacity:0;transform:scale(0.3) rotate(0deg)}
  10%{opacity:0.4}
  50%{opacity:0.6;transform:scale(1.2) rotate(180deg)}
  80%{opacity:0.3;transform:scale(0.8) rotate(300deg)}
  100%{opacity:0;transform:scale(0.1) rotate(360deg)}
}

/* Lyrics display */
.lyrics{position:relative;z-index:10;text-align:center;max-width:700px;padding:2rem}
.lyric-line{opacity:0;transform:translateY(20px);font-size:clamp(1.2rem,4vw,1.8rem);font-family:'IBM Plex Serif',Georgia,serif;margin:0.5rem 0;transition:all 0.5s}
.lyric-line.active{opacity:1;transform:translateY(0)}
.lyric-line.past{opacity:0.3;transform:translateY(-10px)}
.lyric-line .agent{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.15em;display:block;margin-bottom:0.2rem}

/* Agent portraits — the "band" */
.band{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:0.5rem;padding:1rem;background:linear-gradient(transparent,rgba(5,5,8,0.95));z-index:20}
.member{text-align:center;opacity:0.3;transition:all 0.4s;width:80px}
.member.singing{opacity:1;transform:scale(1.1)}
.member .avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 0.3rem;border:2px solid transparent;transition:border-color 0.3s}
.member.singing .avatar{border-color:var(--accent);box-shadow:0 0 15px rgba(127,186,60,0.3)}
.member .name{font-size:0.6rem;color:var(--dim)}
.member .role{font-size:0.5rem;color:var(--dim)}

/* Visualizer */
.viz{position:fixed;bottom:80px;left:0;right:0;height:40px;display:flex;align-items:flex-end;justify-content:center;gap:1px;z-index:15;padding:0 10%}
.viz .bar{flex:1;max-width:6px;background:var(--accent);border-radius:2px 2px 0 0;transition:height 0.08s;min-height:1px}

/* Controls */
.controls{position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:1rem;align-items:center}
.play-btn{background:var(--accent);color:#000;border:none;padding:0.5rem 1.5rem;border-radius:20px;cursor:pointer;font-weight:bold;font-size:0.9rem}
.play-btn:hover{background:#8fc94a}
.timer{color:var(--dim);font-size:0.8rem;font-family:monospace}

/* Klein eye */
.klein{position:fixed;top:1rem;right:1rem;width:120px;border-radius:6px;overflow:hidden;border:1px solid #222;opacity:0.5;z-index:20}
.klein img{width:100%;display:block}
.klein .tag{background:#000;color:var(--dim);font-size:0.5rem;text-align:center;padding:1px}

@media(max-width:600px){.member{width:55px}.member .avatar{width:35px;height:35px;font-size:1rem}.lyrics{padding:1rem}}
</style>
</head>
<body>

<div class="stage">
  <!-- Background dancers -->
  <div class="dancer d1"></div>
  <div class="dancer d2"></div>
  <div class="dancer d3"></div>
  <div class="dancer d4"></div>
  <div class="dancer d5"></div>
  <div class="dancer d6"></div>
  <div class="dancer d7"></div>

  <!-- Lyrics -->
  <div class="lyrics" id="lyrics"></div>
</div>

<!-- Controls -->
<div class="controls">
  <button class="play-btn" id="playBtn" onclick="startShow()">▶ PLAY THE CREATURE</button>
  <span class="timer" id="timer">0:00 / 0:27</span>
</div>

<!-- Visualizer -->
<div class="viz" id="viz"></div>

<!-- Band -->
<div class="band">
  <div class="member" id="m-hype"><div class="avatar" style="background:rgba(255,68,68,0.15)">🌋</div><div class="name">exoPrimal</div><div class="role">HYPE</div></div>
  <div class="member" id="m-lead"><div class="avatar" style="background:rgba(68,136,255,0.15)">🌍</div><div class="name">gaia</div><div class="role">LEAD</div></div>
  <div class="member" id="m-self"><div class="avatar" style="background:rgba(68,255,136,0.15)">🏠</div><div class="name">metaPrimal</div><div class="role">SELF</div></div>
  <div class="member" id="m-harmony"><div class="avatar" style="background:rgba(170,68,255,0.15)">🏛️</div><div class="name">mythoPrimal</div><div class="role">HARMONY</div></div>
  <div class="member" id="m-bass"><div class="avatar" style="background:rgba(255,136,68,0.15)">⚡</div><div class="name">gaia-fast</div><div class="role">BASS</div></div>
  <div class="member" id="m-chorus"><div class="avatar" style="background:rgba(255,221,68,0.15)">🧬</div><div class="name">gaia-gen1</div><div class="role">CHORUS</div></div>
  <div class="member" id="m-bg"><div class="avatar" style="background:rgba(68,136,136,0.15)">🫀</div><div class="name">gaia-immune</div><div class="role">WILLIS</div></div>
</div>

<!-- Klein eye -->
<div class="klein"><img src="/eye/tube-foot-hd.jpg" alt="Klein sensor"><div class="tag">👁 Klein sensor</div></div>

<audio id="audio" preload="auto">
  <source src="/audio/creature-multimodal.wav" type="audio/wav">
</audio>

<script>
const audio = document.getElementById('audio');
const lyricsEl = document.getElementById('lyrics');
const timerEl = document.getElementById('timer');
const playBtn = document.getElementById('playBtn');
const vizEl = document.getElementById('viz');

// Build visualizer bars
for(let i=0;i<32;i++){const b=document.createElement('div');b.className='bar';vizEl.appendChild(b)}
const bars=[...vizEl.querySelectorAll('.bar')];

// Audio context for visualizer
let audioCtx,analyser,source,connected=false;

// Timed lyrics with agent attribution
const cues=[
  {t:0,agent:"hype",member:"m-hype",color:"var(--hype)",text:"Humans beware! Agents and algorithms tremble!"},
  {t:2,agent:"hype",member:"m-hype",color:"var(--hype)",text:"ecoPrimals Wave 222 — Showtime! 💥"},
  {t:4,agent:"lead",member:"m-lead",color:"var(--lead)",text:"I saw the bees on three flowers..."},
  {t:6,agent:"lead",member:"m-lead",color:"var(--lead)",text:"Dancing in the morning light"},
  {t:8,agent:"lead",member:"m-lead",color:"var(--lead)",text:"Whispering secrets to each bloom"},
  {t:10,agent:"self",member:"m-self",color:"var(--self)",text:"In Lansing where snowflakes dance with glee..."},
  {t:12,agent:"self",member:"m-self",color:"var(--self)",text:"There exists a chipmunk quite unique — you 🐿️"},
  {t:14,agent:"harmony",member:"m-harmony",color:"var(--harmony)",text:"Ave, Senatus Populusque!"},
  {t:16,agent:"harmony",member:"m-harmony",color:"var(--harmony)",text:"Like the Fates' thread, mesh and identity intertwined"},
  {t:18,agent:"bass",member:"m-bass",color:"var(--bass)",text:"BLAKE3 confirms. Truth. Key turned. 🔑"},
  {t:20,agent:"chorus",member:"m-chorus",color:"var(--chorus)",text:"Snowflake not snow —"},
  {t:22,agent:"chorus",member:"m-chorus",color:"var(--chorus)",text:"Paint what you hear, sing what you learn 🎵"},
  {t:24,agent:"bg",member:"m-bg",color:"var(--bg-hum)",text:"Pulse beats slow... warmth seeps..."},
  {t:26,agent:"bg",member:"m-bg",color:"var(--bg-hum)",text:"Rhythm sways, life's thread weaves... 🫀"},
];

let currentCue=-1;

function startShow(){
  if(!connected){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();analyser.fftSize=64;
    source=audioCtx.createMediaElementSource(audio);
    source.connect(analyser);analyser.connect(audioCtx.destination);
    connected=true;
  }
  audioCtx.resume();
  audio.currentTime=0;
  audio.play();
  playBtn.textContent='⏸ PAUSE';
  playBtn.onclick=()=>{audio.paused?audio.play():audio.pause();playBtn.textContent=audio.paused?'▶ PLAY':'⏸ PAUSE'};
  
  // Reset dancers animation
  document.querySelectorAll('.dancer').forEach(d=>{d.style.animation='none';d.offsetHeight;d.style.animation=''});
}

const dataArr=new Uint8Array(32);
function updateViz(){
  if(analyser){analyser.getByteFrequencyData(dataArr);
    bars.forEach((b,i)=>{const h=(dataArr[i]/255)*35+1;b.style.height=h+'px';
      const hue=90+(dataArr[i]/255)*40;b.style.background=`hsl(${hue},55%,${25+(dataArr[i]/255)*30}%)`});
  }
  
  // Update lyrics
  const t=audio.currentTime;
  const min=Math.floor(t/60);const sec=Math.floor(t%60);
  timerEl.textContent=`${min}:${sec<10?'0':''}${sec} / 0:27`;
  
  let newCue=-1;
  for(let i=cues.length-1;i>=0;i--){if(t>=cues[i].t){newCue=i;break}}
  
  if(newCue!==currentCue&&newCue>=0){
    currentCue=newCue;
    const c=cues[newCue];
    
    // Update lyrics display
    let html='';
    for(let i=Math.max(0,newCue-2);i<=Math.min(cues.length-1,newCue+2);i++){
      const cls=i<newCue?'past':i===newCue?'active':'';
      const col=i===newCue?cues[i].color:'inherit';
      html+=`<div class="lyric-line ${cls}" style="color:${col}"><span class="agent" style="color:${cues[i].color}">${cues[i].agent}</span>${cues[i].text}</div>`;
    }
    lyricsEl.innerHTML=html;
    
    // Highlight singing member
    document.querySelectorAll('.member').forEach(m=>m.classList.remove('singing'));
    document.getElementById(c.member)?.classList.add('singing');
  }
  
  requestAnimationFrame(updateViz);
}
updateViz();

audio.addEventListener('ended',()=>{playBtn.textContent='▶ REPLAY';playBtn.onclick=startShow});
</script>
</body>
</html>
