<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>desk — primals.eco</title>
<meta name="description" content="Your workspace on the membrane. Study your marks. Write from your notes. Draw connections. Play the epitope sort.">
<meta name="robots" content="noindex">
<style>
:root {
  --bg: #0d1117; --bg-alt: #0a0c12;
  --surface: #161b22; --surface2: #1c2030; --surface3: #21262d;
  --border: #30363d; --border-active: #58a6ff;
  --fg: #c9d1d9; --fg-dim: #8b949e; --fg-muted: #484f58;
  --accent: #58a6ff; --accent-dim: rgba(88,166,255,0.12);
  --green: #3fb950; --red: #f85149; --yellow: #d29922;
  --purple: #bc8cff; --cyan: #39d2c0; --orange: #d29922;

  /* golden ratio panels */
  --phi: 1.618;
  --sidebar-w: 220px;
  --header-h: 42px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
  background: var(--bg); color: var(--fg);
  font-size: 13px; line-height: 1.55;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* === LAYOUT === */
.desk {
  display: grid; height: 100vh;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-columns: 1fr;
}

/* === HEADER === */
.desk-header {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px; background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
}
.desk-title {
  font-family: "Iosevka","Fira Code",monospace;
  font-size: 14px; color: var(--fg); font-weight: 600;
  letter-spacing: 0.03em;
}
.desk-nav { display: flex; gap: 2px; margin-left: 24px; }
.desk-tab {
  background: none; border: none; color: var(--fg-dim);
  font-family: inherit; font-size: 12px; padding: 8px 14px;
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.desk-tab:hover { color: var(--fg); }
.desk-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.desk-links {
  margin-left: auto; display: flex; gap: 12px;
  font-size: 11px; color: var(--fg-dim);
}
.desk-links a { color: var(--fg-dim); font-size: 11px; }
.desk-links a:hover { color: var(--accent); }

/* === MAIN PANEL === */
.desk-main {
  overflow-y: auto; padding: 24px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) var(--bg);
}

/* === CARDS === */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; margin-bottom: 16px; overflow: hidden;
}
.card-header {
  padding: 12px 16px; font-size: 12px; font-weight: 600;
  color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-body { padding: 16px; }

/* === EPITOPE PILL === */
.ep-pill {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
  border: 1px solid; margin: 0 2px;
}

/* === STUDY TAB === */
.study-group { margin-bottom: 20px; }
.study-group-label {
  font-size: 11px; color: var(--fg-dim); text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 8px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.study-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid rgba(48,54,61,0.3);
}
.study-item:last-child { border-bottom: none; }
.study-item a { font-size: 13px; }
.study-item .study-time { font-size: 11px; color: var(--fg-muted); margin-left: auto; }

/* === WRITE TAB === */
.write-entry { margin-bottom: 16px; }
.write-page {
  font-size: 11px; color: var(--fg-dim); margin-bottom: 4px;
  display: flex; align-items: center; gap: 8px;
}
.write-note {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 4px; padding: 10px 12px; font-size: 13px;
  color: var(--fg); line-height: 1.5; white-space: pre-wrap;
}

/* === DRAW TAB === */
.draw-canvas {
  width: 100%; height: calc(100vh - var(--header-h) - 80px);
  background: var(--bg-alt); border: 1px solid var(--border);
  border-radius: 6px; position: relative; overflow: hidden;
}
.draw-node {
  position: absolute; background: var(--surface);
  border: 2px solid; border-radius: 50%;
  width: 50px; height: 50px; display: flex;
  align-items: center; justify-content: center;
  font-size: 9px; text-align: center; cursor: grab;
  transition: box-shadow 0.2s;
}
.draw-node:hover { box-shadow: 0 0 12px rgba(88,166,255,0.3); }

/* === GAIA TAB — ring reflection === */
.gaia-ring-svg { width: 100%; max-width: 600px; margin: 0 auto; display: block; }
.gaia-ring-svg text { font-family: -apple-system, system-ui, sans-serif; }
.gaia-legend { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; font-size:11px; color:var(--fg-dim); }
.gaia-legend span { display:flex; align-items:center; gap:4px; }
.gaia-legend .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
.gaia-profile { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.gaia-profile-item { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:12px; }
.gaia-profile-label { font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--fg-dim); margin-bottom:4px; }
.gaia-profile-val { font-size:18px; font-weight:600; }

/* === SHAPE BAR CHART (gaia tab) === */
.shape-bar-row { display:flex; align-items:center; gap:8px; padding:3px 0; }
.shape-bar-label { width:100px; font-size:11px; text-align:right; }
.shape-bar-track { flex:1; height:12px; background:var(--surface); border-radius:3px; overflow:hidden; position:relative; }
.shape-bar-fill { height:100%; border-radius:3px; transition:width 0.4s; }
.shape-bar-val { min-width:42px; font-size:11px; color:var(--fg-muted); text-align:right; }

/* === WEAVE TAB — progressive trust === */
.weave-section { margin-bottom:24px; }
.weave-section h3 { font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--fg-dim); margin-bottom:8px; padding-bottom:4px; border-bottom:1px solid var(--border); }
.weave-commitment { font-family:monospace; font-size:11px; background:var(--surface); padding:8px 12px; border-radius:4px; word-break:break-all; color:var(--fg-dim); user-select:all; }
.weave-round { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:16px; margin-bottom:12px; }
.weave-round-header { font-size:13px; font-weight:600; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.weave-round-header .round-num { background:var(--accent); color:var(--bg); width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px; }
.weave-input { background:var(--bg-alt); border:1px solid var(--border); color:var(--fg); font-family:monospace; font-size:12px; padding:6px 10px; border-radius:4px; width:100%; }
.weave-input:focus { border-color:var(--accent); outline:none; }
.weave-btn { background:none; border:1px solid var(--border); color:var(--fg); font-family:inherit; font-size:12px; padding:6px 14px; border-radius:4px; cursor:pointer; }
.weave-btn:hover { border-color:var(--accent); color:var(--accent); }
.weave-btn.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.weave-btn.primary:hover { opacity:0.9; }
.weave-result { margin-top:8px; padding:8px 12px; border-radius:4px; font-size:12px; }
.weave-result.match { background:rgba(63,185,80,0.12); border:1px solid rgba(63,185,80,0.3); color:#3fb950; }
.weave-result.partial { background:rgba(210,153,34,0.12); border:1px solid rgba(210,153,34,0.3); color:#d29922; }
.weave-result.none { background:rgba(248,81,73,0.12); border:1px solid rgba(248,81,73,0.3); color:#f85149; }
.weave-mirror { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px; }
.weave-mirror-half { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:12px; }
.weave-mirror-half h4 { font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--fg-dim); margin-bottom:8px; }

/* === CUBE FACE — bingoCube visual board === */
.cube-face { display:grid; gap:4px; width:fit-content; margin:0 auto; user-select:none; }
.cube-face.L3 { grid-template-columns:repeat(3, 90px); grid-template-rows:repeat(3, 90px); }
.cube-face.L5 { grid-template-columns:repeat(5, 64px); grid-template-rows:repeat(5, 64px); }
.cube-cell {
  border-radius:6px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; cursor:grab;
  border:2px solid transparent; transition:all 0.2s;
  position:relative; overflow:hidden;
}
.cube-cell:hover { border-color:var(--accent); transform:scale(1.04); z-index:1; }
.cube-cell.dragging { opacity:0.4; transform:scale(0.95); }
.cube-cell.drag-over { border-color:#fff; border-style:dashed; }
.cube-cell .cell-label { font-size:9px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; z-index:1; }
.cube-cell .cell-val { font-size:16px; font-weight:700; z-index:1; }
.cube-cell.L5 .cell-label { font-size:7px; }
.cube-cell.L5 .cell-val { font-size:12px; }
.cube-cell .cell-fill {
  position:absolute; bottom:0; left:0; right:0;
  transition:height 0.4s; border-radius:0 0 4px 4px;
}
.cube-cell.center-cell { border:2px solid var(--accent); }
.cube-cell.center-cell .cell-label { color:var(--accent); }
.cube-controls { display:flex; gap:8px; justify-content:center; margin-top:12px; align-items:center; }
.cube-level-indicator {
  display:flex; gap:4px; align-items:center; font-size:11px; color:var(--fg-dim);
}
.cube-level-indicator .prime-dot {
  width:12px; height:12px; border-radius:50%; display:inline-flex;
  align-items:center; justify-content:center; font-size:8px; font-weight:700;
  border:1px solid var(--border);
}
.cube-level-indicator .prime-dot.active { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.cube-level-indicator .prime-dot.locked { background:var(--surface); color:var(--fg-dim); }

/* === PLAY TAB — mountain journey === */
.mountain-viz {
  width: 100%; height: 300px; position: relative;
  background: var(--bg-alt); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
}
.mountain-path { position: absolute; bottom: 0; left: 0; right: 0; }

/* === EMPTY STATE === */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--fg-dim);
}
.empty-state h3 { font-size: 18px; color: var(--fg); margin-bottom: 8px; }
.empty-state p { max-width: 400px; margin: 0 auto 16px; line-height: 1.6; }
.empty-state a { color: var(--accent); }

/* === STATS BAR === */
.stats-bar {
  display: flex; gap: 24px; padding: 12px 0; margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.stat-item { text-align: center; }
.stat-val { font-size: 20px; font-weight: 600; color: var(--fg); }
.stat-label { font-size: 10px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.05em; }

/* === EXPORT === */
.export-btn {
  background: var(--accent-dim); border: 1px solid var(--accent);
  color: var(--accent); padding: 6px 14px; border-radius: 4px;
  cursor: pointer; font-family: inherit; font-size: 12px;
  transition: all 0.15s;
}
.export-btn:hover { background: var(--accent); color: #fff; }

@media(max-width: 700px) {
  .desk-nav { gap: 0; }
  .desk-tab { padding: 8px 10px; font-size: 11px; }
  .desk-links { display: none; }
  .desk-main { padding: 16px; }
}
</style>
</head>
<body>
<div class="desk">
  <header class="desk-header">
    <span class="desk-title">⊞ desk</span>
    <nav class="desk-nav">
      <button class="desk-tab active" data-tab="study">study</button>
      <button class="desk-tab" data-tab="write">write</button>
      <button class="desk-tab" data-tab="draw">draw</button>
      <button class="desk-tab" data-tab="play">play</button>
      <button class="desk-tab" data-tab="create">create</button>
      <button class="desk-tab" data-tab="gaia">gaia</button>
      <button class="desk-tab" data-tab="weave">weave</button>
    </nav>
    <div class="desk-links">
      <a href="/">← hud</a>
      <a href="/braid/">⟠ braid</a>
      <a href="https://sporeprint.primals.eco">sporePrint</a>
      <a href="https://tuebor.primals.eco">tuebor</a>
    </div>
  </header>

  <main class="desk-main" id="desk-main">
    <div id="panel-study"></div>
    <div id="panel-write" style="display:none"></div>
    <div id="panel-draw" style="display:none"></div>
    <div id="panel-play" style="display:none"></div>
    <div id="panel-create" style="display:none"></div>
    <div id="panel-gaia" style="display:none"></div>
    <div id="panel-weave" style="display:none"></div>
  </main>
</div>

<script>
(function(){
'use strict';

var BRAID_KEY_PREFIX = 'eco_braid_';
var MARKS_KEY = 'eco_marks';
var EP_COLORS = {
  PHYSICS:'#58a6ff', TOPOLOGY:'#bc8cff', PHILOSOPHY:'#8b949e',
  METHOD:'#3fb950', INVESTIGATION:'#d29922', IMMUNE:'#f85149',
  SCIENCE:'#39d2c0', SIGNAL:'#79c0ff',
};
var EPITOPE_MAP = {
  'anderson':'PHYSICS','localization':'PHYSICS','permeability':'PHYSICS',
  'lattice':'PHYSICS','qcd':'PHYSICS','hofstadter':'PHYSICS','quantum':'PHYSICS',
  'graph':'TOPOLOGY','topology':'TOPOLOGY','network':'TOPOLOGY','mesh':'TOPOLOGY',
  'braid':'TOPOLOGY','fractal':'TOPOLOGY',
  'philosophy':'PHILOSOPHY','omelas':'PHILOSOPHY','atlas':'PHILOSOPHY',
  'sovereignty':'PHILOSOPHY','commons':'PHILOSOPHY','bibliography':'PHILOSOPHY',
  'methodology':'METHOD','constrained':'METHOD','evolution':'METHOD',
  'guidestone':'METHOD','tufte':'METHOD','schell':'METHOD','ludo':'METHOD',
  'detroit':'INVESTIGATION','tuebor':'INVESTIGATION','public-record':'INVESTIGATION',
  'charter':'INVESTIGATION','institutional':'INVESTIGATION','gorilla':'INVESTIGATION',
  'membrane':'IMMUNE','immune':'IMMUNE','skunkbat':'IMMUNE','scatter':'IMMUNE',
  'signal':'SIGNAL','lossy':'SIGNAL','shannon':'SIGNAL','channel':'SIGNAL',
  'science':'SCIENCE','biology':'SCIENCE','genomics':'SCIENCE','ferment':'SCIENCE',
  'story':'SIGNAL','billboard':'SIGNAL','beacon':'SIGNAL','transit':'SIGNAL',
};

function classify(url) {
  return classifyText(url);
}

function classifyText(text) {
  var l = text.toLowerCase(), found = {}, best = 'SIGNAL', bestN = 0;
  for (var kw in EPITOPE_MAP) {
    if (l.indexOf(kw) !== -1) found[EPITOPE_MAP[kw]] = (found[EPITOPE_MAP[kw]]||0) + 1;
  }
  for (var ep in found) { if (found[ep] > bestN) { best = ep; bestN = found[ep]; } }
  return best;
}

// Compute the full 8-dimensional epitope shape from ALL input
function computeShape() {
  var EP_KEYS = Object.keys(EP_COLORS);
  var counts = {};
  EP_KEYS.forEach(function(k) { counts[k] = 0; });

  // Visits (weighted 1×)
  getAllVisits().forEach(function(v) {
    var ep = v.epitope || classify(v.url);
    counts[ep] = (counts[ep] || 0) + 1;
  });

  // Marks (weighted 3× — intentional action)
  var marks = getMarks();
  for (var url in marks) {
    var ep = marks[url].epitope || classify(url);
    counts[ep] = (counts[ep] || 0) + 3;
  }

  // Songs (weighted 5× — creative investment)
  var braids = findAllBraids();
  braids.forEach(function(b) {
    if (!b.braid.songs) return;
    for (var sUrl in b.braid.songs) {
      var song = b.braid.songs[sUrl];
      var ep;
      if (typeof song === 'object' && song.epitope) {
        ep = song.epitope;
      } else {
        var text = (typeof song === 'string') ? song : (song.text || '');
        ep = classifyText(text + ' ' + sUrl);
      }
      counts[ep] = (counts[ep] || 0) + 5;
    }
  });

  // Braid marks (weighted 3×)
  braids.forEach(function(b) {
    if (!b.braid.marks) return;
    b.braid.marks.forEach(function(m) {
      var ep = m.epitope || classify(m.url);
      counts[ep] = (counts[ep] || 0) + 3;
    });
  });

  // Normalize to probability vector
  var total = 0;
  EP_KEYS.forEach(function(k) { total += counts[k]; });
  var shape = {};
  EP_KEYS.forEach(function(k) { shape[k] = total > 0 ? counts[k] / total : 0; });
  shape._total = total;
  shape._counts = counts;
  return shape;
}

function epPill(ep) {
  var c = EP_COLORS[ep] || '#8b949e';
  return '<span class="ep-pill" style="color:'+c+';border-color:'+c+'44">'+ep+'</span>';
}

function findAllBraids() {
  var braids = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (key && key.indexOf(BRAID_KEY_PREFIX) === 0) {
        var raw = localStorage.getItem(key);
        if (raw) {
          var b = JSON.parse(raw);
          if (b && b.visits) braids.push({ key: key, braid: b });
        }
      }
    }
  } catch(e) {}
  return braids;
}

function getMarks() {
  try { return JSON.parse(localStorage.getItem(MARKS_KEY) || '{}'); } catch(e) { return {}; }
}

function getAllVisits() {
  var visits = [];
  var braids = findAllBraids();
  braids.forEach(function(b) {
    b.braid.visits.forEach(function(v) { visits.push(v); });
  });
  return visits;
}

function getAllSongs() {
  var songs = {};
  var braids = findAllBraids();
  braids.forEach(function(b) {
    if (b.braid.songs) {
      for (var url in b.braid.songs) {
        songs[url] = { text: b.braid.songs[url], title: b.braid.visits
          ? (b.braid.visits.find(function(v){return v.url === url;}) || {}).title || url
          : url
        };
      }
    }
  });
  return songs;
}

function timeAgo(iso) {
  var d = new Date(iso), now = new Date();
  var s = Math.floor((now - d) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

function computeEntropy(visits) {
  var counts = {}, total = visits.length;
  visits.forEach(function(v) { counts[v.epitope] = (counts[v.epitope]||0)+1; });
  var H = 0;
  for (var ep in counts) {
    var p = counts[ep] / total;
    if (p > 0) H -= p * Math.log2(p);
  }
  return H;
}

function groupByEpitope(items, epKey) {
  var groups = {};
  items.forEach(function(item) {
    var ep = item[epKey || 'epitope'] || 'SIGNAL';
    if (!groups[ep]) groups[ep] = [];
    groups[ep].push(item);
  });
  return groups;
}

// ═══════════════════════════════════════════════════════
// STUDY — reading list from marks
// ═══════════════════════════════════════════════════════
function renderStudy() {
  var marks = getMarks();
  var entries = [];
  for (var url in marks) {
    entries.push({ url: url, title: marks[url].title || url, epitope: marks[url].epitope || classify(url), time: marks[url].time });
  }

  if (entries.length === 0) {
    return '<div class="empty-state">' +
      '<h3>nothing marked yet</h3>' +
      '<p>As you explore the membrane, use <strong>★ mark</strong> on pages that catch your eye. They\'ll appear here as your reading list.</p>' +
      '<p><a href="https://sporeprint.primals.eco">start exploring →</a></p>' +
    '</div>';
  }

  var groups = groupByEpitope(entries);
  var html = '<div class="stats-bar">' +
    '<div class="stat-item"><div class="stat-val">' + entries.length + '</div><div class="stat-label">marked</div></div>' +
    '<div class="stat-item"><div class="stat-val">' + Object.keys(groups).length + '</div><div class="stat-label">epitopes</div></div>' +
    '<div class="stat-item"><div class="stat-val">' + computeEntropy(entries).toFixed(2) + '</div><div class="stat-label">H (entropy)</div></div>' +
  '</div>';

  var epOrder = ['PHYSICS','TOPOLOGY','PHILOSOPHY','METHOD','INVESTIGATION','IMMUNE','SCIENCE','SIGNAL'];
  epOrder.forEach(function(ep) {
    if (!groups[ep]) return;
    var c = EP_COLORS[ep];
    html += '<div class="study-group">' +
      '<div class="study-group-label" style="color:'+c+'">' + ep + ' (' + groups[ep].length + ')</div>';
    groups[ep].sort(function(a,b) { return (b.time||'') > (a.time||'') ? 1 : -1; });
    groups[ep].forEach(function(e) {
      html += '<div class="study-item">' +
        '<a href="' + e.url + '" target="_blank">' + e.title + '</a>' +
        '<span class="study-time">' + (e.time ? timeAgo(e.time) : '') + '</span>' +
      '</div>';
    });
    html += '</div>';
  });

  return html;
}

// ═══════════════════════════════════════════════════════
// WRITE — notes from songs
// ═══════════════════════════════════════════════════════
function renderWrite() {
  var songs = getAllSongs();
  var urls = Object.keys(songs);

  if (urls.length === 0) {
    return '<div class="empty-state">' +
      '<h3>no notes yet</h3>' +
      '<p>Use <strong>♪ sing</strong> on any page to leave a note. Your notes live in your braid — never sent to a server.</p>' +
      '<p>Your songs will appear here as a notebook.</p>' +
    '</div>';
  }

  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
    '<span style="color:var(--fg-dim);font-size:12px">' + urls.length + ' pages with notes</span>' +
    '<button class="export-btn" id="export-md">export as markdown</button>' +
  '</div>';

  urls.forEach(function(url) {
    var s = songs[url];
    var ep = classify(url);
    html += '<div class="write-entry">' +
      '<div class="write-page">' +
        epPill(ep) +
        ' <a href="' + url + '" target="_blank">' + s.title + '</a>' +
      '</div>' +
      '<div class="write-note">' + escHtml(s.text) + '</div>' +
    '</div>';
  });

  return html;
}

// ═══════════════════════════════════════════════════════
// DRAW — epitope connection map
// ═══════════════════════════════════════════════════════
function renderDraw() {
  var visits = getAllVisits();
  if (visits.length < 2) {
    return '<div class="empty-state">' +
      '<h3>not enough trail yet</h3>' +
      '<p>Explore more pages across the membrane. As your trail grows, the draw canvas maps the connections between the epitopes you\'ve touched.</p>' +
    '</div>';
  }

  var counts = {};
  visits.forEach(function(v) { counts[v.epitope] = (counts[v.epitope]||0)+1; });
  var eps = Object.keys(counts).sort(function(a,b) { return counts[b] - counts[a]; });
  var total = visits.length;

  var html = '<div class="card"><div class="card-header">your epitope map</div><div class="card-body">';
  html += '<div class="draw-canvas" id="draw-area">';

  var cx = 400, cy = 200, r = 150;
  eps.forEach(function(ep, i) {
    var angle = (2 * Math.PI * i / eps.length) - Math.PI/2;
    var x = cx + r * Math.cos(angle) - 25;
    var y = cy + r * Math.sin(angle) - 25;
    var size = 30 + Math.min(50, (counts[ep]/total) * 150);
    var c = EP_COLORS[ep];
    html += '<div class="draw-node" style="left:'+x+'px;top:'+y+'px;width:'+size+'px;height:'+size+'px;border-color:'+c+';color:'+c+'">' +
      ep + '<br>' + counts[ep] +
    '</div>';
  });

  html += '</div></div></div>';

  // Connections list
  html += '<div class="card"><div class="card-header">epitope transitions</div><div class="card-body">';
  var transitions = {};
  for (var i = 1; i < visits.length; i++) {
    var from = visits[i-1].epitope, to = visits[i].epitope;
    if (from !== to) {
      var key = from + ' → ' + to;
      transitions[key] = (transitions[key]||0) + 1;
    }
  }
  var tKeys = Object.keys(transitions).sort(function(a,b) { return transitions[b] - transitions[a]; });
  if (tKeys.length === 0) {
    html += '<p style="color:var(--fg-dim)">All visits in one epitope — no transitions yet.</p>';
  } else {
    tKeys.slice(0,15).forEach(function(t) {
      html += '<div style="display:flex;align-items:center;gap:8px;padding:4px 0">' +
        '<span style="font-size:12px">' + t + '</span>' +
        '<span style="margin-left:auto;color:var(--fg-dim);font-size:11px">×' + transitions[t] + '</span>' +
      '</div>';
    });
  }
  html += '</div></div>';

  return html;
}

// ═══════════════════════════════════════════════════════
// PLAY — mountain journey visualization
// ═══════════════════════════════════════════════════════
function renderPlay() {
  var visits = getAllVisits();
  if (visits.length < 1) {
    return '<div class="empty-state">' +
      '<h3>the mountain awaits</h3>' +
      '<p>Every page you visit adds a step to the path. The mountain reveals itself as your epitope signature diversifies.</p>' +
      '<p><a href="https://sporeprint.primals.eco/science/">climb from science →</a></p>' +
    '</div>';
  }

  var H = computeEntropy(visits);
  var pos = visits.length < 3 ? 'setting out' : H > 2.2 ? 'ascending — exploring broadly' : H > 1.2 ? 'summit — seeing the whole' : 'descending — building deep';

  var html = '<div class="card"><div class="card-header">your mountain</div><div class="card-body">';

  // Stats
  html += '<div class="stats-bar">' +
    '<div class="stat-item"><div class="stat-val">' + visits.length + '</div><div class="stat-label">steps</div></div>' +
    '<div class="stat-item"><div class="stat-val">' + H.toFixed(2) + '</div><div class="stat-label">H (entropy)</div></div>' +
    '<div class="stat-item"><div class="stat-val" style="font-size:14px">' + pos + '</div><div class="stat-label">position</div></div>' +
  '</div>';

  // Mountain path ASCII art
  var counts = {};
  visits.forEach(function(v) { counts[v.epitope] = (counts[v.epitope]||0)+1; });
  var eps = Object.keys(counts).sort(function(a,b) { return counts[b] - counts[a]; });

  html += '<div style="font-family:monospace;font-size:11px;line-height:1.4;padding:16px;background:var(--bg-alt);border-radius:6px">';
  var maxCount = Math.max.apply(null, eps.map(function(e) { return counts[e]; }));
  eps.forEach(function(ep) {
    var c = EP_COLORS[ep];
    var barLen = Math.round((counts[ep] / maxCount) * 40);
    var bar = '';
    for (var i = 0; i < barLen; i++) bar += '█';
    html += '<span style="color:'+c+'">' + pad(ep, 14) + ' ' + bar + ' ' + counts[ep] + '</span>\n';
  });
  html += '</div>';

  // Recent journey
  html += '<h3 style="margin-top:20px;color:var(--fg-dim);font-size:12px;text-transform:uppercase;letter-spacing:0.05em">recent path</h3>';
  var recent = visits.slice(-20).reverse();
  recent.forEach(function(v) {
    html += '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)">' +
      epPill(v.epitope) +
      ' <a href="' + v.url + '" target="_blank" style="font-size:12px">' + (v.title||v.url).slice(0,60) + '</a>' +
      '<span style="margin-left:auto;color:var(--fg-muted);font-size:10px">' + timeAgo(v.time) + '</span>' +
    '</div>';
  });

  html += '</div></div>';
  return html;
}

// ═══════════════════════════════════════════════════════
// CREATE — forge a story from marks + songs

function renderCreate() {
  var marks = getMarks();

  html += '<div class="stats-bar">' +
    '<div class="stat-item"><div class="stat-val">' + markCount + '</div><div class="stat-label">marks</div></div>' +

  return html;
}

// ═══════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function pad(s, n) {
  while (s.length < n) s += ' ';
  return s;
}

function exportMarkdown() {
  var songs = getAllSongs();
  var md = '# Desk Notes — primals.eco\n\n';
  md += '_Exported ' + new Date().toISOString().slice(0,10) + '_\n\n';
  for (var url in songs) {
    var s = songs[url];
    var ep = classify(url);
    md += '## ' + s.title + '\n\n';
    md += '**Epitope:** ' + ep + '  \n';
    md += '**URL:** ' + url + '\n\n';
    md += s.text + '\n\n---\n\n';
  }
  downloadFile('desk-notes.md', md, 'text/markdown');
}

function exportBraidMd() {
  var marks = getMarks();
  var songs = getAllSongs();
  var md = '# My Braid — primals.eco\n\n';
  md += '_Forged ' + new Date().toISOString().slice(0,10) + '_\n\n';
  for (var url in marks) {
    var m = marks[url];
    var ep = m.epitope || classify(url);
    md += '## ' + (m.title || url) + '\n\n';
    md += '**Epitope:** ' + ep + '  \n';
    md += '**URL:** ' + url + '\n\n';
    if (songs[url]) md += songs[url].text + '\n\n';
    md += '---\n\n';
  }
  downloadFile('braid.md', md, 'text/markdown');
}

function exportBraidJson() {
  var braids = findAllBraids();
  var marks = getMarks();
  var data = { exported: new Date().toISOString(), braids: braids.map(function(b){return b.braid;}), marks: marks };
  downloadFile('braid.json', JSON.stringify(data, null, 2), 'application/json');
}

function downloadFile(name, content, type) {
  var blob = new Blob([content], {type: type});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ═══════════════════════════════════════════════════════
// GAIA — the ring seen from your position
// ═══════════════════════════════════════════════════════
function renderGaia() {
  var visits = getAllVisits();
  var marks = getMarks();

  var SITES = [
    {id:'signal',     label:'signal',     color:'#58a6ff'},
    {id:'detroit',    label:'detroit',    color:'#f85149'},
    {id:'tuebor',     label:'tuebor',     color:'#f0883e'},
    {id:'sporeprint', label:'sporePrint', color:'#3fb950'},
    {id:'hypothesis', label:'hypothesis', color:'#bc8cff'},
    {id:'hud',        label:'hud',        color:'#39d2c0'},
    {id:'thesis',     label:'thesis',     color:'#d29922'},
    {id:'clutch',     label:'clutch',     color:'#f778ba'},
    {id:'gorilla',    label:'gorilla',    color:'#8b949e'},
    {id:'git',        label:'git',        color:'#6e7681'}
  ];
  var N = SITES.length;

  // Count visits per site from braid
  var siteCounts = {};
  SITES.forEach(function(s) { siteCounts[s.id] = 0; });
  visits.forEach(function(v) {
    var url = v.url || '';
    SITES.forEach(function(s) {
      if (url.indexOf(s.id + '.primals.eco') >= 0) siteCounts[s.id]++;
    });
  });

  // Epitope profile from marks
  var epCounts = {};
  Object.keys(marks).forEach(function(k) {
    var ep = marks[k].epitope;
    epCounts[ep] = (epCounts[ep] || 0) + 1;
  });

  // d_eff: how many sites touched
  var d_eff = 0;
  SITES.forEach(function(s) { if (siteCounts[s.id] > 0) d_eff++; });

  // focal distance f = 1/pi^(d_eff/2)
  var focal = d_eff > 0 ? (1 / Math.pow(Math.PI, d_eff / 2)) : 1;

  // Shannon entropy of site distribution
  var totalVisits = visits.length || 1;
  var H_site = 0;
  SITES.forEach(function(s) {
    var p = siteCounts[s.id] / totalVisits;
    if (p > 0) H_site -= p * Math.log2(p);
  });

  // SVG ring
  var cx = 300, cy = 260, R = 200;
  var svg = '<svg class="gaia-ring-svg" viewBox="0 0 600 540" xmlns="http://www.w3.org/2000/svg">';

  // Outer membrane circle
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#21262d" stroke-width="2" stroke-dasharray="4,4"/>';

  // Focal distance inner circle
  var focalR = R * Math.min(focal * 2, 0.9);
  if (d_eff > 0) {
    svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+focalR+'" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="2,4"/>';
    svg += '<text x="'+cx+'" y="'+(cy - focalR - 6)+'" text-anchor="middle" font-size="9" fill="#484f58">f = ' + (focal < 0.01 ? focal.toExponential(1) : focal.toFixed(3)) + '</text>';
  }

  // Center — gaia
  svg += '<text x="'+cx+'" y="'+(cy-10)+'" text-anchor="middle" font-size="11" fill="#6e7681">gaia</text>';
  svg += '<text x="'+cx+'" y="'+(cy+6)+'" text-anchor="middle" font-size="9" fill="#484f58">you are here</text>';
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#58a6ff" opacity="0.6"/>';

  // Site nodes on the ring
  var maxCount = 1;
  SITES.forEach(function(s) { if (siteCounts[s.id] > maxCount) maxCount = siteCounts[s.id]; });

  SITES.forEach(function(s, i) {
    var angle = (2 * Math.PI * i / N) - Math.PI / 2;
    var x = cx + R * Math.cos(angle);
    var y = cy + R * Math.sin(angle);
    var visited = siteCounts[s.id] > 0;
    var nodeR = visited ? 10 + Math.min(20, (siteCounts[s.id] / maxCount) * 20) : 8;
    var opacity = visited ? 1 : 0.3;

    // Connection line from center
    if (visited) {
      svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="'+s.color+'" stroke-width="1" opacity="0.2"/>';
    }

    // Node circle
    svg += '<circle cx="'+x+'" cy="'+y+'" r="'+nodeR+'" fill="'+(visited ? s.color : '#21262d')+'" stroke="'+s.color+'" stroke-width="'+(visited?2:1)+'" opacity="'+opacity+'"/>';

    // Label
    var labelR = R + 24;
    var lx = cx + labelR * Math.cos(angle);
    var ly = cy + labelR * Math.sin(angle);
    var anchor = Math.cos(angle) < -0.3 ? 'end' : Math.cos(angle) > 0.3 ? 'start' : 'middle';
    svg += '<text x="'+lx+'" y="'+(ly+4)+'" text-anchor="'+anchor+'" font-size="11" fill="'+s.color+'" font-weight="'+(visited?'600':'400')+'" opacity="'+opacity+'">'+s.label+'</text>';

    // Visit count inside node
    if (visited) {
      svg += '<text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="9" fill="#0d1117" font-weight="700">'+siteCounts[s.id]+'</text>';
    }
  });

  // Epitope petals inside the ring
  var epKeys = Object.keys(EP_COLORS);
  var totalMarks = 0;
  epKeys.forEach(function(e) { totalMarks += (epCounts[e] || 0); });
  if (totalMarks > 0) {
    var innerR = 60;
    epKeys.forEach(function(ep, i) {
      var count = epCounts[ep] || 0;
      if (count === 0) return;
      var angle = (2 * Math.PI * i / epKeys.length) - Math.PI / 2;
      var petalR = innerR * (count / totalMarks) * 2;
      var px = cx + (innerR + petalR / 2) * Math.cos(angle);
      var py = cy + (innerR + petalR / 2) * Math.sin(angle);
      svg += '<circle cx="'+px+'" cy="'+py+'" r="'+(4 + petalR)+'" fill="'+EP_COLORS[ep]+'" opacity="0.3"/>';
      svg += '<text x="'+px+'" y="'+(py+3)+'" text-anchor="middle" font-size="8" fill="'+EP_COLORS[ep]+'">'+ep.slice(0,4)+'</text>';
    });
  }

  svg += '</svg>';

  // Assemble HTML
  var html = '<div class="card"><div class="card-header">your position on the ring</div><div class="card-body">';
  html += svg;
  html += '<div class="gaia-legend">';
  html += '<span><span class="dot" style="background:#58a6ff"></span> visited</span>';
  html += '<span><span class="dot" style="background:#21262d;border:1px solid #30363d"></span> not yet</span>';
  if (totalMarks > 0) html += '<span>inner petals = your epitope marks</span>';
  html += '</div>';
  html += '</div></div>';

  // Profile metrics
  html += '<div class="gaia-profile">';
  html += '<div class="gaia-profile-item"><div class="gaia-profile-label">d_eff (sites touched)</div><div class="gaia-profile-val">' + d_eff + ' / ' + N + '</div></div>';
  html += '<div class="gaia-profile-item"><div class="gaia-profile-label">focal distance</div><div class="gaia-profile-val">' + (focal < 0.01 ? focal.toExponential(2) : focal.toFixed(4)) + '</div></div>';
  html += '<div class="gaia-profile-item"><div class="gaia-profile-label">site entropy H</div><div class="gaia-profile-val">' + H_site.toFixed(3) + '</div></div>';
  html += '<div class="gaia-profile-item"><div class="gaia-profile-label">total visits</div><div class="gaia-profile-val">' + visits.length + '</div></div>';
  html += '</div>';

  // Full epitope shape (all input)
  var shape = computeShape();
  if (shape._total > 0) {
    html += '<div class="card" style="margin-top:16px"><div class="card-header">your shape — all input through the epitope sort</div><div class="card-body">';
    html += '<p style="color:var(--fg-dim);font-size:11px;margin-bottom:12px">Visits ×1 · Marks ×3 · Songs ×5. Weighted by intentional investment. Only you see this.</p>';
    var epKeys = Object.keys(EP_COLORS);
    var maxVal = 0;
    epKeys.forEach(function(k) { if (shape[k] > maxVal) maxVal = shape[k]; });
    epKeys.sort(function(a,b) { return shape[b] - shape[a]; });
    epKeys.forEach(function(ep) {
      var pct = (shape[ep] * 100).toFixed(1);
      var barW = maxVal > 0 ? Math.round((shape[ep] / maxVal) * 100) : 0;
      html += '<div class="shape-bar-row">';
      html += '<div class="shape-bar-label" style="color:' + EP_COLORS[ep] + '">' + ep + '</div>';
      html += '<div class="shape-bar-track"><div class="shape-bar-fill" style="width:' + barW + '%;background:' + EP_COLORS[ep] + '"></div></div>';
      html += '<div class="shape-bar-val">' + pct + '%</div>';
      html += '<div class="shape-bar-val" style="min-width:30px;color:var(--fg-muted)">' + (shape._counts[ep] || 0) + '</div>';
      html += '</div>';
    });
    // Top 2 summary
    var top2 = epKeys.slice(0, 2);
    html += '<p style="margin-top:12px;font-size:12px;color:var(--fg)">Your shape leans <strong style="color:' + EP_COLORS[top2[0]] + '">' + top2[0] + '</strong>';
    if (top2.length > 1 && shape[top2[1]] > 0) {
      var ratio = shape[top2[1]] > 0 ? (shape[top2[0]] / shape[top2[1]]).toFixed(1) : '∞';
      html += ' with <strong style="color:' + EP_COLORS[top2[1]] + '">' + top2[1] + '</strong> secondary (ratio ' + ratio + ':1)';
    }
    html += '.</p>';
    html += '<p style="font-size:11px;color:var(--fg-dim);margin-top:4px">This is your epitope shape. It lives here, in your browser. The membrane never sees it.</p>';
    html += '</div></div>';
  }

  // Collective heatmap (async from traces API)
  html += '<div class="card" style="margin-top:16px"><div class="card-header">the ring — collective (last 2 hours)</div><div class="card-body" id="gaia-collective"><span style="color:var(--fg-dim)">loading...</span></div></div>';

  setTimeout(function() {
    fetch('/api/traces').then(function(r) { return r.json(); }).then(function(d) {
      var el = document.getElementById('gaia-collective');
      if (!el) return;
      var hm = d.heatmap || {};
      var keys = Object.keys(hm).sort(function(a, b) { return hm[b] - hm[a]; });
      if (keys.length === 0) {
        el.innerHTML = '<p style="color:var(--fg-dim)">the ring is quiet — no collective traces in the last 2 hours.</p>';
        return;
      }
      var out = '<div style="font-size:12px">';
      out += '<p style="color:var(--fg-dim);margin-bottom:8px">' + d.total_sessions + ' visitors traversing the ring</p>';
      keys.slice(0, 15).forEach(function(k) {
        var barW = Math.round((hm[k] / hm[keys[0]]) * 100);
        out += '<div style="display:flex;align-items:center;gap:8px;padding:3px 0">';
        out += '<span style="width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + k + '</span>';
        out += '<div style="flex:1;height:6px;background:var(--surface);border-radius:3px;overflow:hidden"><div style="width:' + barW + '%;height:100%;background:var(--accent);border-radius:3px"></div></div>';
        out += '<span style="color:var(--fg-muted);min-width:30px;text-align:right">' + hm[k] + '</span>';
        out += '</div>';
      });
      out += '</div>';
      el.innerHTML = out;
    }).catch(function() {
      var el = document.getElementById('gaia-collective');
      if (el) el.innerHTML = '<p style="color:var(--fg-dim)">could not reach the ring.</p>';
    });
  }, 100);

  // What you see from here
  html += '<div class="card" style="margin-top:16px"><div class="card-header">what you see from here</div><div class="card-body">';
  if (d_eff === 0) {
    html += '<p style="color:var(--fg-dim)">You have not touched the ring yet. Visit any site in the ecosystem. Your position will appear.</p>';
    html += '<p style="margin-top:8px"><a href="https://sporeprint.primals.eco">start at sporePrint \u2192</a></p>';
  } else if (d_eff <= 2) {
    html += '<p>Standing at the edge. ' + d_eff + ' node' + (d_eff > 1 ? 's' : '') + ' lit. Focal distance is wide \u2014 the view is blurry from here. Explore more sites to sharpen it.</p>';
    html += '<p style="color:var(--fg-dim);font-size:11px;margin-top:6px">Anderson: localized. Your wave function concentrates at ' + d_eff + ' surface' + (d_eff > 1 ? 's' : '') + '. The membrane looks opaque.</p>';
  } else if (d_eff <= 5) {
    html += '<p>You can see across. ' + d_eff + ' nodes lit. The focal distance is tightening \u2014 patterns emerge between the sites you have visited.</p>';
    html += '<p style="color:var(--fg-dim);font-size:11px;margin-top:6px">Approaching the mobility edge. A few more surfaces and your wave delocalizes.</p>';
  } else {
    html += '<p>You see the ring. ' + d_eff + ' of ' + N + ' nodes active. Focal distance sharp \u2014 triangulation across the ecosystem.</p>';
    html += '<p style="color:var(--fg-dim);font-size:11px;margin-top:6px">Delocalized. Your wave extends across the membrane. You are one of Gaia\'s epitopes, and you can see the others.</p>';
  }
  html += '</div></div>';

  return html;
}

// WEAVE — BingoCube progressive trust comparison

function renderWeave() {
  var shape = computeShape();
  var EP_KEYS = Object.keys(EP_COLORS);

  if (shape._total === 0) {
    return '<div class="empty-state">' +
      '<h3>no shape yet</h3>' +
      '<p>Explore the membrane. Visit pages. Mark what matters. Sing notes. Your shape forms from what you touch.</p>' +

      '<p><a href="https://sporeprint.primals.eco/science/">start exploring \u2192</a></p>' +
    '</div>';
  }

  // Sort by descending value for display
  var sorted = EP_KEYS.slice().sort(function(a,b) { return shape[b] - shape[a]; });
  var top2 = sorted.slice(0, 2).filter(function(k) { return shape[k] > 0; });

  // Determine cube level (prime chain)
  var activeEpitopes = sorted.filter(function(k) { return shape[k] > 0; }).length;
  var cubeLevel = activeEpitopes >= 6 ? 5 : 3;
  var savedLevel = null;
  try { savedLevel = parseInt(localStorage.getItem('eco_cube_level')); } catch(e) {}
  if (savedLevel === 5 && activeEpitopes >= 6) cubeLevel = 5;
  if (savedLevel === 3) cubeLevel = 3;

  // Compute perplexity (effective number of active axes)
  var H_shape = 0;
  sorted.forEach(function(k) {
    if (shape[k] > 0) H_shape -= shape[k] * Math.log(shape[k]);
  });
  var PP = Math.exp(H_shape);
  var focal = 1 / Math.pow(Math.PI, PP / 2);
  var piCost = Math.pow(Math.PI, PP / 2);

  var html = '';

  // ═══════════════════════════════════════════════════════
  // THE FACE — bingoCube visual board
  // ═══════════════════════════════════════════════════════
  html += '<div class="weave-section">';
  html += '<h3>your face</h3>';
  html += '<div class="card"><div class="card-body">';

  // Axis labels — your top 2 epitopes ARE your axes
  if (top2.length >= 2) {
    html += '<p style="font-size:12px;color:var(--fg-dim);margin-bottom:8px">Your axes: ';
    html += '<strong style="color:' + EP_COLORS[top2[0]] + '">' + top2[0] + '</strong> (primary receptor) \u00d7 ';

  // Prime chain indicator
  html += '<div class="cube-level-indicator" style="margin-bottom:12px;justify-content:center">';
  [3,5,7,11,13].forEach(function(p) {
    var isActive = p === cubeLevel;
    var isUnlocked = p <= cubeLevel;
    html += '<span class="prime-dot ' + (isActive ? 'active' : (isUnlocked ? '' : 'locked')) + '">' + p + '</span>';
  });
  html += '<span style="margin-left:4px">prime chain \u00b7 ' + PP.toFixed(1) + ' active axes</span>';
  html += '</div>';

  html += '<div id="cube-face-container"></div>';

  // Controls
  html += '<div class="cube-controls">';
  if (activeEpitopes >= 6 && cubeLevel === 3) {
    html += '<button class="weave-btn primary" id="cube-evolve">evolve to 5\u00d75</button>';
  } else if (cubeLevel === 5) {
    html += '<button class="weave-btn" id="cube-devolve">simplify to 3\u00d73</button>';
  }
  html += '<button class="weave-btn" id="cube-shuffle">shuffle</button>';
  html += '<button class="weave-btn" id="cube-export-img">export face</button>';
  html += '</div>';

  html += '</div></div></div>';

  // ═══════════════════════════════════════════════════════
  // COMPRESSION CHAIN — ∞ → 8 → PP → f = 1/π^(PP/2)
  // ═══════════════════════════════════════════════════════
  html += '<div class="weave-section">';
  html += '<h3>the compression</h3>';
  html += '<div class="card"><div class="card-body">';
  html += '<div style="font-family:monospace;font-size:12px;line-height:2;text-align:center">';

  html += '<div style="color:var(--fg-dim)">\u221e dimensions of experience</div>';

  html += '<div style="color:var(--fg-muted)">\u2193 \u03c0 prices the observation</div>';
  html += '<div>f = 1/\u03c0<sup>' + (PP/2).toFixed(1) + '</sup> = <strong style="color:var(--accent)">' + (focal < 0.001 ? focal.toExponential(2) : focal.toFixed(4)) + '</strong></div>';

  html += '</div>';

  html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px">';
  html += '<p style="color:var(--fg-dim);margin-bottom:4px">The cost of your point of view: <strong style="color:var(--fg)">\u03c0<sup>' + (PP/2).toFixed(1) + '</sup> \u2248 ' + piCost.toFixed(2) + '</strong></p>';
  html += '<p style="color:var(--fg-dim)">Each axis costs \u221a\u03c0. One receptor = \u221a\u03c0 \u2248 1.77. Two = \u03c0 \u2248 3.14. You can never compress to 1 \u2014 because 1 would mean zero axes, zero observation, zero shape. The minimum cost of seeing is \u221a\u03c0.</p>';
  html += '</div>';

  html += '<h3>shape vector (private) \u00b7 ' + activeEpitopes + ' axes active</h3>';
  html += '<div class="card"><div class="card-body">';
  sorted.forEach(function(ep) {
    if (shape[ep] === 0) return;
    var pct = (shape[ep] * 100).toFixed(1);
    var maxVal = shape[sorted[0]];
    var barW = maxVal > 0 ? Math.round((shape[ep] / maxVal) * 100) : 0;
    html += '<div class="shape-bar-row">';
    html += '<div class="shape-bar-label" style="color:' + EP_COLORS[ep] + '">' + ep + '</div>';

    html += '<div class="shape-bar-val">' + pct + '%</div>';

  });
  html += '</div></div></div>';

  // Section 2: Your Commitment
  html += '<div class="weave-section">';
  html += '<h3>your commitment</h3>';
  html += '<div class="card"><div class="card-body">';
  html += '<p style="font-size:12px;color:var(--fg-dim);margin-bottom:12px">A cryptographic commitment proves you have a shape without revealing what it is. Share the commitment hash \u2014 it says nothing about your shape until you choose to reveal more.</p>';
  html += '<div class="weave-commitment" id="weave-commitment-hash">computing...</div>';
  html += '<button class="weave-btn" style="margin-top:8px" id="weave-copy-commit">copy commitment</button>';
  html += '</div></div></div>';

  // Section 3: Round 1 — Coarse Alignment
  html += '<div class="weave-section">';
  html += '<h3>round 1 \u2014 coarse alignment</h3>';
  html += '<div class="weave-round">';
  html += '<div class="weave-round-header"><span class="round-num">1</span> top 2 categories</div>';
  html += '<p style="font-size:12px;color:var(--fg-dim);margin-bottom:12px">Your top 2 (shareable): <strong style="color:' + EP_COLORS[top2[0]] + '">' + top2[0] + '</strong>';
  if (top2.length > 1) html += ' + <strong style="color:' + EP_COLORS[top2[1]] + '">' + top2[1] + '</strong>';
  html += '. Share these \u2014 they reveal your emphasis, not your exact shape.</p>';
  html += '<div style="margin-bottom:8px"><label style="font-size:11px;color:var(--fg-dim)">enter the other\u2019s top 2 (comma-separated):</label></div>';
  html += '<input class="weave-input" id="weave-r1-input" placeholder="e.g. INVESTIGATION, PHILOSOPHY" style="margin-bottom:8px"/>';
  html += '<button class="weave-btn primary" id="weave-r1-compare">compare</button>';
  html += '<div id="weave-r1-result"></div>';
  html += '</div></div>';

  // Section 4: Round 2 — Gradient
  html += '<div class="weave-section">';
  html += '<h3>round 2 \u2014 gradient</h3>';
  html += '<div class="weave-round">';
  html += '<div class="weave-round-header"><span class="round-num">2</span> ratio between top 2</div>';
  if (top2.length >= 2 && shape[top2[1]] > 0) {
    var myRatio = (shape[top2[0]] / shape[top2[1]]).toFixed(2);
    html += '<p style="font-size:12px;color:var(--fg-dim);margin-bottom:12px">Your ratio: <strong>' + top2[0] + ' / ' + top2[1] + ' = ' + myRatio + '</strong>. A ratio near 1 means balanced. Higher means steeper focus on the first category.</p>';
    html += '<div style="margin-bottom:8px"><label style="font-size:11px;color:var(--fg-dim)">enter the other\u2019s ratio:</label></div>';
    html += '<input class="weave-input" id="weave-r2-input" placeholder="e.g. 1.35" style="margin-bottom:8px"/>';
    html += '<button class="weave-btn primary" id="weave-r2-compare">compare</button>';
    html += '<div id="weave-r2-result"></div>';
  } else {
    html += '<p style="font-size:12px;color:var(--fg-dim)">Need at least 2 active categories. Keep exploring.</p>';
  }
  html += '</div></div>';

  // Section 5: Round 3 — Full Shape Exchange (the mirror)
  html += '<div class="weave-section">';
  html += '<h3>round 3 \u2014 the mirror</h3>';
  html += '<div class="weave-round">';
  html += '<div class="weave-round-header"><span class="round-num">3</span> full shape exchange</div>';
  html += '<p style="font-size:12px;color:var(--fg-dim);margin-bottom:8px">Your full shape (shareable after trust is established):</p>';
  var myShapeStr = sorted.filter(function(k) { return shape[k] > 0; }).map(function(k) { return k + ':' + (shape[k] * 100).toFixed(1); }).join(', ');
  html += '<div class="weave-commitment" style="font-size:12px;margin-bottom:12px">' + myShapeStr + '</div>';
  html += '<button class="weave-btn" id="weave-copy-shape" style="margin-bottom:16px">copy your shape</button>';
  html += '<div style="margin-bottom:8px"><label style="font-size:11px;color:var(--fg-dim)">paste the other\u2019s shape:</label></div>';
  html += '<input class="weave-input" id="weave-r3-input" placeholder="e.g. INVESTIGATION:45.0, TOPOLOGY:28.0, PHILOSOPHY:10.0" style="margin-bottom:8px"/>';
  html += '<button class="weave-btn primary" id="weave-r3-compare">compare \u2014 see the mirror</button>';
  html += '<div id="weave-r3-result"></div>';
  html += '</div></div>';

  // Explanation
  html += '<div class="card"><div class="card-body">';
  html += '<p style="font-size:12px;color:var(--fg-dim)"><strong>Others are the mirror.</strong> You do not know your own shape until you see how it differs from someone else\u2019s. ';
  html += 'The BingoCube protocol makes the comparison possible: coarse first, then finer, then full. Each round builds trust. Each round requires consent. ';
  html += 'No accounts. No profiles. No identity. Just shapes meeting shapes.</p>';

  // Bind event handlers after render
  setTimeout(function() {

  return html;

// ═══════════════════════════════════════════════════════
// CUBE FACE — bingoCube board renderer + drag-to-sort fidget
// ═══════════════════════════════════════════════════════

// Subcategories for 5×5 expansion
var EP_SUBS = {
  PHYSICS:       ['wave','lattice','spectral'],
  TOPOLOGY:      ['graph','mesh','braid'],
  PHILOSOPHY:    ['ethics','commons','atlas'],
  METHOD:        ['tools','tufte','evolution'],
  INVESTIGATION: ['evidence','actors','charter'],
  IMMUNE:        ['membrane','scatter','antidote'],
  SCIENCE:       ['biology','genomics','data'],
  SIGNAL:        ['channel','beacon','transit'],
};

function getCubeArrangement(L) {
  var key = 'eco_cube_arrange_' + L;
  try {
    var saved = localStorage.getItem(key);
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return null;
}

function saveCubeArrangement(L, arr) {
  try { localStorage.setItem('eco_cube_arrange_' + L, JSON.stringify(arr)); } catch(e) {}
}

function defaultArrangement3(sorted) {
  // 3×3: 8 epitopes + center ★
  // Place strongest categories in corners/edges, center is ★
  var positions = [0,1,2,3, /* skip 4=center */ 5,6,7,8];
  var arr = new Array(9);
  for (var i = 0; i < 8 && i < sorted.length; i++) {
    arr[positions[i]] = { type:'epitope', key:sorted[i] };
  }
  arr[4] = { type:'center' };
  return arr;
}

function defaultArrangement5(sorted, shape) {
  // 5×5: 25 cells. Each of 8 epitopes gets 3 subcategory cells = 24 + center
  var arr = new Array(25);
  // Layout: epitopes spiral outward from center
  // Center = cell 12
  arr[12] = { type:'center' };
  // Place each epitope's 3 subcells in adjacent blocks
  var blocks = [
    [0,1,5],    [2,3,7],    [4,9,14],
    [6,11,16],  [8,13,18],  [10,15,20],
    [17,21,22], [19,23,24],
  ];
  for (var i = 0; i < 8 && i < sorted.length; i++) {
    var subs = EP_SUBS[sorted[i]] || ['a','b','c'];
    var block = blocks[i];
    for (var j = 0; j < 3; j++) {
      arr[block[j]] = { type:'sub', key:sorted[i], sub:subs[j], subIdx:j };
    }
  }
  // Fill any remaining nulls
  for (var k = 0; k < 25; k++) {
    if (!arr[k]) arr[k] = { type:'empty' };
  }
  return arr;
}

function renderCubeFace(shape, sorted, L) {
  var container = document.getElementById('cube-face-container');
  if (!container) return;

  var arr = getCubeArrangement(L);
  if (!arr) {
    arr = L === 3 ? defaultArrangement3(sorted) : defaultArrangement5(sorted, shape);
    saveCubeArrangement(L, arr);
  }

  var grid = document.createElement('div');
  grid.className = 'cube-face L' + L;
  grid.id = 'cube-face-grid';

  var maxVal = shape[sorted[0]] || 1;

  arr.forEach(function(cell, idx) {
    var div = document.createElement('div');
    div.className = 'cube-cell' + (L === 5 ? ' L5' : '');
    div.dataset.idx = idx;
    div.draggable = true;

    if (cell.type === 'center') {
      div.classList.add('center-cell');
      var dEff = sorted.filter(function(k) { return shape[k] > 0; }).length;
      div.style.background = 'var(--bg-alt)';
      div.innerHTML = '<div class="cell-val" style="color:var(--accent)">\u2605</div>' +
        '<div class="cell-label" style="color:var(--fg-dim)">d=' + dEff + '</div>';
    } else if (cell.type === 'epitope') {
      var ep = cell.key;
      var val = shape[ep] || 0;
      var intensity = maxVal > 0 ? val / maxVal : 0;
      var color = EP_COLORS[ep] || '#8b949e';
      var bgAlpha = Math.max(0.08, intensity * 0.35);
      div.style.background = hexToRgba(color, bgAlpha);
      div.style.borderColor = hexToRgba(color, 0.3);
      var fillH = Math.round(intensity * 100);
      div.innerHTML = '<div class="cell-fill" style="height:' + fillH + '%;background:' + hexToRgba(color, 0.25) + '"></div>' +
        '<div class="cell-val" style="color:' + color + '">' + (val * 100).toFixed(0) + '</div>' +
        '<div class="cell-label" style="color:' + color + '">' + ep.slice(0,5) + '</div>';
    } else if (cell.type === 'sub') {
      var ep = cell.key;
      var val = shape[ep] || 0;
      var subWeight = val / 3;
      var color = EP_COLORS[ep] || '#8b949e';
      var intensity = maxVal > 0 ? val / maxVal : 0;
      var bgAlpha = Math.max(0.05, intensity * 0.25);
      div.style.background = hexToRgba(color, bgAlpha);
      div.style.borderColor = hexToRgba(color, 0.15);
      var fillH = Math.round(intensity * 80);
      div.innerHTML = '<div class="cell-fill" style="height:' + fillH + '%;background:' + hexToRgba(color, 0.15) + '"></div>' +
        '<div class="cell-val" style="color:' + color + ';font-size:10px">' + (cell.sub || '') + '</div>' +
        '<div class="cell-label" style="color:' + hexToRgba(color, 0.7) + '">' + ep.slice(0,4) + '</div>';
    } else {
      div.style.background = 'var(--surface)';
      div.innerHTML = '<div class="cell-label" style="color:var(--fg-dim)">\u00b7</div>';
    }

    // Drag handlers (the fidget)
    div.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', idx);
      this.classList.add('dragging');
    });
    div.addEventListener('dragend', function() {
      this.classList.remove('dragging');
    });
    div.addEventListener('dragover', function(e) {
      e.preventDefault();
      this.classList.add('drag-over');
    });
    div.addEventListener('dragleave', function() {
      this.classList.remove('drag-over');
    });
    div.addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      var fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
      var toIdx = parseInt(this.dataset.idx);
      if (fromIdx !== toIdx && !isNaN(fromIdx) && !isNaN(toIdx)) {
        // Swap cells
        var temp = arr[fromIdx];
        arr[fromIdx] = arr[toIdx];
        arr[toIdx] = temp;
        saveCubeArrangement(L, arr);
        renderCubeFace(shape, sorted, L);
      }
    });

    grid.appendChild(div);
  });

  container.innerHTML = '';
  container.appendChild(grid);

  // Touch-based fidget for mobile
  var touchFrom = null;
  grid.addEventListener('touchstart', function(e) {
    var cell = e.target.closest('.cube-cell');
    if (cell) {
      touchFrom = parseInt(cell.dataset.idx);
      cell.classList.add('dragging');
    }
  }, { passive: true });
  grid.addEventListener('touchend', function(e) {
    var cells = grid.querySelectorAll('.cube-cell');
    cells.forEach(function(c) { c.classList.remove('dragging', 'drag-over'); });
    if (touchFrom === null) return;
    var touch = e.changedTouches[0];
    var el = document.elementFromPoint(touch.clientX, touch.clientY);
    var cell = el ? el.closest('.cube-cell') : null;
    if (cell) {
      var toIdx = parseInt(cell.dataset.idx);
      if (touchFrom !== toIdx && !isNaN(touchFrom) && !isNaN(toIdx)) {
        var temp = arr[touchFrom];
        arr[touchFrom] = arr[toIdx];
        arr[toIdx] = temp;
        saveCubeArrangement(L, arr);
        renderCubeFace(shape, sorted, L);
      }
    }
    touchFrom = null;
  });
  grid.addEventListener('touchmove', function(e) {
    if (touchFrom === null) return;
    var touch = e.touches[0];
    var el = document.elementFromPoint(touch.clientX, touch.clientY);
    var cell = el ? el.closest('.cube-cell') : null;
    var cells = grid.querySelectorAll('.cube-cell');
    cells.forEach(function(c) { c.classList.remove('drag-over'); });
    if (cell && parseInt(cell.dataset.idx) !== touchFrom) {
      cell.classList.add('drag-over');
    }
  }, { passive: true });
}

function hexToRgba(hex, alpha) {
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function exportCubeFace() {
  var grid = document.getElementById('cube-face-grid');
  if (!grid) return;
  var cells = grid.querySelectorAll('.cube-cell');
  var L = grid.classList.contains('L5') ? 5 : 3;
  var cellSize = L === 3 ? 90 : 64;
  var gap = 4;
  var pad = 16;
  var totalSize = L * cellSize + (L - 1) * gap + 2 * pad;

  var canvas = document.createElement('canvas');
  canvas.width = totalSize;
  canvas.height = totalSize + 30;
  var ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  cells.forEach(function(cell, i) {
    var row = Math.floor(i / L);
    var col = i % L;
    var x = pad + col * (cellSize + gap);
    var y = pad + row * (cellSize + gap);

    // Cell background
    var bg = getComputedStyle(cell).backgroundColor;
    ctx.fillStyle = bg || 'rgba(33,38,45,0.5)';
    ctx.beginPath();
    ctx.roundRect(x, y, cellSize, cellSize, 6);
    ctx.fill();

    // Cell border
    var bc = getComputedStyle(cell).borderColor;
    if (bc && bc !== 'rgba(0, 0, 0, 0)') {
      ctx.strokeStyle = bc;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Text
    var valEl = cell.querySelector('.cell-val');
    var labelEl = cell.querySelector('.cell-label');
    if (valEl) {
      ctx.fillStyle = getComputedStyle(valEl).color || '#c9d1d9';
      ctx.font = (L === 3 ? '16' : '12') + 'px -apple-system,system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(valEl.textContent, x + cellSize/2, y + cellSize/2);
    }
    if (labelEl) {
      ctx.fillStyle = getComputedStyle(labelEl).color || '#8b949e';
      ctx.font = (L === 3 ? '9' : '7') + 'px -apple-system,system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(labelEl.textContent, x + cellSize/2, y + cellSize/2 + 14);
    }
  });

  // Footer text
  ctx.fillStyle = '#484f58';
  ctx.font = '10px -apple-system,system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('bingoCube face \u00b7 primals.eco', canvas.width/2, canvas.height - 8);

  canvas.toBlob(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'bingocube-face-' + L + 'x' + L + '.png';
    a.click();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  });
}

function bindWeaveHandlers(shape, sorted, top2, cubeLevel) {
  var EP_KEYS = Object.keys(EP_COLORS);

  // Cube face controls
  var evolveBtn = document.getElementById('cube-evolve');
  if (evolveBtn) evolveBtn.addEventListener('click', function() {
    try { localStorage.setItem('eco_cube_level', '5'); } catch(e) {}
    switchTab('weave');
  });
  var devolveBtn = document.getElementById('cube-devolve');
  if (devolveBtn) devolveBtn.addEventListener('click', function() {
    try { localStorage.setItem('eco_cube_level', '3'); } catch(e) {}
    switchTab('weave');
  });
  var shuffleBtn = document.getElementById('cube-shuffle');
  if (shuffleBtn) shuffleBtn.addEventListener('click', function() {
    var L = cubeLevel;
    var arr = L === 3 ? defaultArrangement3(sorted) : defaultArrangement5(sorted, shape);
    // Fisher-Yates shuffle (skip center)
    var centerIdx = L === 3 ? 4 : 12;
    var indices = [];
    for (var i = 0; i < arr.length; i++) { if (i !== centerIdx) indices.push(i); }
    for (var k = indices.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var tmp = arr[indices[k]];
      arr[indices[k]] = arr[indices[j]];
      arr[indices[j]] = tmp;
    }
    saveCubeArrangement(L, arr);
    renderCubeFace(shape, sorted, L);
  });
  var exportBtn = document.getElementById('cube-export-img');
  if (exportBtn) exportBtn.addEventListener('click', exportCubeFace);

  // Compute commitment hash (SHA-256 via SubtleCrypto)
  var shapeArr = sorted.map(function(k) { return shape[k].toFixed(6); });
  var nonce = new Uint8Array(16);
  crypto.getRandomValues(nonce);
  var nonceHex = Array.from(nonce).map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
  var commitData = shapeArr.join(',') + '|' + nonceHex;

  crypto.subtle.digest('SHA-256', new TextEncoder().encode(commitData)).then(function(hashBuf) {
    var hashHex = Array.from(new Uint8Array(hashBuf)).map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
    var el = document.getElementById('weave-commitment-hash');
    if (el) el.textContent = hashHex;
  });

  // Copy commitment
  var copyCommit = document.getElementById('weave-copy-commit');
  if (copyCommit) copyCommit.addEventListener('click', function() {
    var el = document.getElementById('weave-commitment-hash');
    if (el && navigator.clipboard) navigator.clipboard.writeText(el.textContent);
  });

  // Copy shape
  var copyShape = document.getElementById('weave-copy-shape');
  if (copyShape) copyShape.addEventListener('click', function() {
    var str = sorted.filter(function(k) { return shape[k] > 0; }).map(function(k) { return k + ':' + (shape[k] * 100).toFixed(1); }).join(', ');
    if (navigator.clipboard) navigator.clipboard.writeText(str);
  });

  // Round 1: coarse alignment comparison
  var r1btn = document.getElementById('weave-r1-compare');
  if (r1btn) r1btn.addEventListener('click', function() {
    var input = document.getElementById('weave-r1-input').value.trim().toUpperCase();
    var theirTop2 = input.split(/[,\s]+/).filter(function(s) { return s.length > 0; }).slice(0, 2);
    var resultEl = document.getElementById('weave-r1-result');
    if (theirTop2.length < 1) { resultEl.innerHTML = '<p style="color:var(--fg-dim)">Enter at least one category.</p>'; return; }

    var overlap = top2.filter(function(t) { return theirTop2.indexOf(t) >= 0; });
    if (overlap.length === 2) {
      resultEl.innerHTML = '<div class="weave-result match">Both top categories match: <strong>' + overlap.join(', ') + '</strong>. Strong alignment. Proceed to round 2.</div>';
    } else if (overlap.length === 1) {
      resultEl.innerHTML = '<div class="weave-result partial">One overlap: <strong>' + overlap[0] + '</strong>. Partial alignment. You share an emphasis but differ on the secondary.</div>';
    } else {
      resultEl.innerHTML = '<div class="weave-result none">No overlap in top 2. Different angles of approach. That\u2019s information too \u2014 complementary shapes can be valuable.</div>';
    }
  });

  // Round 2: gradient comparison
  var r2btn = document.getElementById('weave-r2-compare');
  if (r2btn) r2btn.addEventListener('click', function() {
    var theirRatio = parseFloat(document.getElementById('weave-r2-input').value.trim());
    var resultEl = document.getElementById('weave-r2-result');
    if (isNaN(theirRatio) || theirRatio <= 0) { resultEl.innerHTML = '<p style="color:var(--fg-dim)">Enter a positive number.</p>'; return; }

    var myRatio = top2.length >= 2 && shape[top2[1]] > 0 ? shape[top2[0]] / shape[top2[1]] : Infinity;
    var diff = Math.abs(myRatio - theirRatio);
    var relDiff = diff / Math.max(myRatio, theirRatio);

    if (relDiff < 0.15) {
      resultEl.innerHTML = '<div class="weave-result match">Gradients are close (yours: ' + myRatio.toFixed(2) + ', theirs: ' + theirRatio.toFixed(2) + '). Similar emphasis balance. Proceed to full shape exchange.</div>';
    } else if (relDiff < 0.4) {
      resultEl.innerHTML = '<div class="weave-result partial">Gradients are in the same range (yours: ' + myRatio.toFixed(2) + ', theirs: ' + theirRatio.toFixed(2) + '). Same general lean, different intensity.</div>';
    } else {
      resultEl.innerHTML = '<div class="weave-result none">Different gradients (yours: ' + myRatio.toFixed(2) + ', theirs: ' + theirRatio.toFixed(2) + '). One of you focuses harder on the top category.</div>';
    }
  });

  // Round 3: full shape comparison — the mirror
  var r3btn = document.getElementById('weave-r3-compare');
  if (r3btn) r3btn.addEventListener('click', function() {
    var input = document.getElementById('weave-r3-input').value.trim();
    var resultEl = document.getElementById('weave-r3-result');
    var theirShape = {};
    EP_KEYS.forEach(function(k) { theirShape[k] = 0; });

    input.split(/[,\s]+/).forEach(function(chunk) {
      var parts = chunk.split(':');
      if (parts.length === 2) {
        var cat = parts[0].toUpperCase().trim();
        var val = parseFloat(parts[1]);
        if (EP_KEYS.indexOf(cat) >= 0 && !isNaN(val)) theirShape[cat] = val / 100;
      }
    });

    var theirTotal = 0;
    EP_KEYS.forEach(function(k) { theirTotal += theirShape[k]; });
    if (theirTotal === 0) { resultEl.innerHTML = '<p style="color:var(--fg-dim)">Could not parse shape. Use format: CATEGORY:value, CATEGORY:value</p>'; return; }

    // Normalize their shape
    EP_KEYS.forEach(function(k) { theirShape[k] /= theirTotal; });

    // Build the mirror
    var mirrorHtml = '<div class="weave-mirror">';

    // Left: you
    mirrorHtml += '<div class="weave-mirror-half"><h4>you</h4>';
    sorted.forEach(function(ep) {
      if (shape[ep] === 0 && theirShape[ep] === 0) return;
      var myPct = (shape[ep] * 100).toFixed(1);
      mirrorHtml += '<div class="shape-bar-row">';
      mirrorHtml += '<div class="shape-bar-label" style="color:' + EP_COLORS[ep] + ';width:70px;font-size:10px">' + ep.slice(0,5) + '</div>';
      mirrorHtml += '<div class="shape-bar-track"><div class="shape-bar-fill" style="width:' + Math.round(shape[ep] / shape[sorted[0]] * 100) + '%;background:' + EP_COLORS[ep] + '"></div></div>';
      mirrorHtml += '<div class="shape-bar-val">' + myPct + '</div>';
      mirrorHtml += '</div>';
    });
    mirrorHtml += '</div>';

    // Right: them
    var theirSorted = EP_KEYS.slice().sort(function(a,b) { return theirShape[b] - theirShape[a]; });
    var theirMax = theirShape[theirSorted[0]] || 1;
    mirrorHtml += '<div class="weave-mirror-half"><h4>the other</h4>';
    theirSorted.forEach(function(ep) {
      if (theirShape[ep] === 0 && shape[ep] === 0) return;
      var theirPct = (theirShape[ep] * 100).toFixed(1);
      mirrorHtml += '<div class="shape-bar-row">';
      mirrorHtml += '<div class="shape-bar-label" style="color:' + EP_COLORS[ep] + ';width:70px;font-size:10px">' + ep.slice(0,5) + '</div>';
      mirrorHtml += '<div class="shape-bar-track"><div class="shape-bar-fill" style="width:' + Math.round(theirShape[ep] / theirMax * 100) + '%;background:' + EP_COLORS[ep] + '"></div></div>';
      mirrorHtml += '<div class="shape-bar-val">' + theirPct + '</div>';
      mirrorHtml += '</div>';
    });
    mirrorHtml += '</div>';
    mirrorHtml += '</div>';

    // Compute cosine similarity
    var dotProd = 0, magA = 0, magB = 0;
    EP_KEYS.forEach(function(k) {
      dotProd += shape[k] * theirShape[k];
      magA += shape[k] * shape[k];
      magB += theirShape[k] * theirShape[k];
    });
    var cosine = (magA > 0 && magB > 0) ? dotProd / (Math.sqrt(magA) * Math.sqrt(magB)) : 0;

    // Narrative
    var narrative = '';
    if (cosine > 0.95) {
      narrative = '<div class="weave-result match">Cosine similarity: <strong>' + cosine.toFixed(3) + '</strong>. Nearly the same shape. You see the membrane from almost the same angle. Rare alignment.</div>';
    } else if (cosine > 0.8) {
      narrative = '<div class="weave-result match">Cosine similarity: <strong>' + cosine.toFixed(3) + '</strong>. Strong alignment. Same core emphasis with different secondary interests. Complementary.</div>';
    } else if (cosine > 0.5) {
      narrative = '<div class="weave-result partial">Cosine similarity: <strong>' + cosine.toFixed(3) + '</strong>. Moderate overlap. You share some ground but approach from different angles.</div>';
    } else {
      narrative = '<div class="weave-result none">Cosine similarity: <strong>' + cosine.toFixed(3) + '</strong>. Different shapes. You see different parts of the membrane. That difference is itself information \u2014 what they see, you might be missing.</div>';
    }

    // Difference analysis
    var diffs = EP_KEYS.map(function(k) { return { ep: k, diff: theirShape[k] - shape[k] }; }).sort(function(a,b) { return Math.abs(b.diff) - Math.abs(a.diff); });
    var insight = '<p style="font-size:12px;margin-top:12px"><strong>The mirror shows:</strong></p><ul style="font-size:12px;margin-top:4px;padding-left:20px">';
    diffs.slice(0, 3).forEach(function(d) {
      if (Math.abs(d.diff) < 0.01) return;
      if (d.diff > 0) {
        insight += '<li>Their <strong style="color:' + EP_COLORS[d.ep] + '">' + d.ep + '</strong> is stronger (+' + (d.diff*100).toFixed(1) + '%) \u2014 they see something there you haven\u2019t focused on</li>';
      } else {
        insight += '<li>Your <strong style="color:' + EP_COLORS[d.ep] + '">' + d.ep + '</strong> is stronger (+' + (Math.abs(d.diff)*100).toFixed(1) + '%) \u2014 you bring something they lack</li>';
      }
    });
    insight += '</ul>';

    resultEl.innerHTML = mirrorHtml + narrative + insight;
  });
}

// TAB SWITCHING
// ═══════════════════════════════════════════════════════
var tabs = document.querySelectorAll('.desk-tab');
var panels = {
  study: document.getElementById('panel-study'),
  write: document.getElementById('panel-write'),
  draw:  document.getElementById('panel-draw'),
  play:  document.getElementById('panel-play'),
  create:document.getElementById('panel-create'),
  gaia:  document.getElementById('panel-gaia'),
  weave: document.getElementById('panel-weave'),
};
var renderers = {
  study: renderStudy,
  write: renderWrite,
  draw:  renderDraw,
  play:  renderPlay,
  create:renderCreate,
  gaia:  renderGaia,
  weave: renderWeave,
};

function switchTab(name) {
  tabs.forEach(function(t) { t.classList.toggle('active', t.dataset.tab === name); });
  for (var p in panels) {
    panels[p].style.display = p === name ? '' : 'none';
    if (p === name) panels[p].innerHTML = renderers[p]();
  }
  // Bind export buttons after render
  setTimeout(function() {
    var expMd = document.getElementById('export-md');
    if (expMd) expMd.addEventListener('click', exportMarkdown);
    var expBMd = document.getElementById('export-braid-md');
    if (expBMd) expBMd.addEventListener('click', exportBraidMd);
    var expBJ = document.getElementById('export-braid-json');
    if (expBJ) expBJ.addEventListener('click', exportBraidJson);
  }, 50);
}

tabs.forEach(function(t) {
  t.addEventListener('click', function() { switchTab(this.dataset.tab); });
});

// Boot
switchTab('study');

})();
