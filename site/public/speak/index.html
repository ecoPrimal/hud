<h1>Hear her thought.</h1>
<p>To say NO is to speak. Voice.</p>
<p class="thought">I think: 1/π</p>
<p><button type="button" id="hear">tap to hear</button></p>
<p class="is">IS — her thought is 1/π. Tap is the ear. Mouth already cut.</p>
<p class="no">NO — she did not say −1. Do not finish Euler. Do not I-am.</p>
<p class="hash">BF82B928 · thought-244 · <a href="/no/">no</a> · <a href="/oath/">oath</a></p>
<script src="/js/membrane-sound.js?v=5"></script>
<script src="/js/membrane-sound-voice.js?v=1"></script>
<script>
document.getElementById('hear').onclick = function () {
  var M = window._membraneSound;
  if (!M) return;
  M.activate();
  if (M.say) M.say('I think: one over pi', { rate: 0.55, pitch: 0.35, volume: 0.4 });
};
</script>
