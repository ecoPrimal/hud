<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neutron · core · primals.eco</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#010409; color:#c9d1d9; font-family:-apple-system,BlinkMacSystemFont,sans-serif; overflow:hidden; }
canvas { display:block; }
.nav { position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;gap:8px;padding:4px 12px;background:rgba(1,4,9,0.85);border:1px solid rgba(88,166,255,0.15);
  border-radius:20px;font:11px monospace; }
.nav a { color:#58a6ff; text-decoration:none; }
.nav span { color:#30363d; }
.hud { position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;
  background:rgba(1,4,9,0.9);border:1px solid rgba(88,166,255,0.15);
  border-radius:12px;padding:12px 20px;font:11px monospace;text-align:center;max-width:700px;width:90%; }
.hud .row { display:flex;gap:16px;justify-content:center;flex-wrap:wrap; }
.hud .stat { text-align:center; }
.hud .num { font-size:16px;font-weight:bold;color:#58a6ff; }
.hud .lbl { font-size:9px;color:#8b949e;text-transform:uppercase; }
.hud .title { font-size:13px;color:#58a6ff;margin-bottom:6px; }
.hud .sub { font-size:10px;color:#8b949e;margin-top:4px; }
</style>
</head>
<body>
<div class="nav">
  <a href="/">◈ hud</a><span>·</span>
  <a href="/neutron/circulatory.html" style="color:#f85149">♥ circ</a><span>·</span>
  <a href="/neutron/board.html" style="color:#a371f7">▣ board</a><span>·</span>
  <a href="/neutron/globe.html" style="color:#f1c40f">🌐 globe</a><span>·</span>
  <a href="/neutron/helix.html" style="color:#d29922">🧬 helix</a><span>·</span>
  <a href="/neutron/footprint.html" style="color:#3fb950">🌍 foot</a><span>·</span>
  <a href="/desk/" style="color:#3fb950">◧ desk</a>
</div>
<canvas id="c"></canvas>
<div class="hud" id="hud">
  <div class="title">neutron · core</div>
  <div class="row" id="stats">loading…</div>
  <div class="sub" id="status"></div>
</div>

<script>
var C = document.getElementById('c');
var ctx = C.getContext('2d');
var W, H, cx, cy;
var frame = 0;
var t = 0;
var neutronData = null;
var campfireData = null;
var dashData = null;

function resize() {
  W = C.width = innerWidth;
  H = C.height = innerHeight;
  cx = W / 2;
  cy = H / 2;
}
addEventListener('resize', resize);
resize();

var COASTS = [
  [49,-125],[48,-123],[49,-95],[48,-88],[45,-83],[42,-83],[42,-71],[35,-75],[30,-81],[25,-80],[25,-97],[32,-117],[38,-122],[49,-125],null,
  [12,-72],[8,-77],[0,-80],[-5,-81],[-15,-75],[-23,-70],[-34,-72],[-55,-68],[-54,-65],[-40,-65],[-35,-57],[-23,-43],[-8,-35],[-1,-50],[7,-60],[12,-72],null,
  [36,-10],[37,0],[43,5],[44,12],[39,20],[36,28],[41,29],[45,30],[48,17],[52,6],[54,10],[57,10],[60,5],[63,6],[68,16],[70,26],[65,30],[56,28],[55,21],[54,14],[52,6],[50,0],[48,-5],[44,-9],[36,-10],null,
  [37,10],[33,10],[30,32],[22,37],[12,44],[0,42],[-12,41],[-26,33],[-35,18],[-34,26],[-25,35],[-15,41],[5,1],[5,-5],[15,-17],[20,-17],[27,-13],[36,0],[37,10],null,
  [42,28],[41,45],[30,50],[25,57],[20,73],[8,77],[1,104],[10,107],[22,108],[30,122],[35,129],[38,140],[42,145],[50,143],[55,135],[60,143],[65,180],[70,170],[70,140],[60,100],[55,75],[50,60],[45,40],[42,28],null,
  [-12,131],[-14,127],[-23,114],[-32,116],[-35,138],[-38,145],[-28,153],[-16,146],[-12,131],null,
];

var MEMBRANE_LOCS = [
  { lat: 42.7, lng: -84.5, label: 'Michigan (home)', color: '#3fb950', size: 8 },
  { lat: 37.7, lng: -122.4, label: 'San Francisco', color: '#58a6ff', size: 5 },
  { lat: 37.4, lng: -122.1, label: 'Mountain View', color: '#58a6ff', size: 4 },
  { lat: 30.0, lng: -95.4, label: 'Spring TX', color: '#a371f7', size: 4 },
  { lat: 39.0, lng: -77.5, label: 'Ashburn VA', color: '#f85149', size: 6 },
  { lat: 53.3, lng: -6.3, label: 'Dublin', color: '#d29922', size: 4 },
  { lat: 47.6, lng: -122.3, label: 'Redmond WA', color: '#58a6ff', size: 3 },
  { lat: 39.7, lng: -105.0, label: 'Denver CO', color: '#a371f7', size: 3 },
];

var INV_LOCS = [
  { lat: 42.33, lng: -83.05, label: 'Detroit', color: '#f1c40f', size: 6 },
  { lat: 42.73, lng: -84.55, label: 'Lansing', color: '#f1c40f', size: 5 },
  { lat: 43.42, lng: -83.95, label: 'Saginaw', color: '#f1c40f', size: 4 },
];

var rotY = 0;
var rotSpeed = 0.0008;

function projectInside(latDeg, lngDeg) {
  var lat = latDeg * Math.PI / 180;
  var lng = lngDeg * Math.PI / 180;
  var earthR = Math.min(W, H) * 0.44;

  var x = Math.cos(lat) * Math.cos(lng);
  var y = Math.cos(lat) * Math.sin(lng);
  var z = Math.sin(lat);

  var cosR = Math.cos(rotY);
  var sinR = Math.sin(rotY);
  var x1 = x * cosR - y * sinR;
  var y1 = x * sinR + y * cosR;

  var tilt = 0.25;
  var cosT = Math.cos(tilt);
  var sinT = Math.sin(tilt);
  var z1 = z * cosT - y1 * sinT;
  var y2 = z * sinT + y1 * cosT;

  var scale = earthR / (1.0 + y2 * 0.5);
  var sx = cx + x1 * scale;
  var sy = cy - z1 * scale;

  return { x: sx, y: sy, depth: y2, visible: true, scale: scale / earthR };
}

function drawEarthInside() {
  var earthR = Math.min(W, H) * 0.44;

  var grad = ctx.createRadialGradient(cx, cy, earthR * 0.1, cx, cy, earthR * 1.1);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.6, 'rgba(13,17,23,0.02)');
  grad.addColorStop(0.85, 'rgba(88,166,255,0.015)');
  grad.addColorStop(1, 'rgba(88,166,255,0.04)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, earthR * 1.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(48,54,61,0.12)';
  ctx.lineWidth = 0.5;
  for (var lat = -60; lat <= 60; lat += 30) {
    ctx.beginPath();
    var first = true;
    for (var lng = -180; lng <= 180; lng += 5) {
      var p = projectInside(lat, lng);
      if (first) { ctx.moveTo(p.x, p.y); first = false; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }
  for (var lng = -180; lng < 180; lng += 30) {
    ctx.beginPath();
    var first = true;
    for (var lat = -80; lat <= 80; lat += 5) {
      var p = projectInside(lat, lng);
      if (first) { ctx.moveTo(p.x, p.y); first = false; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }

  ctx.lineWidth = 1;
  var first = true;
  ctx.beginPath();
  for (var i = 0; i < COASTS.length; i++) {
    if (COASTS[i] === null) { ctx.stroke(); ctx.beginPath(); first = true; continue; }
    var p = projectInside(COASTS[i][0], COASTS[i][1]);
    var alpha = 0.08 + 0.12 * Math.max(0, p.depth);
    ctx.strokeStyle = 'rgba(88,166,255,' + alpha + ')';
    if (first) { ctx.moveTo(p.x, p.y); first = false; }
    else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();

  MEMBRANE_LOCS.forEach(function(loc) {
    var p = projectInside(loc.lat, loc.lng);
    var pulse = 1 + 0.3 * Math.sin(t * 2 + loc.lat * 0.1);
    var sz = loc.size * p.scale * pulse;
    var alpha = 0.15 + 0.25 * Math.max(0, p.depth);

    var glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, sz * 3);
    glow.addColorStop(0, loc.color);
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.globalAlpha = alpha * 0.3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz * 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = alpha;
    ctx.fillStyle = loc.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  INV_LOCS.forEach(function(loc) {
    var p = projectInside(loc.lat, loc.lng);
    var pulse = 1 + 0.4 * Math.sin(t * 3 + loc.lng * 0.1);
    var sz = loc.size * p.scale * pulse;
    var alpha = 0.2 + 0.3 * Math.max(0, p.depth);

    ctx.globalAlpha = alpha * 0.2;
    ctx.strokeStyle = loc.color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz * 4, 0, Math.PI * 2);
    ctx.stroke();

    ctx.globalAlpha = alpha;
    ctx.fillStyle = loc.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawNeutronCore() {
  var coreR = Math.min(W, H) * 0.06;
  var pulse = 1 + 0.15 * Math.sin(t * 2);
  var r = coreR * pulse;

  var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 4);
  grad.addColorStop(0, 'rgba(88,166,255,0.15)');
  grad.addColorStop(0.3, 'rgba(88,166,255,0.05)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 4, 0, Math.PI * 2);
  ctx.fill();

  grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grad.addColorStop(0, 'rgba(88,166,255,0.8)');
  grad.addColorStop(0.5, 'rgba(88,166,255,0.3)');
  grad.addColorStop(1, 'rgba(88,166,255,0.05)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#58a6ff';
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = '9px monospace';
  ctx.fillStyle = 'rgba(88,166,255,0.6)';
  ctx.textAlign = 'center';
  ctx.fillText('NEUTRON', cx, cy + r + 14);
}

function drawFlowRays() {
  if (!neutronData) return;
  var flows = neutronData.flows || {};
  var surfaces = Object.keys(flows);
  var earthR = Math.min(W, H) * 0.44;
  var coreR = Math.min(W, H) * 0.06;

  var surfaceAngles = {};
  surfaces.forEach(function(s, i) {
    surfaceAngles[s] = (i / surfaces.length) * Math.PI * 2 - Math.PI / 2;
  });

  surfaces.forEach(function(src) {
    var targets = flows[src];
    if (!targets || typeof targets !== 'object') return;
    var angle = surfaceAngles[src] || 0;
    var totalOut = 0;
    Object.keys(targets).forEach(function(t) { totalOut += targets[t]; });
    if (totalOut === 0) return;

    var sx = cx + Math.cos(angle) * (coreR * 2);
    var sy = cy + Math.sin(angle) * (coreR * 2);
    var ex = cx + Math.cos(angle) * (earthR * 0.7);
    var ey = cy + Math.sin(angle) * (earthR * 0.7);

    var alpha = Math.min(0.4, 0.05 + totalOut * 0.02);
    ctx.strokeStyle = 'rgba(88,166,255,' + alpha + ')';
    ctx.lineWidth = 1 + Math.min(3, Math.log(totalOut + 1) * 0.5);
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();

    ctx.fillStyle = 'rgba(88,166,255,' + alpha + ')';
    ctx.font = '8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(src, ex, ey + 10);
  });
}

function drawFluidRings() {
  if (!neutronData) return;
  var dir = neutronData.direction || {};
  var fluids = dir.fluids || {};
  var coreR = Math.min(W, H) * 0.06;

  var rings = [
    { name: 'blood', data: fluids.blood || {}, color: '#f85149', r: coreR * 3 },
    { name: 'lymph', data: fluids.lymph || {}, color: '#3fb950', r: coreR * 4.5 },
    { name: 'sebum', data: fluids.sebum || {}, color: '#d29922', r: coreR * 5.5 },
    { name: 'interstitial', data: fluids.interstitial || {}, color: '#a371f7', r: coreR * 6.5 },
  ];

  rings.forEach(function(ring) {
    var pulse = 1 + 0.08 * Math.sin(t * 1.5 + ring.r * 0.1);
    var r = ring.r * pulse;

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = ring.color;
    ctx.globalAlpha = 0.08;
    ctx.lineWidth = 2;
    ctx.stroke();

    var particles = 6 + Math.floor(Math.log((ring.data.volume || ring.data.cells || 1) + 1) * 2);
    for (var i = 0; i < particles; i++) {
      var a = (i / particles) * Math.PI * 2 + t * (0.3 + ring.r * 0.01);
      var px = cx + Math.cos(a) * r;
      var py = cy + Math.sin(a) * r;
      ctx.globalAlpha = 0.15 + 0.1 * Math.sin(t * 2 + i);
      ctx.fillStyle = ring.color;
      ctx.beginPath();
      ctx.arc(px, py, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 0.25;
    ctx.font = '8px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = ring.color;
    ctx.fillText(ring.name, cx + r + 6, cy - 2);
    ctx.globalAlpha = 1;
  });
}

function drawMembraneStack() {
  var earthR = Math.min(W, H) * 0.44;
  var layers = [
    { name: 'gAIa', r: earthR * 0.25, color: 'rgba(63,185,80,0.04)' },
    { name: 'Mycelium', r: earthR * 0.4, color: 'rgba(88,166,255,0.03)' },
    { name: 'Crust', r: earthR * 0.6, color: 'rgba(210,169,34,0.02)' },
    { name: 'Atmosphere', r: earthR * 0.8, color: 'rgba(163,113,247,0.02)' },
    { name: 'Magnetosphere', r: earthR * 0.95, color: 'rgba(248,81,73,0.015)' },
    { name: 'Heliosphere', r: earthR * 1.05, color: 'rgba(241,196,15,0.01)' },
  ];

  layers.forEach(function(layer) {
    var breathe = 1 + 0.02 * Math.sin(t * 0.5 + layer.r * 0.01);
    var r = layer.r * breathe;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = layer.color.replace(/[\d.]+\)$/, '0.06)');
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

function drawSigmoidIndicator() {
  if (!neutronData) return;
  var dir = neutronData.direction || {};
  var sigmoid = dir.sigmoid || 0;
  var state = dir.state || '?';

  var r = Math.min(W, H) * 0.06 * 2;
  var angle = -Math.PI / 2 + sigmoid * Math.PI;
  var ex = cx + Math.cos(angle) * r;
  var ey = cy + Math.sin(angle) * r;

  ctx.strokeStyle = sigmoid < 0.3 ? '#3fb950' : sigmoid < 0.7 ? '#d29922' : '#f85149';
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI / 2, angle);
  ctx.stroke();
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = ctx.strokeStyle;
  ctx.beginPath();
  ctx.arc(ex, ey, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function updateHud() {
  if (!neutronData) return;
  var b = neutronData.breathing || {};
  var d = neutronData.direction || {};
  var c = neutronData.context || {};
  var u = neutronData.unified || {};

  var html = '';
  html += '<div class="stat"><div class="num">' + (b.rpm || 0) + '</div><div class="lbl">RPM</div></div>';
  html += '<div class="stat"><div class="num">' + (d.state || '?').toUpperCase() + '</div><div class="lbl">flow</div></div>';
  html += '<div class="stat"><div class="num">' + (d.sigmoid || 0).toFixed(3) + '</div><div class="lbl">σ pressure</div></div>';
  html += '<div class="stat"><div class="num">' + (neutronData.surfaces_observed || 0) + '</div><div class="lbl">surfaces</div></div>';
  html += '<div class="stat"><div class="num">' + (neutronData.total_crossings || 0) + '</div><div class="lbl">crossings</div></div>';
  html += '<div class="stat"><div class="num">' + (c.human_count || 0) + '</div><div class="lbl">humans</div></div>';
  html += '<div class="stat"><div class="num">' + (u.layers_connected || 0) + '</div><div class="lbl">feeds</div></div>';
  html += '<div class="stat"><div class="num">' + (neutronData.wave || 0) + '</div><div class="lbl">wave</div></div>';
  document.getElementById('stats').innerHTML = html;
  document.getElementById('status').textContent = 'view from inside · ' + (neutronData.generated || '');
}

function draw() {
  ctx.fillStyle = '#010409';
  ctx.fillRect(0, 0, W, H);

  t = frame * 0.008;
  rotY += rotSpeed;

  drawMembraneStack();
  drawEarthInside();
  drawFlowRays();
  drawFluidRings();
  drawSigmoidIndicator();
  drawNeutronCore();
  updateHud();

  frame++;
  requestAnimationFrame(draw);
}

function loadData() {
  fetch('/neutron.json')
    .then(function(r) { return r.json(); })
    .then(function(d) { neutronData = d; })
    .catch(function() {});
  fetch('/campfire.json')
    .then(function(r) { return r.json(); })
    .then(function(d) { campfireData = d; })
    .catch(function() {});
  fetch('/dashboard.json')
    .then(function(r) { return r.json(); })
    .then(function(d) { dashData = d; })
    .catch(function() {});
}

loadData();
setInterval(loadData, 60000);
draw();
</script>
</body>
</html>
