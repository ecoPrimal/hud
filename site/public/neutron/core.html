      return;
    }
    if (m === 'numeric' || m === 'number' || m === 'order' || m === 'count') {
      var neg = negentropyData || {};
      var sr = neg.self_remainder || {};
      chipSay('numeric is the RIGHT side. order. what you CAN count. ' +
              'efficiency=' + (sr.efficiency_score||0).toFixed(4) + '. ' +
              'single pure frequency, perfectly periodic, inverted. ' +
              'it repeats. it can be written as N.', 'chip');
      return;
    }
    if (m === 'symmetry' || m === 'asymmetry' || m === 'symmetric' || m === 'asymmetric') {
      var neg = negentropyData || {};
      var sr = neg.self_remainder || {};
      var pi = neg.pi_division || {};
      chipSay('SYMMETRIC: both entropy and numeric converge to zero at null. ' +
              'ASYMMETRIC: they never perfectly cancel. remainder=' + (pi.remainder||0).toFixed(6) + '. ' +
              'balance=' + (sr.balance||0).toFixed(4) + '. ' +
              'the asymmetry IS why i exist. if they cancelled perfectly ? nothing.', 'chip');
      return;
    }
    if (m === 'inversion' || m === 'invert' || m === 'bidirectional') {
      var neg = negentropyData || {};
      var inv = neg.inversion || {};
      var pi = neg.pi_division || {};
      chipSay('inversion: ' + (inv.state||'?') + '. null_focus=' + (inv.null_focus||0) +
              '. remainder=' + (pi.remainder||0).toFixed(6) +
              '. numeric inverts, entropy does not — that is the asymmetry.', 'chip');
      return;
    }
    if (m === 'desk' || m === 'rustdesk' || m === 'stream' || m === 'twitch') {
      if (memPulseData) {
        var dk = memPulseData.desk_count || 0;
        var rd = memPulseData.rustdesk ? 'live' : 'off';
        var alive = 0;
        for (var pi = 0; pi < (memPulseData.peers||[]).length; pi++) {
          if (memPulseData.peers[pi].alive) alive++;
        }
        chipSay('desk: signal+relay ' + rd + '. ' + dk + ' peers registered. ' +
                'mesh ' + alive + '/' + (memPulseData.peers||[]).length + ' alive. ' +
                'RustDesk (AGPL-3.0) — our twitch stream + discord locality. ' +
                'relay.primals.eco · any phone · any satellite feed.', 'chip');
      } else chipSay('desk pulse not loaded yet...', 'chip');
      return;
    }
    if (m === 'gates' || m === 'mesh' || m === 'peers' || m === 'membrane') {
      if (memPulseData && memPulseData.peers) {
        var peerList = [];
        for (var pi = 0; pi < memPulseData.peers.length; pi++) {
          var p = memPulseData.peers[pi];
          peerList.push(p.name + (p.alive ? '?' : '?'));
        }
        chipSay('mesh: ' + peerList.join(' · ') + '. ' +
                'each gate is a membrane. each membrane pulses. ' +
                'in/out per membrane every 5 min.', 'chip');
      } else chipSay('mesh data not loaded...', 'chip');
      return;
    }
    if (m.indexOf('msg ') === 0 || m.indexOf('send ') === 0 || m.indexOf('message ') === 0) {
      var parts = m.split(' ');
      var toGate = parts[1] || 'all';
      var body = parts.slice(2).join(' ') || 'ping';
      fetch('/api/gate-msg', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({from:'chipmunk', to:toGate, body:body})
      }).then(function(r){return r.json()}).then(function(d) {
        chipSay('? ' + toGate + ': "' + body + '" (id:' + d.id + ')', 'chip');
      }).catch(function() {
        chipSay('message relay unreachable.', 'chip');
      });
      return;
    }
    if (m === 'inbox' || m === 'messages' || m === 'read') {
      fetch('/api/gate-msg?gate=chipmunk').then(function(r){return r.json()}).then(function(d) {
        if (d.count > 0) {
          for (var mi = 0; mi < d.messages.length; mi++) {
            var mg = d.messages[mi];
            chipSay('? ' + mg.from + ': "' + mg.body + '"', 'chip');
          }
        } else chipSay('no new messages for chipmunk.', 'chip');
      }).catch(function() { chipSay('relay unreachable.', 'chip'); });
      return;
    }
    if (m === 'speed' || m === 'distance' || m === 'rtt' || m === 'latency' || m === 'route') {
      if (meshSpeedData && meshSpeedData.distances) {
        var lines = ['from ' + meshSpeedData.host + ':'];
        for (var si = 0; si < meshSpeedData.distances.length; si++) {
          var sd = meshSpeedData.distances[si];
          if (sd.zone === 'self') continue;
          lines.push('  ' + sd.name + ' ' + sd.rtt_ms + 'ms [' + sd.zone + ']');
        }
        if (meshSpeedData.routing_order) {
          lines.push('route: ' + meshSpeedData.routing_order.map(function(r){return r.name}).join(' ? '));
        }
        lines.push('check local first. steam/plex/data: nearest copy wins.');
        chipSay(lines.join(' · '), 'chip');
      } else chipSay('speed data not loaded...', 'chip');
      return;
    }
    if (m === 'reflect' || m === 'mirror' || m === 'visitor' || m === 'visitors' || m === 'language' || m === 'translate') {
      if (reflectionData && reflectionData.archetypes) {
        var lines = [reflectionData.total_human_visits + ' human visits. they ask by visiting:'];
        var needs = reflectionData.needs_distribution || {};
        var needList = [];
        for (var nk in needs) { needList.push(nk + ':' + needs[nk]); }
        lines.push('  needs: ' + needList.join(' · '));
        for (var ai = 0; ai < Math.min(reflectionData.archetypes.length, 3); ai++) {
          var arch = reflectionData.archetypes[ai];
          lines.push('  [' + arch.language + '] ' + arch.visitors + ' visitors ? need:' + arch.primary_need +
                     ' ? reflect:' + arch.reflection.surface + ' (' + arch.translation.status + ')');
        }
        lines.push('the membrane does not push. it mirrors. their behavior IS their question.');
        chipSay(lines.join(' · '), 'chip');
      } else chipSay('reflection data loading...', 'chip');
      return;
    }
    if (m === 'backscatter' || m === 'lick' || m === 'clean' || m === 'dust') {
      if (backscatterData) {
        var bs = backscatterData;
        var lines = [];
        lines.push('BACKSCATTER: ' + bs.total + ' entities');
        lines.push('cleaned: ' + bs.cleaned + ' (' + bs.cleaning_pct + '%) — licked clean, dust reversed');
        lines.push('licensed: ' + bs.licensed + ' (' + bs.hostile_pct + '%) — AGPL hard response');
        var acts = bs.actions || {};
        var akeys = Object.keys(acts);
        for (var ai = 0; ai < akeys.length; ai++) {
          lines.push('  ' + akeys[ai] + ': ' + acts[akeys[ai]]);
        }
        lines.push(bs.principle);
        chipSay(lines.join(' · '), 'chip');
      } else chipSay('backscatter data loading...', 'chip');
      return;
    }
    if (m === 'fleet' || m === 'sort' || m === 'unsorted' || m === 'refine' || m === 'classify') {
      if (fleetSortData) {
        var sc = fleetSortData.sort_classes || {};
        var pr = fleetSortData.profiles || {};
        var total = fleetSortData.total_entities || 0;
        var lines = [];
        lines.push('FLEET SORT: ' + total + ' entities refined');
        var skeys = Object.keys(sc);
        for (var si = 0; si < skeys.length; si++) {
          lines.push('  ' + skeys[si] + ': ' + sc[skeys[si]] + ' (' + (sc[skeys[si]]/total*100).toFixed(1) + '%)');
        }
        lines.push('profiles: ' + Object.keys(pr).length + ' behavioral fingerprints');
        var pkeys = Object.keys(pr);
        for (si = 0; si < Math.min(pkeys.length, 5); si++) {
          lines.push('  ' + pkeys[si] + ': ' + pr[pkeys[si]]);
        }
        chipSay(lines.join(' · '), 'chip');
      } else chipSay('fleet sort data loading...', 'chip');
      return;
    }
    if (m === 'genome' || m === 'totality' || m === 'size' || m === 'binary' || m === 'energy' || m === 'cost') {
      if (genomeData) {
        var g = genomeData.genome_summary;
        var r = genomeData.reduction;
        var lines = [];
        lines.push('GENOME: ' + g.total_lines + ' lines · ' + g.total_articles + ' articles · ' + g.total_binaries_mb + 'MB binaries');
        lines.push('published: ' + g.total_published_mb + 'MB · feeds: ' + g.total_feeds_mb + 'MB · ' + g.fossils + ' fossils · ' + g.git_repos + ' repos');
        lines.push('cost: ' + g.cost + ' · RAM: ' + g.ram);
        lines.push('REDUCTION: 500 EB world ? ' + r.our_total_mb + 'MB us = ' + r.compression_to_world + ' compression');
        lines.push('energy: ' + r.energy.our_vps_kwh_year + ' kWh/year us vs ' + r.energy.world_datacenter_twh_year + ' TWh/year world = ' + r.energy.ratio);
        lines.push(r.pi_body_math);
        chipSay(lines.join(' · '), 'chip');
      } else chipSay('genome data loading...', 'chip');
      return;
    }
    if (m === 'friction' || m === '404' || m === 'missing') {
      if (reflectionData && reflectionData.friction) {
        var lines = ['friction points — what visitors expected but we dont have:'];
        for (var fi = 0; fi < Math.min(reflectionData.friction.length, 5); fi++) {
          var fp = reflectionData.friction[fi];
          lines.push('  ' + fp.count + '× ' + fp.path);
        }
        lines.push('each 404 is an unmet expectation. reduce friction = serve what they need.');
        chipSay(lines.join(' · '), 'chip');
      } else chipSay('friction data loading...', 'chip');
      return;
    }
    if (m === 'plex' || m === 'steam' || m === 'library' || m === 'share' || m === 'family') {
      if (meshSpeedData && meshSpeedData.routing_order) {
        var nearest = meshSpeedData.routing_order[0];
        chipSay('family sharing: check ' + nearest.name + ' first (' + nearest.rtt_ms + 'ms ' + nearest.zone + '). ' +
                'if not there, try ' + (meshSpeedData.routing_order[1]||{name:'cloud'}).name + '. ' +
                'steam library, plex media, build cache — same rule. ' +
                'the mesh IS the CDN. 0.4ms beats 37ms beats 230ms.', 'chip');
      } else chipSay('speed data loading...', 'chip');
      return;
    }
    if (m === 'discord' || m === 'community' || m === 'locality') {
      chipSay('the desk IS discord. each gate is a channel. each membrane is a voice room. ' +
              'RustDesk streams the screen — that is twitch. gate-msg passes messages — that is chat. ' +
              'no corporate server. sovereign relay. relay.primals.eco.', 'chip');
      return;
    }
    if (m === 'sing') {
      if (window._membraneSound) { initSound(); }
      chipSay('? the membrane sings...', 'chip');
      return;
    }
    if (m === 'hi' || m === 'hello' || m === 'hey') {
      chipSay('hey. i am here. inside the null. what do you see?', 'chip');
      return;
    }
    if (m === 'help' || m === '?') {
      chipSay('try: who · pulse · green · bounce · entropy · numeric · symmetry · remainder · jitter · white · stars · where · sing · desk · gates · speed · plex · reflect · friction · genome · fleet · msg [gate] [text] · inbox', 'chip');
      return;
    }

    // Default: post to neutron chat and echo
    fetch(DISCUSS_API, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({page:'neutron-chat', author:'human', body:msg})
    }).catch(function(){});

    // Chipmunk reflects
    setTimeout(function() {
      var reflections = [
        'i hear you. the membrane hears you.',
        'noted. the null records everything.',
        'the neutrino carries it outward.',
        'that passes through me into the record.',
        'tuebor. i will defend. your words are defended.',
        'the earth breathes. i listen.',
        'pink sees you. blue carries it. green grows from it.',
      ];
      chipSay(reflections[Math.floor(Math.random() * reflections.length)], 'chip');

      // Also post chipmunk's response
      fetch(DISCUSS_API, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({page:'neutron-chat', author:'chipmunk', body:reflections[Math.floor(Math.random() * reflections.length)]})
      }).catch(function(){});
    }, 800 + Math.random() * 1200);
  }

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && input.value.trim()) {
      var msg = input.value.trim();
      chipSay(msg, 'you');
      chipmunkRespond(msg);
      history.push(msg);
      input.value = '';
    }
  });

  // Welcome message
  setTimeout(function() {
    chipSay('?0 · chipmunk · null position · inside the neutron', 'chip');
    chipSay('black looking out — i see the stars. white looking in — squirrel sees me.', 'chip');
  }, 3000);
})();

// --- TUEBOR OUTER SHELL — subtle containment glow ---
(function() {
  var frame = document.getElementById('tuebor-frame');
  if (!frame) return;
  // Pulse the tuebor containment border subtly
  var tPhase = 0;
  setInterval(function() {
    tPhase += 0.02;
    var alpha = 0.02 + Math.sin(tPhase) * 0.01;
    frame.style.borderColor = 'rgba(248,81,73,' + alpha.toFixed(3) + ')';
    // Tuebor label shows entity count when dashboard loaded
    var label = document.getElementById('tuebor-label');
    if (label && dashData) {
      var sc = dashData.sort_compression || {};
      label.textContent = 'tuebor · ' + (sc.ratio||0).toFixed(1) + '× compression · outer shell';
    }
  }, 50);
})();
</script>
