<script>
var C = document.getElementById('c');
var ctx = C.getContext('2d');
var W, H, cx, cy, R;
var rotX = 0.3, rotY = -1.4; // Start looking at North America
var autoRotate = true;
var rotSpeed = 0.003;
var dragStart = null, dragRotX = 0, dragRotY = 0;

function resize() {
  W = C.width = innerWidth; H = C.height = innerHeight;
  cx = W / 2; cy = H / 2;
  R = Math.min(W, H) * 0.38;
}
addEventListener('resize', resize); resize();

// Mouse drag to rotate
C.addEventListener('mousedown', function(e) {
  dragStart = { x: e.clientX, y: e.clientY };
  dragRotX = rotX; dragRotY = rotY;
  autoRotate = false;
});
addEventListener('mousemove', function(e) {
  if (!dragStart) return;
  rotY = dragRotY + (e.clientX - dragStart.x) * 0.005;
  rotX = dragRotX + (e.clientY - dragStart.y) * 0.005;
  rotX = Math.max(-1.5, Math.min(1.5, rotX));
});
addEventListener('mouseup', function() { dragStart = null; });

// Coastline points (simplified world outline — major land masses)
// [lat, lng] pairs for continental outlines
var COASTS = [
  // North America (simplified)
  [49,-125],[48,-123],[49,-95],[48,-88],[45,-83],[42,-83],[42,-71],[35,-75],[30,-81],[25,-80],[25,-97],[32,-117],[38,-122],[49,-125],null,
  // South America
  [12,-72],[8,-77],[0,-80],[-5,-81],[-15,-75],[-23,-70],[-34,-72],[-55,-68],[-54,-65],[-40,-65],[-35,-57],[-23,-43],[-8,-35],[-1,-50],[7,-60],[12,-72],null,
  // Europe
  [36,-10],[37,0],[43,5],[44,12],[39,20],[36,28],[41,29],[45,30],[48,17],[52,6],[54,10],[57,10],[60,5],[63,6],[68,16],[70,26],[65,30],[56,28],[55,21],[54,14],[52,6],[50,0],[48,-5],[44,-9],[36,-10],null,
  // Africa  
  [37,10],[33,10],[30,32],[22,37],[12,44],[0,42],[-12,41],[-26,33],[-35,18],[-34,26],[-25,35],[-15,41],[5,1],[5,-5],[15,-17],[20,-17],[27,-13],[36,0],[37,10],null,
  // Asia (simplified)
  [42,28],[41,45],[30,50],[25,57],[20,73],[8,77],[1,104],[10,107],[22,108],[30,122],[35,129],[38,140],[42,145],[50,143],[55,135],[60,143],[65,180],[70,170],[70,140],[60,100],[55,75],[50,60],[45,40],[42,28],null,
  // Australia
  [-12,131],[-14,127],[-23,114],[-32,116],[-35,138],[-38,145],[-28,153],[-16,146],[-12,131],null,
];

// Geographic locations from membrane data
var LOCATIONS = [];
var geoData = null;

function addLocation(lat, lng, label, requests, color, org) {
  LOCATIONS.push({ lat:lat*Math.PI/180, lng:lng*Math.PI/180, label:label, requests:requests, color:color, org:org||'' });
}

// Project lat/lng to 3D point on sphere, then rotate
function project3D(latRad, lngRad) {
  var x = Math.cos(latRad) * Math.cos(lngRad);
  var y = Math.cos(latRad) * Math.sin(lngRad);
  var z = Math.sin(latRad);
  // Rotate around Y axis (longitude rotation)
  var x1 = x * Math.cos(rotY) - y * Math.sin(rotY);
  var y1 = x * Math.sin(rotY) + y * Math.cos(rotY);
  // Rotate around X axis (latitude tilt)
  var z1 = z * Math.cos(rotX) - y1 * Math.sin(rotX);
  var y2 = z * Math.sin(rotX) + y1 * Math.cos(rotX);
  return { x: x1 * R + cx, y: -z1 * R + cy, z: y2, visible: y2 > -0.1 };
}

function draw() {
  ctx.fillStyle = '#010409';
  ctx.fillRect(0, 0, W, H);
  
  if (autoRotate) rotY += rotSpeed;
  
  // Atmosphere glow
  var grad = ctx.createRadialGradient(cx, cy, R * 0.95, cx, cy, R * 1.3);
  grad.addColorStop(0, 'rgba(88,166,255,0.06)');
  grad.addColorStop(0.5, 'rgba(88,166,255,0.02)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.3, 0, Math.PI * 2);
  ctx.fill();
  
  // Globe body
  grad = ctx.createRadialGradient(cx - R*0.2, cy - R*0.2, 0, cx, cy, R);
  grad.addColorStop(0, '#0d1117');
  grad.addColorStop(1, '#010409');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fill();
  
  // Grid lines (latitude/longitude)
  ctx.strokeStyle = 'rgba(48,54,61,0.3)';
  ctx.lineWidth = 0.5;
  // Latitude lines
  for (var lat = -80; lat <= 80; lat += 20) {
    ctx.beginPath();
    var first = true;
    for (var lng = -180; lng <= 180; lng += 5) {
      var p = project3D(lat * Math.PI / 180, lng * Math.PI / 180);
      if (p.visible) {
        if (first) { ctx.moveTo(p.x, p.y); first = false; }
        else ctx.lineTo(p.x, p.y);
      } else { first = true; }
    }
    ctx.stroke();
  }
  // Longitude lines
  for (var lng = -180; lng < 180; lng += 30) {
    ctx.beginPath();
    var first = true;
    for (var lat = -90; lat <= 90; lat += 5) {
      var p = project3D(lat * Math.PI / 180, lng * Math.PI / 180);
      if (p.visible) {
        if (first) { ctx.moveTo(p.x, p.y); first = false; }
        else ctx.lineTo(p.x, p.y);
      } else { first = true; }
    }
    ctx.stroke();
  }
  
  // Coastlines
  ctx.strokeStyle = 'rgba(88,166,255,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  var first = true;
  for (var i = 0; i < COASTS.length; i++) {
    if (COASTS[i] === null) { first = true; continue; }
    var p = project3D(COASTS[i][0] * Math.PI / 180, COASTS[i][1] * Math.PI / 180);
    if (p.visible) {
      if (first) { ctx.moveTo(p.x, p.y); first = false; }
      else ctx.lineTo(p.x, p.y);
    } else { first = true; }
  }
  ctx.stroke();
  
  // Location markers
  var t = Date.now() / 1000;
  LOCATIONS.forEach(function(loc) {
    var p = project3D(loc.lat, loc.lng);
    if (!p.visible) return;
    
    var reqs = loc.requests || 1;
    var size = Math.max(4, Math.min(20, Math.log10(reqs) * 4));
    var beat = Math.sin(t * 1.5 + loc.lat * 3) * 0.2 + 0.8;
    var depth = (p.z + 1) / 2; // 0=back, 1=front
    
    // Hex to RGB
    var hr = parseInt(loc.color.slice(1,3),16);
    var hg = parseInt(loc.color.slice(3,5),16);
    var hb = parseInt(loc.color.slice(5,7),16);
    
    // Glow
    var gl = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 3);
    gl.addColorStop(0, 'rgba('+hr+','+hg+','+hb+','+(0.2*depth)+')');
    gl.addColorStop(1, 'rgba('+hr+','+hg+','+hb+',0)');
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size * 3, 0, Math.PI * 2);
    ctx.fill();
    
    // Core
    ctx.fillStyle = loc.color;
    ctx.globalAlpha = beat * depth;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size * beat, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    
    // Label (only if facing us)
    if (depth > 0.5) {
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = loc.color;
      ctx.globalAlpha = depth;
      ctx.fillText(loc.label, p.x, p.y - size * beat - 8);
      ctx.font = '9px monospace';
      ctx.fillStyle = '#c9d1d9';
      ctx.fillText(reqs.toLocaleString() + ' requests', p.x, p.y - size * beat + 2);
      if (loc.org) {
        ctx.font = '8px monospace';
        ctx.fillStyle = '#8b949e';
        ctx.fillText(loc.org, p.x, p.y + size + 10);
      }
      ctx.globalAlpha = 1;
    }
    
    // Connection arc to Michigan (home)
    if (loc.label !== 'Michigan') {
      var home = project3D(42.73 * Math.PI / 180, -84.55 * Math.PI / 180);
      if (home.visible) {
        ctx.strokeStyle = 'rgba('+hr+','+hg+','+hb+','+(0.12*depth)+')';
        ctx.lineWidth = Math.max(0.5, Math.log10(reqs) * 0.3);
        ctx.beginPath();
        ctx.moveTo(home.x, home.y);
        // Great circle arc approximation
        var steps = 20;
        for (var s = 1; s <= steps; s++) {
          var frac = s / steps;
          var midLat = loc.lat + (42.73*Math.PI/180 - loc.lat) * (1-frac);
          var midLng = loc.lng + (-84.55*Math.PI/180 - loc.lng) * (1-frac);
          // Lift the arc above the surface
          var lift = Math.sin(frac * Math.PI) * 0.08;
          var mp = project3D(midLat + lift, midLng);
          if (mp.visible) ctx.lineTo(mp.x, mp.y);
        }
        ctx.stroke();
      }
    }
  });
  
  requestAnimationFrame(draw);
}

// Load geographic data
fetch('/dashboard.json').then(function(r){return r.json()}).then(function(dash) {

  addLocation(37.45, -122.17, 'Menlo Park', 3, '#d29922', 'Meta HQ');
  addLocation(30.00, -95.42, 'Spring TX', 5041, '#58a6ff', 'GPTBot cluster');
  addLocation(39.04, -77.49, 'Ashburn VA', 4515, '#a371f7', 'AWS us-east-1');
  addLocation(47.67, -122.12, 'Redmond WA', 7, '#58a6ff', 'Microsoft/Bing');
  addLocation(53.35, -6.26, 'Dublin', 180, '#f1c40f', 'EU data centers');
  addLocation(39.74, -104.99, 'Colorado', 21, '#8b949e', '');
  
  // Add Alibaba Cloud (China-origin but California-hosted)
  addLocation(37.57, -122.35, 'Alibaba Cloud', 28610, '#d29922', 'AS45102 California');
  
  // Investigation locations (from clutch)
  addLocation(42.33, -83.05, 'Detroit', 0, '#f1c40f', 'investigation — 95 nodes');
  addLocation(42.73, -84.55, 'Lansing', 0, '#f1c40f', 'investigation — John Bean Building');
  addLocation(43.42, -83.95, 'Saginaw', 0, '#f1c40f', 'investigation — 10 nodes');
  
  var totalReqs = geo.reduce(function(s,g){return s+(g.requests||0)},0);
  document.getElementById('info').textContent = 
    totalReqs.toLocaleString() + ' total requests · ' +
    LOCATIONS.length + ' locations · ' +
    'drag to rotate · click pause/rotate';
}).catch(function(e) {
  // Fallback
  addLocation(42.73, -84.55, 'Michigan', 72223, '#3fb950', 'HOME');
  document.getElementById('info').textContent = 'offline mode — drag to rotate';
});

draw();
</script>
