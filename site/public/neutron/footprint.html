<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footprint · primals.eco</title>
<style>
:root { --bg:#0d1117; --fg:#c9d1d9; --dim:#8b949e; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,sans-serif; overflow:hidden; }
canvas { display:block; }
.nav { position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;gap:8px;padding:4px 12px;background:rgba(1,4,9,0.85);border:1px solid rgba(88,166,255,0.15);
  border-radius:20px;font:11px monospace;pointer-events:auto; }
.nav a { color:#58a6ff; text-decoration:none; }
.nav span { color:#30363d; }
.overlay { position:fixed;top:36px;left:24px;z-index:10;pointer-events:none; }
.title { font-size:18px; font-weight:600; }
.sub { font-size:12px; color:var(--dim); }
.legend { position:fixed;bottom:16px;left:24px;z-index:10;font:11px monospace;pointer-events:none; }
.legend-row { display:flex;align-items:center;gap:6px;margin-bottom:3px; }
.legend-dot { width:8px;height:8px;border-radius:50%; }
</style>
</head>
<body>
<div class="nav">
  <a href="/">◈ hud</a><span>·</span>
  <a href="/neutron/circulatory.html" style="color:#f85149">♥ circulatory</a><span>·</span>
  <a href="/neutron/board.html" style="color:#a371f7">▣ board</a><span>·</span>
  <a href="/neutron/helix.html" style="color:#d29922">🧬 helix</a><span>·</span>
  <a href="/neutron/invite.html" style="color:#3fb950">🤝 invite</a><span>·</span>
  <a href="/desk/" style="color:#3fb950">◧ desk</a>
</div>
<div class="overlay">
  <div class="title">geographic footprint</div>
  <div class="sub" id="info">loading...</div>
</div>
<div class="legend" id="legend"></div>
<canvas id="c"></canvas>

<script>
var C = document.getElementById('c');
var ctx = C.getContext('2d');
var W, H;

function resize() { W = C.width = innerWidth; H = C.height = innerHeight; }
addEventListener('resize', resize); resize();

// Known locations with rough lat/lng → screen projection
var LOCATIONS = {
  'Michigan':      { lat: 42.73, lng: -84.55, label: 'Michigan (home)', color: '#3fb950' },
  'California':    { lat: 37.77, lng: -122.42, label: 'California', color: '#f85149' },
  'Texas':         { lat: 30.00, lng: -95.42, label: 'Texas (Spring)', color: '#d29922' },
  'Virginia':      { lat: 39.04, lng: -77.49, label: 'Virginia (Ashburn)', color: '#58a6ff' },
  'Washington':    { lat: 47.67, lng: -122.12, label: 'Washington (Redmond)', color: '#a371f7' },
  'Colorado':      { lat: 39.74, lng: -104.99, label: 'Colorado', color: '#8b949e' },
  'New Jersey':    { lat: 40.22, lng: -74.76, label: 'New Jersey', color: '#8b949e' },
  'Dublin':        { lat: 53.35, lng: -6.26,  label: 'Dublin (IE)', color: '#f1c40f' },
};

// Simple Mercator projection centered on US
function project(lat, lng) {
  var cx = W * 0.45, cy = H * 0.45;
  var scale = Math.min(W, H) * 0.008;
  var x = cx + (lng + 95) * scale;  // center on US
  var y = cy - (lat - 40) * scale * 1.3;
  return { x: x, y: y };
}

var geoData = null;
var subnetData = null;
var pulsePhase = 0;

function draw() {
  ctx.fillStyle = 'rgba(13,17,23,0.2)';
  ctx.fillRect(0, 0, W, H);
  
  pulsePhase += 0.02;
  
  if (!geoData) { requestAnimationFrame(draw); return; }
  
  // Draw connection lines from Michigan to other locations (gossip mesh / webb)
  var home = project(42.73, -84.55);
  
  // Draw each location
  var totalReqs = 0;
  geoData.forEach(function(g) { totalReqs += g.requests || 0; });
  
  geoData.forEach(function(g) {
    if (g.country === '??' || g.country === 'EU') return;
    var regions = g.regions || [];
    regions.forEach(function(r) {
      var loc = LOCATIONS[r.region];
      if (!loc) return;
      
      var p = project(loc.lat, loc.lng);
      var reqs = r.requests || 0;
      var size = Math.max(6, Math.min(40, Math.sqrt(reqs / 100)));
      var beat = Math.sin(pulsePhase + loc.lat * 0.1) * 0.3 + 0.7;
      
      // Connection line to home
      ctx.strokeStyle = loc.color;
      ctx.globalAlpha = 0.15;
      ctx.lineWidth = Math.max(1, Math.log10(reqs) * 0.5);
      ctx.beginPath();
      ctx.moveTo(home.x, home.y);
      // Curve
      var midX = (home.x + p.x) / 2;
      var midY = Math.min(home.y, p.y) - 30;
      ctx.quadraticCurveTo(midX, midY, p.x, p.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      
      // Flowing particles along the connection
      for (var i = 0; i < 3; i++) {
        var t = ((pulsePhase * 0.3 + i * 0.33) % 1);
        var px = (1-t)*(1-t)*home.x + 2*(1-t)*t*midX + t*t*p.x;
        var py = (1-t)*(1-t)*home.y + 2*(1-t)*t*midY + t*t*p.y;
        ctx.fillStyle = loc.color;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(px, py, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      
      // Glow
      var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2);
      grad.addColorStop(0, loc.color.replace(')', ',0.2)').replace('#', 'rgba('));
      // Use hex conversion
      var hr = parseInt(loc.color.slice(1,3),16);
      var hg = parseInt(loc.color.slice(3,5),16);
      var hb = parseInt(loc.color.slice(5,7),16);
      grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2.5);
      grad.addColorStop(0, 'rgba('+hr+','+hg+','+hb+',0.2)');
      grad.addColorStop(1, 'rgba('+hr+','+hg+','+hb+',0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size * 2.5, 0, Math.PI * 2);
      ctx.fill();
      
      // Core
      ctx.fillStyle = loc.color;
      ctx.globalAlpha = beat;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size * beat, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      
      // Label
      ctx.font = '11px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = loc.color;
      ctx.fillText(loc.label, p.x, p.y - size - 8);
      ctx.font = '10px monospace';
      ctx.fillStyle = '#c9d1d9';
      ctx.fillText(reqs.toLocaleString() + ' req', p.x, p.y - size + 2);
      
      // Cities
      (r.cities || []).forEach(function(city, ci) {
        ctx.font = '9px monospace';
        ctx.fillStyle = '#8b949e';
        ctx.fillText(city.city + ' (' + city.requests.toLocaleString() + ')', p.x, p.y + size + 10 + ci * 12);
      });
    });
  });
  
  // Home pulse (Michigan)
  var hbeat = Math.sin(pulsePhase * 1.5) * 0.3 + 0.8;
  ctx.fillStyle = '#3fb950';
  ctx.globalAlpha = hbeat;
  ctx.beginPath();
  ctx.arc(home.x, home.y, 12 * hbeat, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText('HOME', home.x, home.y + 4);
  ctx.font = '9px monospace';
  ctx.fillStyle = '#3fb950';
  ctx.fillText('self: 72,223', home.x, home.y + 20);
  
  // Subnet orgs in corners
  if (subnetData) {
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#8b949e';
    var yOff = 80;
    subnetData.filter(function(s) { return s.org && s.org !== 'Unknown'; }).slice(0, 8).forEach(function(s, i) {
      var color = s.asn_type === 'self' ? '#3fb950' : s.asn_type === 'datacenter' ? '#f85149' : s.asn_type === 'cloud' ? '#58a6ff' : '#8b949e';
      ctx.fillStyle = color;
      ctx.fillText(s.org + ' (' + s.requests.toLocaleString() + ')', W - 250, yOff + i * 14);
    });
  }
  
  requestAnimationFrame(draw);
}

// Load
Promise.all([
  fetch('/dashboard.json').then(function(r){return r.json()}).catch(function(){return null}),
  fetch('/neutron.json').then(function(r){return r.json()}).catch(function(){return null})
]).then(function(res) {
  var dash = res[0];
  var neutron = res[1];
  if (dash) {
    geoData = dash.geography || [];
    subnetData = dash.subnets || [];
  }
  var b = (neutron || {}).breathing || {};
  document.getElementById('info').textContent = 
    'RPM ' + (b.rpm || 0).toFixed(0) + ' · where the membrane touches the world · ' +
    (geoData || []).reduce(function(s,g){return s+(g.requests||0)},0).toLocaleString() + ' total requests';
  
  // Legend
  var legendHtml = '';
  for (var name in LOCATIONS) {
    var loc = LOCATIONS[name];
    legendHtml += '<div class="legend-row"><div class="legend-dot" style="background:'+loc.color+'"></div> '+loc.label+'</div>';
  }
  document.getElementById('legend').innerHTML = legendHtml;
});

draw();
</script>
</body>
</html>
