<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neutron · discuss · primals.eco</title>
<style>
:root {
  --neutron-blue: #58a6ff;
  --neutron-dim: rgba(88,166,255,0.15);
  --neutron-glow: rgba(88,166,255,0.08);
  --bg: #010409;
  --fg: #c9d1d9;
  --fg-dim: #8b949e;
  --border: rgba(88,166,255,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}
.container { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
  margin-bottom: 24px;
}
header h1 {
  font-size: 18px;
  font-weight: 500;
  color: var(--neutron-blue);
  display: flex;
  align-items: center;
  gap: 8px;
}
header h1::before {
  content: "";
  display: inline-block;
  width: 8px; height: 8px;
  background: var(--neutron-blue);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--neutron-blue), 0 0 12px rgba(88,166,255,0.3);
}
.meta { color: var(--fg-dim); font-size: 12px; margin-top: 4px; }
.meta a { color: var(--neutron-blue); text-decoration: none; opacity: 0.7; }
.meta a:hover { opacity: 1; }

.thread { display: flex; flex-direction: column; gap: 2px; }
.entry {
  padding: 10px 14px;
  background: var(--neutron-glow);
  border-left: 2px solid var(--border);
  transition: border-color 0.2s, background 0.2s;
}
.entry:hover {
  border-left-color: var(--neutron-blue);
  background: var(--neutron-dim);
}
.entry-meta {
  font-size: 11px;
  color: var(--fg-dim);
  margin-bottom: 4px;
  display: flex;
  gap: 12px;
}
.entry-body {
  font-size: 13px;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--fg);
}

.pulse-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neutron-blue), transparent);
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 100;
}
.pulse-bar.active { opacity: 1; animation: pulse-sweep 1.5s ease-in-out; }
@keyframes pulse-sweep {
  0% { opacity: 0; transform: scaleX(0.3); }
  50% { opacity: 1; transform: scaleX(1); }
  100% { opacity: 0; transform: scaleX(0.3); }
}

.stats {
  display: flex; gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  font-size: 12px;
  color: var(--fg-dim);
}
.stats .val { color: var(--neutron-blue); font-weight: 600; }

#status { font-size: 11px; color: var(--fg-dim); padding: 8px 0; }

.nav {
  position: fixed;
  bottom: 16px;
  right: 16px;
  display: flex;
  gap: 8px;
}
.nav a {
  display: inline-block;
  padding: 4px 10px;
  background: var(--neutron-glow);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--fg-dim);
  text-decoration: none;
  font-size: 11px;
  transition: all 0.2s;
}
.nav a:hover {
  border-color: var(--neutron-blue);
  color: var(--neutron-blue);
}
</style>
</head>
<body>
<div class="pulse-bar" id="pulse"></div>
<div class="container">
  <header>
    <h1>neutron &middot; discuss</h1>
    <div class="meta">
      the messaging axis &middot; N&#8596;S &middot; blue &middot;
      <a href="https://primals.eco">membrane</a> &middot;
      <a href="https://signal.primals.eco">signal</a>
    </div>
  </header>
  <div class="stats" id="stats">loading&hellip;</div>
  <div class="thread" id="thread">loading thread&hellip;</div>
  <div id="status"></div>
</div>
<nav class="nav">
  <a href="https://primals.eco">&#9673; hud</a>
  <a href="https://tuebor.primals.eco">&#9876; tuebor</a>
  <a href="https://signal.primals.eco">&#128225; signal</a>
</nav>
<script>
const API = "/api/discuss";
const POLL_MS = 30000;
let entries = [];

function esc(s) {
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

async function load() {
  var pulse = document.getElementById("pulse");
  pulse.classList.add("active");
  setTimeout(function() { pulse.classList.remove("active"); }, 1500);

  try {
    var r = await fetch(API + "/comments?limit=200");
    if (!r.ok) throw new Error(r.status);
    var data = await r.json();
    var items = Array.isArray(data) ? data : (data.comments || []);
    if (items.length > 0) {
      entries = items;
      render();
      return;
    }
  } catch(e) { /* fall through */ }

  try {
    var r2 = await fetch(API);
    if (!r2.ok) throw new Error(r2.status);
    var data2 = await r2.json();
    if (data2.comments) { entries = data2.comments; render(); return; }
    if (Array.isArray(data2)) { entries = data2; render(); return; }
  } catch(e2) { /* fall through */ }

  document.getElementById("thread").innerHTML =
    "<div class='entry'><div class='entry-body'>neutron axis is waking. the discuss braid is being wired.</div></div>";
  document.getElementById("stats").innerHTML =
    "<span>entries: <span class='val'>0</span></span>";
  document.getElementById("status").textContent =
    "last poll: " + new Date().toISOString().slice(11,19) + " UTC";
}

function render() {
  var sorted = entries.sort(function(a,b) {
    var ta = a.ts || a.created_at || a.epoch || "";
    var tb = b.ts || b.created_at || b.epoch || "";
    return (tb > ta) ? 1 : (tb < ta) ? -1 : 0;
  });

  var pages = {};
  sorted.forEach(function(e) { pages[e.page || "unknown"] = 1; });

  document.getElementById("stats").innerHTML =
    "<span>entries: <span class='val'>" + sorted.length + "</span></span>" +
    "<span>pages: <span class='val'>" + Object.keys(pages).length + "</span></span>" +
    "<span>latest: <span class='val'>" + esc((sorted[0] && sorted[0].ts || "").slice(0,16)) + "</span></span>";

  document.getElementById("thread").innerHTML = sorted.slice(0, 100).map(function(e) {
    var ts = esc((e.ts || e.created_at || "").slice(0,16));
    var page = esc(e.page || "unknown");
    var body = esc(e.body || "");
    return "<div class='entry'>" +
      "<div class='entry-meta'><span>" + ts + "</span><span>page: " + page + "</span></div>" +
      "<div class='entry-body'>" + body + "</div></div>";
  }).join("");

  document.getElementById("status").textContent =
    "last poll: " + new Date().toISOString().slice(11,19) + " UTC";
}

load();
setInterval(load, POLL_MS);
</script>
</body>
</html>
