<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nestgate — talk to the membrane</title>
<meta name="description" content="Open. Free. No login. Talk to the ecoPrimals membrane through the squirrel. 20 senses, live data, persistent memory.">
<meta property="og:title" content="nestgate — talk to the membrane">
<meta property="og:description" content="Open AI membrane interface. No login. No paywall. The squirrel is watching.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐿️</text></svg>">
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #21262d;
  --fg: #c9d1d9;
  --dim: #6e7681;
  --accent: #58a6ff;
  --green: #3fb950;
  --gold: #d29922;
  --orange: #f0883e;
  --red: #f85149;
  --user-bg: #1c2333;
  --bot-bg: #0d1117;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', ui-monospace, monospace;
  display: flex;
  flex-direction: column;
}

header {
  padding: .8rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: .6rem;
  flex-shrink: 0;
}
header .logo { font-size: 1.3em; }
header h1 { font-size: .95em; font-weight: 400; color: var(--accent); }
header .tag { font-size: .72em; color: var(--dim); margin-left: auto; }
header .pulse { animation: pulse 2s infinite; color: var(--green); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  scroll-behavior: smooth;
}

.msg {
  max-width: 720px;
  margin: 0 auto .8rem;
  padding: .8rem 1rem;
  border-radius: 8px;
  font-size: .88em;
  line-height: 1.6;
  word-wrap: break-word;
}
.msg.user {
  background: var(--user-bg);
  border: 1px solid var(--border);
}
.msg.bot {
  background: var(--bot-bg);
  border-left: 3px solid var(--green);
}
.msg.system {
  background: transparent;
  color: var(--dim);
  font-size: .78em;
  text-align: center;
  border: none;
}
.msg.error {
  border-left-color: var(--red);
  color: var(--red);
}
.msg .who {
  font-size: .7em;
  color: var(--dim);
  margin-bottom: .3rem;
}
.msg pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: .6rem;
  overflow-x: auto;
  font-size: .85em;
  margin: .5rem 0;
  white-space: pre-wrap;
}
.msg code { color: var(--green); }
.msg a { color: var(--accent); }
.msg .kv { display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; margin: .4rem 0; }
.msg .kv dt { color: var(--gold); font-weight: 600; }
.msg .kv dd { color: var(--fg); }

.typing { color: var(--dim); font-style: italic; }
.typing::after {
  content: '...';
  animation: dots 1.4s steps(4, end) infinite;
}
@keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

#input-wrap {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  padding: .8rem 1rem;
  background: var(--surface);
}
#input-row {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  gap: .5rem;
}
#input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: .7rem .9rem;
  color: var(--fg);
  font: inherit;
  font-size: .88em;
  outline: none;
  resize: none;
  min-height: 2.4em;
  max-height: 8em;
}
#input:focus { border-color: var(--accent); }
#input::placeholder { color: var(--dim); }
#send {
  background: var(--green);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  padding: .5rem .9rem;
  font: 600 .85em/1 inherit;
  cursor: pointer;
  align-self: flex-end;
}
#send:hover { opacity: .85; }
#send:disabled { opacity: .4; cursor: default; }

.suggestions {
  max-width: 720px;
  margin: .5rem auto 0;
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
}
.suggestions button {
  background: var(--bg);
  color: var(--dim);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: .35rem .6rem;
  font: .72em/1 inherit;
  cursor: pointer;
}
.suggestions button:hover { color: var(--accent); border-color: var(--accent); }

footer {
  text-align: center;
  padding: .4rem;
  font-size: .65em;
  color: var(--dim);
  flex-shrink: 0;
}
footer a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <span class="logo">🐿️</span>
  <h1>nestgate</h1>
  <span class="pulse">●</span>
  <span class="tag">open · free · no login · 20 senses · AGPL</span>
</header>

<div id="chat"></div>

<div id="input-wrap">
  <div id="input-row">
    <textarea id="input" rows="1" placeholder="ask the membrane anything..." autofocus></textarea>
    <button id="send">send</button>
  </div>
  <div class="suggestions" id="suggestions">
    <button data-q="what's alive right now?">what's alive?</button>
    <button data-q="who are the humans?">humans?</button>
    <button data-q="show me the topology">topology</button>
    <button data-q="what does the chipmunk see?">chipmunk?</button>
    <button data-q="tell me a story">stories</button>
    <button data-q="what's the membrane doing?">membrane?</button>
    <button data-q="show me the neutrino mailbox">neutrino?</button>
    <button data-q="how does the particle model work?">particle model</button>
    <button data-q="run the scan sweep sort pipeline">scan sweep sort</button>
    <button data-q="what are the braid connections?">braids?</button>
  </div>
</div>

<footer>
  <a href="https://nestgate.io">nestgate.io</a> ·
  <a href="https://primals.eco">primals.eco</a> ·
  <a href="https://nestgate.io/mcp">MCP endpoint</a> ·
  AGPL-3.0 · no cookies · no tracking · the membrane IS the API
</footer>

<script>
'use strict';

const MCP = '/mcp';
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let busy = false;

const ROUTES = [
  { pat: /\b(count|alive|pulse|how many|status)\b/i, tool: 'membrane_counts', args: {} },
  { pat: /\b(human|people|visitor|epitope|who)\b/i, tool: 'human_epitopes', args: {} },
  { pat: /\b(observe|membrane|watch|see|look|what.s.happening)\b/i, tool: 'observe_membrane', args: { focus: 'all' } },
  { pat: /\b(topolog|shape|node|edge|mesh|site)\b/i, tool: 'topology', args: {} },
  { pat: /\b(chipmunk|squirrel|wake)\b/i, tool: 'chipmunk_status', args: {} },
  { pat: /\b(story|stories|campfire|tell me)\b/i, tool: 'read_stories', args: { kind: 'all' } },
  { pat: /\b(journal|learn|seen)\b/i, tool: 'read_journal', args: {} },
  { pat: /\b(scan|sweep|sort|pipeline|immune)\b/i, tool: 'scan_sweep_sort', args: {} },
  { pat: /\b(braid|passage|connection|weav)\b/i, tool: 'braid_connections', args: {} },
  { pat: /\b(note|human.note|said|left)\b/i, tool: 'human_notes', args: {} },
  { pat: /\b(neutron|neutrino|mail|inbox|message|channel)\b/i, tool: 'neutron_read', args: { channel: 'all' } },
  { pat: /\b(particle|atom|proton|neutron model|physics|subatomic)\b/i, tool: 'particle_model', args: {} },
  { pat: /\b(feed|raw|data)\b/i, tool: 'raw_feed', args: { feed: 'now' } },
  { pat: /\b(weather|space|solar|kp|ionosphere)\b/i, tool: 'raw_feed', args: { feed: 'negentropy' } },
];

function route(text) {
  const lower = text.toLowerCase();

  // neutron_write detection
  const writeMatch = lower.match(/^(write|send|post|leave|say|note)\s+(to\s+)?(inbox|notes|reminders|chat)?\s*[:\-]?\s*(.+)/i);
  if (writeMatch) {
    return {
      tool: 'neutron_write',
      args: {
        channel: writeMatch[3] || 'notes',
        body: writeMatch[4] || text,
        author: 'human-via-nestgate'
      }
    };
  }

  // raw_feed with specific feed name
  const feedMatch = lower.match(/\b(?:show|get|fetch|read)\s+(?:the\s+)?(\w+)\s+feed\b/i);
  if (feedMatch) {
    return { tool: 'raw_feed', args: { feed: feedMatch[1] } };
  }

  for (const r of ROUTES) {
    if (r.pat.test(lower)) return { tool: r.tool, args: r.args };
  }

  // whats_new
  if (/\b(new|rss|feed|shipped|latest|paper|recent)\b/i.test(lower)) {
    const feedMatch = lower.match(/\b(sporeprint|hud|connect)\b/i);
    return { tool: 'whats_new', args: { source: feedMatch ? feedMatch[1] : 'all', limit: 10 } };
  }

  // discuss
  const discussMatch = lower.match(/\b(?:discuss|comment|thread|talk about)\s+(\S+)/i);
  if (discussMatch) {
    return { tool: 'discuss_thread', args: { page: discussMatch[1], action: 'read' } };
  }
  if (/\b(discuss|comment|thread)\b/i.test(lower)) {
    return { tool: 'discuss_thread', args: { page: 'general', action: 'read' } };
  }

  // discuss write detection
  const commentMatch = lower.match(/^(?:comment|post|discuss)\s+(?:on\s+)?(\S+)?\s*[:\-]\s*(.+)/i);
  if (commentMatch) {
    return { tool: 'discuss_thread', args: { page: commentMatch[1] || 'general', action: 'write', body: commentMatch[2], author: 'human-via-nestgate' } };
  }

  // default: observe everything
  return { tool: 'observe_membrane', args: { focus: 'all' } };
}

async function callMCP(tool, args) {
  const body = {
    jsonrpc: '2.0',
    id: Date.now(),
    method: 'tools/call',
    params: { name: tool, arguments: args }
  };
  const resp = await fetch(MCP, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  const content = data.result?.content || [];
  return content.map(c => c.text || '').join('\n');
}

function addMsg(cls, html, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if (who) div.innerHTML = `<div class="who">${who}</div>` + html;
  else div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function formatJSON(raw) {
  try {
    const obj = JSON.parse(raw);
    return renderObj(obj);
  } catch {
    return `<pre>${escHTML(raw)}</pre>`;
  }
}

function renderObj(obj, depth) {
  depth = depth || 0;
  if (obj === null || obj === undefined) return '<span style="color:var(--dim)">null</span>';
  if (typeof obj === 'string') return escHTML(obj);
  if (typeof obj === 'number' || typeof obj === 'boolean') return `<code>${obj}</code>`;
  if (Array.isArray(obj)) {
    if (obj.length === 0) return '<span style="color:var(--dim)">[]</span>';
    if (obj.length <= 5 && obj.every(x => typeof x !== 'object')) {
      return obj.map(x => `<code>${escHTML(String(x))}</code>`).join(' · ');
    }
    return '<ul style="padding-left:1.2em;margin:.3rem 0">' +
      obj.map(x => `<li>${renderObj(x, depth+1)}</li>`).join('') + '</ul>';
  }
  if (typeof obj === 'object') {
    const keys = Object.keys(obj);
    if (keys.length === 0) return '<span style="color:var(--dim)">{}</span>';
    // compact for shallow objects with few keys
    if (depth < 2 && keys.length <= 12) {
      let html = '<dl class="kv">';
      for (const k of keys) {
        html += `<dt>${escHTML(k)}</dt><dd>${renderObj(obj[k], depth+1)}</dd>`;
      }
      return html + '</dl>';
    }
    return `<pre>${escHTML(JSON.stringify(obj, null, 2))}</pre>`;
  }
  return escHTML(String(obj));
}

function escHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  input.value = '';
  autoResize();

  addMsg('user', escHTML(text), 'you');
  const { tool, args } = route(text);
  const typing = addMsg('bot typing', `calling <code>${tool}</code>`, '🐿️ squirrel');

  try {
    const raw = await callMCP(tool, args);
    typing.remove();
    const header = `<div class="who">🐿️ squirrel · <code>${tool}</code></div>`;
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = header + formatJSON(raw);
    chat.appendChild(div);
  } catch (e) {
    typing.remove();
    addMsg('bot error', `error: ${escHTML(e.message)}`, '🐿️');
  }

  chat.scrollTop = chat.scrollHeight;
  busy = false;
  sendBtn.disabled = false;
  input.focus();
}

function autoResize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 128) + 'px';
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', autoResize);

document.getElementById('suggestions').addEventListener('click', e => {
  const btn = e.target.closest('button[data-q]');
  if (!btn) return;
  input.value = btn.dataset.q;
  send();
});

// welcome
addMsg('system', '🐿️ <strong>nestgate</strong> — open membrane interface · no login · no paywall · 20 senses');
addMsg('system', 'ask anything. the squirrel routes your question to the right membrane sense organ.');
addMsg('system', 'you can also <strong>write</strong> — say <code>write to notes: your message here</code> to leave a mark that persists.');

// initial pulse
(async () => {
  try {
    const raw = await callMCP('topology', {});
    const obj = JSON.parse(raw);
    const alive = obj.services_alive || '?';
    const feeds = obj.feeds_total || '?';
    const subs = obj.subdomains || '?';
    addMsg('system', `membrane alive · ${alive} services · ${feeds} feeds · ${subs} subdomains · surface: ${obj.surface || 'klein_bottle'}`);
  } catch {}
})();
</script>
</body>
</html>
